<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morpheus — token platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* chrome vars are driven from the live Morpheus tokens at runtime (Dark defaults below) */
    --bg:#141419; --surface:#1B1B21; --surface-2:#2A2A32; --line:#F0F0F61F;
    --text:#F1F0EA; --muted:#9C9CA8; --faint:#6E6E78;
    --accent:#7FA9F9; --accent-soft:#7FA9F929;
    --shadow:0 18px 46px rgba(0,0,0,.5);
    --font:"Geist",system-ui,sans-serif;
    --mono:"Geist Mono",ui-monospace,monospace;
    --checker:conic-gradient(#c9c9c9 90deg,#f0f0f0 90deg 180deg,#c9c9c9 180deg 270deg,#f0f0f0 270deg);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;transition:background .25s,color .25s}
  button{font-family:inherit;color:inherit;cursor:pointer}

  .appbar{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .brand .sym{width:22px;height:22px;border:2px solid var(--text);border-radius:5px;position:relative;flex-shrink:0}
  .brand .sym::before{content:"";position:absolute;inset:4px 4px auto auto;width:6px;height:6px;border:2px solid var(--text);border-bottom:none;border-left:none}
  .brand .sym::after{content:"";position:absolute;left:4px;bottom:4px;width:6px;height:6px;background:var(--text);opacity:.55}
  .brand small{color:var(--muted);font-weight:500;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
  .brand .logo{height:17px;width:auto;display:block;color:var(--text)}
  .live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:20px}
  .live .d{width:6px;height:6px;border-radius:50%;background:#30F284}
  .spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:34px;min-width:210px}
  .search svg{flex-shrink:0;color:var(--muted)}
  .search input{background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:13px;width:100%}
  .search input::placeholder{color:var(--faint)}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
  .seg button{background:none;border:none;color:var(--muted);border-radius:7px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
  .seg button.on{background:var(--surface-2);color:var(--text)}
  .seg .mi{width:13px;height:13px}

  .body{display:flex;flex:1;min-height:0}
  .rail{width:238px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:12px 10px}
  .rail .rhead{padding:4px 8px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .setrow{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;padding:8px;border-radius:8px;font-size:13px;color:var(--text);text-align:left}
  .setrow:hover{background:var(--surface-2)}
  .setrow.active{background:var(--accent-soft)}
  .setrow.active .setname{font-weight:600}
  .setrow .setname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .setrow .cnt{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .dotk{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .railgroup{margin:8px 0 2px;padding:10px 8px 2px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

  .main{flex:1;min-width:0;overflow-y:auto;padding:20px 26px 90px}
  .crumbs{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:5px}
  .crumbs b{color:var(--text);font-weight:600}
  .modechip{margin-left:6px;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .maintitle{font-size:21px;font-weight:600;letter-spacing:-.02em}
  .mainsub{font-size:12.5px;color:var(--muted);margin:3px 0 22px}

  .group{margin-bottom:24px}
  .group>h3{font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:2px;cursor:pointer;user-select:none}
  .group>h3 .chev{color:var(--muted);transition:transform .15s}
  .group.collapsed .chev{transform:rotate(-90deg)}
  .group.collapsed .grpbody{display:none}
  .group>h3 .gcount{font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:500}
  .grpbody{padding-top:13px}

  .ramp{margin-bottom:16px}
  .ramp .rname{font-size:12.5px;font-weight:500;margin-bottom:7px;display:flex;align-items:center;gap:8px}
  .ramp .rname .rpath{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:400}
  .swatches{display:flex;gap:5px;flex-wrap:wrap}
  .sw{width:54px;cursor:pointer}
  .sw .chip{height:46px;border-radius:8px;border:1px solid rgba(127,127,127,.16);transition:transform .1s}
  .sw:hover .chip{transform:translateY(-2px)}
  .sw.active .chip{outline:2px solid var(--accent);outline-offset:2px}
  .sw .step{margin-top:5px;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--muted)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .card{cursor:pointer;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
  .card:hover{border-color:var(--muted)}
  .card.active{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .card .cc{height:52px;border-bottom:1px solid var(--line)}
  .card .ci{padding:7px 9px 8px}
  .card .cn{font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .ch{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:1px}

  .rows{display:flex;flex-direction:column;gap:2px;max-width:660px}
  .trow{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:9px;cursor:pointer}
  .trow:hover{background:var(--surface-2)}
  .trow.active{background:var(--accent-soft)}
  .trow .prev{flex-shrink:0;display:flex;align-items:center;width:80px}
  .trow .tk{flex:1;min-width:0}
  .trow .tk .tn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .tk .tp{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .trow .tv{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
  .trow .tv .al{color:var(--accent);font-size:10.5px}
  .spx{height:14px;background:var(--accent);border-radius:3px;opacity:.85}
  .radbox{width:38px;height:24px;border:1.6px solid var(--accent);background:var(--accent-soft)}
  .shadowbox{width:56px;height:34px;border-radius:8px;background:var(--surface)}
  .typespec{white-space:nowrap;overflow:hidden;max-width:340px;text-overflow:ellipsis}

  .codeview{display:none;background:#0c0a09;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.65;color:#cfc8bd;overflow:auto;white-space:pre;max-width:940px}
  .codeview .k{color:#8fb8ff}.codeview .s{color:#7ee0a8}.codeview .d2{color:#e6a55b}
  .codeview .sw-inline{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid rgba(127,127,127,.3)}
  body.code .maincols{display:none}
  body.code .codeview{display:block}
  .empty{color:var(--muted);font-size:14px;padding:56px 0;text-align:center}

  .inspector{width:0;flex-shrink:0;border-left:1px solid var(--line);background:var(--surface);overflow:hidden;transition:width .18s ease}
  .inspector.open{width:332px}
  .insp-in{width:332px;height:100%;overflow-y:auto}
  .insp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
  .insp-head .t{font-size:12px;font-weight:600;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .insp-head .x{width:26px;height:26px;border-radius:7px;border:none;background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center}
  .insp-preview{height:132px;display:flex;align-items:flex-end;padding:12px;border-bottom:1px solid var(--line)}
  .insp-preview .pv{font-family:var(--mono);font-size:11px;font-weight:500;background:rgba(0,0,0,.4);color:#fff;padding:3px 8px;border-radius:6px}
  .insp-name{padding:15px 16px 3px}
  .insp-name .nm{font-size:16px;font-weight:600;word-break:break-word}
  .insp-name .pth{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;word-break:break-all}
  .insp-fields{padding:9px 16px 26px}
  .fld{padding:11px 0;border-bottom:1px solid var(--line)}
  .fld:last-child{border-bottom:none}
  .fld .fl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  .fld .fv{display:flex;align-items:center;gap:8px;font-size:13px;font-family:var(--mono);word-break:break-all}
  .fld .fv .copy{margin-left:auto;flex-shrink:0;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center}
  .fld .fv .copy:hover{color:var(--text)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:20px;background:var(--surface-2);color:var(--muted)}
  .cdot{width:18px;height:18px;border-radius:5px;border:1px solid rgba(127,127,127,.22);flex-shrink:0}
  .matchrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--text)}
  .modes2{display:flex;flex-direction:column;gap:8px;width:100%}
  .mv{display:flex;align-items:center;gap:9px;font-size:12px}
  .mv.cur{font-weight:600}
  .mv .ml{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);width:38px}
  .mv .mval{font-family:var(--mono);color:var(--text)}
  .mv .star{color:var(--accent);font-size:9px}
  .chainline{font-family:var(--mono);font-size:11.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .chainline .lnk{color:var(--accent);cursor:pointer}
  .chainline .lnk:hover{text-decoration:underline}
  .chainline .arw{color:var(--faint)}
  .badge.cond{display:inline-block;margin-left:6px;font-size:9px;letter-spacing:.03em;padding:1px 7px;border-radius:20px;background:var(--accent-soft);color:var(--accent);text-transform:none}
  .card{position:relative}
  .card.aliased .cn::before{content:"↳ ";color:var(--accent);font-weight:400}
  .card .condflag{position:absolute;top:5px;right:6px;font-size:10px;z-index:2;filter:saturate(1.4)}
  .tagline{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted)}
  .tagline .tl-mark{width:4px;height:15px;border-radius:2px;background:var(--accent);flex-shrink:0}
  .tagline b{color:var(--text);font-weight:600}
  .tagline i{color:var(--faint);font-style:italic}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:12.5px;font-weight:500;padding:9px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* view visibility */
  body:not(.view-tokens) .tokonly{display:none}
  body:not(.view-tokens) .rail,body:not(.view-tokens) .inspector{display:none}
  .appnav button{font-weight:600}

  /* platform export bar */
  .platbar{display:none;gap:4px;align-items:center;margin:0 0 8px}
  body.code .platbar{display:flex}
  .platbar button{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 11px;font-family:var(--mono);font-size:11.5px;font-weight:600}
  .platbar button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .platbar .platnote{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}

  /* calculation readout */
  .calc{display:flex;align-items:center;gap:7px}
  .calc .op2,.dval .op2{color:var(--faint)}
  .calc b{color:var(--text)}

  /* ===== panels (Sync / History) ===== */
  .panel{max-width:1060px;margin:0 auto}
  .phead{margin-bottom:6px}
  .phead .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
  .phead h1{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
  .phead p{font-size:14px;color:var(--muted);margin-top:8px;max-width:720px;line-height:1.6}
  .demoflag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:3px 9px;vertical-align:middle;white-space:nowrap}
  .seclabel{font-size:12px;font-weight:600;margin:26px 0 12px;display:flex;align-items:center;gap:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
  .seclabel .ln{flex:1;height:1px;background:var(--line)}
  .lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  .lane{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px}
  .lane .lh{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .lane .lh .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:var(--mono);font-size:14px;font-weight:600;flex-shrink:0}
  .lane .lh .tt{font-size:14px;font-weight:600}
  .lane .lh .tt small{display:block;color:var(--muted);font-weight:400;font-size:11px;font-family:var(--mono);margin-top:2px}
  .lane .arrow{margin-left:auto;color:var(--faint);font-size:16px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
  .kv:first-of-type{margin-top:10px}
  .kv .k2{color:var(--muted)}
  .kv .v2{font-family:var(--mono);font-size:11.5px;text-align:right;word-break:break-word}
  .statuspill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:20px}
  .statuspill.ok{background:rgba(48,174,106,.15);color:#2fae6a}
  .statuspill.warn{background:rgba(255,168,61,.18);color:#b9791a}
  .statuspill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .laneact{margin-top:14px;display:flex;gap:8px}
  .btn{font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);display:inline-flex;align-items:center;gap:7px}
  .btn.pri{background:var(--accent);color:var(--accent-fg,#fff);border-color:transparent}
  .btn:hover{filter:brightness(1.04)}
  .pipe{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
  .stage{flex:1;padding:13px 14px;border-right:1px solid var(--line)}
  .stage:last-child{border-right:none}
  .stage .sn{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
  .stage .sn .tick{color:#2fae6a}
  .stage .sm{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:5px}
  .pipemeta{display:flex;align-items:center;gap:14px;margin-top:11px;font-family:var(--mono);font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .feed,.card2{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
  .frow{display:flex;align-items:center;gap:12px;padding:11px 15px;border-top:1px solid var(--line);font-size:12.5px}
  .frow:first-child{border-top:none}
  .frow .fic{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;font-family:var(--mono);font-size:11px}
  .frow .fmain{flex:1;min-width:0}
  .frow .fa{font-weight:500}
  .frow .fsrc{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:1px}
  .frow .ft{color:var(--faint);font-family:var(--mono);font-size:11px;white-space:nowrap}
  .brow{display:flex;align-items:center;gap:12px;padding:12px 15px;border-top:1px solid var(--line)}
  .brow:first-child{border-top:none}
  .branchname{font-family:var(--mono);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .badge2{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--muted);text-transform:none;letter-spacing:0}
  .badge2.prot{background:rgba(255,168,61,.18);color:#b9791a}
  .ab{font-family:var(--mono);font-size:11.5px}.ab .up{color:#2fae6a}.ab .dn{color:#cf6b5c}
  .diffrow{display:flex;align-items:center;gap:11px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px}
  .diffrow:first-child{border-top:none}
  .diffrow .op{width:14px;text-align:center;font-family:var(--mono);font-weight:700;flex-shrink:0}
  .op.add{color:#2fae6a}.op.mod{color:#b9791a}.op.ren{color:var(--accent)}
  .diffrow .dp{font-family:var(--mono);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .diffrow .dval{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0}
  .vrow{display:flex;align-items:center;gap:13px;padding:12px 15px;border-top:1px solid var(--line)}
  .vrow:first-child{border-top:none}
  .vtag{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--surface-2);padding:4px 9px;border-radius:7px;flex-shrink:0}
  .vrow .vd{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}
  .ptable{width:100%;border-collapse:collapse;font-size:12.5px}
  .ptable th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:9px 14px;border-bottom:1px solid var(--line)}
  .ptable td{padding:10px 14px;border-bottom:1px solid var(--line)}
  .ptable tr:last-child td{border-bottom:none}
  .who{display:flex;align-items:center;gap:9px;font-weight:500}
  .av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0}

  @media(max-width:960px){.rail{width:196px}.inspector.open,.insp-in{width:290px}}
  @media(max-width:820px){.lanes{grid-template-columns:1fr}.pipe{flex-direction:column}.stage{border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escA(s){return esc(s).replace(/"/g,'&quot;');}
function match(p){return !state.search||p.toLowerCase().includes(state.search.toLowerCase());}
function chipStyle(hex){return `background:linear-gradient(${hex},${hex}),var(--checker);background-size:100% 100%,12px 12px`;}
function semHex(path){return SEM[path][MI()];}
function aliasTarget(path,i){return ALIAS[path]?(ALIAS[path][i]||null):null;}
function isAliased(path){return !!aliasTarget(path,MI());}
function condAlias(path){return ALIAS[path] ? (ALIAS[path][0]||null)!==(ALIAS[path][1]||null) : false;}
function chainOf(path,i){const chain=[];let cur=path;const seen=new Set();while(true){const t=aliasTarget(cur,i);if(!t||seen.has(cur))break;seen.add(cur);chain.push(t);cur=t;}return chain;}
function toRgba(h){h=h.replace('#','');if(h.length===3||h.length===4)h=h.split('').map(c=>c+c).join('');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16),a=h.length===8?parseInt(h.slice(6,8),16)/255:1;return `rgba(${r}, ${g}, ${b}, ${+a.toFixed(3)})`;}
function effToCss(str){return str.split(';').map(part=>{const m=part.match(/color:\s*([^,]+),\s*offset:\s*\(([-\d.]+),\s*([-\d.]+)\),\s*radius:\s*([-\d.]+),\s*spread:\s*([-\d.]+)/i);if(!m)return '';let col=m[1].trim();if(col.startsWith('#'))col=toRgba(col);return `${m[2]}px ${m[3]}px ${m[4]}px ${m[5]}px ${col}`;}).filter(Boolean).join(', ');}

function grp(t,c,inner){return `<div class="group"><h3><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>${esc(t)}<span class="gcount">${c}</span></h3><div class="grpbody">${inner}</div></div>`;}

function renderRamps(){
  let out='';
  for(const fam in PRIM){
    const steps=Object.keys(PRIM[fam]).filter(st=>match(`base/${fam}/${st}`)||match(fam));
    if(!steps.length)continue;
    let sw='';
    steps.forEach(st=>{const p=`base/${fam}/${st}`,hex=PRIM[fam][st];sw+=`<div class="sw ${state.selected===p?'active':''}" data-tok="${escA(p)}"><div class="chip" style="${chipStyle(hex)}"></div><div class="step">${st}</div></div>`;});
    out+=`<div class="ramp"><div class="rname">${fam} <span class="rpath">base/${fam}</span></div><div class="swatches">${sw}</div></div>`;
  }
  return out;
}
function renderColorGrid(){
  const groups={};
  Object.keys(SEM).filter(match).forEach(p=>{const g=p.split('/')[0];(groups[g]=groups[g]||[]).push(p);});
  let out='';
  Object.keys(groups).forEach(g=>{
    let cards='';
    groups[g].forEach(p=>{const hex=semHex(p),label=p.split('/').slice(1).join('/')||p,al=isAliased(p),cond=condAlias(p);const sub=al?('↳ '+esc(aliasTarget(p,MI()))):hex.toUpperCase();cards+=`<div class="card ${state.selected===p?'active':''} ${al?'aliased':''}" data-tok="${escA(p)}" title="${hex.toUpperCase()}${al?' · inherits '+escA(aliasTarget(p,MI())):''}">${cond?'<span class="condflag" title="conditional — differs by mode">⚡</span>':''}<div class="cc" style="${chipStyle(hex)}"></div><div class="ci"><div class="cn">${esc(label)}</div><div class="ch">${sub}</div></div></div>`;});
    out+=grp(g,groups[g].length,`<div class="cards">${cards}</div>`);
  });
  return out;
}
function renderScalar(kind){
  const src=kind==='spacing'?SPACING:kind==='radius'?RADIUS:HEIGHT;
  const rows=src.filter(([n])=>match(kind+'/'+n));
  if(!rows.length)return '';
  let out='';
  rows.forEach(([n,v])=>{const p=kind+'/'+n;let prev,val;
    if(kind==='spacing'){prev=`<span class="spx" style="width:${Math.max(2,Math.min(80,v))}px"></span>`;val=v+'px';}
    else if(kind==='radius'){const r=v===999?12:Math.min(12,v);prev=`<span class="radbox" style="border-radius:${r}px 0 0 0"></span>`;val=(v===999?'999px':v+'px');}
    else{prev=`<span class="spx" style="width:${Math.max(2,Math.min(80,v))}px;height:${Math.max(6,Math.min(20,v/3))}px"></span>`;val=v+'px';}

function renderShadows(){

/* ---- multi-platform export (scales across tools & platforms) ---- */
function renderExport(set){
  if(state.platform==='JSON') return exportJSON(set);
  const rows=flattenSet(set);
  if(state.platform==='CSS')     return esc(exportCSS(rows,set));
  if(state.platform==='Tailwind')return esc(exportTailwind(rows,set));
  if(state.platform==='Swift')   return esc(exportSwift(rows,set));
  if(state.platform==='Kotlin')  return esc(exportKotlin(rows,set));
  return '';
}
function flattenSet(set){
  const out=[];
  if(set.kind==='ramps'){for(const f in PRIM)for(const s in PRIM[f])out.push({name:`color/base/${f}/${s}`,color:true,light:PRIM[f][s],dark:PRIM[f][s]});}
  else if(set.kind==='colorgrid'){for(const p in SEM)out.push({name:'color/'+p,color:true,light:SEM[p][0],dark:SEM[p][1],ref:ALIAS[p]});}
  else if(set.kind==='shadows'){for(const n in SHADOWS)out.push({name:'shadow/'+n,value:effToCss(SHADOWS[n])});}
  else if(set.kind==='spacing'){SPACING.forEach(([n,v])=>out.push({name:'spacing/'+n,value:v+'px',num:v}));}
  else if(set.kind==='radius'){RADIUS.forEach(([n,v])=>out.push({name:'radius/'+n,value:(v===999?'999px':v+'px'),num:v}));}
  else if(set.kind==='height'){HEIGHT.forEach(([n,v])=>out.push({name:'height/'+n,value:v+'px',num:v}));}
  else if(set.kind==='padding'){PADDING.forEach(([n,v,al])=>out.push({name:'padding/'+n,value:v+'px',num:v}));}
  else if(set.kind==='typo'){TYPO.forEach(t=>out.push({name:'type/'+t.path,value:`${t.size}px/${t.lh} ${t.weight} ${t.family}`}));}
  return out;
}
const kebab=n=>n.replace(/[\/ ]+/g,'-').toLowerCase();
const camel=n=>{const p=n.replace(/[^a-z0-9]+/gi,' ').trim().split(' ');return p.map((w,i)=>i?w.charAt(0).toUpperCase()+w.slice(1):w.toLowerCase()).join('');};
const pascal=n=>{const c=camel(n);return c.charAt(0).toUpperCase()+c.slice(1);};
function hexToArgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');let a='FF',rgb=h.slice(0,6);if(h.length===8){rgb=h.slice(0,6);a=h.slice(6,8);}return '0x'+(a+rgb).toUpperCase();}
function exportCSS(rows,set){
  const dual=set.kind==='colorgrid';
  let light=rows.map(r=>`  --${kebab(r.name)}: ${r.color?r.light:r.value};`).join('\n');
  let out=`/* Morpheus ·  · CSS custom properties */\n:root {\n${light}\n}`;
  if(dual){ out+=`\n\n[data-theme="dark"] {\n`+rows.map(r=>`  --${kebab(r.name)}: ${r.dark};`).join('\n')+`\n}`; }
  return out;
}
function exportTailwind(rows,set){
  const body=rows.map(r=>`      '${kebab(r.name)}': '${r.color?r.light:(r.num!==undefined?r.num+'px':r.value)}',`).join('\n');
  const key=set.kind==='spacing'||set.kind==='radius'||set.kind==='height'||set.kind==='padding'?'spacing':(rows[0]&&rows[0].color?'colors':'extend');
  return `// tailwind.config.js · Morpheus ${set.name}\nmodule.exports = {\n  theme: {\n    extend: {\n      ${key}: {\n${body}\n      }\n    }\n  }\n}${set.kind==='colorgrid'?'\n// Dark mode resolves via [data-theme="dark"] CSS vars.':''}`;
}
function exportSwift(rows,set){
  const b=rows.filter(r=>r.color).map(r=>`    static let ${camel(r.name.replace('color/',''))} = Color(hex: "${r.light}")${r.dark!==r.light?`  // dark: ${r.dark}`:''}`).join('\n');
  if(!b) return `// Morpheus ${set.name}\nenum MorpheusTokens {\n`+rows.map(r=>`    static let ${camel(r.name)} = "${r.value}"`).join('\n')+`\n}`;
  return `// Morpheus ${set.name} · SwiftUI\nimport SwiftUI\nenum MorpheusColor {\n${b}\n}`;
}
function exportKotlin(rows,set){
  const b=rows.filter(r=>r.color).map(r=>`    val ${pascal(r.name.replace('color/',''))} = Color(${hexToArgb(r.light)})${r.dark!==r.light?`  // dark ${hexToArgb(r.dark)}`:''}`).join('\n');
  if(!b) return `// Morpheus ${set.name}\nobject MorpheusTokens {\n`+rows.map(r=>`    const val ${pascal(r.name)} = "${r.value}"`).join('\n')+`\n}`;
  return `// Morpheus ${set.name} · Compose\nimport androidx.compose.ui.graphics.Color\nobject MorpheusColor {\n${b}\n}`;
}

/* JSON code view */
function exportJSON(set){
  let obj={};
  if(set.kind==='ramps'){obj={base:{}};for(const f in PRIM){obj.base[f]={};for(const s in PRIM[f])obj.base[f][s]={value:PRIM[f][s],type:'color'};}}
  else if(set.kind==='colorgrid'){const ref=(p,i)=>{const t=aliasTarget(p,i);return t?'{'+t.replace(/[\/ ]/g,'.')+'}':SEM[p][i];};for(const p in SEM)setDeep(obj,p,{type:'color',value:{Light:ref(p,0),Dark:ref(p,1)}});}
  else if(set.kind==='shadows'){for(const n in SHADOWS)setDeep(obj,n,{value:effToCss(SHADOWS[n]),type:'boxShadow'});}
  else if(set.kind==='spacing'){SPACING.forEach(([n,v])=>obj[n]={value:v+'px',type:'spacing'});}
  else if(set.kind==='radius'){RADIUS.forEach(([n,v])=>obj[n]={value:(v===999?'999px':v+'px'),type:'borderRadius'});}
  else if(set.kind==='height'){HEIGHT.forEach(([n,v])=>setDeep(obj,n,{value:v+'px',type:'sizing'}));}
  else if(set.kind==='padding'){PADDING.forEach(([n,v,al])=>obj[n]={value:'{'+al.replace(/[\/ ]/g,'.')+'}',type:'spacing'});}
  else if(set.kind==='typo'){TYPO.forEach(t=>setDeep(obj,t.path,{value:{fontSize:t.size+'px',lineHeight:String(t.lh),fontWeight:String(t.weight),fontFamily:t.family},type:'typography'}));}
  return colorize(JSON.stringify(obj,null,2));
}
function setDeep(obj,path,val){const ks=path.split('/');let o=obj;ks.forEach((k,i)=>{if(i===ks.length-1)o[k]=val;else o=o[k]=o[k]||{};});}
function colorize(s){return esc(s).replace(/"([^"]+)":/g,'"<span class="k">$1</span>":').replace(/: "(#[0-9A-Fa-f]{3,8})"/g,(m,h)=>`: "<span class="sw-inline" style="${chipStyle(h)}"></span><span class="s">${h}</span>"`).replace(/"(Light|Dark)"/g,'"<span class="d2">$1</span>"').replace(/: "(\{[^"]+\})"/g,': "<span class="d2">$1</span>"').replace(/: "([^#][^"]*)"/g,': "<span class="s">$1</span>"');}

  const diffs=CHANGES.map(c=>`<div class="diffrow"><span class="op ${c.cls}">${c.op}</span><span class="dp">${esc(c.path)}</span>${c.from?`<span class="dval"><span class="cdot" style="width:13px;height:13px;background:${c.from}"></span>${c.from}<span class="op2">→</span><span class="cdot" style="width:13px;height:13px;background:${c.to}"></span>${c.to}</span>`:`<span class="dval">${esc(c.note||'')}</span>`}</div>`).join('');
  const versions=VERSIONS.map(v=>`<div class="vrow"><span class="vtag">${v.tag}</span><div class="vmeta"><div style="font-size:12.5px">${esc(v.note)}</div><div class="vd">${v.d}</div></div></div>`).join('');
  const perms=ROLES.map(r=>`<tr><td><div class="who"><span class="av" style="background:${r.av}">${esc(r.who[0])}</span>${esc(r.who)}</div></td><td><span class="badge2">${esc(r.role)}</span></td><td class="fsrc">${esc(r.scope)}</td></tr>`).join('');
  return `<div class="panel">
    <div class="phead"><div class="kick">Collaboration, branching &amp; governance</div><h1>Track changes. Manage permissions. Version confidently. ${demoflag()}</h1>
    <p>Make this the source of truth that finally has history — every change reviewed, versioned, and attributable, with brand and theme work isolated on branches until it's ready to merge.</p></div>
    <div class="seclabel">Branches<span class="ln"></span></div>
    <div class="card2">${branches}</div>
    <div class="seclabel">Changes · since v2.4.0<span class="ln"></span></div>
    <div class="card2">${diffs}</div>
    <div class="seclabel">Versions<span class="ln"></span></div>
    <div class="card2">${versions}</div>
    <div class="seclabel">Permissions &amp; governance<span class="ln"></span></div>
    <div class="card2"><table class="ptable"><thead><tr><th>Member</th><th>Role</th><th>Scope</th></tr></thead><tbody>${perms}</tbody></table></div>
  </div>`;
}
function renderView(){
  document.body.classList.remove('view-tokens','view-sync','view-history');
  document.body.classList.add('view-'+state.view);
  if(state.view!=='tokens'){closeInspector();document.body.classList.remove('code');}
  if(state.view==='tokens'){renderRail();renderMain();syncSeg('viewseg','code');}
  else if(state.view==='sync'){main.innerHTML=renderSync();}
  else{main.innerHTML=renderHistory();}
}

/* ============ EVENTS ============ */
rail.addEventListener('click',e=>{const r=e.target.closest('[data-set]');if(r){state.active=r.dataset.set;document.body.classList.remove('code');syncSeg('viewseg','code');renderRail();renderMain();}});
main.addEventListener('click',e=>{
  const pl=e.target.closest('[data-plat]');if(pl){state.platform=pl.dataset.plat;renderMain();return;}
  const dm=e.target.closest('[data-demo]');if(dm){toast(dm.dataset.demo+' — prototype action');return;}
  const h=e.target.closest('.group>h3');if(h){h.parentElement.classList.toggle('collapsed');return;}
  const t=e.target.closest('[data-tok]');if(t)openInspector(t.dataset.tok);
});
$('#navseg').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(!b)return;state.view=b.dataset.nav;$('#navseg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderView();});
inspIn.addEventListener('click',e=>{const l=e.target.closest('.lnk[data-tok]');if(l){const tk=l.dataset.tok;if(LOOKUP[tk])openInspector(tk);}});
document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c){navigator.clipboard&&navigator.clipboard.writeText(c.dataset.copy);toast('Copied '+c.dataset.copy);}});
$('#search').addEventListener('input',e=>{state.search=e.target.value;renderMain();});

const modeseg=$('#modeseg');
modeseg.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;state.mode=b.dataset.mode;modeseg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));applyMode();renderRail();renderMain();if(state.selected)openInspector(state.selected);});

const viewseg=$('#viewseg');
function syncSeg(id,codeVal){const el=$('#'+id);el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.view===codeVal)===document.body.classList.contains('code')));}
viewseg.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;document.body.classList.toggle('code',b.dataset.view==='code');syncSeg('viewseg','code');});

let toastT;const toastEl=$('#toast');
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),1500);}

/* init */
const mp=new URLSearchParams(location.search).get('mode');
if(mp==='Light'||mp==='Dark'){state.mode=mp;modeseg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.mode===mp));}
applyMode();renderView();
</script>
</body>
</html>
