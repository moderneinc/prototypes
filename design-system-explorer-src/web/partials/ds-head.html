<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Internal design-system gallery: permanently noindex (dark-launched, see docs/WORKFLOW.md). -->
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/prototypes/design-system-explorer/brand/moderne-symbol.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<!-- Pre-paint: set light/dark BEFORE first paint (from a shared #mode=light hash
     or the saved pref) so a light link doesn't flash dark first. Dark is the
     default :root, so we only act on "light". -->
<script>try{var h=location.hash.match(/mode=(light|dark)/),m=h&&h[1];if(!m){var s=JSON.parse(localStorage.getItem("ds-colors")||"{}");m=s&&s.mode;}if(m==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
