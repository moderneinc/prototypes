<!DOCTYPE html>
<html lang="en">
<head>
  {{> ds-head }}
  <title>Example screens — Moderne SaaS DS</title>
  <script type="module" src="/src/pages/ds-examples-viewer.ts"></script>
</head>
<body>
  <div class="ds-shell">
    {{> ds-shell-top }}
    <nav class="ds-sidenav">{{> ds-sidenav-links }}</nav>
    <main class="ds-main" id="ex-main" style="padding:0;overflow:hidden;position:relative;display:flex;flex-direction:column">
      <div id="ex-note" class="ds-ex-note" hidden><span class="tag">Approximation</span>
        <span>A recreation to convey how the system feels in context — not a pixel-exact rebuild of the product.</span></div>
      <iframe id="ex-frame" title="Recreated Moderne screen — themed live" style="flex:1;width:100%;border:0;display:block"></iframe>
      <section id="ex-intro" class="ds-surface-intro" hidden></section>
    </main>
  </div>
</body>
</html>
