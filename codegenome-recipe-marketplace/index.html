<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Browsers take the SVG; the raster fallbacks are for crawlers and iOS.
         Google fetches favicons with Googlebot-Image and is least reliable with
         an SVG-only declaration, so ship a PNG and an .ico alongside it. The
         nginx icon block exempts all of these from the sitewide noindex. -->
    <link rel="icon" href="/prototypes/codegenome-recipe-marketplace/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/prototypes/codegenome-recipe-marketplace/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="/prototypes/codegenome-recipe-marketplace/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/prototypes/codegenome-recipe-marketplace/apple-touch-icon.png" />
    <title>Code Genome Project — code search</title>
    <meta
      name="description"
      content="Search code across the Maven corpus, indexed by the Code Genome Project."
    />
    <!-- Self-canonical: the search box writes queries into the URL as /?q=<query>,
         which shares the homepage path "/" and so isn't covered by the noindex
         header. This collapses any shared /?q= search links back to the homepage. -->
    <link rel="canonical" href="https://codegenomeproject.org/" />
    <script>
      // Apply an explicitly-chosen theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
    <script type="module" crossorigin src="/prototypes/codegenome-recipe-marketplace/assets/index-CksRuIgc.js"></script>
    <link rel="stylesheet" crossorigin href="/prototypes/codegenome-recipe-marketplace/assets/index-CWePrRrg.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
