<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auth reskin · light vs dark</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 32px auto; max-width: 1400px; padding: 0 20px;
         background: Canvas; color: CanvasText; }
  h1 { font-size: 1.5rem; }
  p.note { opacity: .72; }
  a.back { color: LinkText; font-weight: 600; }
  section { margin: 30px 0; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  h2 .tag { font-size: .72rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-left: 6px;
            background: color-mix(in srgb, CanvasText 12%, transparent); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .col .lbl { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .6; margin-bottom: 5px; }
  iframe { width: 100%; height: 620px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
           border-radius: 12px; background: #fff; }
  @media (max-width: 820px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>Sign-in &amp; token reskin · light vs dark</h1>
  <p class="note">Every screen in both themes, side by side. <a class="back" href="index.html">← back to the flow view</a></p>
  <div id="grid"></div>
  <script>
    var states = [
      ['01-login.html', 'Sign in', '#32'],
      ['02-login-oauth-error.html', 'Sign in · OAuth error', '#32'],
      ['03-login-bad-password.html', 'Sign in · invalid credentials', '#32'],
      ['04-no-verified-email.html', 'No verified email (recoverable)', '#32'],
      ['05-consent-optin.html', 'Consent · opt-in', '#14'],
      ['06-consent-notice.html', 'Consent · notice', '#14'],
      ['07-token-page.html', 'Token page · masked token + snippets', '#14'],
      ['08-customer-manage.html', 'Customer · manage tokens', '#14'],
      ['09-customer-fresh-token.html', 'Customer · after minting', '#14'],
    ];
    var grid = document.getElementById('grid');
    states.forEach(function (s) {
      var sec = document.createElement('section');
      sec.innerHTML =
        '<h2>' + s[1] + '<span class="tag">' + s[2] + '</span></h2>' +
        '<div class="pair">' +
          '<div class="col"><div class="lbl">Light</div><iframe loading="lazy" src="light/' + s[0] + '"></iframe></div>' +
          '<div class="col"><div class="lbl">Dark</div><iframe loading="lazy" src="dark/' + s[0] + '"></iframe></div>' +
        '</div>';
      grid.appendChild(sec);
    });
  </script>
</body>
</html>
