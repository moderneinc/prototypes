<!-- Gallery chrome: brand block (top-left) + sticky topbar. Dark-only, so there
     is no theme toggle. This is the static "Storybook" frame, NOT a product component. -->
<div class="ds-brand"><span class="dot"></span><b>Moderne</b><span>SaaS DS</span></div>
<header class="ds-topbar">
  <h1>SaaS Design System <span class="ds-topbar-meta" style="margin-left:8px">dark · first pass</span></h1>
  <!-- Interactive theme builder: pick a primary + secondary from our palette;
       it live-themes the whole showcase (this site is built with the system) and
       persists across pages. Swatches are populated by src/lib/ds-theme.ts. -->
  <div class="ds-theme-ctl">
    <button class="ds-theme-trigger" aria-expanded="false" aria-controls="ds-theme-panel">
      <span class="sw2"><i style="background:var(--ds-primary)"></i><i style="background:var(--ds-secondary)"></i></span>
      Theme
    </button>
    <div class="ds-theme-panel" id="ds-theme-panel" hidden>
      <div class="ds-theme-head"><b>Build a theme</b>
        <button class="ds-btn ds-btn--subtle ds-btn--sm" data-theme-reset>Reset</button>
      </div>
      <div class="ds-theme-grp"><span class="lbl">Primary · brand &amp; action</span><div class="ds-sw-row" data-role="primary"></div></div>
      <div class="ds-theme-grp"><span class="lbl">Secondary · accent</span><div class="ds-sw-row" data-role="secondary"></div></div>
      <div class="ds-theme-grp"><span class="lbl">Primary font · UI</span><div class="ds-font-row" data-font="sans"></div></div>
      <div class="ds-theme-grp"><span class="lbl">Secondary font · mono / data</span><div class="ds-font-row" data-font="mono"></div></div>
      <div class="ds-theme-grp"><span class="lbl">Base · ground</span>
        <div class="ds-font-row" data-base-row>
          <button class="ds-fontpill" data-base="cool" aria-pressed="true">Cool neutral</button>
          <button class="ds-fontpill" data-base="warm" aria-pressed="false">Warm · gold nav</button>
        </div>
      </div>
      <div class="ds-theme-actions">
        <button class="ds-btn ds-btn--secondary ds-btn--sm" data-theme-copy>Copy CSS</button>
        <span class="ds-sm ds-muted" data-theme-current></span>
      </div>
      <pre class="ds-theme-out"></pre>
    </div>
  </div>
</header>
