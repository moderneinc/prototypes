<style>
  :root {
    --midnight: #041834;
    --digital-blue: #283AF7;
    --gold: #E7B136;
    --grey: #F8F8FF;
    --lavender: #D4D3E4;
    --body: rgba(4,24,52,0.66);
    --muted: rgba(4,24,52,0.45);
    --border: rgba(4,24,52,0.12);
    --font-head: "Beausite", "Poppins", system-ui, sans-serif;
    --font-body: "Poppins", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font-body); background: #1a2236; display: flex; align-items: center; justify-content: center; overflow: hidden; }

  #stage { position: relative; width: 1280px; height: 720px; transform-origin: center center; box-shadow: 0 24px 70px rgba(0,0,0,0.45); border-radius: 6px; overflow: hidden; }

  .slide { position: absolute; inset: 0; display: none; padding: 64px 72px 60px; background: var(--grey); }
  .slide.active { display: block; }
  .slide.light {
    background:
      radial-gradient(120% 90% at 0% 0%, rgba(231,177,54,0.18) 0%, transparent 42%),
      radial-gradient(120% 95% at 100% 0%, rgba(40,58,247,0.13) 0%, transparent 55%),
      radial-gradient(110% 95% at 100% 5%, var(--lavender) 0%, transparent 50%),
      radial-gradient(120% 100% at 0% 100%, rgba(133,254,153,0.20) 0%, transparent 55%),
      var(--grey);
  }
  .slide.dark { background: var(--midnight); }

  .grid-tex { position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(4,24,52,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(4,24,52,0.05) 1px, transparent 1px);
    background-size: 116px 116px; }
  .dark .grid-tex { background-image: linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px); }

  .arc { position: absolute; right: -120px; bottom: -260px; width: 760px; height: 760px; pointer-events: none; }
  .arc svg { width: 100%; height: 100%; }

  .progress { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--midnight); z-index: 5; }
  .progress .fill { height: 100%; transition: width .35s ease; }

  .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; }
  .toprow { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow { font-family: var(--font-head); font-size: 28px; font-weight: 500; color: var(--midnight); display: inline-flex; align-items: center; gap: 14px; }
  .dark .eyebrow { color: rgba(255,255,255,0.85); }
  .eyebrow .tick { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }

  .pill { background: var(--midnight); color: #fff; font-weight: 500; font-size: 16px; padding: 9px 20px; border-radius: 999px; white-space: nowrap; }
  .dark .pill { background: rgba(255,255,255,0.12); }

  .logo { display: flex; align-items: center; gap: 11px; }
  .logo .mark { width: 30px; height: 30px; color: #fff; }
  .logo .word { font-family: var(--font-head); font-size: 27px; font-weight: 500; color: #fff; }

  h1.head { font-family: var(--font-head); color: var(--midnight); font-weight: 600; letter-spacing: -1.5px; line-height: 0.98; margin-top: 28px; }
  .dark h1.head { color: #fff; }
  .head.xl { font-size: 128px; }
  .head.lg { font-size: 78px; line-height: 1.0; letter-spacing: -1px; }
  .head.md { font-size: 58px; line-height: 1.04; letter-spacing: -0.8px; }

  .accentline { height: 7px; width: 132px; border-radius: 4px; margin-top: 30px; }

  .sub { font-size: 29px; line-height: 1.4; color: var(--body); max-width: 780px; margin-top: 26px; font-weight: 300; }
  .sub strong { font-weight: 600; color: var(--midnight); }
  .dark .sub { color: rgba(255,255,255,0.78); }
  .dark .sub strong { color: #fff; }

  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: auto; }
  .feat { border-top: 1px solid var(--border); padding-top: 18px; }
  .feat .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 12px; vertical-align: middle; }
  .feat .ftext { font-size: 22px; font-weight: 600; color: var(--midnight); vertical-align: middle; }
  .feat .fsub { font-size: 16px; color: var(--body); margin-top: 8px; font-weight: 300; }

  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 38px; }
  .next { display: inline-flex; align-items: center; gap: 16px; background: var(--digital-blue); color: #fff; font-weight: 600; font-size: 19px; padding: 14px 16px 14px 28px; border: none; border-radius: 999px; cursor: pointer; font-family: inherit; }
  .next .circ { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.55); display: grid; place-items: center; }
  .next .circ svg { width: 16px; height: 16px; }
  .counter { font-size: 16px; color: var(--muted); font-weight: 500; }
  .dark .counter { color: rgba(255,255,255,0.5); }

  #dots { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; z-index: 50; flex-wrap: wrap; max-width: 90vw; justify-content: center; }
  #dots button { width: 9px; height: 9px; border-radius: 50%; border: none; background: rgba(255,255,255,0.35); cursor: pointer; padding: 0; }
  #dots button.on { background: #fff; width: 24px; border-radius: 6px; }
  .hint { position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.4); font-size: 13px; z-index: 50; }
</style>
</head>

  <div id="stage"></div>
  <div id="dots"></div>
  <div class="hint">← → to navigate · F for fullscreen</div>

<script>
const slides = JSON.parse(document.getElementById('deckdata').textContent);
const stage = document.getElementById('stage');
const dotsWrap = document.getElementById('dots');
let cur = 0;

function render(){
  const s = slides[cur], n = slides.length;
  const isDark = s.type === "dark";
  const arcColor = isDark ? "rgba(133,254,153,0.18)" : "rgba(4,24,52,0.10)";
  const pct = ((cur+1)/n)*100;
  const accent = s.accent || "#E7B136";

  const topLeft = (isDark && s.title)
    ? `<div class="logo"><svg class="mark"><use href="#m-mark"/></svg><span class="word">Moderne</span></div>`
    : `<span class="eyebrow"><span class="tick" style="background:${accent}"></span>${s.eyebrow}</span>`;
  const topRight = s.pill ? `<span class="pill">${s.pill}</span>` : `<span class="counter">Moderne · 2026</span>`;

  let mid = `<h1 class="head ${s.hc}">${s.head}</h1>`;
  if (s.divider) mid += `<div class="accentline" style="background:${accent}"></div>`;
  mid += `<p class="sub">${s.sub}</p>`;

  let features = "";
  if (s.feats){
    features = `<div class="features">` + s.feats.map(f =>
      `<div class="feat"><span class="dot" style="background:${accent}"></span><span class="ftext">${f[0]}</span><div class="fsub">${f[1]}</div></div>`).join("") + `</div>`;
  }

  const centered = s.title || s.divider;
  const body = centered
    ? `<div style="margin-top:auto;margin-bottom:auto">${mid}</div>`
    : `<div>${mid}</div>${features}`;

  const last = cur === n - 1;
  const foot = `<div class="foot">
      <button class="next" onclick="${last ? 'go(0)' : 'next()'}">${last ? 'Restart' : 'Next slide'}
        <span class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
      <span class="counter">${String(cur+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}</span>
    </div>`;

  stage.innerHTML = `
    <div class="slide ${isDark ? 'dark':'light'} active">
      <div class="progress"><div class="fill" style="width:${pct}%;background:${accent}"></div></div>
      <div class="grid-tex"></div>
      <div class="arc" style="color:${arcColor}"><svg><use href="#arc-motif"/></svg></div>
      <div class="inner"><div class="toprow">${topLeft}${topRight}</div>${body}${foot}</div>
    </div>`;
  [...dotsWrap.children].forEach((d,i)=> d.classList.toggle('on', i===cur));
}
function go(i){ cur = (i+slides.length)%slides.length; render(); }
function next(){ go(cur+1); }
function prev(){ go(cur-1); }
slides.forEach((_,i)=>{ const b=document.createElement('button'); b.onclick=()=>go(i); dotsWrap.appendChild(b); });
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '){ next(); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ prev(); }
  else if(e.key.toLowerCase()==='f'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
function fit(){ const pad=40; const sx=(window.innerWidth-pad)/1280, sy=(window.innerHeight-pad)/720; stage.style.transform=`scale(${Math.min(sx,sy)})`; }
window.addEventListener('resize', fit); fit(); render();
</script>
