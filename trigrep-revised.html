// === Levenshtein (capped) — used for autocomplete fuzzy matching ======
function tgLev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  if (Math.abs(m - n) > 3) return 99;
  let prev = new Array(n + 1), curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      curr[j] = Math.min(curr[j-1] + 1, prev[j] + 1, prev[j-1] + cost);
    }
    [prev, curr] = [curr, prev];
  }
  return prev[n];
}

// === Lexer + parser — raw query only, no prose pipeline =============
function tgLexRaw(s) {
  const out = [];
  const re = /(\()|(\))|(\/(?:\\.|[^/\\])+\/)|("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])*')|(struct(?:ural)?:'(?:\\.|[^'\\])*')|([A-Za-z_][\w-]*:[^\s()]+)|(-?[^\s()]+)/g;
  let m;
  while ((m = re.exec(s))) {
    const tok = m[0];
    if (!tok.trim()) continue;
    out.push(tok);
  }
  return out;
}

function tgValidateValue(filterKey, value) {
  const list = TG_VALUES[filterKey] || [];
  if (!value) return 'invalid';
  const pool = list.map(v => (typeof v === 'string' ? v : v.value).toLowerCase());
  return pool.includes(value.toLowerCase()) ? 'valid' : 'unverified';
}

function tgParseRaw(s) {
  const atoms = tgLexRaw(s || '');
  const tokens = [];
  for (const a of atoms) {
    const low = a.toLowerCase();
    if (a === '(' || a === ')') { tokens.push({ kind:'op', value:a }); continue; }
    if (low === 'or' || low === 'and') { tokens.push({ kind:'op', value: low }); continue; }
    if (a.startsWith('-') && a.length > 1) {
      const rest = a.slice(1);
      const rc = rest.indexOf(':');
      if (rc > 0 && /^[A-Za-z_][\w-]*$/.test(rest.slice(0, rc))) {
        tokens.push({ kind:'op', value:'not' });
        const rawKey = rest.slice(0, rc);
        const value = rest.slice(rc + 1);
        const canon = TG_ALIAS_TO_CANON[rawKey.toLowerCase()] || rawKey;
        const status = TG_FILTERS[canon] ? tgValidateValue(canon, value) : 'unverified';
        tokens.push({ kind:'filter', key:canon, value, raw:rest, status });
        continue;
      }
      if (!rest.includes(':')) {
        tokens.push({ kind:'op', value:'not' });
        tokens.push({ kind:'term', value: rest, mode:'literal' });
        continue;
      }
    }
    if (/^\/.+\/$/.test(a)) { tokens.push({ kind:'term', value:a, mode:'regex' }); continue; }
    if (/^struct(ural)?:/.test(a)) { tokens.push({ kind:'term', value:a, mode:'structural' }); continue; }
    const colon = a.indexOf(':');
    if (colon > 0 && /^[A-Za-z_][\w-]*$/.test(a.slice(0, colon))) {
      const rawKey = a.slice(0, colon);
      const value = a.slice(colon + 1);
      const canon = TG_ALIAS_TO_CANON[rawKey.toLowerCase()] || rawKey;
      const status = TG_FILTERS[canon] ? tgValidateValue(canon, value) : 'unverified';
      tokens.push({ kind:'filter', key:canon, value, raw:a, status });
      continue;
    }
    tokens.push({ kind:'term', value:a, mode:'literal' });
  }
  return tokens;
}

function tgSerialize(tokens) {
  const parts = [];
  for (const t of tokens) {
    if (t.kind === 'op') {
      if (t.value === 'not') parts.push('-NEG');
      else parts.push(t.value);
    } else if (t.kind === 'filter') {
      parts.push(`${t.key}:${t.value}`);
    } else {
      parts.push(t.value);
    }
  }
  return parts.join(' ').replace(/-NEG\s+/g, '-').replace(/\s+/g, ' ').trim();
}

// === State + glue =====================================================
const TGState = { tokens: [], ac: { open:false, items:[], active:0, mode:null, ctx:null }, lastSubmitted: '' };

function tgEscape(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// === Canonicalizer ====================================================
function tgCanonical(input) {
  const tokens = typeof input === 'string' ? tgParseRaw(input) : input;
  const filters = [], terms = [], ops = [];
  for (const t of tokens) {
    if (t.kind === 'filter') filters.push(`${t.key}:${t.value}`);
    else if (t.kind === 'term') terms.push(t.value);
    else if (t.kind === 'op' && (t.value === 'or' || t.value === 'not')) ops.push(t.value);
  }
  filters.sort(); terms.sort(); ops.sort();
  return [...terms, ...filters, ...ops].join(' ');
}

// === Happy-path queries (Appendix A) + signature & phrase routing ======
const TG_HAPPY_QUERIES = {
  authOpt1: { flow: 'a', query: '(@PreAuthorize or @Secured or @RolesAllowed) visibility:public lang:java' },
  authOpt2: { flow: 'a', query: 'implements:AuthenticationEntryPoint' },
  authOpt3: { flow: 'a', query: 'visibility:public' },
  logOpt1:  { flow: 'b', query: '/log\\.(error|warn)\\(/' },
  logOpt2:  { flow: 'b', query: 'Logger type:symbol' },
  logOpt3:  { flow: 'b', query: 'Logger type:symbol -file:**/test/**' },
  restOpt1: { flow: 'c', query: '@RestController lang:java' },
  restOpt2: { flow: 'c', query: 'type:symbol RestTemplate or type:symbol WebClient or type:symbol RestClient lang:java' },
};

// Precomputed canonical bags for "did the user assemble a happy path?"
const TG_HAPPY_BAGS = {};
for (const [k, h] of Object.entries(TG_HAPPY_QUERIES)) TG_HAPPY_BAGS[k] = tgCanonical(h.query);

function tgRouteSignature(tokens) {
  const literals = tokens.filter(t => t.kind === 'term' && t.mode === 'literal').map(t => t.value);
  const regexes  = tokens.filter(t => t.kind === 'term' && t.mode === 'regex').map(t => t.value);
  const filters  = tokens.filter(t => t.kind === 'filter');
  const hasFilter = (k, v) => filters.some(f => f.key === k && (v == null || f.value.toLowerCase() === v.toLowerCase()));
  const hasNegFile = (glob) => {
    for (let i = 0; i < tokens.length - 1; i++) {
      if (tokens[i].kind === 'op' && tokens[i].value === 'not'
          && tokens[i+1].kind === 'filter' && tokens[i+1].key === 'file' && tokens[i+1].value === glob) return true;
    }
    return false;
  };
  if (literals.some(v => /^@(PreAuthorize|Secured|RolesAllowed)$/.test(v))
      && (hasFilter('visibility','public') || hasFilter('lang','java'))) return TG_HAPPY_QUERIES.authOpt1;
  if (hasFilter('implements','AuthenticationEntryPoint')) return TG_HAPPY_QUERIES.authOpt2;
  if (filters.length === 1 && hasFilter('visibility','public') && literals.length === 0 && regexes.length === 0) return TG_HAPPY_QUERIES.authOpt3;
  if (regexes.some(r => /log\\?\.\(\s*(error\s*\|\s*warn|warn\s*\|\s*error)\s*\)\\?\(/.test(r))) return TG_HAPPY_QUERIES.logOpt1;
  const isLoggerByType = literals.includes('Logger') && hasFilter('type','symbol');
  if (isLoggerByType && hasNegFile('**/test/**')) return TG_HAPPY_QUERIES.logOpt3;
  if (isLoggerByType) return TG_HAPPY_QUERIES.logOpt2;
  if (hasFilter('type','symbol') && literals.some(v => /^(RestTemplate|WebClient|RestClient)$/.test(v))) return TG_HAPPY_QUERIES.restOpt2;
  if (literals.includes('@RestController')) return TG_HAPPY_QUERIES.restOpt1;
  return null;
}

// Small fixed phrase bridge — not a parser. A handful of broad questions
// that mature search products bridge to a known query (Sourcegraph
// Smart Search–style). No stemming, no concept index, no fuzzy English.
const TG_PHRASE_ROUTES = [
  { rx: /\b(production code only|exclude tests?|no tests?|skip tests?)\b/i,                    key: 'logOpt3' },
  { rx: /\b(logger declarations?|what loggers do we use|logger types?|loggers?\b)\b/i,         key: 'logOpt2' },
  { rx: /\b(error logging|where do we log errors?|log errors?|warnings?|error\/warn)\b/i,      key: 'logOpt1' },
  { rx: /\b(public[- ]?facing|public only|just public|exposed services?)\b/i,                  key: 'authOpt3' },
  { rx: /\b(auth(entication)? entry points?|where authentication starts|entry points?)\b/i,    key: 'authOpt2' },
  { rx: /\b(@PreAuthorize|@Secured|@RolesAllowed|public authorization|authorization (rules?|annotations?))\b/i, key: 'authOpt1' },
  { rx: /\b(outbound|client calls?|http clients?|RestTemplate|WebClient|RestClient)\b/i,       key: 'restOpt2' },
  { rx: /\b(server[- ]?side controllers?|rest controllers?|@RestController|REST APIs?)\b/i,    key: 'restOpt1' },
];
function tgRoutePhrase(text) {
  for (const r of TG_PHRASE_ROUTES) if (r.rx.test(text)) return TG_HAPPY_QUERIES[r.key];
  return null;
}

const TG_THEME_WORDS = {
  auth:    /\b(authentication|auth|login|security|authorize|authorization|@PreAuthorize|@Secured|@RolesAllowed|entry points?|public[- ]?facing)\b/i,
  logging: /\b(logging|log|logger|loggers|slf4j|log4j|error logging|warnings?|audit log)\b/i,
  rest:    /\b(rest|api|apis|endpoints?|controllers?|@RestController|outbound|client|RestTemplate|WebClient|RestClient)\b/i,
};
function tgDetectTheme(text) {
  for (const [theme, rx] of Object.entries(TG_THEME_WORDS)) if (rx.test(text)) return theme;
  return null;
}
const TG_THEMES = {
  auth:    { title: 'Authentication', question: 'How is authentication handled?', options: [
    { label: 'Public authorization rules',  desc: '@PreAuthorize / @Secured / @RolesAllowed on public methods', key: 'authOpt1' },
    { label: 'Auth entry points',           desc: 'Classes that implement AuthenticationEntryPoint',           key: 'authOpt2' },
    { label: 'Just public-facing services', desc: 'Anything tagged visibility:public',                          key: 'authOpt3' },
  ]},
  logging: { title: 'Logging', question: 'How is logging done across our services?', options: [
    { label: 'Error logging',                       desc: 'Regex over log.error / log.warn calls', key: 'logOpt1' },
    { label: 'Logger declarations',                 desc: 'All Logger symbol declarations',         key: 'logOpt2' },
    { label: 'Production code only (exclude tests)', desc: 'Loggers, excluding **/test/** paths',   key: 'logOpt3' },
  ]},
  rest:    { title: 'REST APIs', question: 'How are our REST APIs structured?', options: [
    { label: 'REST controllers (server side)', desc: '@RestController in Java',                  key: 'restOpt1' },
    { label: 'Outbound REST calls (client)',   desc: 'RestTemplate / WebClient / RestClient',    key: 'restOpt2' },
  ]},
};
function tgShowScope(themeId) {
  const theme = TG_THEMES[themeId];
  const results = document.getElementById('trigrep-results') || trigrepPanel.querySelector('#trigrep-results');
  if (!theme || !results) { showSearchFallback(); return; }
  results.innerHTML = `
    <div class="trigrep-empty tg-scope">
      <div class="trigrep-empty-title">Looking for ${tgEscape(theme.title)}?</div>
      <div class="trigrep-empty-desc">${tgEscape(theme.question)} Pick a way to scope it down:</div>
      <div class="tg-scope-list">
        ${theme.options.map((o, i) => {

          return `<button class="tg-scope-option" data-i="${i}" type="button">
            <span class="tg-scope-label">${tgEscape(o.label)}</span>
            <span class="tg-scope-desc">${tgEscape(o.desc)}</span>
            <code>${tgEscape(q)}</code>
          </button>`;
        }).join('')}
      </div>
    </div>
  `;
  results.querySelectorAll('.tg-scope-option').forEach(btn => {

function tgRunCanned(query, flowId) {
  const flow = FLOWS[flowId];
  if (!flow) return;
  currentFlow = flowId;
  const input = document.getElementById('trigrep-query-input');
  if (input) input.value = query;
  setSyntaxMode('sourcegraph');
  renderTrigrepResults(flow);
  tgSyncFromInput();

// === Filter pills + free-text token chips =============================
// A `NOT` op followed by a `filter` token renders as ONE pill with an
// "is not" badge. Free-text terms / regex / structural units render as
// their own neutral chips alongside the pills.
function tgRenderPills() {
  const strip = document.getElementById('tg-chip-strip');
  if (!strip) return;
  const html = [];
  const tokens = TGState.tokens;
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.kind === 'op' && t.value === 'not' && tokens[i+1] && tokens[i+1].kind === 'filter') {
      const f = tokens[i+1];
      const cls = ['tg-pill','is-not', f.status === 'unverified' ? 'is-unverified' : ''].filter(Boolean).join(' ');
      html.push(`<span class="${cls}" data-idx="${i+1}" data-pair="${i}">
        <span class="tg-pill-key">${tgEscape(f.key)}</span>
        <span class="tg-pill-op">is not</span>
        <span class="tg-pill-val">${tgEscape(f.value)}</span>
        <button class="tg-pill-x" data-x-pair="${i},${i+1}" title="Remove" aria-label="Remove ${tgEscape(f.key)}: ${tgEscape(f.value)}">×</button>
      </span>`);
      i++;
      continue;
    }
    if (t.kind === 'filter') {
      const cls = ['tg-pill', t.status === 'unverified' ? 'is-unverified' : ''].filter(Boolean).join(' ');
      html.push(`<span class="${cls}" data-idx="${i}">
        <span class="tg-pill-key">${tgEscape(t.key)}:</span>
        <span class="tg-pill-val">${tgEscape(t.value)}</span>
        <button class="tg-pill-x" data-x="${i}" title="Remove" aria-label="Remove ${tgEscape(t.key)}: ${tgEscape(t.value)}">×</button>
      </span>`);
      continue;
    }
    if (t.kind === 'op') {
      html.push(`<span class="tg-op-chip" data-idx="${i}">${tgEscape(t.value)}</span>`);
      continue;
    }
    const modeCls = t.mode === 'regex' ? ' is-regex' : (t.mode === 'structural' ? ' is-structural' : '');
    html.push(`<span class="tg-tok${modeCls}" data-idx="${i}">${tgEscape(t.value)}<button class="tg-tok-x" data-x="${i}" title="Remove" aria-label="Remove ${tgEscape(t.value)}">×</button></span>`);
  }
  strip.innerHTML = html.join('');
  strip.querySelectorAll('[data-x]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.x, 10);
      TGState.tokens.splice(idx, 1);
      tgWriteBack();
    });
  });
  strip.querySelectorAll('[data-x-pair]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const [a, b] = btn.dataset.xPair.split(',').map(n => parseInt(n, 10));
      TGState.tokens.splice(Math.min(a,b), 2);
      tgWriteBack();
    });
  });
  // Click on a pill (not the ×) → re-edit its value via the autocomplete.
  strip.querySelectorAll('.tg-pill').forEach(p => {
    p.addEventListener('click', e => {
      if (e.target.closest('.tg-pill-x')) return;
      const idx = parseInt(p.dataset.idx, 10);
      const t = TGState.tokens[idx];
      if (!t || t.kind !== 'filter') return;
      const input = document.getElementById('trigrep-query-input');
      if (!input) return;
      // Strip the pill from tokens, then plant `key:` in the input so the
      // value dropdown opens and the user picks again.
      const pairOp = p.dataset.pair != null ? parseInt(p.dataset.pair, 10) : null;
      if (pairOp != null) TGState.tokens.splice(Math.min(pairOp, idx), 2);
      else TGState.tokens.splice(idx, 1);
      const baseRaw = tgSerialize(TGState.tokens);
      input.value = (baseRaw ? baseRaw + ' ' : '') + `${t.key}:`;
      const newPos = input.value.length;
      input.focus();
      input.setSelectionRange(newPos, newPos);
      tgSyncFromInput();
      setTimeout(tgRenderAutocomplete, 0);
    });
  });
}

function tgWriteBack() {
  const input = document.getElementById('trigrep-query-input');
  if (input) input.value = tgSerialize(TGState.tokens);
  tgRenderPills();
}

// === Recognition-over-recall autocomplete =============================
// On focus / empty caret token → list of filters with descriptions.
// After `key:` → values for that filter (curated, with scope hints).
function tgCaretContext(input) {
  const v = input.value;
  const pos = input.selectionStart || v.length;
  let start = pos;
  while (start > 0 && !/\s/.test(v[start - 1])) start--;
  const tokenSoFar = v.slice(start, pos);
  const colon = tokenSoFar.indexOf(':');
  if (colon < 0) {
    return { mode: 'filter', prefix: tokenSoFar.toLowerCase(), start, pos };
  }
  const key = tokenSoFar.slice(0, colon);
  const prefix = tokenSoFar.slice(colon + 1);
  const canon = TG_ALIAS_TO_CANON[key.toLowerCase()];
  if (!canon) return null;
  return { mode: 'value', canon, prefix, start, pos };
}

function tgValueLookup(filterKey, prefix='') {
  const list = (TG_VALUES[filterKey] || []).map(v => typeof v === 'string' ? { value: v } : v);
  const p = (prefix || '').toLowerCase();
  if (!p) return list.slice(0, 12);
  const starts = list.filter(v => v.value.toLowerCase().startsWith(p));
  const contains = list.filter(v => !v.value.toLowerCase().startsWith(p) && v.value.toLowerCase().includes(p));
  const fuzzy = list.filter(v => !v.value.toLowerCase().includes(p) && tgLev(v.value.toLowerCase(), p) <= 2);
  return [...starts, ...contains, ...fuzzy].slice(0, 12);
}

function tgFilterLookup(prefix='') {
  const p = (prefix || '').toLowerCase();
  const all = TG_FILTER_ORDER.map(k => ({ key: k, desc: TG_FILTERS[k].desc }));
  if (!p) return all;
  const starts = all.filter(f => f.key.startsWith(p));
  const contains = all.filter(f => !f.key.startsWith(p) && f.key.includes(p));
  const aliasHits = all.filter(f => !f.key.includes(p) && TG_FILTERS[f.key].aliases.some(a => a.startsWith(p)));
  return [...starts, ...contains, ...aliasHits];
}

function tgRenderAutocomplete() {
  const ac = document.getElementById('tg-autocomplete');
  const input = document.getElementById('trigrep-query-input');
  if (!ac || !input) return;
  if (document.activeElement !== input) { ac.hidden = true; TGState.ac.open = false; return; }
  const ctx = tgCaretContext(input);
  if (!ctx) { ac.hidden = true; TGState.ac.open = false; return; }
  let items, sectionTitle;
  if (ctx.mode === 'filter') {
    items = tgFilterLookup(ctx.prefix).map(f => ({ kind:'filter', name: `${f.key}:`, desc: f.desc, insert: `${f.key}:` }));
    sectionTitle = ctx.prefix ? `Filters matching "${ctx.prefix}"` : 'Available filters';
  } else {
    const raw = tgValueLookup(ctx.canon, ctx.prefix);
    items = raw.map(v => ({ kind:'value', name: v.value, desc: v.desc || '', insert: v.value }));
    sectionTitle = `Values for ${ctx.canon}:`;
  }
  if (!items.length) { ac.hidden = true; TGState.ac.open = false; return; }
  TGState.ac = { open: true, items, active: 0, mode: ctx.mode, ctx };
  const renderName = (name) => {
    if (ctx.mode === 'filter') {
      const m = ctx.prefix && name.toLowerCase().startsWith(ctx.prefix) ? ctx.prefix.length : 0;
      return m ? `<b>${tgEscape(name.slice(0, m))}</b>${tgEscape(name.slice(m))}` : tgEscape(name);
    }
    const m = ctx.prefix && name.toLowerCase().startsWith(ctx.prefix.toLowerCase()) ? ctx.prefix.length : 0;
    return m ? `<b>${tgEscape(name.slice(0, m))}</b>${tgEscape(name.slice(m))}` : tgEscape(name);
  };
  ac.innerHTML = `<div class="tg-ac-section">${tgEscape(sectionTitle)}</div>` +
    items.map((it, i) => `
      <div class="tg-ac-item${i === 0 ? ' is-active' : ''}" data-i="${i}">
        <span class="tg-ac-name">${renderName(it.name)}</span>
        <span class="tg-ac-desc">${tgEscape(it.desc || '')}</span>
      </div>`).join('');
  const box = document.getElementById('trigrep-search-box');
  if (box) {
    ac.style.left = (box.offsetLeft + 120) + 'px';
    ac.style.top = (box.offsetTop + box.offsetHeight + 4) + 'px';
  }
  ac.hidden = false;
  ac.querySelectorAll('.tg-ac-item').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      tgAcCommit(parseInt(el.dataset.i, 10));
    });
  });
}

function tgAcCommit(i) {
  const ac = document.getElementById('tg-autocomplete');
  const input = document.getElementById('trigrep-query-input');
  if (!ac || !input || !TGState.ac.open) return;
  const item = TGState.ac.items[i];
  const ctx = TGState.ac.ctx;
  const before = input.value.slice(0, ctx.start);
  const after = input.value.slice(ctx.pos);
  let insert;
  if (ctx.mode === 'filter') {
    insert = item.insert;
  } else {
    insert = `${ctx.canon}:${item.insert}`;
  }
  input.value = before + insert + after;
  const newPos = (before + insert).length;
  input.setSelectionRange(newPos, newPos);
  if (ctx.mode === 'value') {
    ac.hidden = true; TGState.ac.open = false;
  }
  tgSyncFromInput();
  // After committing a filter key, re-open to show its value list.
  if (ctx.mode === 'filter') setTimeout(tgRenderAutocomplete, 0);
}
function tgAcMove(delta) {
  const ac = document.getElementById('tg-autocomplete');
  if (!ac) return;
  const n = TGState.ac.items.length;
  if (!n) return;
  TGState.ac.active = ((TGState.ac.active + delta) % n + n) % n;
  ac.querySelectorAll('.tg-ac-item').forEach((el, i) => el.classList.toggle('is-active', i === TGState.ac.active));
  // Scroll the active item into view (keyboard nav with long lists).
  const active = ac.querySelector('.tg-ac-item.is-active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

// === Silent reformulation (Sourcegraph Smart Search–style) ============
// Try deterministic rewrites in order; first one that lands on a happy
// path wins. Capped to ~6 cheap rules. No prose parsing.
function tgReformulate(text) {
  const tokens = tgParseRaw(text);
  // R1 — exact canonical match against a happy-path bag.
  const bag = tgCanonical(tokens);
  for (const [k, b] of Object.entries(TG_HAPPY_BAGS)) {
    if (bag === b) return { ...TG_HAPPY_QUERIES[k], source: 'exact', original: text };
  }
  // R2 — token shape matches a happy-path signature.
  const sig = tgRouteSignature(tokens);
  if (sig) return { ...sig, source: 'signature', original: text };
  // R3 — drop a trailing unverified/unknown filter that's too narrow.
  if (tokens.length >= 2) {
    const last = tokens[tokens.length - 1];
    if (last.kind === 'filter' && last.status !== 'valid') {
      const stripped = tokens.slice(0, -1);
      const sig2 = tgRouteSignature(stripped);
      if (sig2) return { ...sig2, source: 'stripped-trailing-filter', original: text };
    }
  }
  // R4 — treat bare terms as regex (only when nothing else fired).
  const bareTerms = tokens.filter(t => t.kind === 'term' && t.mode === 'literal');
  if (bareTerms.length === 1) {
    const candidate = tgParseRaw(`/${bareTerms[0].value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}/`);
    const sig3 = tgRouteSignature(candidate);
    if (sig3) return { ...sig3, source: 'as-regex', original: text };
  }
  // R5 — small fixed phrase bridge (not NL parsing).
  const ph = tgRoutePhrase(text);
  if (ph) return { ...ph, source: 'phrase', original: text };
  return null;
}

function tgShowReformBanner(originalQuery, reformulatedQuery, sourceLabel) {
  const el = document.getElementById('tg-reform-banner');
  if (!el) return;
  el.innerHTML = `
    Showing results for: <code>${tgEscape(reformulatedQuery)}</code>
    <button class="tg-reform-action" type="button" data-act="exact">Search exactly what I typed instead</button>
    <button class="tg-reform-dismiss" type="button" data-act="dismiss" aria-label="Dismiss">×</button>
  `;
  el.dataset.original = originalQuery;
  el.hidden = false;
  el.querySelector('[data-act="exact"]').addEventListener('click', () => {
    const input = document.getElementById('trigrep-query-input');
    if (input) input.value = originalQuery;
    tgHideReformBanner();
    showSearchFallback();
  });
  el.querySelector('[data-act="dismiss"]').addEventListener('click', tgHideReformBanner);
}
function tgHideReformBanner() {
  const el = document.getElementById('tg-reform-banner');
  if (!el) return;
  el.hidden = true;
  el.innerHTML = '';
}

// === Submit pipeline ==================================================
function tgSubmit(text) {
  if (!text) return;
  TGState.lastSubmitted = text;
  // 1) Exact canned syntax-example match (start-state cards path).
  const syntaxMatch = Object.entries(SYNTAX_EXAMPLES).find(([, t]) => t.toLowerCase() === text.toLowerCase());
  if (syntaxMatch) { tgHideReformBanner(); executeSearch(syntaxMatch[0]); return; }
  // 2) Silent reformulation → run the matched happy path.
  const hit = tgReformulate(text);
  if (hit) {
    if (hit.source === 'exact') tgHideReformBanner();
    else tgShowReformBanner(text, hit.query, hit.source);
    tgRunCanned(hit.query, hit.flow);
    return;
  }
  // 3) Theme detected → scope-it-down chips (no fixture matched).
  const theme = tgDetectTheme(text);
  if (theme) { tgHideReformBanner(); tgShowScope(theme); return; }
  // 4) Honest empty state — this prototype only has scripted fixtures.
  tgHideReformBanner();
  showSearchFallback();
}

// === Input → tokens → views ===========================================
function tgRenderAll() { tgRenderPills(); }
let tgDebounce = null;
function tgSyncFromInput() {
  const input = document.getElementById('trigrep-query-input');
  if (!input) return;
  if (tgDebounce) clearTimeout(tgDebounce);
  tgDebounce = setTimeout(() => {
    TGState.tokens = tgParseRaw(input.value);
    tgRenderAll();
    tgRenderAutocomplete();
  }, 180);
}

function tgWireAll() {
  const input = document.getElementById('trigrep-query-input');
  const ac = document.getElementById('tg-autocomplete');
  if (!input) return;
  input.addEventListener('input', tgSyncFromInput);
  input.addEventListener('focus', () => setTimeout(tgRenderAutocomplete, 0));
  input.addEventListener('click', tgRenderAutocomplete);
  input.addEventListener('keyup', () => { if (!TGState.ac.open) tgRenderAutocomplete(); });
  input.addEventListener('blur', () => setTimeout(() => { if (ac) ac.hidden = true; TGState.ac.open = false; }, 150));
  input.addEventListener('keydown', (e) => {
    if (TGState.ac.open) {
      if (e.key === 'ArrowDown') { e.preventDefault(); tgAcMove(1); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); tgAcMove(-1); return; }
      if (e.key === 'Enter' && TGState.ac.items.length) { e.preventDefault(); tgAcCommit(TGState.ac.active); return; }
      if (e.key === 'Tab' && TGState.ac.items.length)   { e.preventDefault(); tgAcCommit(TGState.ac.active); return; }
      if (e.key === 'Escape') { ac.hidden = true; TGState.ac.open = false; return; }
    }
  });
}

// === Acceptance tests — runLeanV1Tests() ==============================
window.runLeanV1Tests = function tgRunLeanV1Tests() {
  const cases = [];
  // Autocomplete
  cases.push({ section:'autocomplete', name: 'focusing empty input lists filters with descriptions',
    check: () => {
      const all = tgFilterLookup('');
      return all.length >= 10 && all.every(f => f.desc && f.desc.length > 5);
    } });
  cases.push({ section:'autocomplete', name: 'lang: suggests only real languages (no zero-result values)',
    check: () => {
      const vs = tgValueLookup('lang','');
      return vs.length >= 4 && vs.every(v => TG_VALUES.lang.includes(v.value) || TG_VALUES.lang.some(x => (typeof x === 'string' ? x : x.value) === v.value));
    } });
  cases.push({ section:'autocomplete', name: 'file: suggestions include repo scope where relevant',
    check: () => {
      const vs = tgValueLookup('file','OrderController');
      return vs.length >= 1 && vs[0].desc === 'payments-api';
    } });
  cases.push({ section:'autocomplete', name: 'value lookup prefix match: vis → public',
    check: () => tgValueLookup('visibility','pub').some(v => v.value === 'public') });

  // Pills
  cases.push({ section:'pills', name: 'Auth Opt 1 parses into 3 free-text + 2 pills',
    check: () => {
      const t = tgParseRaw('(@PreAuthorize or @Secured or @RolesAllowed) visibility:public lang:java');
      return t.filter(x => x.kind === 'filter').length === 2
          && t.filter(x => x.kind === 'term' && x.mode === 'literal').length === 3;
    } });
  cases.push({ section:'pills', name: '-file:**/test/** parses to NOT + filter (rendered as one is-not pill)',
    check: () => {
      const t = tgParseRaw('Logger type:symbol -file:**/test/**');
      const not = t.findIndex(x => x.kind === 'op' && x.value === 'not');
      return not >= 0 && t[not+1] && t[not+1].kind === 'filter' && t[not+1].key === 'file';
    } });
  cases.push({ section:'pills', name: 'editing a value → still serializes valid query',
    check: () => {
      const t = tgParseRaw('lang:java visibility:public');
      t[0].value = 'kotlin';
      return tgSerialize(t) === 'lang:kotlin visibility:public';
    } });
  cases.push({ section:'pills', name: 'removing a pill → others survive',
    check: () => {
      const t = tgParseRaw('lang:java visibility:public select:symbol.method');
      t.splice(1, 1);
      return tgSerialize(t) === 'lang:java select:symbol.method';
    } });
  for (const [k, h] of Object.entries(TG_HAPPY_QUERIES)) {
    cases.push({ section:'pills', name: `roundtrip canonical: ${k}`,
      check: () => tgCanonical(tgParseRaw(tgSerialize(tgParseRaw(h.query)))) === TG_HAPPY_BAGS[k] });
  }

  // Silent reformulation
  cases.push({ section:'reform', name: 'exact happy-path query → no banner (exact match)',
    check: () => {
      const r = tgReformulate('@RestController lang:java');
      return r && r.source === 'exact';
    } });
  cases.push({ section:'reform', name: 'near-miss: "public java authorization annotations" → Auth Opt 1',
    check: () => {
      const r = tgReformulate('public java authorization annotations');
      return r && r.flow === 'a' && (r.source === 'phrase' || r.source === 'signature');
    } });
  cases.push({ section:'reform', name: 'reorder-tolerant: tokens in different order still hit Auth Opt 1',
    check: () => {
      const r = tgReformulate('lang:java visibility:public (@PreAuthorize or @Secured or @RolesAllowed)');
      return r && r.flow === 'a';
    } });
  cases.push({ section:'reform', name: 'truly off-script "payment processing" → no reformulation',
    check: () => tgReformulate('payment processing') === null });
  cases.push({ section:'reform', name: 'phrase bridge: "where do we log errors" → Log Opt 1',
    check: () => {
      const r = tgReformulate('where do we log errors');
      return r && r.query === TG_HAPPY_QUERIES.logOpt1.query;
    } });

  // Removed surfaces are no longer reachable
  cases.push({ section:'removed', name: 'tgParseNL no longer defined',
    check: () => typeof tgParseNL === 'undefined' });
  cases.push({ section:'removed', name: 'TG_CONCEPTS no longer defined',
    check: () => typeof TG_CONCEPTS === 'undefined' });
  cases.push({ section:'removed', name: 'TG_CATALOG no longer defined',
    check: () => typeof TG_CATALOG === 'undefined' });
  cases.push({ section:'removed', name: 'tgApplySyntaxMode no longer defined (patternType: parse-only)',
    check: () => typeof tgApplySyntaxMode === 'undefined' });
  cases.push({ section:'removed', name: 'patternType: still PARSES from a pasted query',
    check: () => {
      const t = tgParseRaw('lang:java patternType:structural');
      return t.some(x => x.kind === 'filter' && x.key === 'patternType' && x.value === 'structural');
    } });

  // Theme fallback when no reformulation fires
  cases.push({ section:'theme', name: '"how is authentication handled?" → auth scope panel',
    check: () => tgDetectTheme('how is authentication handled?') === 'auth' });

  let pass = 0;
  const report = [];
  for (const c of cases) {
    let ok = false, detail = '';
    try { ok = !!c.check(); } catch (e) { detail = 'ERR: ' + e.message; }
    if (ok) pass++;
    report.push({ section: c.section, name: c.name, ok, detail });
  }
  const sections = {};
  for (const r of report) { sections[r.section] = sections[r.section] || { p:0, t:0 }; sections[r.section].t++; if (r.ok) sections[r.section].p++; }
  console.group(`[trigrep] lean v1 tests: ${pass}/${cases.length} passed`);
  for (const [s, x] of Object.entries(sections)) console.log(`   ${x.p === x.t ? '✅' : '❌'} ${s}: ${x.p}/${x.t}`);
  for (const r of report) {
    const tag = r.ok ? '✅' : '❌';
    if (r.ok) console.log(`${tag} [${r.section}] ${r.name}`);
    else console.warn(`${tag} [${r.section}] ${r.name} ${r.detail}`);
  }
  console.groupEnd();
  return { pass, total: cases.length, report };
};

function renderActivityPanel(root) {
  const COLORS = {
    'trigrep-search': '#ecb81f',
    'recipe-run':     '#992fb9',
    'commit-job':     '#2f42ff',
    'visualization':  '#27aa88',
    'none':           '#e5e7eb'
  };
  const STROKE = 1.2;
  const VB = '-12 -12 35 36';
  const svg = (children) => `<svg class="ap-scene" viewBox="${VB}" xmlns="http://www.w3.org/2000/svg">${children}</svg>`;
  const circle = (color, paths = {}) => {
    const parts = [];
    if (paths.right)  parts.push(`<path d="M 11,5 H 35"  stroke="${paths.right}"  stroke-width="${STROKE}" fill="none"/>`);
    if (paths.left)   parts.push(`<path d="M -12,5 H -1" stroke="${paths.left}"   stroke-width="${STROKE}" fill="none"/>`);
    if (paths.top)    parts.push(`<path d="M 5,-1 V -12" stroke="${paths.top}"    stroke-width="${STROKE}" fill="none"/>`);
    if (paths.bottom) parts.push(`<path d="M 5,11 V 35"  stroke="${paths.bottom}" stroke-width="${STROKE}" fill="none"/>`);
    parts.push(`<circle r="6" cx="5" cy="5" fill="${color}"/>`);
    return svg(parts.join(''));
  };
  const pathVertical   = (color) => svg(`<path d="M 5,-12 V 35" stroke="${color}" stroke-width="${STROKE}" fill="none"/>`);
  const pathHorizontal = (color) => svg(`<path d="M -12,5 H 35" stroke="${color}" stroke-width="${STROKE}" fill="none"/>`);
  const corner         = (color) => svg(`<path d="M -12,5 H 0 Q 5 5.5, 5 12 V 35" stroke="${color}" stroke-width="${STROKE}" fill="none"/>`);
  const cornerWithH    = (cornerColor, hColor) => svg(`
    <path d="M -12,5 H 35" stroke="${hColor}"      stroke-width="${STROKE}" fill="none"/>
    <path d="M -12,5 H 0 Q 5 5.5, 5 12 V 35" stroke="${cornerColor}" stroke-width="${STROKE}" fill="none"/>
  `);
  const cornerTR = (color) => svg(`<path d="M 5,-12 V 0 Q 5 5, 12 5 H 35" stroke="${color}" stroke-width="${STROKE}" fill="none"/>`);
  const teeRight = (railColor, branchColor) => svg(`
    <path d="M 5,-12 V 35" stroke="${railColor}"   stroke-width="${STROKE}" fill="none"/>
    <path d="M 5,5 H 35"   stroke="${branchColor || railColor}" stroke-width="${STROKE}" fill="none"/>
  `);
  const S = {
    BLANK:'blank', CIRCLE:'circle', CIRCLE_R:'circle-right', CIRCLE_B:'circle-bottom',
    CIRCLE_T:'circle-top', CIRCLE_TB:'circle-top-bottom',
    CORNER:'corner', CORNER_H:'corner-h', CORNER_TR:'corner-tr', TEE_RIGHT:'tee-right',
    V:'vertical', H:'horizontal'
  };
  const renderScene = (scene, color, pathColor) => {
    const pc = pathColor || color;
    switch (scene) {
      case S.BLANK:     return '';
      case S.CIRCLE:    return circle(color);
      case S.CIRCLE_R:  return circle(color, { right: pc });
      case S.CIRCLE_B:  return circle(color, { bottom: pc });
      case S.CIRCLE_T:  return circle(color, { top: pc });
      case S.CIRCLE_TB: return circle(color, { top: pc, bottom: pc });
      case S.CORNER:    return corner(pc);
      case S.CORNER_H:  return cornerWithH(color, pc);
      case S.CORNER_TR: return cornerTR(color);
      case S.TEE_RIGHT: return teeRight(color, pc);
      case S.V:         return pathVertical(color);
      case S.H:         return pathHorizontal(color);
      default:          return '';
    }
  };

  const trigrepRow = (name, query, opts) => {
    const { hasChild = true, mode = 'sourcegraph', org = 'Acme Bank', status = '2 matches · 14 files', runBy = 'A', time = '6 min ago', abs = 'Today 09:42', clusterStart = true } = opts || {};

    if (trigrepRel === 'middle') col0 = S.TEE_RIGHT;
    if (trigrepRel === 'last')   col0 = S.CORNER_TR;

    else if (hasCommit)      col2 = S.CORNER;
    else if (hasVis)         col2 = S.H;

      type: 'recipe-run', name, recipe, clusterStart,

  const visualizationRow = (name, opts) => {

      scenes:          [col0, S.BLANK, S.BLANK, col3],
      colors:          [COLORS['trigrep-search'], COLORS.none, COLORS.none, COLORS['visualization']],
      secondaryColors: [COLORS['trigrep-search'], COLORS.none, COLORS.none, COLORS['visualization']],

  const rows = [
    trigrepRow('Find usages of @Deprecated in Spring projects', '@Deprecated', { hasChild: true, status: '147 matches · 38 files', time: '6 min ago', abs: 'Today 09:42' }),
    recipeRunRow('Update Spring Boot dependencies', 'org.openrewrite.spring.boot3.UpgradeSpringBoot_3_3', { trigrepRel: 'middle', hasCommit: true, hasVis: true, runBy: 'A', time: '4 min ago', abs: 'Today 09:44' }),
    commitJobRow('chore: bump Spring Boot to 3.3.x', { isLast: true, hasParallelVis: true, parentHasTrigrepSiblingBelow: true, progress: { done: 12, total: 12 }, runBy: 'A', time: '3 min ago', abs: 'Today 09:45' }),
    visualizationRow('Dependency usage chart', { isLast: true, parentHasTrigrepSiblingBelow: true, status: 'Completed', runBy: 'A', time: '2 min ago', abs: 'Today 09:46' }),
    recipeRunRow('Replace deprecated annotations', 'org.openrewrite.java.migrate.UpgradeJavaVersion', { trigrepRel: 'last', hasCommit: true, hasVis: false, runBy: 'M', time: '4 min ago', abs: 'Today 09:44' }),
    commitJobRow('refactor: replace @Deprecated calls', { isLast: true, hasParallelVis: false, parentHasTrigrepSiblingBelow: false, progress: { done: 8, total: 12, running: true }, runBy: 'M', time: '2 min ago', abs: 'Today 09:46' }),
    recipeRunRow('Migrate JUnit 4 to JUnit 5', 'org.openrewrite.java.testing.junit5.JUnit5BestPractices', { trigrepRel: 'none', hasCommit: true, hasVis: true, runBy: 'R', time: '1 hr ago', abs: 'Today 08:51', clusterStart: true }),
    commitJobRow('test: migrate to JUnit 5', { isLast: true, hasParallelVis: true, parentHasTrigrepSiblingBelow: false, progress: { done: 8, total: 9 }, runBy: 'R', time: '58 min ago', abs: 'Today 08:53' }),

    trigrepRow('Find owner-tagged TODO comments',      '/TODO\\(\\w+\\):/',                      { hasChild: false, mode: 'regex', status: '284 matches · 87 files', runBy: 'A', time: '2 days ago', abs: 'Mon 11:08',      clusterStart: true })

      </header>
      <section class="ap-tiles">

        <div class="ap-tile recipe"><div class="ap-tile-label"><span class="dot"></span>Recipe runs</div><div class="ap-tile-value">64</div><div class="ap-tile-delta"><span class="up">▲ 4%</span> · last 7 days</div></div>
        <div class="ap-tile commit"><div class="ap-tile-label"><span class="dot"></span>Commit jobs</div><div class="ap-tile-value">27</div><div class="ap-tile-delta"><span class="down">▼ 8%</span> · last 7 days</div></div>
        <div class="ap-tile viz"><div class="ap-tile-label"><span class="dot"></span>Visualizations</div><div class="ap-tile-value">13</div><div class="ap-tile-delta">— stable · last 7 days</div></div>
      </section>
      <div class="ap-toolbar">
        <div class="ap-search">
          <svg class="icn" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
          <input type="text" placeholder="Search by name, recipe, or commit message…" />
        </div>
        <div class="ap-chips" role="group" aria-label="Activity type filters">
          <button class="ap-chip t-trigrep active"><span class="sw"></span>Trigrep</button>

        <select class="ap-select" aria-label="Run by"><option>Run by anyone</option><option>Run by me</option><option>Run by team</option></select>
        <select class="ap-select" aria-label="Status"><option>Any status</option><option>Completed</option><option>Running</option><option>Failed</option></select>

    if (r.progress) {

      const state = failed ? 'failed' : running ? 'running' : done < total ? 'warn' : 'success';

      tdStatus.innerHTML = `
        <div class="progress">

  root.querySelectorAll('.ap-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('active');
      chip.classList.toggle('muted');
    });

  // Trigrep search rows are clickable — clicking the name jumps back to that
  // search in the Trigrep view with the query and syntax mode pre-filled.
  root.querySelectorAll('.trigrep-search-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const query = link.dataset.query || '';
      const mode  = link.dataset.mode  || 'sourcegraph';
      setActiveView('trigrep');

      // Route to a canned flow if one exists for this query, otherwise let
      // the standard submit pipeline handle it (which falls back to the
      // honest empty "no matches" state).
      const flowId = (typeof QUERY_TO_FLOW !== 'undefined') ? QUERY_TO_FLOW[query] : null;
      if (flowId && FLOWS[flowId]) {
        try { executeSearch(flowId); } catch (err) {}
        // executeSearch hard-codes Sourcegraph, so restore the original mode
        // and refresh the chip strip from the rewritten input value.
        try { setSyntaxMode(mode); } catch (err) {}
        const input = trigrepPanel.querySelector('#trigrep-query-input');
        if (input) input.dispatchEvent(new Event('input', { bubbles: true }));
        return;
      }

      try { setSyntaxMode(mode); } catch (err) {}
      const input = trigrepPanel.querySelector('#trigrep-query-input');
      if (input) {
        input.value = query;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      try { tgSubmit(query); }
      catch (err) { try { showSearchFallback(); } catch (e2) {} }
    });
  });
}
