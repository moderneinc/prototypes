<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trigrep</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ================================================
   NEO DESIGN SYSTEM — BRAND TOKENS (Tier 1)
   ================================================ */
:root {
  --brand-white: #FFFFFF;
  --brand-black: #000000;
  --brand-digital-blue-100: #F2F3FF;
  --brand-digital-blue-200: #DCE0FF;
  --brand-digital-blue-300: #B6BFFF;
  --brand-digital-blue-400: #8D99FF;
  --brand-digital-blue-500: #2F42FF;
  --brand-digital-blue-600: #2637E6;
  --brand-digital-blue-700: #1E2EC2;
  --brand-digital-blue-800: #131E7A;
  --brand-digital-blue-900: #000855;
  --brand-green-100: #F3FFF5;
  --brand-green-200: #CFFFD7;
  --brand-green-500: #72E184;
  --brand-green-600: #5EC46F;
  --brand-green-700: #4CA75A;
  --brand-green-800: #3B8948;
  --brand-red-100: #FEF2F2;
  --brand-red-400: #FCA5A5;
  --brand-red-500: #F87171;
  --brand-red-600: #CB3446;
  --brand-red-700: #A92232;
  --brand-red-800: #871421;
  --brand-orange-100: #FFF8E5;
  --brand-orange-600: #FFB800;
  --brand-orange-700: #D69B00;
  --brand-orange-800: #856000;
  --brand-grey-100: #F9FAFB;
  --brand-grey-200: #F3F4F6;
  --brand-grey-300: #E5E7EB;
  --brand-grey-400: #D1D5DB;
  --brand-grey-500: #9CA3AF;
  --brand-grey-600: #6B7280;
  --brand-grey-700: #4B5563;
  --brand-grey-800: #374151;
  --brand-grey-900: #1F2937;
  --brand-grey-1000: #111827;
  --brand-violet-500: #AD59C7;
  --brand-violet-600: #992FB9;
  --brand-teal-600: #3BCCA6;
  --brand-font-family-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --brand-font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  --brand-font-weight-regular: 400;
  --brand-font-weight-medium: 500;
  --brand-font-weight-semibold: 600;
  --brand-font-weight-bold: 700;
  --brand-font-size-100: 10px;
  --brand-font-size-200: 12px;
  --brand-font-size-300: 14px;
  --brand-font-size-400: 16px;
  --brand-font-size-500: 18px;
  --brand-font-size-600: 20px;
  --brand-font-size-700: 24px;
  --brand-font-size-800: 28px;
  --brand-spacing-0: 0;
  --brand-spacing-100: 4px;
  --brand-spacing-200: 8px;
  --brand-spacing-300: 12px;
  --brand-spacing-400: 16px;
  --brand-spacing-500: 20px;
  --brand-spacing-600: 24px;
  --brand-spacing-800: 32px;
  --brand-spacing-1000: 40px;
  --brand-radius-0: 0;
  --brand-radius-100: 4px;
  --brand-radius-200: 6px;
  --brand-radius-300: 8px;
  --brand-radius-400: 12px;
  --brand-radius-500: 16px;
  --brand-radius-full: 9999px;
  --brand-shadow-100: 0 1px 3px rgba(31, 41, 55, 0.1);
  --brand-shadow-200: 0 2px 4px rgba(31, 41, 55, 0.1);
  --brand-shadow-300: 0 8px 15px rgba(31, 41, 55, 0.1);
  --brand-shadow-400: 0 4px 4px rgba(31, 41, 55, 0.1), 0 8px 24px rgba(31, 41, 55, 0.1);
  --brand-shadow-500: 0 8px 15px rgba(31, 41, 55, 0.1);
  --brand-transition-fast: 150ms ease;
  --brand-transition-base: 200ms ease;
  --brand-line-height-200: 20px;
  --brand-line-height-300: 24px;
  --brand-line-height-400: 28px;
}

/* ================================================
   NEO DESIGN SYSTEM — ALIAS TOKENS (Tier 2)
   ================================================ */
:root {
  --alias-primary-100: var(--brand-digital-blue-100);
  --alias-primary-200: var(--brand-digital-blue-200);
  --alias-primary-300: var(--brand-digital-blue-300);
  --alias-primary-500: var(--brand-digital-blue-500);
  --alias-primary-600: var(--brand-digital-blue-600);
  --alias-primary-700: var(--brand-digital-blue-700);
  --alias-primary-800: var(--brand-digital-blue-800);
  --alias-success-100: var(--brand-green-100);
  --alias-success-600: var(--brand-green-600);
  --alias-success-700: var(--brand-green-700);
  --alias-error-100: var(--brand-red-100);
  --alias-error-600: var(--brand-red-600);
  --alias-error-700: var(--brand-red-700);
  --alias-warning-100: var(--brand-orange-100);
  --alias-warning-600: var(--brand-orange-600);
  --alias-neutral-light-100: var(--brand-grey-100);
  --alias-neutral-light-200: var(--brand-grey-200);
  --alias-neutral-light-300: var(--brand-grey-300);
  --alias-neutral-light-400: var(--brand-grey-400);
  --alias-neutral-dark-500: var(--brand-grey-500);
  --alias-neutral-dark-600: var(--brand-grey-600);
  --alias-neutral-dark-700: var(--brand-grey-700);
  --alias-neutral-dark-800: var(--brand-grey-800);
  --alias-neutral-dark-900: var(--brand-grey-900);
  --alias-neutral-dark-1000: var(--brand-grey-1000);
  --alias-foundation-white: var(--brand-white);
  --alias-foundation-black: var(--brand-black);
  --alias-font-heading: var(--brand-font-family-sans);
  --alias-font-body: var(--brand-font-family-sans);
  --alias-font-code: var(--brand-font-family-mono);
}

/* ================================================
   NEO DESIGN SYSTEM — MAPPED TOKENS (Tier 3)
   ================================================ */
:root {
  --surface-primary: var(--alias-foundation-white);
  --surface-page: #f4f4f4;
  --surface-secondary: var(--alias-neutral-light-100);
  --surface-tertiary: var(--alias-neutral-light-200);
  --surface-disabled: var(--alias-neutral-light-200);
  --surface-error: var(--alias-error-100);
  --surface-success: var(--alias-success-100);
  --surface-information: var(--alias-primary-100);
  --surface-warning: var(--alias-warning-100);
  --surface-primary-filled: var(--alias-primary-500);
  --surface-error-filled: var(--alias-error-600);
  --surface-success-filled: var(--alias-success-600);
  --surface-primary-hover: var(--alias-primary-100);
  --surface-primary-pressed: var(--alias-primary-200);
  --surface-primary-filled-hover: var(--alias-primary-700);
  --surface-primary-filled-pressed: var(--alias-primary-800);
  --surface-primary-active: #3776F01A;
  --surface-error-filled-hover: var(--alias-error-700);
  --text-primary: var(--alias-neutral-dark-1000);
  --text-secondary: var(--alias-neutral-dark-600);
  --text-tertiary: var(--alias-neutral-dark-500);
  --text-disabled: var(--alias-neutral-light-400);
  --text-error: var(--alias-error-600);
  --text-success: var(--alias-success-700);
  --text-information: var(--alias-primary-700);
  --text-on-primary: var(--alias-foundation-white);
  --text-on-error: var(--alias-foundation-white);
  --text-primary-hover: var(--alias-primary-700);
  --icon-primary: var(--alias-neutral-dark-1000);
  --icon-secondary: var(--alias-neutral-dark-600);
  --icon-tertiary: var(--alias-neutral-dark-500);
  --icon-on-primary: var(--alias-foundation-white);
  --border-primary: var(--alias-neutral-light-300);
  --border-secondary: var(--alias-neutral-light-400);
  --border-hover: var(--alias-neutral-light-400);
  --border-focus: var(--alias-primary-600);
  --content-heading: var(--alias-neutral-dark-1000);
  --content-body: var(--alias-neutral-dark-800);
  --content-caption: var(--alias-neutral-dark-600);
  --content-placeholder: var(--alias-neutral-dark-500);
  --font-heading: var(--alias-font-heading);
  --font-body: var(--alias-font-body);
  --font-code: var(--alias-font-code);
  --space-1: var(--brand-spacing-100);
  --space-2: var(--brand-spacing-200);
  --space-3: var(--brand-spacing-300);
  --space-4: var(--brand-spacing-400);
  --space-5: var(--brand-spacing-500);
  --space-6: var(--brand-spacing-600);
  --space-8: var(--brand-spacing-800);
  --space-10: var(--brand-spacing-1000);
  --radius-sm: var(--brand-radius-100);
  --radius-md: var(--brand-radius-200);
  --radius-lg: var(--brand-radius-300);
  --radius-xl: var(--brand-radius-400);
  --radius-2xl: var(--brand-radius-500);
  --radius-full: var(--brand-radius-full);
  --shadow-xs: var(--brand-shadow-100);
  --shadow-sm: var(--brand-shadow-200);
  --shadow-md: var(--brand-shadow-300);
  --shadow-lg: var(--brand-shadow-400);
  --shadow-xl: var(--brand-shadow-500);
  --transition-fast: var(--brand-transition-fast);
  --transition-base: var(--brand-transition-base);
}

/* Legacy tokens still consumed by the rest of this file */
:root {
    --grey-25:  #f9fafb;
    --grey-50:  #f3f4f6;
    --grey-100: #e5e7eb;
    --grey-200: #d1d5db;
    --grey-300: #9ca3af;
    --grey-500: #6b7280;
    --grey-600: #4b5563;
    --grey-700: #374151;
    --grey-800: #1f2937;
    --grey-900: #111827;
    --bg: #ffffff;

    --neo-digital-blue-300: #8d99ff;
    --neo-digital-blue-500: #2f42ff;
    --neo-red-500: #cb3446;

    --neo-red: #FF3232;
    --roseate: #DB4197;
    --violet: #461DDE;
    --digital-blue: #2F42FF;
    --digital-green: #3DDC84;

    --highlight: #fbbf24;
    --highlight-bg: #fef3c7;
    --highlight-text: #78350f;
    --java-dot: #e76f00;
    --code-bg: #0d1117;

    --code-near-black: #0A0F1E;
    --code-cb: #7B9FFF;
    --code-cs: #A0A4C0;
    --code-cd: rgba(255,255,255,0.25);
    --code-slate-mid: #636687;

    /* Moderne UI palette (recipe results page) — used in Trigrep
       to mirror FileDiffView / ResultExpansionPanel visuals. */
    --mui-grey-100: #F8F9FA;
    --mui-grey-150: #EDEFEF;
    --mui-grey-200: #E9ECEF;
    --mui-grey-300: #DEE2E6;
    --mui-grey-400: #CED4DA;
    --mui-grey-500: #ADB5BD;
    --mui-grey-600: #6C757D;
    --mui-grey-700: #495057;
    --mui-grey-800: #343A40;
    --mui-card-bg: #F4F4F4;
    --mui-card-body-bg: #FFFFFF;
    --mui-divider: #C1C1C1;
    --mui-blue: #2F42FF;
    --mui-blue-200: #9FA8FF;
    --mui-gold: #FFC107;
    --mui-gold-soft: #FFF3B0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--grey-50);
    color: var(--grey-700);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.55;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }

  /* ===== Shell ===== */
  body { background: var(--surface-page); }
  .shell { height: 100vh; display: flex; flex-direction: column; }
  .grid {
    display: grid;
    grid-template-columns: 98px 1fr;
    grid-template-areas: "nav content";
    flex: 1;
    overflow: hidden;
    gap: 0;
    background: var(--surface-page);
  }

/* ================================================
   LEFT NAVIGATION RAIL (98px) — v2-sandbox spec
   ================================================ */
.left-nav {
  grid-area: nav;
  width: 98px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  padding: 2px 8px 24px;
  gap: 0;
  background: var(--surface-page);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  overflow: visible;
}

.left-nav-top {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  gap: 4px;
}

.nav-item-home { padding: 0 4px; }
.nav-item-home .nav-icon-container { padding: 4px; }

.nav-item {
  width: 100%;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  position: relative;
  text-decoration: none;
  background: transparent;
}

.nav-icon-container {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: var(--radius-lg);
  border: 1px solid transparent;
  background: transparent;
  transition: background-color 150ms ease, border-color 150ms ease;
}

.nav-item:hover .nav-icon-container,
.nav-item.active .nav-icon-container {
  background: var(--brand-digital-blue-100);
  border-color: var(--brand-digital-blue-200);
}

.nav-item svg {
  width: 22px;
  height: 22px;
  min-width: 22px;
  color: var(--brand-grey-900);
  flex-shrink: 0;
}

.nav-label {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: var(--brand-font-weight-regular);
  line-height: 1;
  color: var(--brand-grey-900);
  text-align: center;
  white-space: normal;
  width: 100%;
  transition: color 150ms ease;
}

.nav-item:hover .nav-label { color: var(--brand-digital-blue-600); }
.nav-item.active .nav-label {
  font-weight: var(--brand-font-weight-semibold);
  color: var(--brand-digital-blue-800);
}

.nav-badge {
  font-size: 11px;
  padding: 0 6px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--brand-grey-200);
  color: var(--brand-grey-800);
  border: 1px solid rgba(107, 114, 128, 0.5);
  font-weight: var(--brand-font-weight-medium);
  line-height: 1;
  text-align: center;
  letter-spacing: 0;
}

.nav-home-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
  padding: 4px 0;
}

.nav-version-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--brand-digital-blue-500) 0%, var(--brand-violet-500) 100%);
  color: var(--brand-white);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: var(--brand-font-weight-semibold);
  line-height: 1;
  letter-spacing: 0;
}

.nav-more-wrapper { position: relative; margin-top: auto; }

.nav-more-popover {
  position: absolute;
  left: calc(100% + 4px);
  bottom: 0;
  background: var(--surface-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 96px;
  z-index: 100;
}

.nav-more-popover[hidden] { display: none; }
.nav-more-popover .nav-item { padding: 8px 4px; }

/* ================================================
   MAIN CONTENT AREA
   ================================================ */
.main-area {
  grid-area: content;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* ================================================
   GLOBAL NAVIGATION BAR (65px toolbar)
   ================================================ */
.global-nav {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 12px 20px;
  gap: 12px;
  flex-shrink: 0;
  position: relative;
  width: 100%;
}

.global-nav::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 70%;
  transform: translate(-50%, -50%);
  width: 1000px;
  max-width: 90%;
  height: 65px;
  background: radial-gradient(ellipse at center, var(--brand-red-100) 0%, var(--brand-red-100) 40%, transparent 70%);
  filter: blur(20px);
  z-index: 0;
  pointer-events: none;
}

.global-nav > * { position: relative; z-index: 1; }

.org-selector {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  color: var(--text-primary);
  cursor: pointer;
  padding: 10px 16px;
  border-radius: var(--radius-full);
  transition: all var(--transition-fast);
  background: var(--surface-primary);
  border: 1px solid var(--border-secondary);
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-transform: none;
}

.org-selector:hover {
  background: var(--brand-grey-200);
  border-color: var(--border-primary);
}

.org-selector.selected {
  color: var(--text-primary);
  font-weight: var(--brand-font-weight-regular);
}

.org-selector-wrapper {
  position: relative;
  flex: 0 1 auto;
  min-width: 0;
  max-width: 50vw;
}

.nav-spacer { flex: 1; }

.search-input {
  height: 40px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-secondary);
  padding: 10px 16px;
  font-size: var(--brand-font-size-300);
  color: var(--text-tertiary);
  background: var(--surface-primary);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: background var(--transition-fast), border-color var(--transition-fast);
  flex-shrink: 0;
  user-select: none;
}

.search-input:hover {
  background: var(--brand-grey-200);
  border-color: var(--border-primary);
}

.search-input > span:first-of-type { flex: 1; white-space: nowrap; }
.search-input-keys { display: inline-flex; align-items: center; gap: 2px; }

.search-input kbd {
  font-size: var(--brand-font-size-100);
  background: var(--surface-tertiary);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-tertiary);
  font-family: var(--font-body);
  border: 1px solid var(--border-primary);
  min-width: 18px;
  text-align: center;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 64px;
}

.nav-action-btn {
  width: 40px;
  height: 40px;
  border-radius: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background var(--transition-fast), transform 200ms ease-in;
  border: none;
  background: transparent;
  color: var(--brand-grey-900);
  flex-shrink: 0;
}

.nav-action-btn:hover { background: var(--brand-grey-200); }
.nav-action-btn.open { background: var(--surface-primary); box-shadow: var(--shadow-xs); }
.nav-action-btn svg { width: 20px; height: 20px; }

.avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background: #E45A4F;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: var(--brand-font-weight-semibold);
  color: var(--brand-white);
  flex-shrink: 0;
}

  /* ===== Page (full-width trigrep panel) ===== */
  .page {
    flex: 1;
    background: var(--bg);
    border-radius: 8px;
    overflow: hidden;
    margin: 0 8px 8px 0;
    min-height: 0;
    display: flex;
    position: relative;
  }
  .trigrep-panel {
    flex: 1 1 auto;
    min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ===== Trigrep left panel ===== */
  .trigrep-page-header {
    padding: 20px 24px 12px;
    background: #ffffff;
    flex-shrink: 0;
  }
  .trigrep-page-title {
    font-family: var(--font-heading, 'Inter', sans-serif);
    font-size: 21px;
    font-weight: 400;
    color: var(--grey-900, #111827);
    line-height: 1.4;
  }
  .trigrep-page-subtitle {
    font-size: 14px;
    color: var(--grey-600, #6B7280);
    margin-top: 2px;
  }
  .trigrep-head {
    padding: 8px 24px 12px;
    border-bottom: 1px solid var(--mui-divider);
    flex-shrink: 0;
    background: #ffffff;
  }
  .trigrep-search-row {
    display: flex; align-items: center; gap: 10px;
  }
  .trigrep-search-box {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    background: #fff;
    border: 1px solid var(--grey-200);
    border-radius: 8px;
    padding: 6px 10px 6px 12px;
    min-height: 40px;
  }
  .trigrep-search-box:focus-within {
    border-color: var(--neo-digital-blue-500);
    box-shadow: 0 0 0 3px rgba(47, 66, 255, 0.12);
  }
  .trigrep-search-icon { width: 16px; height: 16px; color: var(--grey-500); flex-shrink: 0; }
  /* Syntax selector */
  .syntax-selector { position: relative; flex-shrink: 0; }
  .syntax-selector-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; border: 0;
    padding: 4px 6px;
    font-size: 12px; color: var(--grey-600, #555);
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
  }
  .syntax-selector-btn:hover { background: var(--grey-50, #f5f5f5); color: var(--grey-700, #2b2b2b); }
  .syntax-selector-btn svg { width: 10px; height: 10px; color: var(--grey-500, #777); }
  .syntax-selector[data-open="1"] .syntax-selector-btn svg { transform: rotate(180deg); }
  .syntax-selector-divider {
    width: 1px; height: 18px;
    background: var(--grey-200, #e6e6e6);
    flex-shrink: 0;

  .syntax-selector-menu {

    padding: 8px 10px;
    font-size: 12px;

  .syntax-selector-menu li:hover { background: var(--grey-50, #f5f5f5); }

    color: var(--neo-digital-blue-500);

  }
  .syntax-selector-menu .opt-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 500;
    color: var(--grey-900);
  }
  .syntax-selector-menu .opt-label svg { width: 12px; height: 12px; color: var(--grey-500); }
  .syntax-selector-menu .opt-desc {
    font-size: 11px; color: var(--grey-500);
    font-family: 'JetBrains Mono', monospace;
  }
  .syntax-selector-menu li[aria-selected="true"] .opt-label { color: var(--neo-digital-blue-500); }
  .syntax-selector-menu li[aria-selected="true"] .opt-label svg { color: var(--neo-digital-blue-500); }
  .trigrep-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--grey-50);
    color: var(--grey-700);
    border: 1px solid var(--grey-100);
    border-radius: 6px;
    padding: 3px 4px 3px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    white-space: nowrap;
  }
  .trigrep-chip strong { color: var(--grey-500); font-weight: 500; margin-right: 1px; }
  .trigrep-chip-x {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: none; background: transparent;
    color: var(--grey-500); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .trigrep-chip-x:hover { background: var(--grey-200); color: var(--grey-900); }
  .trigrep-chip-x svg { width: 10px; height: 10px; }
  .trigrep-query {
    flex: 1; min-width: 80px;
    border: none; outline: none; background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--grey-900);
  }
  .trigrep-query::placeholder {
    font-family: var(--brand-font-family-sans);
    font-size: 13.5px;
    color: var(--grey-500);
    opacity: 1;
  }
  .btn-search {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 40px;
    background: var(--neo-digital-blue-500);
    color: #fff; border: none;
    padding: 0 16px;
    border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .btn-search:hover { background: #1f30e6; }

  /* Search-bar help text */
  .search-help-row {
    margin-top: 12px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    min-height: 18px;
  }
  /* Collapse the row when there's nothing to show (no result stats yet)
     so the empty state and results pane sit tight under the assist row. */
  .search-help-row:has(> .search-help-stats:empty),
  .search-help-row:not(:has(*:not(:empty))) {
    margin-top: 0;
    min-height: 0;
  }
  .search-help {
    font-size: 12px;
    color: var(--grey-500);
    line-height: 1.5;
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .search-help code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--grey-700);
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    padding: 0 4px;
    border-radius: 3px;
  }
  .search-help-stats {
    display: inline-flex; align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--mui-grey-600);
    flex-shrink: 0;
  }
  .search-help-stats:empty { display: none; }
  .results-toolbar-summary { color: var(--mui-grey-700); }
  .results-toolbar-summary strong { color: var(--grey-900); font-weight: 600; }
  .results-toolbar-recipes { color: var(--mui-grey-700); }
  .results-toolbar-recipes strong { color: var(--grey-900); font-weight: 600; }
  .results-toolbar-time {
    color: var(--mui-grey-500);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .results-toolbar-export {
    color: var(--neo-digital-blue-500);
    text-decoration: none;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .results-toolbar-export:hover { text-decoration: underline; }
  .results-toolbar-export svg { width: 11px; height: 11px; }

  .trigrep-body {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  /* Sidebar */
  .trigrep-sidebar {
    flex: 0 0 24%;
    min-width: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--mui-grey-200);
    background: #ffffff;
    font-size: 12px;
    min-height: 0;
  }
  .trigrep-pane {
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .trigrep-pane + .trigrep-pane {
    border-top: 1px solid var(--mui-grey-200);
  }
  .trigrep-pane-filters { flex: 1 1 auto; }
  .trigrep-pane-repos   { flex: 0 1 auto; max-height: 40%; }
  .trigrep-pane-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px 8px;
    font-size: 11px;
    color: var(--mui-grey-600);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .trigrep-pane-head .pane-count {
    color: var(--mui-grey-500);
    font-weight: 600;
    text-transform: none;
    margin-left: 4px;
  }
  .trigrep-pane-head .collapse-all {
    color: var(--mui-blue); cursor: pointer;
    text-transform: none; letter-spacing: 0; font-weight: 500;
    font-size: 11.5px;
  }
  .trigrep-pane-head .collapse-all:hover { text-decoration: underline; }
  .trigrep-pane-body {
    overflow-y: auto;
    padding: 0 8px 12px;
    min-height: 0;
  }
  .trigrep-pane-body::-webkit-scrollbar { width: 6px; }
  .trigrep-pane-body::-webkit-scrollbar-thumb { background: var(--mui-grey-300); border-radius: 3px; }
  .filter-group { margin: 4px 0 2px; }
  .filter-group-head {
    display: flex; align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 6px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px; font-weight: 700;
    color: var(--mui-grey-800);
  }
  .filter-group-head:hover { background: var(--mui-grey-100); }
  .filter-group-head svg {
    width: 14px; height: 14px;
    color: var(--mui-grey-600);
    transition: transform 0.2s ease;
    flex: 0 0 auto;
  }
  .filter-group.collapsed .filter-group-head svg { transform: rotate(-90deg); }
  .filter-group.collapsed .filter-group-body { display: none; }
  .filter-group-body { padding: 2px 0 6px 8px; margin-left: 12px; }
  .filter-group-label {
    padding: 10px 6px 4px;
    font-size: 10px;
    color: var(--mui-grey-500);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .topic-search {
    width: calc(100% - 8px);
    margin: 4px 0 6px;
    padding: 5px 9px;
    border: 1px solid var(--mui-grey-300);
    border-radius: 4px;
    font-family: inherit; font-size: 12px;
    color: var(--mui-grey-800);
    background: #ffffff;
    outline: none;
  }
  .topic-search:focus { border-color: var(--mui-blue); }
  .filter-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    min-height: 28px;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    color: var(--mui-grey-800);
  }
  .filter-item:hover { background: var(--mui-grey-100); }
  .filter-item .count {
    color: var(--mui-grey-600);
    font-size: 12px;
    flex: 0 0 auto;
  }
  .filter-item.active {
    background: rgba(47, 66, 255, 0.06);
    color: var(--mui-blue);
    font-weight: 500;
  }
  .filter-item.active .count { color: var(--mui-blue); font-weight: 500; }
  .filter-item .lang-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    display: inline-block;
    box-shadow: none;
  }
  .filter-item-name {
    display: inline-flex; align-items: center;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .filter-item .filter-check {
    width: 12px; height: 12px;
    flex-shrink: 0;
    color: transparent;
    margin-right: 6px;
  }
  .filter-item.active .filter-check {
    color: var(--mui-blue);
  }
  .filter-group.is-repo-list .filter-item .count {
    color: var(--mui-blue);
    font-weight: 500;
  }
  .filter-group.is-repo-list .filter-item.active .count { color: var(--mui-blue); }
  .filter-more-link {
    display: block;
    background: transparent; border: 0;
    padding: 4px 6px;
    margin-top: 2px;
    font-family: inherit; font-size: 12px;
    color: var(--mui-blue);
    cursor: pointer;
    text-align: left;
  }
  .filter-more-link:hover { text-decoration: underline; }
  .filter-group.is-repo-list.flat { margin: 4px 0 2px; }
  .filter-group.is-repo-list.flat .repo-list-body {
    padding: 4px 0 6px;
    margin-left: 0;
  }
  .repo-search-wrap {
    display: flex; align-items: center; gap: 6px;
    margin: 4px 0 6px;
    padding: 4px 9px;
    border: 1px solid var(--mui-grey-300);
    border-radius: 4px;
    background: #fff;
  }
  .repo-search-wrap:focus-within {
    border-color: var(--mui-blue);
  }
  .repo-search-icon {
    width: 12px; height: 12px;
    color: var(--mui-grey-500);
    flex-shrink: 0;
  }
  .repo-search {
    flex: 1; min-width: 0;
    border: 0; outline: none;
    background: transparent;
    font-family: inherit; font-size: 12px;
    color: var(--mui-grey-800);
  }
  .repo-search::placeholder { color: var(--mui-grey-500); }

  .trigrep-results {
    flex: 1 1 0;
    min-width: 0;
    overflow-y: auto;
    padding: 16px 24px 32px;
    background: var(--grey-25);
  }
  .trigrep-results::-webkit-scrollbar { width: 8px; }
  .trigrep-results::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 4px; }

  /* Result card */
  .result-card {
    background: var(--mui-card-bg);
    border: 1px solid var(--mui-grey-300);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: none;
  }
  .result-card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1px 8px 1px 12px;
    background: var(--mui-card-bg);
    min-height: 36px;
  }
  .result-card-file {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    color: var(--mui-grey-800);
    font-weight: 500;
    min-width: 0;
  }
  .result-card-file .file-module {
    color: var(--mui-grey-600); font-weight: 400;
    font-family: inherit;
    font-size: 13px;
    margin-left: 2px;
  }
  .result-card-actions { display: inline-flex; align-items: center; gap: 2px; }
  .result-card-meta {
    font-size: 12px; color: var(--mui-grey-600); margin-right: 6px;
  }
  .icon-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: none; background: transparent;
    color: var(--mui-grey-600);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--mui-grey-200); color: var(--mui-grey-800); }
  .icon-btn svg { width: 14px; height: 14px; }
  .chevron-btn svg { transition: transform 0.2s ease; }
  .result-card.collapsed .chevron-btn svg { transform: rotate(-90deg); }
  .result-card.collapsed .result-card-body { display: none; }
  .result-card-body {
    background: var(--mui-card-body-bg);
    border-top: 1px solid var(--mui-grey-300);
  }

  /* Hunk-range header */
  .hunk-label {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 14px;
    background: var(--mui-card-bg);
    border-top: 1px solid var(--mui-grey-300);
    border-bottom: 1px solid var(--mui-grey-300);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--mui-grey-600);
  }
  .hunk-label .hunk-text { color: var(--mui-grey-700); }
  .hunk-label .icon-btn { width: 22px; height: 22px; }
  .hunk-label .icon-btn svg { width: 12px; height: 12px; }

  /* Code body */
  .code-body {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--mui-grey-800);
    background: var(--mui-card-body-bg);
    overflow-x: auto;
    padding: 4px 0;
  }
  .code-line {
    display: grid;
    grid-template-columns: 5ch 5ch 24px 1fr;
    align-items: center;
    min-height: 22px;
  }
  .code-line.simple { grid-template-columns: 5ch 1fr; }
  .code-ln {
    color: var(--mui-grey-500);
    text-align: center;
    padding: 0;
    user-select: none;
    font-size: 12px;
  }
  .code-marker {
    text-align: center;
    color: var(--mui-grey-500);
    user-select: none;
    font-weight: 600;
  }
  .code-text {
    padding: 0 14px 0 8px;
    white-space: pre;
    color: var(--mui-grey-800);
  }
  .code-line.simple .code-text { padding-left: 12px; }
  .code-line.is-hit { background: rgba(159, 168, 255, 0.12); }
  .code-line:hover { background: var(--mui-grey-100); }
  .code-line.removed { background: #FFEBEB; }
  .code-line.removed .code-marker { color: #cf222e; }
  .code-line.added { background: #F3FFF5; }
  .code-line.added .code-marker { color: #1a7f37; }
  .match {
    background: var(--mui-gold-soft);
    color: var(--mui-grey-800);
    padding: 0 2px;
    border-radius: 2px;
    box-shadow: inset 0 -2px 0 var(--mui-gold);
  }
  .code-line.removed .match { background: #ffdce0; color: #82071e; box-shadow: none; }
  .code-line.added .match { background: #aceebb; color: #0f5132; box-shadow: none; }

  /* File detail drill-down */
  .trigrep-body { transition: opacity 100ms ease; }
  .trigrep-body.detail-mode > .trigrep-sidebar,
  .trigrep-body.detail-mode > .trigrep-results { display: none; }
  .trigrep-detail {
    display: none;
    flex: 1; flex-direction: column;
    min-width: 0;
    overflow: hidden;
    background: #fff;
  }
  .trigrep-body.detail-mode > .trigrep-detail { display: flex; }
  .result-card-file.is-clickable { cursor: pointer; }
  .result-card-file.is-clickable:hover { color: var(--mui-blue); }

  .detail-breadcrumb {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 24px;
    font-size: 13px;
    border-bottom: 1px solid var(--grey-50);
    background: #fff;
    flex-shrink: 0;
  }
  .detail-back {
    background: none; border: none; padding: 2px 0;
    color: var(--neo-digital-blue-500);
    cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .detail-back:hover { text-decoration: underline; }
  .detail-back svg { width: 12px; height: 12px; }
  .detail-crumb-sep { color: var(--grey-300); }
  .detail-crumb-current {
    color: var(--grey-900); font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
  }
  .detail-search-row {
    padding: 10px 24px;
    border-bottom: 1px solid var(--grey-50);
    background: #fff;
    flex-shrink: 0;
  }
  .detail-search-box {
    display: flex; align-items: center; gap: 8px;
    background: #fff;
    border: 1px solid var(--grey-200);
    border-radius: 6px;
    padding: 6px 12px;
  }
  .detail-search-box:focus-within {
    border-color: var(--neo-digital-blue-500);
    box-shadow: 0 0 0 3px rgba(47, 66, 255, 0.12);
  }
  .detail-search-box svg {
    width: 14px; height: 14px;
    color: var(--grey-500);
    flex-shrink: 0;
  }
  .detail-search-box input {
    flex: 1;
    border: none; outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    color: var(--grey-900);
  }
  .detail-search-box input::placeholder { color: var(--grey-500); }
  .detail-search-box .kbd-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 1px 5px;
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    border-radius: 4px;
    color: var(--grey-600);
    flex-shrink: 0;
  }

  .detail-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--grey-50);
    background: #fff;
    flex-shrink: 0;
  }
  .detail-header-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .detail-file-path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--grey-900);
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .detail-module {
    color: var(--grey-600);
    font-size: 12px;
    margin-top: 4px;
  }
  .detail-code {
    flex: 1;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.7;
    background: #fff;
    padding: 12px 0;
  }
  .detail-code::-webkit-scrollbar { width: 8px; }
  .detail-code::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 4px; }
  .detail-code .code-line {
    display: grid;
    grid-template-columns: 56px 1fr;
    align-items: center;
    min-height: 22px;
  }
  .detail-code .code-line.has-match { background: #fffbeb; }
  .detail-code .code-ln {
    text-align: right;
    color: var(--grey-300);
    padding: 0 12px 0 0;
    user-select: none;
    font-size: 11.5px;
  }
  .detail-code .code-text {
    padding: 0 14px;
    white-space: pre;
    color: var(--grey-900);
  }
  .detail-code .kw { color: var(--neo-digital-blue-500); }
  .detail-code .str { color: #b45309; }
  .detail-code .ann { color: var(--violet); }
  .detail-code .cmt { color: var(--grey-500); font-style: italic; }
  .detail-code .match {
    background: var(--highlight-bg); color: var(--highlight-text);
    padding: 0 2px; border-radius: 2px;
  }

  /* Lang dot */
  .lang-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--java-dot);
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(231, 111, 0, 0.15);
  }

  /* ===== Trigrep start state (centered hero) ===== */
  .trigrep-start-state {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px 64px;
    background: var(--grey-25);
    overflow-y: auto;
  }
  .trigrep-start-hero {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%; max-width: 560px;
    text-align: center;
  }
  .trigrep-start-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(47, 66, 255, 0.10);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--neo-digital-blue-500);
  }
  .trigrep-start-icon svg { width: 28px; height: 28px; }
  .trigrep-start-title {
    font-size: 22px; font-weight: 600;
    color: var(--grey-900);
    margin: 6px 0 0;
  }
  .trigrep-start-subtitle {
    font-size: 14.5px;
    color: var(--grey-600);
    line-height: 1.55;
    max-width: 480px;
  }
  .trigrep-start-examples-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--grey-500);
    margin-top: 18px;
  }
  .trigrep-start-examples-list {
    display: flex; flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-top: 4px;
  }
  .trigrep-start-example {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: #fff;
    border: 1px solid var(--grey-100);
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    font-family: inherit;
    width: 100%;
  }
  .trigrep-start-example:hover {
    border-color: var(--neo-digital-blue-500);
    background: rgba(47, 66, 255, 0.03);
  }
  .trigrep-start-example-text {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .trigrep-start-example-query {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--neo-digital-blue-500);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trigrep-start-example-desc {
    font-size: 12.5px;
    color: var(--grey-500);
  }
  .trigrep-start-example-icon {
    width: 16px; height: 16px;
    color: var(--grey-400);
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .trigrep-start-example:hover .trigrep-start-example-icon {
    color: var(--neo-digital-blue-500);
  }
  .trigrep-start-divider {
    width: 100%;
    height: 1px;
    background: var(--grey-200);
    margin-top: 14px;
  }
  .trigrep-start-reference-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 18px;
    border: 1px solid var(--brand-digital-blue-200);
    border-radius: 9999px;
    color: var(--neo-digital-blue-500);
    font-size: 13px;
    font-weight: 500;
    background: #fff;
    cursor: pointer;
    text-decoration: none;
    margin-top: 14px;
  }
  .trigrep-start-reference-link:hover {
    background: rgba(47, 66, 255, 0.04);
    border-color: var(--neo-digital-blue-500);
  }
  .trigrep-start-reference-link svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* Overflow indicator below results */
  .results-overflow {
    margin: 16px 0 4px;
    padding: 12px 16px;
    text-align: center;
    color: var(--grey-600);
    font-size: 13px;
  }
  .results-overflow strong { color: var(--grey-900); font-weight: 600; }
  .results-overflow .show-more {
    background: none; border: 0; padding: 0;
    margin-left: 12px;
    color: var(--neo-digital-blue-500);
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .results-overflow .show-more:hover { text-decoration: underline; }

  /* Search-fallback empty state */
  .trigrep-empty {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 40px 24px;
    background: var(--grey-25);
  }
  .trigrep-empty-title { font-size: 15px; font-weight: 600; color: var(--grey-700); }
  .trigrep-empty-desc { font-size: 13px; color: var(--grey-600); max-width: 360px; line-height: 1.5; }

  /* =====================================================================
     Trigrep NL-Assist — chip strip, suggestions, catalog, autocomplete
     ===================================================================== */
  .tg-assist-row {
    margin-top: 8px;
    display: flex; align-items: flex-start;
    gap: 8px;
  }
  .tg-chip-strip {
    flex: 1 1 auto;
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 4px;
    min-height: 22px;
  }
  .tg-chip-strip:empty::before {
    content: "Start typing — words become filters. Try \201Cpublic java methods that throw IOException\201D.";
    color: var(--grey-500); font-size: 12px;
  }
  .tg-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--grey-50);
    color: var(--grey-700);
    border: 1px solid var(--grey-100);
    border-radius: 6px;
    padding: 2px 4px 2px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.4;
    white-space: nowrap;
    cursor: default;
  }
  .tg-chip strong { color: var(--grey-500); font-weight: 500; margin-right: 1px; }
  .tg-chip.is-op { background: transparent; border-color: transparent; color: var(--grey-500); padding: 2px 4px; }
  .tg-chip.is-term { background: #fff; border-style: dashed; }
  .tg-chip.is-regex { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
  .tg-chip.is-structural { background: #f5f3ff; border-color: #ddd6fe; color: #5b21b6; }
  .tg-chip.status-unverified { background: var(--brand-orange-100); border-color: var(--brand-orange-600); color: var(--brand-orange-800); }
  .tg-chip.status-invalid    { background: var(--brand-red-100);    border-color: var(--brand-red-500);    color: var(--brand-red-700); text-decoration: underline wavy; }
  .tg-chip.status-suggested  { background: var(--alias-primary-100, #F2F3FF); border-color: var(--neo-digital-blue-300); color: var(--neo-digital-blue-500); border-style: dashed; }
  .tg-chip-x {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: none; background: transparent;
    color: inherit; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1;
  }
  .tg-chip-x:hover { background: rgba(0,0,0,0.08); }
  .tg-mode-badge {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--grey-50);
    color: var(--grey-600);
    border: 1px solid var(--grey-100);
    cursor: pointer;
    font-family: var(--brand-font-family-sans);
  }
  .tg-mode-badge.mode-regex { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
  .tg-mode-badge.mode-structural { background: #f5f3ff; border-color: #ddd6fe; color: #5b21b6; }
  .tg-mode-badge.mode-mixed { background: var(--alias-primary-100, #F2F3FF); border-color: var(--neo-digital-blue-300); color: var(--neo-digital-blue-500); }
  .tg-raw-toggle {
    flex-shrink: 0;
    font-size: 11px; color: var(--grey-600);
    background: transparent; border: 1px solid var(--grey-200);
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .tg-raw-toggle:hover { background: var(--grey-50); }
  .tg-raw-toggle.is-on { background: var(--neo-digital-blue-500); color: #fff; border-color: var(--neo-digital-blue-500); }
  .tg-catalog-btn {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--grey-600);
    background: transparent; border: 1px solid var(--grey-200);
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .tg-catalog-btn:hover { background: var(--grey-50); color: var(--neo-digital-blue-500); }

  .tg-suggest-banner {
    margin-top: 6px;
    padding: 6px 10px;
    background: var(--alias-primary-100, #F2F3FF);
    border: 1px solid var(--neo-digital-blue-300);
    border-radius: 6px;
    font-size: 12px;
    color: var(--grey-800);
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px;
  }
  .tg-suggest-banner:empty { display: none; }
  .tg-suggest-banner code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    background: #fff;
    border: 1px solid var(--grey-100);
    padding: 0 4px;
    border-radius: 3px;
    color: var(--grey-800);
  }
  .tg-suggest-banner button {
    background: var(--neo-digital-blue-500); color: #fff;
    border: 0; border-radius: 4px;
    padding: 2px 8px;
    font: 500 11px/1.4 var(--brand-font-family-sans);
    cursor: pointer;
  }
  .tg-suggest-banner button.is-secondary {
    background: #fff; color: var(--grey-700); border: 1px solid var(--grey-200);
  }
  .tg-explain {
    margin-top: 4px;
    font-size: 12px;
    color: var(--grey-600);
    line-height: 1.5;
  }
  .tg-explain:empty { display: none; }
  .tg-explain b { color: var(--grey-800); font-weight: 600; }

  /* Autocomplete dropdown anchored under the input */
  .tg-autocomplete {
    position: absolute;
    background: #fff;
    border: 1px solid var(--grey-200);
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.10);
    z-index: 40;
    min-width: 200px; max-width: 320px;
    padding: 4px;
    max-height: 240px; overflow: auto;
  }
  .tg-autocomplete[hidden] { display: none; }
  .tg-ac-item {
    padding: 6px 10px;
    font-size: 12px;
    color: var(--grey-800);
    border-radius: 4px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
  }
  .tg-ac-item small { color: var(--grey-500); font-family: var(--brand-font-family-sans); font-size: 11px; }
  .tg-ac-item:hover, .tg-ac-item.is-active { background: var(--alias-primary-100, #F2F3FF); color: var(--neo-digital-blue-500); }

  /* Catalog modal */
  .tg-modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(17, 24, 39, 0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .tg-modal-backdrop[hidden] { display: none; }
  .tg-modal {
    width: min(720px, 92vw);
    max-height: 80vh;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .tg-modal-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--grey-100);
    display: flex; align-items: center; gap: 12px;
  }
  .tg-modal-head h3 { font-size: 14px; font-weight: 600; color: var(--grey-900); margin: 0; }
  .tg-modal-head input {
    flex: 1;
    border: 1px solid var(--grey-200);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .tg-modal-head input:focus { border-color: var(--neo-digital-blue-500); }
  .tg-modal-close {
    border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--grey-500);
    padding: 4px 8px;
  }
  .tg-modal-body {
    overflow: auto;
    padding: 8px 12px 16px;
  }
  .tg-cat-entry {
    padding: 10px 12px;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 4px;
  }
  .tg-cat-entry:hover { background: var(--grey-50); border-color: var(--grey-100); }
  .tg-cat-entry-head { display: flex; align-items: center; gap: 8px; }
  .tg-cat-entry-kind {
    font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 3px;
    background: var(--grey-100); color: var(--grey-700);
  }
  .tg-cat-entry-kind.k-filter     { background: var(--alias-primary-100, #F2F3FF); color: var(--neo-digital-blue-500); }
  .tg-cat-entry-kind.k-regex      { background: #fff7ed; color: #9a3412; }
  .tg-cat-entry-kind.k-structural { background: #f5f3ff; color: #5b21b6; }
  .tg-cat-entry-name { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--grey-900); }
  .tg-cat-entry-desc { font-size: 12px; color: var(--grey-600); }
  .tg-cat-entry-tags { font-size: 11px; color: var(--grey-500); font-style: italic; }

  /* Scope-it-down panel (shown after Search when a theme is detected) */
  .trigrep-empty.tg-scope { padding-top: 56px; }
  .tg-scope-list {
    margin-top: 4px;
    width: min(560px, 100%);
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .tg-scope-option {
    text-align: left;
    background: #fff;
    border: 1px solid var(--grey-200);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex; flex-direction: column;
    gap: 4px;
    cursor: pointer;
    font: inherit;
  }
  .tg-scope-option:hover {
    border-color: var(--neo-digital-blue-500);
    background: var(--alias-primary-100, #F2F3FF);
  }
  .tg-scope-label { font-size: 13px; font-weight: 600; color: var(--grey-900); }
  .tg-scope-desc  { font-size: 12px; color: var(--grey-600); }
  .tg-scope-option code {
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--grey-700);
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    padding: 2px 6px;
    border-radius: 4px;
    align-self: flex-start;
  }

</style>

  if (isOpen) {
    morePopover.setAttribute('hidden', '');
    moreTrigger.classList.remove('active');
  } else {
    morePopover.removeAttribute('hidden');
    moreTrigger.classList.add('active');
  }
});
document.addEventListener('click', (e) => {
  if (!moreTrigger.contains(e.target) && !morePopover.contains(e.target)) {
    morePopover.setAttribute('hidden', '');
    moreTrigger.classList.remove('active');
  }
});

  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function setNavActive(id) {
  document.querySelectorAll('#left-nav-items .nav-item, #nav-more-popover .nav-item').forEach(el => {
    el.classList.remove('active');
  });
  const labelMap = { trigrep: 'Trigrep' };
  const label = labelMap[id] || id;
  document.querySelectorAll('#left-nav-items .nav-item').forEach(el => {
    if (el.querySelector('.nav-label')?.textContent === label) el.classList.add('active');
  });
}

function setSyntaxMode(mode) {
  trigrepCurrentMode = mode;
  const label = trigrepPanel.querySelector('.syntax-selector-label');
  if (label) label.textContent = SYNTAX_LABELS[mode] || 'Sourcegraph';
  const menu = trigrepPanel.querySelector('.syntax-selector-menu');
  if (menu) {
    menu.querySelectorAll('li[role="option"]').forEach(o => {
      if (o.dataset.value === mode) o.setAttribute('aria-selected', 'true');
      else o.removeAttribute('aria-selected');
    });
  }
  const input = trigrepPanel.querySelector('#trigrep-query-input');
  if (input) input.placeholder = PLACEHOLDERS[mode] || '';
}

function wireSyntaxSelector() {
  const selector = trigrepPanel.querySelector('#syntax-selector');
  if (!selector) return;
  const btn = selector.querySelector('.syntax-selector-btn');
  const menu = selector.querySelector('.syntax-selector-menu');
  const closeMenu = () => {
    menu.hidden = true;
    selector.removeAttribute('data-open');
    btn.setAttribute('aria-expanded', 'false');
  };
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = !menu.hidden;
    if (open) { closeMenu(); return; }
    menu.hidden = false;
    selector.setAttribute('data-open', '1');
    btn.setAttribute('aria-expanded', 'true');
  });
  menu.querySelectorAll('li[role="option"]').forEach(li => {
    li.addEventListener('click', () => {
      const mode = li.dataset.value;
      setSyntaxMode(mode);
      tgApplySyntaxMode(mode);
      closeMenu();
    });
  });
  document.addEventListener('click', (e) => {
    if (!selector.contains(e.target)) closeMenu();
  });
}

function renderStartExamples() {
  const slot = trigrepPanel.querySelector('#trigrep-start-examples-list');
  if (!slot) return;
  slot.innerHTML = START_EXAMPLES.map(ex => `
    <button class="trigrep-start-example" type="button" data-action="${ex.action}" data-mode="${ex.mode}">
      <span class="trigrep-start-example-text">
        <span class="trigrep-start-example-query">${escapeHtml(ex.query)}</span>
        <span class="trigrep-start-example-desc">${ex.desc}</span>
      </span>
      <svg class="trigrep-start-example-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  `).join('');
  slot.querySelectorAll('.trigrep-start-example').forEach(card => {
    card.addEventListener('click', () => {
      const mode = card.dataset.mode;
      if (mode) setSyntaxMode(mode);
      const action = card.dataset.action;
      if (action === 'fallback') { showSearchFallback(); return; }
      if (action && action.startsWith('syntax-')) {
        const flowId = action.slice('syntax-'.length);
        executeSearch(flowId);
        return;
      }
    });
  });
}

function wireTrigrepSearchBar() {
  const input = trigrepPanel.querySelector('#trigrep-query-input');
  const btn = trigrepPanel.querySelector('#trigrep-search-btn');
  if (!input || !btn) return;

  const submit = () => {
    const text = (input.value || '').trim();
    if (!text) return;
    // 1) Exact canned syntax-example match (preserves original cards)
    const syntaxMatch = Object.entries(SYNTAX_EXAMPLES).find(([, t]) => t.toLowerCase() === text.toLowerCase());
    if (syntaxMatch) { executeSearch(syntaxMatch[0]); return; }
    // 2) Natural-language phrase routing → canned query on a happy path
    const phraseHit = tgRoutePhrase(text);
    if (phraseHit) { tgRunCanned(phraseHit.query, phraseHit.flow); return; }
    // 3) Canonical signature routing — token shape matches a happy-path query
    const parsed = (TGState && TGState.tokens && TGState.tokens.length) ? TGState.tokens : tgParseNL(text).tokens;
    const sigHit = tgRouteSignature(parsed);
    if (sigHit) { tgRunCanned(sigHit.query, sigHit.flow); return; }
    // 4) Broad theme detected but no specific scope → scope-it-down chips
    const theme = tgDetectTheme(text, parsed);
    if (theme) { tgShowScope(theme); return; }
    // 5) Honest empty state — this prototype only has scripted fixtures
    showSearchFallback();
  };

  btn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
}

function showSearchFallback() {
  const results = trigrepPanel.querySelector('#trigrep-results');
  if (!results) return;
  results.innerHTML = `
    <div class="trigrep-empty">
      <div class="trigrep-empty-title">No matches in this prototype</div>
      <div class="trigrep-empty-desc">This is a prototype — try one of the example queries on the empty state, or run one of the syntax-mode happy paths.</div>
    </div>
  `;
}

// ===================================================================
// Execute a search — flip trigrep to results state for the given flow
// ===================================================================
function executeSearch(flowId) {
  const flow = FLOWS[flowId];
  if (!flow) return;
  currentFlow = flowId;

  const input = trigrepPanel.querySelector('#trigrep-query-input');
  if (input) {
    input.value = FINAL_QUERIES[flowId] || flow.phase2.query;
    input.style.color = '';
  }
  setSyntaxMode('sourcegraph');

  renderTrigrepResults(flow);
}

function renderTrigrepResults(flow) {
  const body = trigrepPanel.querySelector('#trigrep-body');
  if (!body) return;

  // Clear any inline stats from a previous search
  const inlineStats = trigrepPanel.querySelector('#search-help-stats');
  if (inlineStats) inlineStats.innerHTML = '';

  // ----- Sidebar groups -----
  const activeSet = PRESET_ACTIVE_FILTERS[currentFlow] || new Set();
  const renderGroup = (group) => {
    const repoClass = group.isRepoList ? ' is-repo-list' : '';
    const overflow = group.overflowMore
      ? `<button type="button" class="filter-more-link">+${group.overflowMore.toLocaleString()} more</button>`
      : '';
    const itemsHtml = group.items.map(it => {
      const dot = it.dot ? `<span class="lang-dot" style="background:${it.dot};box-shadow:none;"></span>` : '';
      const isActive = activeSet.has(it.name);
      return `<div class="filter-item${isActive ? ' active' : ''}" data-count="${it.count}">
        <span class="filter-item-name">${CHECK_ICON_SVG}${dot}${it.name}</span>
        <span class="count">${it.count.toLocaleString()}</span>
      </div>`;
    }).join('');
    if (group.isRepoList) {
      return `
      <div class="filter-group is-repo-list flat" data-group="${group.id}">
        <div class="repo-search-wrap">
          <svg class="repo-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="repo-search" placeholder="Filter repos…">
        </div>
        <div class="filter-group-body repo-list-body">
          ${itemsHtml}
          ${overflow}
        </div>
      </div>`;
    }
    return `
    <div class="filter-group${repoClass}" data-group="${group.id}">
      <div class="filter-group-label">${group.title.replace(/^By\s+/i, '').toUpperCase()}</div>
      <div class="filter-group-body" style="margin-left: 0; padding: 0;">
        ${group.searchable ? '<input class="topic-search" placeholder="Search topics…">' : ''}
        ${itemsHtml}
        ${overflow}
      </div>
    </div>`;
  };
  const nonRepoFilters = flow.phase2.filters.filter(g => !g.isRepoList);
  const repoFilters    = flow.phase2.filters.filter(g => g.isRepoList);
  const nonRepoFiltersHtml = nonRepoFilters.map(renderGroup).join('');
  const repoFiltersHtml    = repoFilters.map(renderGroup).join('');

  const repoCount = flow.phase2.baseFiles || 0;

  // ----- Result cards (cap initial display at 5) -----
  const extraCards = flow.phase2.extraCards || [];
  const extraSlice = Math.max(0, 5 - flow.cards.length);
  const initialCards = [...flow.cards, ...extraCards.slice(0, extraSlice)];
  const remainingCards = extraCards.slice(extraSlice);
  const cardsHtml = initialCards.map(buildResultCardHTML).join('');
  const overflowText = flow.overflow || '';

  // ----- Results stats — inline on the right of the search-help row -----
  const summaryRaw = flow.phase2.summary || '';
  const nums = (summaryRaw.replace(/<[^>]+>/g, '').match(/[\d,]+/g) || []);
  const matchCount = nums[0] || '';
  const fileCount = nums[1] || '';
  const timeMs = (summaryRaw.match(/([\d.]+ms)/) || [, ''])[1];
  const statsHtml = `
    <span class="results-toolbar-summary"><strong id="summary-count">${matchCount}</strong> matches across <strong id="summary-files">${fileCount}</strong> files</span>
    <a class="results-toolbar-export" href="#" onclick="return false;" title="Export results as CSV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </a>
    <span class="results-toolbar-time">${timeMs}</span>
  `;
  if (inlineStats) inlineStats.innerHTML = statsHtml;

  body.innerHTML = `
    <aside class="trigrep-sidebar" aria-label="Repositories and filters">
      ${repoFiltersHtml ? `
      <section class="trigrep-pane trigrep-pane-repos" aria-label="Repositories">
        <div class="trigrep-pane-head">
          <span>Repositories <span class="pane-count">(${repoCount.toLocaleString()})</span></span>
        </div>
        <div class="trigrep-pane-body">
          ${repoFiltersHtml}
        </div>
      </section>` : ''}
      <section class="trigrep-pane trigrep-pane-filters" aria-label="Filters">
        <div class="trigrep-pane-head">
          <span>Filters</span>
        </div>
        <div class="trigrep-pane-body">
          ${nonRepoFiltersHtml}
        </div>
      </section>
    </aside>
    <div class="trigrep-results" id="trigrep-results">
      <div id="result-cards-list">${cardsHtml}</div>
      <div class="results-overflow">
        ${overflowText} <button class="show-more" id="show-more-btn">Show more results</button>
      </div>
    </div>
  `;

  wireResultsInteractions(flow, remainingCards);
}

function buildResultCardHTML(card) {
  return `
    <article class="result-card" data-card-id="${card.id}">
      <div class="result-card-head">
        <div class="result-card-file is-clickable">${card.file}<span class="file-module">— ${card.module}</span></div>
        <div class="result-card-actions">
          <span class="result-card-meta">${card.count} match${card.count === 1 ? '' : 'es'}</span>
          <button class="icon-btn" title="More"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
          <button class="icon-btn chevron-btn" title="Collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>

      <div class="result-card-body">

        </div>
      </div>
    </article>
  `;
}

function wireResultsInteractions(flow, remainingCards) {
  const baseMatches = flow.phase2.baseMatches;
  const baseFiles = flow.phase2.baseFiles;
  const activeFilters = new Map();
  const summaryCount = trigrepPanel.querySelector('#summary-count');
  const summaryFiles = trigrepPanel.querySelector('#summary-files');

  // Filter group collapse
  trigrepPanel.querySelectorAll('.filter-group-head').forEach(head => {
    head.addEventListener('click', () => head.parentElement.classList.toggle('collapsed'));
  });
  const collapseAll = trigrepPanel.querySelector('#collapse-all');
  if (collapseAll) {
    collapseAll.addEventListener('click', () => {
      const groups = trigrepPanel.querySelectorAll('.filter-group');
      const anyOpen = [...groups].some(g => !g.classList.contains('collapsed'));
      groups.forEach(g => g.classList.toggle('collapsed', anyOpen));
      collapseAll.textContent = anyOpen ? 'Expand all' : 'Collapse all';
    });
  }

  // Seed active filters from preset state so the summary reflects what's
  // shown as "active" in the sidebar on first render.
  trigrepPanel.querySelectorAll('.filter-item.active').forEach(item => {
    const key = item.querySelector('.filter-item-name').textContent.trim();
    const count = parseInt(item.dataset.count, 10) || 0;
    activeFilters.set(key, count);
  });

  function recomputeSummary() {
    if (activeFilters.size === 0) {
      if (summaryCount) summaryCount.textContent = baseMatches.toLocaleString();
      if (summaryFiles) summaryFiles.textContent = baseFiles.toLocaleString();
    } else {
      const total = [...activeFilters.values()].reduce((a, b) => a + b, 0);
      if (summaryCount) summaryCount.textContent = total.toLocaleString();
      if (summaryFiles) summaryFiles.textContent = Math.max(1, Math.ceil(total / 5.5)).toLocaleString();
    }
  }

  trigrepPanel.querySelectorAll('.filter-item').forEach(item => {
    item.addEventListener('click', () => {
      const key = item.querySelector('.filter-item-name').textContent.trim();
      const count = parseInt(item.dataset.count, 10) || 0;
      const wasActive = activeFilters.has(key);
      if (wasActive) activeFilters.delete(key);
      else activeFilters.set(key, count);
      item.classList.toggle('active', !wasActive);
      recomputeSummary();
    });
  });

  // Chip removal
  trigrepPanel.querySelectorAll('.trigrep-chip-x').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); btn.closest('.trigrep-chip').remove(); });
  });

  // Topic search
  const topicSearch = trigrepPanel.querySelector('.topic-search');
  if (topicSearch) {
    topicSearch.addEventListener('input', () => {
      const q = topicSearch.value.toLowerCase().trim();
      const group = topicSearch.closest('.filter-group-body');
      group.querySelectorAll('.filter-item').forEach(item => {
        const name = item.querySelector('.filter-item-name').textContent.toLowerCase();
        item.style.display = (q === '' || name.includes(q)) ? '' : 'none';
      });
    });
  }

  // Repo search
  const repoSearch = trigrepPanel.querySelector('.repo-search');
  if (repoSearch) {
    repoSearch.addEventListener('input', () => {
      const q = repoSearch.value.toLowerCase().trim();
      const list = repoSearch.closest('.filter-group').querySelector('.repo-list-body');
      list.querySelectorAll('.filter-item').forEach(item => {
        const name = item.querySelector('.filter-item-name').textContent.toLowerCase();
        item.style.display = (q === '' || name.includes(q)) ? '' : 'none';
      });
    });
  }

  // Chevron collapse
  trigrepPanel.querySelectorAll('.chevron-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.result-card').classList.toggle('collapsed'));
  });

  // File drill-down
  trigrepPanel.querySelectorAll('.result-card .result-card-file').forEach(el => {
    const card = el.closest('.result-card');
    const id = card?.dataset.cardId;
    if (id && FILE_DETAILS[id]) {
      el.addEventListener('click', () => showFileDetail(FILE_DETAILS[id]));
    } else {
      el.classList.remove('is-clickable');
    }
  });

  // Show more
  const showMoreBtn = trigrepPanel.querySelector('#show-more-btn');
  if (showMoreBtn) {
    showMoreBtn.addEventListener('click', () => {
      if (!remainingCards.length) {
        showMoreBtn.style.display = 'none';
        return;
      }
      const list = trigrepPanel.querySelector('#result-cards-list');
      const toAdd = remainingCards.splice(0, 2);
      const html = toAdd.map(buildResultCardHTML).join('');
      list.insertAdjacentHTML('beforeend', html);
      toAdd.forEach(card => {
        const el = list.querySelector(`.result-card[data-card-id="${card.id}"]`);
        if (!el) return;
        el.querySelector('.chevron-btn').addEventListener('click', () => el.classList.toggle('collapsed'));
        const fileEl = el.querySelector('.result-card-file');
        if (FILE_DETAILS[card.id]) {
          fileEl.addEventListener('click', () => showFileDetail(FILE_DETAILS[card.id]));
        } else {
          fileEl.classList.remove('is-clickable');
        }
      });
      if (!remainingCards.length) showMoreBtn.style.display = 'none';
    });
  }
}

function showFileDetail(file) {
  const body = trigrepPanel.querySelector('.trigrep-body');
  if (!body) return;
  let detail = body.querySelector('.trigrep-detail');
  if (!detail) {
    detail = document.createElement('div');
    detail.className = 'trigrep-detail';
    body.appendChild(detail);
  }
  detail.innerHTML = buildFileDetailHTML(file);
  detail.querySelector('.detail-back').addEventListener('click', showResultsList);

  body.style.opacity = '0';
  setTimeout(() => {
    body.classList.add('detail-mode');
    body.style.opacity = '1';
  }, 100);
}

function showResultsList() {
  const body = trigrepPanel.querySelector('.trigrep-body');
  if (!body) return;
  body.style.opacity = '0';
  setTimeout(() => {
    body.classList.remove('detail-mode');
    body.style.opacity = '1';
  }, 100);
}

// Fillers used to expand sparse FILE_DETAILS data into a continuous file view —

  '    <span class="kw">private final</span> Logger log = LoggerFactory.getLogger(getClass());',

  '        <span class="kw">if</span> (req == <span class="kw">null</span>) <span class="kw">throw new</span> IllegalArgumentException();',
  '',
];

function expandFileLines(lines) {
  if (!lines.length) return lines;
  const out = [];
  let prev = 0;
  for (const line of lines) {
    while (prev + 1 < line.n) {
      prev++;
      out.push({ n: prev, code: DETAIL_FILLERS[prev % DETAIL_FILLERS.length] });
    }
    out.push(line);
    prev = line.n;
  }
  return out;
}

function buildFileDetailHTML(file) {
  const linesHtml = expandFileLines(file.lines).map(l => {
    const code = (l.code || ' ').replace(/<m>/g, '<span class="match">').replace(/<\/m>/g, '</span>');
    return `<div class="code-line ${l.hasMatch ? 'has-match' : ''}"><span class="code-ln">${l.n}</span><span class="code-text">${code}</span></div>`;
  }).join('');
  return `

// SWAP POINT: replace with live index lookup
function tgValueLookup(filterKey, prefix='') {
  const f = TG_FILTERS[filterKey];
  if (!f) return [];
  let pool = [];
  if (f.value.startsWith('enum:')) pool = TG_VOCAB[f.value] || [];
  else if (TG_VOCAB[filterKey]) pool = TG_VOCAB[filterKey];
  const p = (prefix || '').toLowerCase();
  if (!p) return pool.slice(0, 12);
  const starts = pool.filter(v => v.toLowerCase().startsWith(p));
  const contains = pool.filter(v => !v.toLowerCase().startsWith(p) && v.toLowerCase().includes(p));
  const fuzzy = pool.filter(v => !v.toLowerCase().includes(p) && tgLev(v.toLowerCase(), p) <= 2);
  return [...starts, ...contains, ...fuzzy].slice(0, 12);
}
function tgValidateValue(filterKey, value) {
  const f = TG_FILTERS[filterKey];
  if (!f) return 'unverified';
  if (!value) return 'invalid';
  if (f.value.startsWith('enum:')) {
    const list = TG_VOCAB[f.value] || [];
    return list.includes(value.toLowerCase()) ? 'valid' : 'unverified';
  }
  if (TG_VOCAB[filterKey] && TG_VOCAB[filterKey].some(v => v.toLowerCase() === value.toLowerCase())) return 'valid';
  if (f.value === 'integer') return /^\d+$/.test(value) ? 'valid' : 'invalid';
  return 'unverified';
}
