<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderne — Design Kit (Dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Poppins",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:rgba(133,254,153,0.25);}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">



<div ref="{{ rootRef }}" style="position:relative;min-height:100vh;width:100%;font-family:'Poppins',system-ui,sans-serif;color:var(--text,#EFEBE0);background:var(--bg,#0E0F0D);overflow:hidden;">

  <!-- ambient glow -->
  <div style="position:absolute;top:-120px;right:-80px;width:680px;height:680px;pointer-events:none;background:radial-gradient(circle at 70% 30%, var(--glow,rgba(133,254,153,0.10)), transparent 60%);"></div>

  <sc-if value="{{ showGrid }}" hint-placeholder-val="{{ true }}">
    <!-- blueprint construction line-art, tiled pattern -->
    <div style="position:absolute;top:0;left:0;right:0;height:860px;pointer-events:none;overflow:hidden;color:var(--grid-strong,rgba(255,255,255,0.13));-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 46%,transparent 90%);mask-image:linear-gradient(180deg,#000 0%,#000 46%,transparent 90%);">
      <svg width="100%" height="860" viewBox="0 0 10390 8826" preserveAspectRatio="xMidYMin slice" fill="none" style="display:block;">
        <defs>
          <pattern id="mod-construct" patternUnits="userSpaceOnUse" width="2078" height="1271">
            <g fill="none" stroke="currentColor" stroke-width="11">
              <line x1="0" y1="635" x2="2078" y2="635"></line>
              <line x1="540" y1="635" x2="540" y2="1271"></line>
              <line x1="1175" y1="0" x2="1175" y2="1271"></line>
              <line x1="1812" y1="0" x2="1812" y2="1271"></line>
              <line x1="1175" y1="0" x2="1812" y2="0"></line>
              <line x1="540" y1="951" x2="1175" y2="951"></line>
              <line x1="1812" y1="951" x2="2078" y2="951"></line>
              <line x1="0" y1="1271" x2="540" y2="1271"></line>
              <line x1="1175" y1="1271" x2="1812" y2="1271"></line>
              <line x1="1175" y1="0" x2="0" y2="1175"></line>
              <line x1="1175" y1="635" x2="1812" y2="1271"></line>
              <path d="M0 8 A634 634 0 0 1 540 635"></path>
              <path d="M1177 0 A635 635 0 0 0 1812 635"></path>
            </g>
          </pattern>
        </defs>
        <rect x="0" y="0" width="10390" height="8826" fill="url(#mod-construct)"></rect>
      </svg>
    </div>
  </sc-if>

  <div style="position:relative;max-width:1200px;margin:0 auto;padding:34px 44px 104px;">

    <!-- ===== Top nav ===== -->
    <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:1px solid var(--line,rgba(255,255,255,0.08));">
      <img src="assets/moderne-design-kit/moderne-logo.png" alt="Moderne" style="height:29px;width:auto;display:block;flex:none;filter:var(--logo-filter,brightness(0) invert(1));">
      <div style="display:flex;align-items:center;gap:12px;flex:none;margin-left:auto;">
        <!-- theme toggle -->
        <button onClick="{{ toggleMode }}" aria-label="Toggle theme" style="display:flex;align-items:center;gap:8px;background:var(--surface2,#1D1D21);color:var(--text,#F4F1E9);border:1px solid var(--line,rgba(255,255,255,0.12));border-radius:999px;padding:9px 16px 9px 13px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
            <span>Dark</span>
          </sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"></path></svg>
            <span>Light</span>
          </sc-if>
        </button>
      </div>
    </div>

    <!-- ===== Hero ===== -->
    <div style="max-width:780px;padding:84px 0 92px;">
      <h1 style="font-size:74px;font-weight:600;line-height:0.98;letter-spacing:-2.4px;margin-bottom:26px;color:var(--text,#F4F1E9);">The Moderne<br>visual language</h1>
      <p style="font-size:18.5px;line-height:1.55;color:var(--body,rgba(239,235,224,0.6));max-width:640px;">A dual-mode system on one brand spine. Near-black or paper-white canvas, Digital Green as the live accent, Inter all-caps labels for anything systematic, and the building-blocks mark that flips with the theme. Deliberate, engineered, confident.</p>
    </div>

    <!-- ===== COLOR ===== -->
    <section style="margin-bottom:96px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line,rgba(255,255,255,0.1));padding-bottom:18px;margin-bottom:34px;">
        <h2 style="font-size:36px;font-weight:600;letter-spacing:-1px;color:var(--text,#F4F1E9);">Palette</h2>
        <span style="font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted,rgba(239,235,224,0.42));">PANTONE-matched · green leads the accent</span>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:40px;">
        <sc-for list="{{ brand }}" as="c" hint-placeholder-count="6">
          <div style="background:var(--surface,#16161A);border:1px solid var(--line2,rgba(255,255,255,0.08));border-radius:12px;overflow:hidden;">
            <div style="height:108px;background:{{ c.swatch }};box-shadow:inset 0 0 0 1px var(--swatch-inset,rgba(255,255,255,0.06));"></div>
            <div style="padding:18px 20px;">
              <div style="font-size:17px;font-weight:600;margin-bottom:5px;color:var(--text,#F4F1E9);">{{ c.name }}</div>
              <div style="display:flex;align-items:center;justify-content:space-between;font-family:'Inter',sans-serif;">
                <span style="font-size:13px;color:var(--body,rgba(239,235,224,0.6));">{{ c.hex }}</span>
                <span style="font-size:11.5px;color:var(--muted,rgba(239,235,224,0.38));">{{ c.pantone }}</span>
              </div>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:36px;">
        <div>
          <div style="font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted,rgba(239,235,224,0.42));margin-bottom:18px;">UI tokens · {{ modeLabel }}</div>
          <sc-for list="{{ tokens }}" as="d" hint-placeholder-count="6">
            <div style="display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line2,rgba(255,255,255,0.07));">
              <div style="width:30px;height:30px;border-radius:7px;flex:none;background:{{ d.swatch }};box-shadow:inset 0 0 0 1px var(--swatch-inset,rgba(255,255,255,0.12));"></div>
              <div style="flex:1;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--text,#EFEBE0);">{{ d.token }}</div>
              <div style="font-size:12.5px;color:var(--muted,rgba(239,235,224,0.5));">{{ d.use }}</div>
            </div>
          </sc-for>
        </div>
        <div>
          <div style="font-family:'Inter',sans-serif;font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted,rgba(239,235,224,0.42));margin-bottom:18px;">Category accent palette</div>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;">
            <sc-for list="{{ accents }}" as="a" hint-placeholder-count="7">
              <div style="background:var(--surface,#16161A);border:1px solid var(--line2,rgba(255,255,255,0.08));border-radius:9px;overflow:hidden;">
                <div style="height:46px;background:{{ a.color }};box-shadow:inset 0 0 0 1px var(--swatch-inset,rgba(255,255,255,0.06));"></div>
                <div style="padding:9px 12px;">
                  <div style="font-size:13px;font-weight:600;color:var(--text,#F4F1E9);">{{ a.name }}</div>
                  <div style="font-family:'Inter',sans-serif;font-size:11px;color:var(--muted,rgba(239,235,224,0.5));margin-top:2px;">{{ a.color }}</div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== TYPE ===== -->
    <section style="margin-bottom:96px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line,rgba(255,255,255,0.1));padding-bottom:18px;margin-bottom:34px;">
        <h2 style="font-size:36px;font-weight:600;letter-spacing:-1px;color:var(--text,#F4F1E9);">Typography</h2>
        <span style="font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted,rgba(239,235,224,0.42));">Poppins · Inter</span>
      </div>

      <div style="display:grid;grid-template-columns:1.45fr 1fr;gap:36px;align-items:start;">
        <div style="background:var(--surface,#16161A);border:1px solid var(--line2,rgba(255,255,255,0.08));border-radius:14px;overflow:hidden;">
          <sc-for list="{{ typeScale }}" as="t" hint-placeholder-count="5">
            <div style="display:flex;align-items:baseline;gap:20px;padding:20px 28px;border-bottom:1px solid var(--line2,rgba(255,255,255,0.06));">
              <div style="width:118px;flex:none;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted,rgba(239,235,224,0.4));line-height:1.5;padding-top:6px;">{{ t.spec }}</div>
              <div style="flex:1;color:var(--text,#F4F1E9);font-family:{{ t.ff }};text-transform:{{ t.tt }};font-size:{{ t.size }};font-weight:{{ t.weight }};line-height:{{ t.lh }};letter-spacing:{{ t.tracking }};">{{ t.label }}</div>
            </div>
          </sc-for>
        </div>
        <div style="display:flex;flex-direction:column;gap:16px;">
          <div style="background:var(--surface,#16161A);border:1px solid var(--line2,rgba(255,255,255,0.08));border-radius:14px;padding:24px 26px;">
            <div style="font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent,#85FE99);margin-bottom:14px;">Headline · Poppins SemiBold</div>
            <div style="font-size:44px;font-weight:600;line-height:0.92;letter-spacing:-1px;color:var(--text,#F4F1E9);">Aa</div>
          </div>
          <div style="background:var(--surface,#16161A);border:1px solid var(--line2,rgba(255,255,255,0.08));border-radius:14px;padding:24px 26px;">
            <div style="font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted,rgba(239,235,224,0.45));margin-bottom:14px;">Body · Poppins Regular</div>
            <div style="font-size:44px;font-weight:500;line-height:0.92;letter-spacing:-0.5px;color:var(--text,#F4F1E9);">Aa</div>
          </div>
          <div style="background:var(--surface,#16161A);border:1px solid var(--line2,rgba(255,255,255,0.08));border-radius:14px;padding:24px 26px;">
            <div style="font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted,rgba(239,235,224,0.45));margin-bottom:14px;">Labels · Inter</div>
            <div style="font-family:'Inter',sans-serif;font-size:42px;font-weight:600;line-height:0.92;letter-spacing:-0.5px;text-transform:uppercase;color:var(--text,#F4F1E9);">Aa</div>
            <div style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--muted,rgba(239,235,224,0.5));margin-top:12px;letter-spacing:2px;text-transform:uppercase;">Labels · 01 → 24 · CVE-IDS</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== LOGO ===== -->
    <section style="margin-bottom:96px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line,rgba(255,255,255,0.1));padding-bottom:18px;margin-bottom:34px;">
        <h2 style="font-size:36px;font-weight:600;letter-spacing:-1px;color:var(--text,#F4F1E9);">Logo</h2>
        <span style="font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted,rgba(239,235,224,0.42));">White on dark · Midnight on light</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
        <div style="background:#16161A;border-radius:14px;padding:58px 46px;display:flex;align-items:center;justify-content:center;">
          <img src="assets/moderne-design-kit/moderne-logo.png" alt="Moderne" style="height:46px;width:auto;display:block;filter:brightness(0) invert(1);">
        </div>
        <div style="background:#F8F8FF;border-radius:14px;padding:58px 46px;display:flex;align-items:center;justify-content:center;">
          <img src="assets/moderne-design-kit/moderne-logo.png" alt="Moderne" style="height:46px;width:auto;display:block;">
        </div>
      </div>
    </section>

    <!-- ===== COMPONENTS ===== -->
    <section>
      <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line,rgba(255,255,255,0.1));padding-bottom:18px;margin-bottom:34px;">
        <h2 style="font-size:36px;font-weight:600;letter-spacing:-1px;color:var(--text,#F4F1E9);">Components</h2>
        <span style="font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted,rgba(239,235,224,0.42));">Flat · green accent · mono meta</span>
      </div>

      <!-- buttons + search -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;">
        <div style="background:var(--surface,#16161A);border:1px solid var(--line2,rgba(255,255,255,0.08));border-radius:14px;padding:30px;">
          <div style="font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted,rgba(239,235,224,0.42));margin-bottom:22px;">Buttons</div>
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            <button style="background:#85FE99;color:#08110A;border:none;font-family:inherit;font-size:15px;font-weight:600;padding:13px 26px;border-radius:999px;cursor:pointer;">Book a demo</button>
            <button style="display:inline-flex;align-items:center;gap:11px;background:transparent;color:var(--text,#F4F1E9);border:1px solid var(--line-strong,rgba(255,255,255,0.22));font-family:inherit;font-size:15px;font-weight:600;padding:12px 14px 12px 20px;border-radius:8px;cursor:pointer;">Read the docs
              <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent,rgba(133,254,153,0.6));color:var(--accent,#85FE99);font-size:14px;">→</span>
            </button>
            <button style="background:transparent;color:var(--body,rgba(239,235,224,0.7));border:none;font-family:inherit;font-size:15px;font-weight:500;padding:12px 6px;cursor:pointer;text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--accent,rgba(133,254,153,0.6));">Learn more</button>
          </div>
          <div style="font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted,rgba(239,235,224,0.4));margin-top:20px;line-height:1.5;">Green pill = primary CTA. Outline + green arrow = docs. Underlined ghost = inline.</div>
        </div>
        <div style="background:var(--surface,#16161A);border:1px solid var(--line2,rgba(255,255,255,0.08));border-radius:14px;padding:30px;">
          <div style="font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted,rgba(239,235,224,0.42));margin-bottom:22px;">Search field</div>
          <div style="display:flex;align-items:center;gap:12px;border:1px solid var(--line,rgba(255,255,255,0.14));border-radius:9px;padding:13px 16px;background:var(--field,#0E0F0D);">
            <span style="display:inline-flex;width:17px;height:17px;border:2px solid var(--muted,rgba(239,235,224,0.4));border-radius:50%;position:relative;flex:none;">
              <span style="position:absolute;width:7px;height:2px;background:var(--muted,rgba(239,235,224,0.4));bottom:-3px;right:-4px;transform:rotate(45deg);border-radius:2px;"></span>
            </span>
            <span style="flex:1;font-size:15px;color:var(--muted,rgba(239,235,224,0.4));">Search recipes, docs, CVEs…</span>
            <span style="display:inline-flex;gap:4px;font-family:'Inter',sans-serif;">
              <kbd style="font-size:11.5px;color:var(--body,rgba(239,235,224,0.6));background:var(--surface2,#1D1D21);border:1px solid var(--line,rgba(255,255,255,0.12));border-radius:5px;padding:2px 7px;">⌘</kbd>
              <kbd style="font-size:11.5px;color:var(--body,rgba(239,235,224,0.6));background:var(--surface2,#1D1D21);border:1px solid var(--line,rgba(255,255,255,0.12));border-radius:5px;padding:2px 7px;">K</kbd>
            </span>
          </div>
          <div style="font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted,rgba(239,235,224,0.4));margin-top:20px;line-height:1.5;">Mono placeholder + ⌘K. Inset field one step off its card.</div>
        </div>
      </div>

      <!-- nav + TOC -->
      <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:18px;">
        <div style="background:var(--surface,#16161A);border:1px solid var(--line2,rgba(255,255,255,0.08));border-radius:14px;padding:30px;">
          <div style="font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted,rgba(239,235,224,0.42));margin-bottom:22px;">Navigation</div>
          <div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap;">
            <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="6">
              <div style="display:flex;flex-direction:column;align-items:center;gap:7px;">
                <div style="display:flex;align-items:center;gap:6px;">
                  <span style="font-size:15px;font-weight:500;color:var(--body,rgba(239,235,224,0.74));">{{ n.label }}</span>
                  <sc-if value="{{ n.caret }}" hint-placeholder-val="{{ true }}">
                    <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="var(--muted,rgba(239,235,224,0.5))" stroke-width="1.4"><path d="M1 1l4 4 4-4"></path></svg>
                  </sc-if>
                </div>
                <sc-if value="{{ n.active }}" hint-placeholder-val="{{ false }}">
                  <div style="height:2px;width:100%;background:var(--accent,#85FE99);border-radius:2px;"></div>
                </sc-if>
              </div>
            </sc-for>
          </div>
          <div style="font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted,rgba(239,235,224,0.4));margin-top:24px;line-height:1.5;">Carets flag dropdowns. Active item carries a 2px Digital Green underline.</div>
        </div>
        <div style="background:var(--surface,#16161A);border:1px solid var(--line2,rgba(255,255,255,0.08));border-radius:14px;padding:30px;">
          <div style="font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted,rgba(239,235,224,0.42));margin-bottom:20px;">On-page nav</div>
          <div style="border-left:2px solid var(--line,rgba(255,255,255,0.1));padding-left:18px;display:flex;flex-direction:column;gap:14px;position:relative;">
            <div style="position:absolute;left:-2px;top:0;width:2px;height:32px;background:var(--accent,#85FE99);border-radius:2px;"></div>
            <sc-for list="{{ toc }}" as="t" hint-placeholder-count="5">
              <sc-if value="{{ t.active }}" hint-placeholder-val="{{ false }}">
                <div style="font-size:14.5px;font-weight:500;color:var(--text,#F4F1E9);">{{ t.label }}</div>
              </sc-if>
              <sc-if value="{{ t.inactive }}" hint-placeholder-val="{{ true }}">
                <div style="font-size:14.5px;font-weight:400;color:var(--muted,rgba(239,235,224,0.45));">{{ t.label }}</div>
              </sc-if>
            </sc-for>
          </div>
        </div>
      </div>

      <!-- related posts -->
      <div style="font-size:18px;font-weight:600;letter-spacing:-0.3px;color:var(--text,#F4F1E9);margin-bottom:16px;">Related posts</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;">

        <!-- card 1: gradient panel -->
        <div>
          <div style="height:208px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(125deg,#FF2D9B 0%,#9A4DFF 48%,#283AF7 100%);padding:18px;">
            <div style="font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;color:#fff;">CODE REMIX PANEL</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px;">
              <div style="height:42px;border:1px solid rgba(255,255,255,0.55);border-radius:4px;"></div>
              <div style="height:42px;border:1px solid rgba(255,255,255,0.55);border-radius:4px;"></div>
              <div style="height:42px;border:1px solid rgba(255,255,255,0.55);border-radius:4px;"></div>

              <div style="font-size:17px;font-weight:600;letter-spacing:-0.4px;color:#2A3442;line-height:1.22;margin-top:20px;">Moderne Agent Tools:<br>Trading GPU for CPU</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:15px;">
                <p style="font-size:10px;line-height:1.55;color:#5A6573;">Most coding agents today—Copilot, Claude Code, Amp, and others—work from the same constraint: Fragmented, incomplete context. So they build knowledge on the fly—inferring across gaps, leading to guesswork, inconsistent outcomes, and inflated token usage.</p>
                <p style="font-size:10px;line-height:1.55;color:#5A6573;">Moderne Prethink changes this. It provides agents with structured, precomputed knowledge derived from a compiler-accurate semantic model of the code. By starting with authoritative, shared context, agents are able to reduce token overhead, improve accuracy, and get to answers faster—with more consistent outcomes across teams.</p>
              </div>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:22px;align-items:start;">

                    <div style="font-size:10px;color:#5A6573;line-height:1.4;margin-top:6px;">Faster on avg than ripgrep</div>
                  </div>
                </div>
                <!-- UNDERSTAND -->
                <div style="background:#fff;border:1px solid #ECEEF3;border-radius:9px;padding:14px 13px;box-shadow:0 1px 2px rgba(10,27,51,0.05);">
                  <span style="display:inline-block;background:#EEF0F4;color:#6B7280;font-family:'Inter',sans-serif;font-size:8px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:4px 9px;border-radius:5px;">Understand</span>

  const brand = [

  const anatomy = [
    { color:"#0A1B33", title:"Category pill", detail:"Midnight fill, white label — top-right anchor." },

  ];

  const tokensByMode = {
    light: [
      { token:"--bg", swatch:"#F8F8FF", use:"Canvas" },
      { token:"--surface", swatch:"#FFFFFF", use:"Cards" },
      { token:"--line", swatch:"#E4E6EF", use:"Dividers" },
      { token:"--text", swatch:"#041834", use:"Headlines" },

      { token:"--accent", swatch:"#0B8A45", use:"Accent" },
    ],
    dark: [
      { token:"--bg", swatch:"#0E0F0D", use:"Canvas" },
      { token:"--surface", swatch:"#16161A", use:"Cards" },
      { token:"--line", swatch:"rgba(255,255,255,0.10)", use:"Dividers" },
      { token:"--text", swatch:"#F4F1E9", use:"Headlines" },
      { token:"--body", swatch:"rgba(239,235,224,0.62)", use:"Body copy" },
      { token:"--accent", swatch:"#85FE99", use:"Accent" },
    ]
  };
  function vals(mode){
    const isLight = mode==="light";
    return {
      showGrid:true, modeLabel:isLight?"Light":"Dark", isLight:isLight, isDark:!isLight,
      navItems:navItems, toc:tocRaw.map(t=>({label:t.label, active:t.active, inactive:!t.active})),
      tokens:tokensByMode[mode], brand:brand, accents:accents, docCards:docCards,
      slideFeatures:slideFeatures, prethinkRows:prethinkRows, anatomy:anatomy, typeScale:typeScale
    };
  }

  function ev(expr, scope){
    expr=expr.trim();
    if(expr==="true")return true;
    if(expr==="false")return false;
    let cur=scope;
    for(const part of expr.split(".")){
      if(cur==null)return undefined;
      cur=cur[part];
    }
    return cur;
  }
  function interp(str, scope){
    return str.replace(/\{\{([^}]+)\}\}/g, function(_,e){ const v=ev(e,scope); return v==null?"":String(v); });
  }
  const strip=s=>(s||"").replace(/^\s*\{\{/, "").replace(/\}\}\s*$/, "").trim();

  function process(node, scope, out){
    if(node.nodeType===3){ out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if(node.nodeType!==1){ return; }
    const tag=node.tagName.toLowerCase();
    if(tag==="sc-for"){
      const arr=ev(strip(node.getAttribute("list")), scope)||[];
      const as=node.getAttribute("as")||"item";
      arr.forEach(function(item){
        const child=Object.assign({}, scope); child[as]=item;
        node.childNodes.forEach(c=>process(c, child, out));
      });
      return;
    }
    if(tag==="sc-if"){
      if(ev(strip(node.getAttribute("value")), scope)){
        node.childNodes.forEach(c=>process(c, scope, out));
      }
      return;
    }
    const el=document.createElement(tag);
    for(const attr of node.attributes){
      if(attr.name==="ref"){ el.id="root"; continue; }
      if(attr.name==="onclick"){ el.setAttribute("data-toggle","1"); continue; }
      el.setAttribute(attr.name, interp(attr.value, scope));
    }
    node.childNodes.forEach(c=>process(c, scope, el));
    out.appendChild(el);
  }

  const tpl=document.getElementById("tpl");
  const app=document.getElementById("app");
  let mode="dark";
  function applyTheme(){
    const root=document.getElementById("root"); if(!root)return;
    const t=THEMES[mode]; for(const k in t) root.style.setProperty("--"+k, t[k]);
  }
  function render(){
    const scope=vals(mode);
    app.innerHTML="";
    tpl.content.childNodes.forEach(c=>process(c, scope, app));
    applyTheme();
    const btn=app.querySelector("[data-toggle]");
    if(btn) btn.addEventListener("click", function(){ mode=(mode==="dark")?"light":"dark"; render(); });
  }
  render();
})();
