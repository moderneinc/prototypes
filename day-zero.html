<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderne — Day Zero Onboarding Tour</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ================================================
   NEO DESIGN SYSTEM — BRAND TOKENS (Tier 1)
   ================================================ */
:root {
  --brand-white: #FFFFFF;
  --brand-black: #000000;
  --brand-digital-blue-100: #F2F3FF;
  --brand-digital-blue-200: #DCE0FF;
  --brand-digital-blue-300: #B6BFFF;
  --brand-digital-blue-400: #8D99FF;
  --brand-digital-blue-500: #2F42FF;
  --brand-digital-blue-600: #2637E6;
  --brand-digital-blue-700: #1E2EC2;
  --brand-digital-blue-800: #131E7A;
  --brand-digital-blue-900: #000855;
  --brand-green-100: #F3FFF5;
  --brand-green-200: #CFFFD7;
  --brand-green-500: #72E184;
  --brand-green-600: #5EC46F;
  --brand-green-700: #4CA75A;
  --brand-green-800: #3B8948;
  --brand-red-100: #FEF2F2;
  --brand-red-400: #FCA5A5;
  --brand-red-500: #F87171;
  --brand-red-600: #CB3446;
  --brand-red-700: #A92232;
  --brand-red-800: #871421;
  --brand-orange-100: #FFF8E5;
  --brand-orange-600: #FFB800;
  --brand-orange-700: #D69B00;
  --brand-orange-800: #856000;
  --brand-grey-100: #F9FAFB;
  --brand-grey-200: #F3F4F6;
  --brand-grey-300: #E5E7EB;
  --brand-grey-400: #D1D5DB;
  --brand-grey-500: #9CA3AF;
  --brand-grey-600: #6B7280;
  --brand-grey-700: #4B5563;
  --brand-grey-800: #374151;
  --brand-grey-900: #1F2937;
  --brand-grey-1000: #111827;
  --brand-violet-500: #AD59C7;
  --brand-violet-600: #992FB9;
  --brand-teal-600: #3BCCA6;
  --brand-font-family-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --brand-font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  --brand-font-weight-regular: 400;
  --brand-font-weight-medium: 500;
  --brand-font-weight-semibold: 600;
  --brand-font-weight-bold: 700;
  --brand-font-size-100: 10px;
  --brand-font-size-200: 12px;
  --brand-font-size-300: 14px;
  --brand-font-size-400: 16px;
  --brand-font-size-500: 18px;
  --brand-font-size-600: 20px;
  --brand-font-size-700: 24px;
  --brand-font-size-800: 28px;
  --brand-spacing-0: 0;
  --brand-spacing-100: 4px;
  --brand-spacing-200: 8px;
  --brand-spacing-300: 12px;
  --brand-spacing-400: 16px;
  --brand-spacing-500: 20px;
  --brand-spacing-600: 24px;
  --brand-spacing-800: 32px;
  --brand-spacing-1000: 40px;
  --brand-radius-0: 0;
  --brand-radius-100: 4px;
  --brand-radius-200: 6px;
  --brand-radius-300: 8px;
  --brand-radius-400: 12px;
  --brand-radius-500: 16px;
  --brand-radius-full: 9999px;
  --brand-shadow-100: 0 1px 3px rgba(31, 41, 55, 0.1);
  --brand-shadow-200: 0 2px 4px rgba(31, 41, 55, 0.1);
  --brand-shadow-300: 0 8px 15px rgba(31, 41, 55, 0.1);
  --brand-shadow-400: 0 4px 4px rgba(31, 41, 55, 0.1), 0 8px 24px rgba(31, 41, 55, 0.1);
  --brand-shadow-500: 0 8px 15px rgba(31, 41, 55, 0.1);
  --brand-transition-fast: 150ms ease;
  --brand-transition-base: 200ms ease;
  --brand-line-height-200: 20px;
  --brand-line-height-300: 24px;
  --brand-line-height-400: 28px;
}

/* ================================================
   NEO DESIGN SYSTEM — ALIAS TOKENS (Tier 2)
   ================================================ */
:root {
  --alias-primary-100: var(--brand-digital-blue-100);
  --alias-primary-200: var(--brand-digital-blue-200);
  --alias-primary-300: var(--brand-digital-blue-300);
  --alias-primary-500: var(--brand-digital-blue-500);
  --alias-primary-600: var(--brand-digital-blue-600);
  --alias-primary-700: var(--brand-digital-blue-700);
  --alias-primary-800: var(--brand-digital-blue-800);
  --alias-success-100: var(--brand-green-100);
  --alias-success-600: var(--brand-green-600);
  --alias-success-700: var(--brand-green-700);
  --alias-error-100: var(--brand-red-100);
  --alias-error-600: var(--brand-red-600);
  --alias-error-700: var(--brand-red-700);
  --alias-warning-100: var(--brand-orange-100);
  --alias-warning-600: var(--brand-orange-600);
  --alias-neutral-light-100: var(--brand-grey-100);
  --alias-neutral-light-200: var(--brand-grey-200);
  --alias-neutral-light-300: var(--brand-grey-300);
  --alias-neutral-light-400: var(--brand-grey-400);
  --alias-neutral-dark-500: var(--brand-grey-500);
  --alias-neutral-dark-600: var(--brand-grey-600);
  --alias-neutral-dark-700: var(--brand-grey-700);
  --alias-neutral-dark-800: var(--brand-grey-800);
  --alias-neutral-dark-900: var(--brand-grey-900);
  --alias-neutral-dark-1000: var(--brand-grey-1000);
  --alias-foundation-white: var(--brand-white);
  --alias-foundation-black: var(--brand-black);
  --alias-font-heading: var(--brand-font-family-sans);
  --alias-font-body: var(--brand-font-family-sans);
  --alias-font-code: var(--brand-font-family-mono);
}

/* ================================================
   NEO DESIGN SYSTEM — MAPPED TOKENS (Tier 3)
   Components consume ONLY these.
   ================================================ */
:root {
  --surface-primary: var(--alias-foundation-white);
  --surface-page: #f4f4f4;
  --surface-secondary: var(--alias-neutral-light-100);
  --surface-tertiary: var(--alias-neutral-light-200);
  --surface-disabled: var(--alias-neutral-light-200);
  --surface-error: var(--alias-error-100);
  --surface-success: var(--alias-success-100);
  --surface-information: var(--alias-primary-100);
  --surface-warning: var(--alias-warning-100);
  --surface-primary-filled: var(--alias-primary-500);
  --surface-error-filled: var(--alias-error-600);
  --surface-success-filled: var(--alias-success-600);
  --surface-primary-hover: var(--alias-primary-100);
  --surface-primary-pressed: var(--alias-primary-200);
  --surface-primary-filled-hover: var(--alias-primary-700);
  --surface-primary-filled-pressed: var(--alias-primary-800);
  --surface-primary-active: #3776F01A;
  --surface-error-filled-hover: var(--alias-error-700);
  --text-primary: var(--alias-neutral-dark-1000);
  --text-secondary: var(--alias-neutral-dark-600);
  --text-tertiary: var(--alias-neutral-dark-500);
  --text-disabled: var(--alias-neutral-light-400);
  --text-error: var(--alias-error-600);
  --text-success: var(--alias-success-700);
  --text-information: var(--alias-primary-700);
  --text-on-primary: var(--alias-foundation-white);
  --text-on-error: var(--alias-foundation-white);
  --text-primary-hover: var(--alias-primary-700);
  --icon-primary: var(--alias-neutral-dark-1000);
  --icon-secondary: var(--alias-neutral-dark-600);
  --icon-tertiary: var(--alias-neutral-dark-500);
  --icon-on-primary: var(--alias-foundation-white);
  --border-primary: var(--alias-neutral-light-300);
  --border-secondary: var(--alias-neutral-light-400);
  --border-hover: var(--alias-neutral-light-400);
  --border-focus: var(--alias-primary-600);
  --content-heading: var(--alias-neutral-dark-1000);
  --content-body: var(--alias-neutral-dark-800);
  --content-caption: var(--alias-neutral-dark-600);
  --content-placeholder: var(--alias-neutral-dark-500);
  --activity-recipe-run: #992fb9;
  --activity-commit-job: #2f42ff;
  --activity-visualization: #27aa88;
  --surface-datagrid-header: var(--alias-neutral-light-100);
  --font-heading: var(--alias-font-heading);
  --font-body: var(--alias-font-body);
  --font-code: var(--alias-font-code);
  --space-1: var(--brand-spacing-100);
  --space-2: var(--brand-spacing-200);
  --space-3: var(--brand-spacing-300);
  --space-4: var(--brand-spacing-400);
  --space-5: var(--brand-spacing-500);
  --space-6: var(--brand-spacing-600);
  --space-8: var(--brand-spacing-800);
  --space-10: var(--brand-spacing-1000);
  --radius-sm: var(--brand-radius-100);
  --radius-md: var(--brand-radius-200);
  --radius-lg: var(--brand-radius-300);
  --radius-xl: var(--brand-radius-400);
  --radius-2xl: var(--brand-radius-500);
  --radius-full: var(--brand-radius-full);
  --shadow-xs: var(--brand-shadow-100);
  --shadow-sm: var(--brand-shadow-200);
  --shadow-md: var(--brand-shadow-300);
  --shadow-lg: var(--brand-shadow-400);
  --shadow-xl: var(--brand-shadow-500);
  --transition-fast: var(--brand-transition-fast);
  --transition-base: var(--brand-transition-base);
}

/* ================================================
   BASE STYLES
   ================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--surface-page);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

#root {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* ================================================
   APP LAYOUT — CSS Grid matching real SaaS
   ================================================ */
.app-shell {
  display: grid;
  grid-template-columns: 82px 1fr;
  grid-template-areas: "nav content";
  width: 100%;
  height: 100%;
  background: var(--surface-page);
}

/* ================================================
   LEFT NAVIGATION RAIL (82px)
   ================================================ */
.left-nav {
  grid-area: nav;
  width: 82px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 8px 24px;
  gap: 0;
  background: var(--surface-primary);
  border-right: 1px solid var(--border-secondary);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  overflow: hidden;
}

.nav-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  margin-bottom: 8px;
  cursor: pointer;
}

.nav-item {
  width: 66px;
  padding: 8px 0 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  position: relative;
  transition: background var(--transition-fast);
  text-decoration: none;
}

.nav-item:hover {
  background: var(--surface-secondary);
}

.nav-item.active {
  background: #3776F01A;
}

.nav-item svg {
  width: 22px;
  height: 22px;
  min-width: 22px;
  color: #1C1B1F;
  flex-shrink: 0;
}

.nav-item.active svg {
  color: #1C1B1F;
}

.nav-label {
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: var(--brand-font-weight-regular);
  line-height: 16px;
  color: #1C1B1F;
  text-align: center;
  white-space: normal;
}

.nav-item.active .nav-label {
  font-weight: var(--brand-font-weight-semibold);
  color: #1C1B1F;
}

.nav-badge {
  position: absolute;
  top: 2px;
  right: 0;
  font-size: 11px;
  padding: 0 8px;
  border-radius: 50px;
  background: var(--brand-digital-blue-300);
  color: white;
  font-weight: var(--brand-font-weight-medium);
  line-height: 1.5;
  text-align: center;
}

/* ================================================
   MAIN CONTENT AREA
   ================================================ */
.main-area {
  grid-area: content;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* ================================================
   GLOBAL NAVIGATION BAR (65px toolbar)
   ================================================ */
.global-nav {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 12px 20px;
  gap: 12px;
  flex-shrink: 0;
  position: relative;
}

.org-selector {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  color: var(--text-primary);
  cursor: pointer;
  padding: 10px 16px;
  border-radius: 8px;
  transition: all var(--transition-fast);
  background: var(--surface-primary);
  border: 1px solid transparent;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.org-selector:hover {
  background: var(--brand-grey-200);
}

.org-selector.selected {
  color: var(--text-primary);
  font-weight: var(--brand-font-weight-medium);
}

.nav-spacer {
  flex: 1;
}

.search-input {
  height: 40px;
  width: 220px;
  border-radius: 24px;
  border: 1px solid var(--border-secondary);
  padding: 4px 12px;
  font-size: var(--brand-font-size-300);
  color: var(--text-tertiary);
  background: var(--surface-primary);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  cursor: pointer;
  transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: var(--shadow-xs);
}

.search-input:hover {
  border-color: var(--border-primary);
}

.search-input span {
  flex: 1;
}

.search-input kbd {
  font-size: var(--brand-font-size-100);
  background: var(--surface-tertiary);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-tertiary);
  font-family: var(--font-body);
  border: 1px solid var(--border-primary);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 64px;
}

.nav-action-btn {
  width: 44px;
  height: 44px;
  border-radius: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 200ms ease-in;
  border: none;
  background: var(--surface-primary);
  color: var(--brand-grey-900);
  box-shadow: var(--shadow-xs);
  flex-shrink: 0;
}

.nav-action-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.avatar {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-full);
  background: var(--brand-digital-blue-200);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: var(--brand-font-weight-medium);
  color: var(--brand-digital-blue-800);
  flex-shrink: 0;
}

/* ================================================
   CONTENT AREA — white bg, rounded
   ================================================ */
.content-wrapper {
  flex: 1;
  background: var(--surface-primary);
  overflow-y: auto;
  position: relative;
}

.content-area {
  padding: var(--space-6) var(--space-8);
}

/* ================================================
   PAGE CONTENT HEADER (ModernePageContent style)
   ================================================ */
.page-header {
  margin-bottom: var(--space-5);
}

.page-title {
  font-family: var(--font-heading);
  font-size: 21px;
  font-weight: var(--brand-font-weight-regular);
  color: var(--content-heading);
  line-height: 140%;
}

.page-subtitle {
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  font-weight: var(--brand-font-weight-regular);
  color: var(--brand-grey-600);
  line-height: var(--brand-line-height-300);
  margin-top: var(--space-1);
}

.page-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ================================================
   BUTTONS
   ================================================ */
.btn {
  height: 40px;
  padding: 0 var(--space-4);
  border-radius: 999px;
  border: 1px solid var(--brand-digital-blue-300);
  background: var(--surface-primary);
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  font-weight: var(--brand-font-weight-medium);
  line-height: var(--brand-line-height-200);
  color: var(--brand-grey-900);
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.btn:hover {
  background: var(--brand-digital-blue-100);
  border-color: var(--brand-digital-blue-300);
}

.btn-primary {
  background: var(--brand-digital-blue-500);
  color: var(--text-on-primary);
  border-color: var(--brand-digital-blue-500);
}

.btn-primary:hover {
  background: var(--brand-digital-blue-700);
  border-color: var(--brand-digital-blue-700);
}

.btn-primary.pulse {
  position: relative;
  box-shadow: 0 0 0 3px rgba(47, 66, 255, 0.25);
}

.btn-primary.pulse::after {
  content: '';
  position: absolute;
  inset: -4px;
  border: 2px solid var(--brand-digital-blue-500);
  border-radius: 999px;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.btn-sm {
  height: 28px;
  padding: 0 var(--space-3);
  font-size: var(--brand-font-size-200);
}

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text-secondary);
}

.btn-ghost:hover {
  background: var(--surface-secondary);
  border-color: transparent;
}

/* ================================================
   MARKETPLACE PAGE
   ================================================ */
.marketplace-banner {
  padding: var(--space-5) var(--space-6);
  background: var(--surface-information);
  border-radius: var(--radius-xl);
  margin-bottom: var(--space-6);
}

.marketplace-banner p {
  font-size: var(--brand-font-size-300);
  color: var(--text-information);
  line-height: 1.5;
}

.marketplace-banner strong {
  font-weight: var(--brand-font-weight-semibold);
}

.marketplace-layout {
  display: grid;
  grid-template-columns: 224px 1fr;
  gap: var(--space-6);
}

.marketplace-sidebar {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.marketplace-sidebar-search {
  height: 36px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-primary);
  padding: 0 var(--space-3);
  font-size: var(--brand-font-size-300);
  color: var(--text-primary);
  background: var(--surface-primary);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  width: 100%;
}

.marketplace-sidebar-search input {
  border: none;
  outline: none;
  background: transparent;
  font-size: var(--brand-font-size-300);
  font-family: var(--font-body);
  color: var(--text-primary);
  flex: 1;
  width: 100%;
}

.marketplace-sidebar-search input::placeholder {
  color: var(--content-placeholder);
}

.sidebar-section-label {
  font-family: var(--font-body);
  font-size: var(--brand-font-size-400);
  font-weight: var(--brand-font-weight-semibold);
  color: var(--brand-grey-900);
  text-transform: none;
  letter-spacing: 0;
}

.sidebar-category-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.sidebar-category-link {
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  font-weight: var(--brand-font-weight-regular);
  color: var(--brand-grey-700);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--transition-fast);
}

.sidebar-category-link:hover {
  background: var(--brand-grey-100);
}

.sidebar-category-link.active {
  background: var(--brand-grey-200);
  color: var(--brand-grey-900);
  font-weight: var(--brand-font-weight-medium);
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, 160px);
  gap: var(--space-4);
}

.category-card {
  width: 160px;
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  padding: var(--space-3);
  cursor: pointer;
  transition: all var(--transition-fast);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.category-card:hover {
  border-color: var(--brand-digital-blue-500);
  box-shadow: var(--shadow-sm);
}

.category-card-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-lg);
  background: var(--surface-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.category-card-name {
  font-size: var(--brand-font-size-300);
  font-weight: var(--brand-font-weight-semibold);
  color: var(--text-primary);
}

.category-card-count {
  font-size: var(--brand-font-size-200);
  color: var(--text-tertiary);
}

.category-card-desc {
  font-size: var(--brand-font-size-200);
  color: var(--text-secondary);
  line-height: 1.5;
}

/* ================================================
   SEARCH DROPDOWN
   ================================================ */
.search-dropdown {
  position: absolute;
  z-index: 200;
  background: var(--surface-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-xl);
  width: 520px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  top: 56px;
  right: 120px;
}

.search-dd-input {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border-primary);
}

.search-dd-input span {
  font-size: var(--brand-font-size-300);
  color: var(--text-primary);
  font-weight: var(--brand-font-weight-medium);
}

.search-dd-cursor {
  display: inline-block;
  width: 1.5px;
  height: 16px;
  background: var(--surface-primary-filled);
  animation: cursor-blink 1s step-end infinite;
}

@keyframes cursor-blink { 50% { opacity: 0; } }

.search-dd-section {
  padding: var(--space-2) 0;
}

.search-dd-label {
  font-size: var(--brand-font-size-100);
  font-weight: var(--brand-font-weight-semibold);
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: var(--space-1) var(--space-4) var(--space-2);
}

.search-dd-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  cursor: pointer;
  transition: background var(--transition-fast);
}

.search-dd-item:hover,
.search-dd-item.active {
  background: var(--surface-primary-hover);
}

.search-dd-item.active {
  border-left: 2px solid var(--surface-primary-filled);
}

.search-dd-icon {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-md);
  background: var(--surface-primary-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.search-dd-name {
  font-size: var(--brand-font-size-300);
  font-weight: var(--brand-font-weight-medium);
  color: var(--text-primary);
}

.search-dd-meta {
  font-size: var(--brand-font-size-200);
  color: var(--text-tertiary);
  margin-top: 1px;
}

.search-dd-badge {
  font-size: 9px;
  font-weight: var(--brand-font-weight-semibold);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  margin-left: var(--space-2);
}

.search-dd-badge.popular {
  background: var(--surface-warning);
  color: var(--brand-orange-800);
}

.search-dd-badge.repos {
  background: var(--surface-secondary);
  color: var(--text-tertiary);
}

/* ================================================
   "WHY DID THIS CHANGE?" POPOVER
   ================================================ */
.diff-actions-menu {
  position: relative;
  display: inline-flex;
}

.diff-more-btn {
  width: 24px;
  height: 24px;
  border-radius: var(--radius-md);
  border: none;
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--icon-tertiary);
  transition: all var(--transition-fast);
  margin-left: auto;
}

.diff-more-btn:hover {
  background: var(--surface-secondary);
  color: var(--icon-secondary);
}

.why-popover {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: var(--space-1);
  background: var(--surface-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-xl);
  padding: var(--space-4);
  width: 320px;
  box-shadow: var(--shadow-lg);
  z-index: 50;
}

.why-popover-title {
  font-family: var(--font-heading);
  font-size: var(--brand-font-size-300);
  font-weight: var(--brand-font-weight-semibold);
  line-height: var(--brand-line-height-300);
  color: var(--content-heading);
  margin-bottom: var(--space-2);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.why-popover-content {
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  color: var(--content-body);
  line-height: var(--brand-line-height-300);
}

.why-badge {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  background: var(--surface-information);
  color: var(--text-information);
  font-weight: var(--brand-font-weight-semibold);
}

/* ================================================
   COMMIT DIALOG
   ================================================ */
.commit-dialog-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.commit-dialog {
  background: var(--surface-primary);
  border-radius: var(--radius-2xl);
  width: 480px;
  box-shadow: var(--shadow-xl);
  overflow: hidden;
}

.commit-dialog-header {
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--border-primary);
}

.commit-dialog-title {
  font-family: var(--font-heading);
  font-size: var(--brand-font-size-500);
  font-weight: var(--brand-font-weight-semibold);
  line-height: var(--brand-line-height-400);
  color: var(--content-heading);
}

.commit-dialog-subtitle {
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  line-height: var(--brand-line-height-300);
  color: var(--content-caption);
  margin-top: var(--space-1);
}

.commit-dialog-body {
  padding: var(--space-5) var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.commit-field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.commit-field-label {
  font-family: var(--font-body);
  font-size: var(--brand-font-size-200);
  font-weight: var(--brand-font-weight-medium);
  line-height: var(--brand-line-height-200);
  color: var(--content-heading);
}

.commit-field-input {
  height: 36px;
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  padding: 0 var(--space-3);
  font-size: var(--brand-font-size-300);
  font-family: var(--font-body);
  color: var(--text-primary);
  background: var(--surface-primary);
  outline: none;
  transition: border-color var(--transition-fast);
}

.commit-field-input:focus {
  border-color: var(--border-focus);
}

.commit-field-input.mono {
  font-family: var(--font-code);
  font-size: var(--brand-font-size-200);
}

.commit-field-textarea {
  height: 64px;
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  padding: var(--space-2) var(--space-3);
  font-size: var(--brand-font-size-300);
  font-family: var(--font-body);
  color: var(--text-primary);
  background: var(--surface-primary);
  outline: none;
  resize: none;
  transition: border-color var(--transition-fast);
}

.commit-field-textarea:focus {
  border-color: var(--border-focus);
}

.commit-field-select {
  height: 36px;
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  padding: 0 var(--space-3);
  font-size: var(--brand-font-size-300);
  font-family: var(--font-body);
  color: var(--text-primary);
  background: var(--surface-primary);
  outline: none;
  appearance: auto;
}

.commit-dialog-footer {
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid var(--border-primary);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-2);
  background: var(--surface-secondary);
}

/* ================================================
   DATA TABLE (shared pattern for Repos & Activity)
   ================================================ */
.data-table {
  width: 100%;
  border-collapse: collapse;
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-xl);
  overflow: hidden;
}

.data-table thead {
  background: var(--brand-grey-100);
}

.data-table th {
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  font-weight: var(--brand-font-weight-semibold);
  line-height: var(--brand-line-height-300);
  color: var(--brand-grey-600);
  text-align: left;
  padding: 10px var(--space-4);
  border-bottom: 1px solid var(--border-primary);
  white-space: nowrap;
}

.data-table td {
  padding: var(--space-3) var(--space-4);
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  font-weight: var(--brand-font-weight-regular);
  line-height: var(--brand-line-height-300);
  color: var(--brand-grey-900);
  border-bottom: 1px solid var(--brand-grey-200);
  vertical-align: middle;
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tr:hover td {
  background: var(--brand-grey-100);
}

/* ================================================
   REPOSITORIES PAGE
   ================================================ */
.repo-origin-icon {
  width: 16px;
  height: 16px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.repo-name-cell {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: var(--brand-font-weight-medium);
  color: var(--brand-digital-blue-500);
}

.ingestion-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-full);
  background: var(--surface-success-filled);
  display: inline-block;
  flex-shrink: 0;
}

/* ================================================
   ACTIVITY PAGE
   ================================================ */
.activity-dot {
  width: 10px;
  height: 10px;
  border-radius: var(--radius-full);
  display: inline-block;
  flex-shrink: 0;
}

.activity-dot.recipe-run {
  background: var(--activity-recipe-run);
}

.activity-dot.commit-job {
  background: var(--activity-commit-job);
}

.activity-type-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px var(--space-2);
  border-radius: 999px;
  font-size: var(--brand-font-size-200);
  font-weight: var(--brand-font-weight-medium);
  white-space: nowrap;
}

.activity-type-badge.recipe-run {
  background: var(--surface-information);
  color: var(--text-information);
}

.activity-type-badge.commit {
  background: var(--surface-success);
  color: var(--text-success);
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px var(--space-2);
  border-radius: 999px;
  font-size: var(--brand-font-size-200);
  font-weight: var(--brand-font-weight-medium);
  white-space: nowrap;
}

.status-badge.complete {
  background: var(--surface-information);
  color: var(--text-information);
}

.status-badge.running {
  background: var(--surface-success);
  color: var(--text-success);
}

.activity-row-mine {
  position: relative;
}

.activity-row-mine td {
  background: var(--surface-primary-hover) !important;
  font-weight: var(--brand-font-weight-medium);
}

.activity-row-mine td:first-child {
  border-left: 3px solid var(--surface-primary-filled);
}

.run-by-cell {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* ================================================
   RECIPE DETAIL PAGE
   ================================================ */
.breadcrumb {
  font-size: var(--brand-font-size-200);
  color: var(--text-tertiary);
  margin-bottom: var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.breadcrumb a {
  color: var(--text-secondary);
  text-decoration: none;
  cursor: pointer;
}

.breadcrumb a:hover {
  color: var(--brand-digital-blue-600);
  text-decoration: underline;
}

.breadcrumb-sep {
  color: var(--text-disabled);
}

.recipe-header {
  margin-bottom: var(--space-5);
}

.recipe-title {
  font-size: var(--brand-font-size-700);
  font-weight: var(--brand-font-weight-semibold);
  color: var(--content-heading);
  line-height: 1.3;
}

.recipe-meta {
  font-size: var(--brand-font-size-200);
  color: var(--text-tertiary);
  margin-top: var(--space-1);
}

.recipe-card {
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-xl);
  overflow: hidden;
  margin-bottom: var(--space-4);
}

.recipe-card-body {
  padding: var(--space-5) var(--space-6);
}

.recipe-desc {
  font-size: var(--brand-font-size-300);
  color: var(--content-body);
  line-height: 1.7;
  margin-bottom: var(--space-5);
  max-width: 700px;
}

.recipe-section-title {
  font-size: var(--brand-font-size-300);
  font-weight: var(--brand-font-weight-semibold);
  color: var(--content-heading);
  margin-bottom: var(--space-3);
}

.recipe-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-5);
}

.recipe-org-message {
  font-size: var(--brand-font-size-200);
  color: var(--text-secondary);
  margin-bottom: var(--space-3);
}

.recipe-id-block {
  background: var(--surface-secondary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  padding: var(--space-3) var(--space-4);
  font-family: var(--font-code);
  font-size: var(--brand-font-size-200);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.recipe-tags {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.recipe-tag {
  font-size: var(--brand-font-size-200);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-full);
  background: var(--surface-secondary);
  color: var(--text-secondary);
  font-weight: var(--brand-font-weight-medium);
}

/* ================================================
   RESULTS PAGE
   ================================================ */
.results-tabs {
  display: flex;
  align-items: center;
  gap: 0;
  border-bottom: 1px solid var(--border-primary);
  padding: 0 var(--space-6);
  background: var(--surface-primary);
}

.results-tab {
  padding: var(--space-3) var(--space-4);
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  font-weight: var(--brand-font-weight-regular);
  line-height: var(--brand-line-height-300);
  color: var(--brand-grey-700);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all var(--transition-fast);
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}

.results-tab:hover {
  color: var(--brand-grey-900);
}

.results-tab.active {
  color: var(--brand-digital-blue-500);
  font-weight: var(--brand-font-weight-semibold);
  border-bottom-color: var(--brand-digital-blue-500);
}

.results-tab.disabled {
  color: var(--text-disabled);
  cursor: default;
}

.results-tab-actions {
  margin-left: auto;
  display: flex;
  gap: var(--space-2);
}

.results-split {
  display: grid;
  grid-template-columns: 420px 1fr;
  height: calc(100% - 120px);
  min-height: 400px;
}

.results-left {
  border-right: 1px solid var(--border-primary);
  overflow-y: auto;
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.results-right {
  overflow-y: auto;
  padding: var(--space-5);
  background: var(--surface-secondary);
}

.results-summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-2);
}

.summary-stat {
  padding: var(--space-3);
  border-radius: var(--radius-lg);
  background: var(--surface-secondary);
}

.summary-stat-value {
  font-size: var(--brand-font-size-500);
  font-weight: var(--brand-font-weight-semibold);
  color: var(--text-primary);
}

.summary-stat-label {
  font-size: var(--brand-font-size-200);
  color: var(--text-tertiary);
  margin-top: 2px;
}

.results-filter-tabs {
  display: flex;
  gap: var(--space-1);
  background: var(--surface-secondary);
  padding: 2px;
  border-radius: var(--radius-lg);
  width: fit-content;
}

.results-filter-tab {
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-md);
  font-size: var(--brand-font-size-200);
  font-weight: var(--brand-font-weight-medium);
  color: var(--text-secondary);
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--font-body);
  transition: all var(--transition-fast);
}

.results-filter-tab.active {
  background: var(--surface-primary);
  color: var(--text-primary);
  box-shadow: var(--shadow-xs);
}

.results-tree {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.results-tree-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background var(--transition-fast);
  font-size: var(--brand-font-size-200);
}

.results-tree-item:hover {
  background: var(--surface-secondary);
}

.results-tree-item.selected {
  background: var(--surface-primary-hover);
}

.results-tree-checkbox {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.results-tree-checkbox.checked {
  background: var(--surface-primary-filled);
}

.results-tree-checkbox.unchecked {
  border: 1.5px solid var(--border-secondary);
  background: var(--surface-primary);
}

.results-tree-name {
  flex: 1;
  font-weight: var(--brand-font-weight-medium);
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.results-tree-count {
  font-size: var(--brand-font-size-100);
  color: var(--text-tertiary);
  white-space: nowrap;
}

.results-action-panel {
  padding: var(--space-3) var(--space-5);
  border-top: 1px solid var(--border-primary);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  background: var(--surface-primary);
}

.results-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.commit-btn {
  /* tour target */
}

/* Diff view placeholder */
.diff-placeholder {
  background: var(--surface-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-xl);
  overflow: hidden;
  height: 100%;
  min-height: 300px;
}

.diff-header {
  padding: var(--space-3) var(--space-4);
  background: var(--surface-secondary);
  border-bottom: 1px solid var(--border-primary);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--brand-font-size-200);
  font-weight: var(--brand-font-weight-medium);
  color: var(--text-primary);
}

.diff-file-path {
  font-family: var(--font-code);
  font-size: var(--brand-font-size-200);
  color: var(--text-secondary);
}

.diff-content {
  font-family: var(--font-code);
  font-size: var(--brand-font-size-200);
  line-height: 1.7;
  padding: 0;
}

.diff-line {
  display: flex;
  padding: 0 var(--space-4);
  min-height: 22px;
}

.diff-line-num {
  width: 40px;
  text-align: right;
  color: var(--text-tertiary);
  user-select: none;
  flex-shrink: 0;
  padding-right: var(--space-2);
}

.diff-line-content {
  flex: 1;
  padding-left: var(--space-2);
  white-space: pre;
}

.diff-line.added {
  background: var(--surface-success);
}

.diff-line.added .diff-line-content {
  color: var(--brand-green-800);
}

.diff-line.removed {
  background: var(--surface-error);
}

.diff-line.removed .diff-line-content {
  color: var(--brand-red-700);
}

.diff-line.context .diff-line-content {
  color: var(--text-secondary);
}

/* ================================================
   EMPTY STATE
   ================================================ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  min-height: 300px;
  color: var(--text-tertiary);
  font-size: var(--brand-font-size-300);
  gap: var(--space-3);
}

/* ================================================
   ORG DROPDOWN
   ================================================ */
.org-dropdown {
  position: absolute;
  z-index: 100;
  background: var(--surface-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-xl);
  width: 360px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  top: 56px;
  left: var(--space-5);
}

.org-dd-search {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border-primary);
}

.org-dd-search input {
  width: 100%;
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  padding: var(--space-2) var(--space-3);
  font-size: var(--brand-font-size-300);
  font-family: var(--font-body);
  outline: none;
}

.org-dd-search input::placeholder {
  color: var(--content-placeholder);
}

.org-dd-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  font-size: var(--brand-font-size-300);
  color: var(--text-primary);
  cursor: pointer;
  transition: background var(--transition-fast);
}

.org-dd-item:hover {
  background: var(--surface-secondary);
}

.org-dd-item.active {
  background: var(--surface-primary-hover);
}

.org-avatar {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--brand-font-size-200);
  font-weight: var(--brand-font-weight-semibold);
  color: var(--text-on-primary);
  flex-shrink: 0;
}

.org-dd-meta {
  flex: 1;
}

.org-dd-name {
  font-weight: var(--brand-font-weight-medium);
}

.org-dd-repos {
  font-size: var(--brand-font-size-200);
  color: var(--text-tertiary);
  margin-top: 1px;
}

/* ================================================
   WELCOME MODAL
   ================================================ */
.welcome-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}

.welcome-backdrop {

function CustomTooltip({ continuous, index, step, backProps, closeProps, primaryProps, skipProps, tooltipProps, size }) {
  const isLast = index === size - 1;
  return html`
    <div ...${tooltipProps} className="joyride-tooltip">
      <div className="joyride-tooltip__step">STEP ${index + 1} OF ${size}</div>
      ${step.title ? html`<div className="joyride-tooltip__title">${step.title}</div>` : null}
      <div className="joyride-tooltip__content" dangerouslySetInnerHTML=${{ __html: step.content }}></div>
      <div className="joyride-tooltip__footer">
        <button ...${primaryProps} className="joyride-tooltip__btn-next">${isLast ? 'Got it!' : 'Next'}</button>
        <button ...${skipProps} className="joyride-tooltip__btn-skip">${isLast ? 'Restart tour' : 'Skip tour'}</button>
        <div className="joyride-tooltip__dots">
          ${Array.from({ length: size }, (_, i) => html`
            <div key=${i} className=${'joyride-tooltip__dot' + (i === index ? ' active' : '')}></div>
          `)}
        </div>
      </div>
    </div>
  `;
}

  6: 'results-commit',
};

const stepToSidebar = {
  0: 'marketplace',
  1: 'repos',
  2: 'marketplace',
  3: 'marketplace',
  4: 'activity',
  5: 'activity',
  6: 'activity',
};

// ============================================================
// APP
// ============================================================
function App() {
  const [showWelcome, setShowWelcome] = useState(true);
  const [runTour, setRunTour] = useState(false);
  const [stepIndex, setStepIndex] = useState(0);
  const [currentView, setCurrentView] = useState('empty');
  const [orgSelected, setOrgSelected] = useState(false);

  const activeSidebar = runTour ? (stepToSidebar[stepIndex] || 'marketplace') : (orgSelected ? 'marketplace' : 'marketplace');

  const handleStartTour = useCallback(() => {
    setShowWelcome(false);
    setCurrentView('empty');
    setOrgSelected(false);
    setStepIndex(0);
    setTimeout(() => setRunTour(true), 100);
  }, []);

  const handleDismissWelcome = useCallback(() => {
    setShowWelcome(false);
  }, []);

  const handleJoyrideCallback = useCallback((data) => {
    const { action, index, status, type } = data;

    if (status === 'finished') {
      setRunTour(false);
      return;
    }

    if (status === 'skipped') {
      setRunTour(false);
      setCurrentView('marketplace');
      setOrgSelected(true);
      return;
    }

    if (type === 'step:after') {
      const nextIndex = index + (action === 'prev' ? -1 : 1);
      if (nextIndex >= 0 && nextIndex < tourSteps.length) {
        const nextView = stepToView[nextIndex];
        if (nextView) {
          setCurrentView(nextView);
        }
        if (nextIndex >= 1) {
          setOrgSelected(true);
        }
        setStepIndex(nextIndex);
      }
    }
  }, []);

  const handleOrgClick = useCallback(() => {
    if (!runTour) {
      setOrgSelected(!orgSelected);
    }
  }, [runTour, orgSelected]);

  // Determine if the current view needs the content wrapper (white bg + rounded)
  const isResultsView = currentView === 'results' || currentView === 'results-commit';

  let pageContent;
  switch (currentView) {
    case 'repos':
      pageContent = html`<${ReposPage} />`;
      break;
    case 'marketplace':
      pageContent = html`<${MarketplacePage} />`;
      break;
    case 'marketplace-search':
      pageContent = html`<${MarketplaceSearchPage} />`;
      break;
    case 'recipe':
      pageContent = html`<${RecipeDetailPage} />`;
      break;
    case 'activity':
      pageContent = html`<${ActivityPage} />`;
      break;
    case 'results-review':
      pageContent = html`<${ResultsPage} mode="review" />`;
      break;
    case 'results-commit':
      pageContent = html`<${ResultsPage} mode="commit" />`;
      break;
    default:
      pageContent = html`<${EmptyState} />`;
  }

  return html`
    <div className="app-shell">
      <${LeftNavigation} activeItem=${activeSidebar} />
      <div className="main-area">
        <${GlobalNavBar}
          orgSelected=${orgSelected}
          onOrgClick=${handleOrgClick}
        />
        <div className="content-wrapper">
          ${pageContent}
        </div>
        ${runTour ? html`
          <div className="tour-progress">
            ${icons.info(12, 'var(--surface-primary-filled)')}
            <span>Getting started: ${stepIndex + 1} of 7</span>
            <div className="progress-dots">
              ${Array.from({ length: 7 }, (_, i) => html`
                <div key=${i} className=${'progress-dot' + (i < stepIndex ? ' done' : '') + (i === stepIndex ? ' current' : '')}></div>
              `)}
            </div>
            <button className="progress-dismiss" onClick=${() => { setRunTour(false); setCurrentView('marketplace'); setOrgSelected(true); }}>Dismiss</button>
          </div>
        ` : null}
      </div>
      <${Joyride}
        steps=${tourSteps}
        run=${runTour}
        stepIndex=${stepIndex}
        continuous=${true}
        showSkipButton=${true}
        disableOverlayClose=${true}
        disableCloseOnEsc=${false}
        spotlightPadding=${8}
        callback=${handleJoyrideCallback}
        tooltipComponent=${CustomTooltip}
        styles=${{
          options: {
            arrowColor: '#FFFFFF',
            backgroundColor: '#FFFFFF',
            overlayColor: 'rgba(0, 0, 0, 0.5)',
            primaryColor: '#2F42FF',
            spotlightShadow: '0 0 0 9999px rgba(0, 0, 0, 0.5)',
            zIndex: 1000,
          },
          spotlight: {
            borderRadius: 8,
          },
        }}
        floaterProps=${{
          disableAnimation: true,
        }}
      />
      ${showWelcome ? html`
        <div className="welcome-overlay">
          <div className="welcome-backdrop" onClick=${handleDismissWelcome}></div>
          <div className="welcome-card">
            <div className="welcome-icon" dangerouslySetInnerHTML=${{ __html: '<svg width="36" height="36" viewBox="0 0 47 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M46.2205 0.092002C45.777 -0.0920021 45.2677 0.00862519 44.9272 0.350758L24.4951 20.8816C23.1532 9.14558 13.2189 0 1.18742 0C0.872678 0 0.572248 0.126503 0.349071 0.350758C0.125895 0.575013 0 0.876894 0 1.19315V23.5899V45.9895C0 46.0097 0.00858372 46.0269 0.00858372 46.047C0.00858372 46.1045 0.0228899 46.1592 0.0343349 46.2167C0.0457799 46.277 0.0572248 46.3374 0.0772535 46.3949C0.082976 46.4122 0.082976 46.4294 0.0886985 46.4467C0.103005 46.4812 0.128756 46.507 0.145923 46.5415C0.174536 46.5962 0.203148 46.6508 0.240344 46.6997C0.274679 46.7457 0.311875 46.7859 0.351933 46.8262C0.39199 46.8664 0.432047 46.9067 0.480688 46.9412C0.52933 46.9786 0.580832 47.0073 0.635195 47.0361C0.66953 47.0533 0.695282 47.0792 0.729616 47.0936C0.743923 47.0993 0.758229 47.0964 0.772535 47.1022C0.901291 47.1511 1.03863 47.1856 1.18455 47.1856H45.7627C46.4179 47.1856 46.9501 46.6508 46.9501 45.9924V1.19315C46.9501 0.710141 46.6611 0.276006 46.2176 0.092002H46.2205ZM44.5781 4.07109V22.3968H26.3406L44.5781 4.07109ZM44.5781 33.5951H24.661V24.7802H44.5781V33.5951ZM2.37483 43.1087V24.7831H20.6124L11.4936 33.9459L2.37483 43.1087ZM2.37483 2.41793C13.0673 3.01594 21.6625 11.6526 22.2576 22.3968H2.37483V2.41793ZM13.1703 35.6335L22.2891 26.4707V44.7964H4.05152L13.1703 35.6335ZM24.6639 44.7964V35.9814H44.581V44.7964H24.6639Z" fill="#041834"/></svg>' }}></div>
            <h2>Welcome to Moderne</h2>
            <p>Moderne runs automated code transformations across all your repositories at once. Let\u2019s get you to your first result in a few minutes.</p>
            <div className="welcome-buttons">
              <button className="wb-primary" onClick=${handleStartTour}>Show me how</button>
              <button className="wb-secondary" onClick=${handleDismissWelcome}>I\u2019ll explore on my own \u2014 restart from Help anytime</button>
            </div>
          </div>
        </div>
      ` : null}
    </div>
  `;
}

// ============================================================
// MOUNT
// ============================================================
const root = createRoot(document.getElementById('root'));
root.render(html`<${App} />`);
</script>

</body>
</html>
