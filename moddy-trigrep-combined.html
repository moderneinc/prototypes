/* ================================================

   ================================================ */
:root {
  --alias-primary-100: var(--brand-digital-blue-100);
  --alias-primary-200: var(--brand-digital-blue-200);
  --alias-primary-300: var(--brand-digital-blue-300);
  --alias-primary-500: var(--brand-digital-blue-500);
  --alias-primary-600: var(--brand-digital-blue-600);
  --alias-primary-700: var(--brand-digital-blue-700);
  --alias-primary-800: var(--brand-digital-blue-800);
  --alias-success-100: var(--brand-green-100);
  --alias-success-600: var(--brand-green-600);
  --alias-success-700: var(--brand-green-700);
  --alias-error-100: var(--brand-red-100);
  --alias-error-600: var(--brand-red-600);
  --alias-error-700: var(--brand-red-700);
  --alias-warning-100: var(--brand-orange-100);
  --alias-warning-600: var(--brand-orange-600);
  --alias-neutral-light-100: var(--brand-grey-100);

  --alias-neutral-dark-500: var(--brand-grey-500);

  --alias-neutral-dark-800: var(--brand-grey-800);

  --alias-font-heading: var(--brand-font-family-sans);

/* ================================================
   NEO DESIGN SYSTEM — MAPPED TOKENS (Tier 3)
   Components consume ONLY these.
   ================================================ */
:root {
  --surface-primary: var(--alias-foundation-white);
  --surface-page: #f4f4f4;
  --surface-secondary: var(--alias-neutral-light-100);
  --surface-tertiary: var(--alias-neutral-light-200);
  --surface-disabled: var(--alias-neutral-light-200);
  --surface-error: var(--alias-error-100);
  --surface-success: var(--alias-success-100);
  --surface-information: var(--alias-primary-100);
  --surface-warning: var(--alias-warning-100);
  --surface-primary-filled: var(--alias-primary-500);
  --surface-error-filled: var(--alias-error-600);
  --surface-success-filled: var(--alias-success-600);
  --surface-primary-hover: var(--alias-primary-100);
  --surface-primary-pressed: var(--alias-primary-200);
  --surface-primary-filled-hover: var(--alias-primary-700);
  --surface-primary-filled-pressed: var(--alias-primary-800);
  --surface-primary-active: #3776F01A;
  --surface-error-filled-hover: var(--alias-error-700);
  --text-primary: var(--alias-neutral-dark-1000);
  --text-secondary: var(--alias-neutral-dark-600);
  --text-tertiary: var(--alias-neutral-dark-500);
  --text-disabled: var(--alias-neutral-light-400);

  --text-success: var(--alias-success-700);
  --text-information: var(--alias-primary-700);
  --text-on-primary: var(--alias-foundation-white);
  --text-on-error: var(--alias-foundation-white);
  --text-primary-hover: var(--alias-primary-700);
  --icon-primary: var(--alias-neutral-dark-1000);
  --icon-secondary: var(--alias-neutral-dark-600);
  --icon-tertiary: var(--alias-neutral-dark-500);
  --icon-on-primary: var(--alias-foundation-white);
  --border-primary: var(--alias-neutral-light-300);
  --border-secondary: var(--alias-neutral-light-400);
  --border-hover: var(--alias-neutral-light-400);
  --border-focus: var(--alias-primary-600);
  --content-heading: var(--alias-neutral-dark-1000);
  --content-body: var(--alias-neutral-dark-800);
  --content-caption: var(--alias-neutral-dark-600);
  --content-placeholder: var(--alias-neutral-dark-500);
  --font-heading: var(--alias-font-heading);
  --font-body: var(--alias-font-body);
  --font-code: var(--alias-font-code);
  --space-1: var(--brand-spacing-100);
  --space-2: var(--brand-spacing-200);
  --space-3: var(--brand-spacing-300);
  --space-4: var(--brand-spacing-400);
  --space-5: var(--brand-spacing-500);
  --space-6: var(--brand-spacing-600);
  --space-8: var(--brand-spacing-800);
  --space-10: var(--brand-spacing-1000);
  --radius-sm: var(--brand-radius-100);
  --radius-md: var(--brand-radius-200);
  --radius-lg: var(--brand-radius-300);
  --radius-xl: var(--brand-radius-400);
  --radius-2xl: var(--brand-radius-500);
  --radius-full: var(--brand-radius-full);
  --shadow-xs: var(--brand-shadow-100);
  --shadow-sm: var(--brand-shadow-200);
  --shadow-md: var(--brand-shadow-300);
  --shadow-lg: var(--brand-shadow-400);

/* Legacy tokens still consumed by the rest of this file */
:root {
    --grey-25:  #f9fafb;
    --grey-50:  #f3f4f6;
    --grey-100: #e5e7eb;
    --grey-200: #d1d5db;
    --grey-300: #9ca3af;
    --grey-500: #6b7280;
    --grey-600: #4b5563;
    --grey-700: #374151;
    --grey-800: #1f2937;
    --grey-900: #111827;
    --bg: #ffffff;

    --neo-digital-blue-300: #8d99ff;
    --neo-digital-blue-500: #2f42ff;
    --neo-red-500: #cb3446;

    --neo-red: #FF3232;
    --roseate: #DB4197;
    --violet: #461DDE;
    --digital-blue: #2F42FF;
    --digital-green: #3DDC84;

    --highlight: #fbbf24;
    --highlight-bg: #fef3c7;
    --highlight-text: #78350f;

    --code-cs: #A0A4C0;

    --code-slate-mid: #636687;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--grey-50);
    color: var(--grey-700);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.55;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }

  /* ===== Shell ===== */
  body { background: var(--surface-page); }
  .shell { height: 100vh; display: flex; flex-direction: column; }
  .grid {
    display: grid;
    grid-template-columns: 98px 1fr;
    grid-template-areas: "nav content";
    flex: 1;
    overflow: hidden;
    gap: 0;
    background: var(--surface-page);
  }

/* ================================================
   LEFT NAVIGATION RAIL (98px) — v2-sandbox spec
   ================================================ */
.left-nav {
  grid-area: nav;
  width: 98px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  padding: 2px 8px 24px;
  gap: 0;
  background: var(--surface-page);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  overflow: visible;
}

.left-nav-top {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  gap: 4px;
}

.nav-item-home {
  padding: 0 4px;
}

.nav-item-home .nav-icon-container {
  padding: 4px;
}

.nav-item {
  width: 100%;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  position: relative;
  text-decoration: none;
  background: transparent;
}

.nav-icon-container {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: var(--radius-lg);
  border: 1px solid transparent;
  background: transparent;
  transition: background-color 150ms ease, border-color 150ms ease;
}

.nav-item:hover .nav-icon-container,
.nav-item.active .nav-icon-container {
  background: var(--brand-digital-blue-100);
  border-color: var(--brand-digital-blue-200);
}

.nav-item svg {
  width: 22px;
  height: 22px;
  min-width: 22px;
  color: var(--brand-grey-900);
  flex-shrink: 0;
}

.nav-label {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: var(--brand-font-weight-regular);
  line-height: 1;
  color: var(--brand-grey-900);
  text-align: center;
  white-space: normal;
  width: 100%;
  transition: color 150ms ease;
}

.nav-item:hover .nav-label {
  color: var(--brand-digital-blue-600);
}

.nav-item.active .nav-label {
  font-weight: var(--brand-font-weight-semibold);
  color: var(--brand-digital-blue-800);
}

.nav-badge {
  font-size: 11px;
  padding: 0 6px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--brand-grey-200);
  color: var(--brand-grey-800);
  border: 1px solid rgba(107, 114, 128, 0.5);
  font-weight: var(--brand-font-weight-medium);
  line-height: 1;
  text-align: center;
  letter-spacing: 0;
}

.nav-home-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
  padding: 4px 0;
}

.nav-version-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--brand-digital-blue-500) 0%, var(--brand-violet-500) 100%);
  color: var(--brand-white);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: var(--brand-font-weight-semibold);
  line-height: 1;
  letter-spacing: 0;
}

.nav-more-wrapper {
  position: relative;
  margin-top: auto;
}

.nav-more-popover {
  position: absolute;
  left: calc(100% + 4px);
  bottom: 0;
  background: var(--surface-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 96px;
  z-index: 100;
}

.nav-more-popover[hidden] { display: none; }

.nav-more-popover .nav-item {
  padding: 8px 4px;
}

/* ================================================
   MAIN CONTENT AREA
   ================================================ */
.main-area {
  grid-area: content;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* ================================================
   GLOBAL NAVIGATION BAR (65px toolbar)
   ================================================ */
.global-nav {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 12px 20px;
  gap: 12px;
  flex-shrink: 0;
  position: relative;
  width: 100%;
}

.global-nav::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 70%;
  transform: translate(-50%, -50%);
  width: 1000px;
  max-width: 90%;
  height: 65px;
  background: radial-gradient(ellipse at center, var(--brand-red-100) 0%, var(--brand-red-100) 40%, transparent 70%);
  filter: blur(20px);
  z-index: 0;
  pointer-events: none;
}

.global-nav > * {
  position: relative;
  z-index: 1;
}

.org-selector {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  color: var(--text-primary);
  cursor: pointer;
  padding: 10px 16px;
  border-radius: var(--radius-full);
  transition: all var(--transition-fast);
  background: var(--surface-primary);
  border: 1px solid var(--border-secondary);
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-transform: none;
}

.org-selector:hover {
  background: var(--brand-grey-200);
  border-color: var(--border-primary);
}

.org-selector.selected {
  color: var(--text-primary);
  font-weight: var(--brand-font-weight-regular);
}

.org-selector-wrapper {
  position: relative;
  flex: 0 1 auto;
  min-width: 0;
  max-width: 50vw;
}

.nav-spacer {
  flex: 1;
}

.search-input {
  height: 40px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-secondary);
  padding: 10px 16px;
  font-size: var(--brand-font-size-300);
  color: var(--text-tertiary);
  background: var(--surface-primary);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: background var(--transition-fast), border-color var(--transition-fast);
  flex-shrink: 0;
  user-select: none;
}

.search-input:hover {
  background: var(--brand-grey-200);
  border-color: var(--border-primary);
}

.search-input > span:first-of-type {
  flex: 1;
  white-space: nowrap;
}

.search-input-keys {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.search-input kbd {
  font-size: var(--brand-font-size-100);
  background: var(--surface-tertiary);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-tertiary);
  font-family: var(--font-body);
  border: 1px solid var(--border-primary);
  min-width: 18px;
  text-align: center;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 64px;
}

.nav-action-btn {
  width: 40px;
  height: 40px;
  border-radius: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background var(--transition-fast), transform 200ms ease-in;
  border: none;
  background: transparent;
  color: var(--brand-grey-900);
  flex-shrink: 0;
}

.nav-action-btn:hover {
  background: var(--brand-grey-200);
}

.nav-action-btn.open {
  background: var(--surface-primary);
  box-shadow: var(--shadow-xs);
}

.nav-action-btn svg { width: 20px; height: 20px; }

.avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background: #E45A4F;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: var(--brand-font-weight-semibold);
  color: var(--brand-white);
  flex-shrink: 0;
}

  /* ===== Page (split container) — transitions between Phase 1 and Phase 2 ===== */
  .page {
    flex: 1;
    background: var(--bg);
    border-radius: 8px;
    overflow: hidden;
    margin: 0 8px 8px 0;
    min-height: 0;
    display: flex;
    position: relative;
  }
  /* TriGrep panel: collapsed to width 0 in Phase 1; expanded to flex 1 in Phase 2 */
  .trigrep-panel {
    width: 0;
    flex-shrink: 0;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: width 300ms cubic-bezier(0.4, 0, 0.2, 1),
                flex-basis 300ms cubic-bezier(0.4, 0, 0.2, 1),
                flex-grow 300ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* Divider hidden in Phase 1 */
  .divider {
    width: 0;
    background: transparent;
    cursor: col-resize;
    position: relative;
    flex-shrink: 0;
    transition: width 300ms cubic-bezier(0.4, 0, 0.2, 1), background 0.15s ease;
  }
  .divider:hover, .divider.dragging { background: var(--grey-100); }
  .divider-toggle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 22px; height: 38px;
    border-radius: 6px;
    background: #fff;
    border: 1px solid var(--grey-100);
    box-shadow: 0 1px 2px rgba(15,23,42,0.06);
    display: none; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--grey-500);
    z-index: 2;
  }
  .divider-toggle:hover { color: var(--grey-900); border-color: var(--grey-200); }
  .divider-toggle svg { width: 12px; height: 12px; }

  /* Moddy panel: full flex in Phase 1; 30% in Phase 2 */
  .moddy-panel {
    flex: 1;
    min-width: 0;
    display: flex; flex-direction: column;
    background: #fff;
    overflow: hidden;
    transition: width 300ms cubic-bezier(0.4, 0, 0.2, 1),
                flex-basis 300ms cubic-bezier(0.4, 0, 0.2, 1),
                flex-grow 300ms cubic-bezier(0.4, 0, 0.2, 1),
                border-left-width 300ms ease;
    border-left: 0 solid var(--grey-100);
  }
  .moddy-panel.collapsed { width: 0 !important; min-width: 0; border-left-width: 0; flex: 0 0 0 !important; }

  /* === Phase 2 active state === */
  body.phase-2 .trigrep-panel {
    width: auto;
    flex: 1 1 auto;
  }
  body.phase-2 .divider {
    width: 6px;
  }
  body.phase-2 .divider-toggle { display: inline-flex; }
  body.phase-2 .moddy-panel {
    flex: 0 0 30%;
    border-left-width: 1px;
  }

  /* Reopen tab for Moddy when collapsed */
  .moddy-reopen {
    position: absolute;
    right: 0; top: 50%;
    transform: translateY(-50%);
    padding: 12px 6px;
    background: #fff;
    border: 1px solid var(--grey-100);
    border-right: none;
    border-radius: 8px 0 0 8px;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    color: var(--grey-700);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    writing-mode: vertical-rl;
  }
  .moddy-reopen.visible { display: inline-flex; }

  /* ===== Moddy chat container (lives inside .moddy-panel — flexes width with phase) ===== */
  .chat-inner {
    flex: 1;
    display: flex; flex-direction: column;
    min-height: 0;
    width: 100%;
    transition: max-width 300ms cubic-bezier(0.4, 0, 0.2, 1), padding 300ms ease;
    margin: 0 auto;
    /* Phase 1: centered, capped width */
    max-width: 720px;
    padding: 0 24px;
  }
  body.phase-2 .chat-inner {
    max-width: 100%;
    padding: 0;
  }

  /* Moddy header (only shown in Phase 2) */
  .moddy-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--grey-50);
    display: none; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  body.phase-2 .moddy-head { display: flex; }
  .back-to-chat {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: none;
    padding: 4px 6px 4px 0;
    color: var(--grey-500);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 6px;
    transition: color 0.15s ease;
  }
  .back-to-chat:hover { color: var(--neo-digital-blue-500); }
  .back-to-chat svg { width: 14px; height: 14px; }
  .moddy-head-actions { display: inline-flex; gap: 4px; }

  /* Greeter — Phase 1 step 1 only */
  .greeter {
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 0 16px; gap: 20px;
    width: 100%;
  }
  .greeter.hidden { display: none; }
  .greeter-logo {
    width: 135px; height: 135px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .greeter-logo svg { width: 100%; height: 100%; }
  #greeter-spinner { width: 100%; height: 100%; }
  .greeter-headline {
    text-align: center;
    font-size: 22px; font-weight: 500; color: var(--grey-800);
    line-height: 1.3;
  }
  .suggestions {
    display: flex; flex-direction: column;
    width: 100%;
    margin-top: 12px;
  }
  .suggestion {
    text-align: left;
    padding: 14px 16px;
    border: none;
    border-bottom: 1px solid var(--grey-50);
    background: transparent;
    color: var(--grey-700);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
    line-height: 1.45;
  }
  .suggestion:hover { background: var(--grey-25); color: var(--grey-900); }
  .suggestion:last-child { border-bottom: none; }
  /* Subtle highlight on the one tile that advances the demo */
  .suggestion.is-primed {
    background: rgba(47, 66, 255, 0.04);
    border-left: 2px solid var(--neo-digital-blue-500);
    padding-left: 14px;
    color: var(--grey-900);
  }
  .suggestion.is-primed:hover { background: rgba(47, 66, 255, 0.08); }
  .greeter-disclaimer {
    text-align: center;
    font-size: 12px;
    color: var(--grey-600);
    padding: 20px 16px 16px;
    line-height: 1.5;
  }
  .greeter-disclaimer svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; color: var(--neo-digital-blue-500); }

  /* Conversation (shared between phases) */
  .conversation {
    flex: 1; overflow-y: auto;
    padding: 24px 4px 24px;
    display: flex; flex-direction: column; gap: 20px;
    scrollbar-gutter: stable;
  }
  body.phase-2 .conversation { padding: 18px 18px 12px; gap: 14px; }
  .conversation.hidden { display: none; }
  .conversation::-webkit-scrollbar { width: 6px; }
  .conversation::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 3px; }

  /* User message — Phase 1 style (full-width grey bubble) */
  .msg-user {
    align-self: stretch;
    display: flex; flex-direction: row; gap: 10px; align-items: flex-start;
    background: var(--grey-50);
    border-radius: 16px;
    padding: 12px 14px;
  }
  body.phase-2 .msg-user {
    align-self: flex-end;
    max-width: 88%;
    border-radius: 14px 14px 4px 14px;
    padding: 10px 14px;
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
  }
  body.phase-2 .msg-user .avatar { display: none; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: var(--grey-100); color: var(--grey-700);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .msg-user-text { color: var(--grey-800); font-size: 15px; padding-top: 4px; }
  body.phase-2 .msg-user-text { padding-top: 0; font-size: 13.5px; color: var(--grey-900); line-height: 1.5; }

  /* Moddy message */
  .msg-moddy { display: flex; flex-direction: column; gap: 12px; color: var(--grey-600); font-size: 16px; }
  body.phase-2 .msg-moddy { font-size: 13.5px; gap: 10px; }
  .msg-moddy p { margin: 0; }
  .msg-moddy .inline-code, .msg-moddy code {
    background: var(--grey-25); border: 1px solid var(--grey-50);
    padding: 0 5px; border-radius: 4px;
    font-size: 13px; color: var(--violet);
    font-family: 'JetBrains Mono', monospace;
  }
  body.phase-2 .msg-moddy code { font-size: 12px; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeInUp 380ms cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* Derived query — Neo mini-code-card */
  .derived-query {
    background: var(--code-near-black);
    border-radius: 8px;
    overflow: hidden;
  }
  .derived-query-head {
    padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .derived-query-head-title {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    color: var(--code-slate-mid);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .derived-query-cmd {
    padding: 14px 16px;
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(255,255,255,0.6);
    white-space: pre;
    overflow-x: auto;
  }
  /* In the narrow Moddy panel, wrap the command so it stays readable. */
  body.phase-2 .derived-query-cmd {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-x: hidden;
  }
  .derived-query-cmd .cb { color: var(--code-cb); }
  .derived-query-cmd .cs { color: var(--code-cs); }
  .derived-query-cmd .cd { color: var(--code-cd); }
  .derived-query-copy {
    width: 24px; height: 24px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.08);
    background: transparent;
    color: var(--code-cs);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .derived-query-copy:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .derived-query-copy svg { width: 12px; height: 12px; }
  .derived-query-copy.copied {
    background: rgba(61,220,132,0.18);
    border-color: rgba(61,220,132,0.4);
    color: var(--digital-green);
  }

  /* Scope line */
  .scope-line {
    font-size: 12px; color: var(--grey-600);
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  }
  .scope-line .scope-sep { color: var(--grey-300); }

  /* Module grouping */
  .modules-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    font-size: 14px; color: var(--grey-600);
  }
  body.phase-2 .modules-row { font-size: 13px; }
  .modules-label { font-weight: 600; color: var(--grey-800); margin-right: 4px; }
  .module-chip {
    border: 1px solid var(--grey-100); background: #fff;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px; color: var(--grey-700);
    cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit;
  }
  .module-chip:hover { border-color: var(--violet); color: var(--violet); background: rgba(70,29,222,0.04); }
  .module-chip .count {
    background: var(--grey-50); color: var(--grey-500);
    border-radius: 999px; padding: 0 6px; font-size: 11px;
  }
  .module-chip:hover .count { background: rgba(70,29,222,0.1); color: var(--violet); }
  .modules-more {
    background: none; border: none; padding: 0;
    color: var(--violet); cursor: pointer;
    font-family: inherit; font-size: 13px;
    text-decoration: underline;
  }

  /* Inline file cards (Phase 1) */
  .results { display: flex; flex-direction: column; gap: 10px; }
  .file-group {
    border: 1px solid var(--grey-100); border-radius: 8px;
    background: #fff; overflow: hidden;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    transition: border-color 0.15s ease, box-shadow 0.2s ease;
  }
  .file-group:hover {
    border-color: var(--grey-200);
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
  }
  .file-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--grey-25);
    border-bottom: 1px solid var(--grey-50);
    font-size: 12px;
    cursor: pointer;
  }
  .file-path { color: var(--grey-900); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .file-module { color: var(--grey-500); font-weight: 400; margin-left: 2px; }
  .file-count {
    color: var(--grey-500); font-size: 11px; margin-left: auto;
    background: var(--grey-50);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .file-chev {
    width: 12px; height: 12px; color: var(--grey-500);
    transition: transform 0.15s ease;
  }
  .file-group.collapsed .file-chev { transform: rotate(-90deg); }
  .file-group.collapsed .file-body { display: none; }
  .lang-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--java-dot);
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(231, 111, 0, 0.15);
  }
  .file-body { padding: 8px 0; }
  .match-line {
    display: grid; grid-template-columns: 56px 1fr;
    padding: 3px 0;
    font-size: 12.5px;
    line-height: 1.55;
    font-family: 'JetBrains Mono', monospace;
  }
  .match-line:hover { background: var(--grey-25); }
  .match-line .lineno {
    text-align: right; color: var(--grey-300); padding-right: 12px;
    user-select: none;
  }
  .match-line .code {
    padding: 0 14px 0 12px; color: var(--grey-900); white-space: pre; overflow-x: auto;
  }
  .match-line mark {
    background: var(--highlight-bg); color: var(--highlight-text);
    padding: 0 2px; border-radius: 2px;
  }

  .overflow-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 4px 0;
    font-size: 13px; color: var(--grey-600);
  }
  .overflow-row .more-link {
    background: none; border: none; padding: 0;
    color: var(--violet); cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600;
  }
  .overflow-row .more-link:hover { text-decoration: underline; }

  /* Followup action buttons (Phase 1 + Phase 2) */
  .followup-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .followup-actions.stacked { flex-direction: column; align-items: stretch; gap: 8px; }
  body.phase-2 .followup-actions { flex-direction: column; align-items: stretch; gap: 8px; }
  .followup {
    border: 1px solid var(--grey-200); background: #fff;
    border-radius: 8px; padding: 9px 14px;
    font-size: 13px; color: var(--grey-900); cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .followup:hover { border-color: var(--grey-300); background: var(--grey-25); }
  body.phase-2 .followup { width: 100%; text-align: left; }
  .followup.primary {
    background: var(--neo-digital-blue-500);
    color: #fff; border-color: var(--neo-digital-blue-500);
    font-weight: 600;
  }
  .followup.primary:hover { background: #1f30e6; }
  .followup.primary svg { width: 14px; height: 14px; }
  .followup.tertiary {
    border: none; background: transparent;
    padding: 8px 6px; color: var(--neo-digital-blue-500);
    font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .followup.tertiary:hover { background: rgba(47, 66, 255, 0.06); color: var(--neo-digital-blue-500); }
  .followup svg { width: 14px; height: 14px; }

  /* Chat input */
  .prompt-wrap {
    padding: 16px 0 24px;
    background: linear-gradient(to bottom, transparent, var(--bg) 30%);
    flex-shrink: 0;
  }
  body.phase-2 .prompt-wrap {
    padding: 14px 18px 12px;
    background: #fff;
    border-top: 1px solid var(--grey-50);
  }
  .prompt-gradient {
    position: relative; padding: 1px; border-radius: 10px;
    background: linear-gradient(60deg, var(--neo-red), var(--roseate), var(--violet), var(--digital-blue), var(--digital-green));
    background-size: 300% 300%;
    animation: gradient-shift 10s ease alternate infinite;
    box-shadow: rgba(0,0,0,0.12) 0px 1px 8px 0px;
  }
  body.phase-2 .prompt-gradient {
    background: var(--grey-200);
    animation: none;
    box-shadow: none;
  }
  @keyframes gradient-shift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .prompt-inner {
    background: var(--bg); border-radius: 9px;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px 10px 18px;
  }
  body.phase-2 .prompt-inner { padding: 6px 6px 6px 14px; }
  .prompt-input {
    flex: 1; border: none; outline: none; resize: none;
    font-family: inherit; font-size: 15px; color: var(--grey-700);
    background: transparent; padding: 8px 0;
    height: 24px; line-height: 1.5;
    overflow-y: auto;
  }
  body.phase-2 .prompt-input { font-size: 13.5px; padding: 6px 0; }
  .prompt-input::placeholder { color: var(--grey-300); }
  .send-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: var(--grey-900); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .send-btn:hover { background: var(--grey-700); }
  .send-btn svg { width: 14px; height: 14px; }
  body.phase-2 .send-btn { width: 30px; height: 30px; }
  .prompt-footnote {
    font-size: 11px; color: var(--grey-600);
    text-align: left;
    margin-top: 8px;
    padding-left: 4px;
  }
  body.phase-2 .prompt-footnote { text-align: center; padding-left: 0; }

  /* ===== TriGrep left panel ===== */
  .trigrep-head {
    padding: 16px 24px 12px;
    border-bottom: 1px solid var(--grey-50);
    flex-shrink: 0;
  }
  .trigrep-search-row {
    display: flex; align-items: center; gap: 10px;
  }
  .trigrep-search-box {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    background: #fff;
    border: 1px solid var(--grey-200);
    border-radius: 8px;
    padding: 6px 10px 6px 12px;
    min-height: 40px;
  }
  .trigrep-search-box:focus-within {
    border-color: var(--neo-digital-blue-500);
    box-shadow: 0 0 0 3px rgba(47, 66, 255, 0.12);
  }
  .trigrep-search-icon { width: 16px; height: 16px; color: var(--grey-500); flex-shrink: 0; }
  .trigrep-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--grey-50);
    color: var(--grey-700);
    border: 1px solid var(--grey-100);
    border-radius: 6px;
    padding: 3px 4px 3px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    white-space: nowrap;
  }
  .trigrep-chip strong { color: var(--grey-500); font-weight: 500; margin-right: 1px; }
  .trigrep-chip-x {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: none; background: transparent;
    color: var(--grey-500); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .trigrep-chip-x:hover { background: var(--grey-200); color: var(--grey-900); }
  .trigrep-chip-x svg { width: 10px; height: 10px; }
  .trigrep-query {
    flex: 1; min-width: 80px;
    border: none; outline: none; background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--grey-900);
  }
  .btn-search {
    background: var(--neo-digital-blue-500);
    color: #fff; border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .btn-search:hover { background: #1f30e6; }
  .trigrep-meta-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
    font-size: 12px; color: var(--grey-600);
  }
  .trigrep-meta-row a {
    color: var(--grey-600); text-decoration: none; font-size: 12px;
  }
  .trigrep-meta-row a:hover { color: var(--neo-digital-blue-500); }
  .trigrep-summary { color: var(--grey-700); font-weight: 500; }
  .trigrep-summary .summary-count { color: var(--grey-900); font-weight: 600; }

  .trigrep-body {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  .trigrep-filters {
    width: 240px;
    flex-shrink: 0;
    border-right: 1px solid var(--grey-50);
    overflow-y: auto;
    padding: 16px 12px 24px;
  }
  .trigrep-filters::-webkit-scrollbar { width: 6px; }
  .trigrep-filters::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 3px; }
  .filters-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 8px 8px;
    font-size: 11px;
    color: var(--grey-500);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .filters-head .collapse-all {
    color: var(--neo-digital-blue-500); cursor: pointer;
    text-transform: none; letter-spacing: 0; font-weight: 500;
    font-size: 11.5px;
  }
  .filters-head .collapse-all:hover { text-decoration: underline; }
  .filter-group {
    margin-bottom: 16px;
    border-top: 1px solid var(--grey-50);
    padding-top: 12px;
  }
  .filter-group:first-of-type { border-top: none; padding-top: 4px; }
  .filter-group-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 13px; font-weight: 600; color: var(--grey-900);
  }
  .filter-group-head:hover { background: var(--grey-25); }
  .filter-group-head svg { width: 12px; height: 12px; color: var(--grey-500); transition: transform 0.2s ease; }
  .filter-group.collapsed .filter-group-head svg { transform: rotate(-90deg); }
  .filter-group.collapsed .filter-group-body { display: none; }
  .filter-group-body { padding: 4px 0 2px; }
  .topic-search {
    width: calc(100% - 16px);
    margin: 6px 8px 8px;
    padding: 6px 10px;
    border: 1px solid var(--grey-100);
    border-radius: 6px;
    font-family: inherit; font-size: 12px;
    color: var(--grey-700);
    background: var(--grey-25);
    outline: none;
  }
  .topic-search:focus { border-color: var(--neo-digital-blue-300); background: #fff; }
  .filter-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--grey-700);
    font-family: 'JetBrains Mono', monospace;
  }
  .filter-item:hover { background: var(--grey-25); color: var(--grey-900); }
  .filter-item .count { color: var(--grey-500); font-size: 11.5px; }
  .filter-item.active {
    background: rgba(47, 66, 255, 0.08);
    color: var(--neo-digital-blue-500);
    font-weight: 600;
  }
  .filter-item.active .count { color: var(--neo-digital-blue-500); }
  .filter-item .lang-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    display: inline-block;
    box-shadow: none;
  }
  .filter-item-name { display: inline-flex; align-items: center; }

  .trigrep-results {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px 32px;
    background: var(--grey-25);
  }
  .trigrep-results::-webkit-scrollbar { width: 8px; }
  .trigrep-results::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 4px; }

  .result-card {
    background: #fff;
    border: 1px solid var(--grey-100);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.03);
  }
  .result-card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--grey-50);
    background: #fff;
  }
  .result-card-file {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--grey-900);
    font-weight: 500;
  }
  .result-card-file .file-dot {
    width: 8px; height: 8px;
    background: var(--java-dot);
    border-radius: 50%;
  }
  .result-card-file .file-module {
    color: var(--grey-500); font-weight: 400;
    font-family: inherit;
    font-size: 12.5px;
    margin-left: 4px;
  }
  .result-card-actions { display: inline-flex; align-items: center; gap: 4px; }

    font-size: 11.5px; color: var(--grey-500); margin-right: 6px;

  .icon-btn {

  .hunk-label {
    display: flex; align-items: center; justify-content: space-between;

  .code-body {

    padding: 6px 0;

    align-items: center;
    min-height: 22px;

  .code-line.simple { grid-template-columns: 56px 1fr; }
  .code-ln {
    color: var(--grey-300); text-align: right;

  }
  .code-marker {
    text-align: center; color: var(--grey-300);
    user-select: none; font-weight: 600;
  }
  .code-text { padding: 0 14px 0 6px; white-space: pre; }
  .code-line.simple .code-text { padding-left: 14px; }
  .code-line.removed { background: #ffeef0; }
  .code-line.removed .code-marker { color: #cf222e; }
  .code-line.added { background: #e6ffec; }
  .code-line.added .code-marker { color: #1a7f37; }
  .match {
    background: var(--highlight-bg); color: var(--highlight-text);
    padding: 0 2px; border-radius: 2px;
  }
  .code-line.removed .match { background: #ffdce0; color: #82071e; }
  .code-line.added .match { background: #aceebb; color: #0f5132; }

  /* File detail drill-down */
  .trigrep-body { transition: opacity 100ms ease; }
  .trigrep-body.detail-mode > .trigrep-filters,
  .trigrep-body.detail-mode > .trigrep-results { display: none; }
  .trigrep-detail {

    overflow: hidden;
    background: #fff;

  .result-card-file.is-clickable { cursor: pointer; }

  .detail-breadcrumb {
    display: flex; align-items: center; gap: 8px;

  }

    display: flex; align-items: center; justify-content: space-between;

  }
  .detail-file-path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;

  .detail-module {

    margin-top: 4px;
  }
  .detail-code {
    flex: 1;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.7;
    background: #fff;

  .detail-code::-webkit-scrollbar { width: 8px; }

  .detail-code .code-line {
    display: grid;
    grid-template-columns: 56px 1fr;
    align-items: center;
    min-height: 22px;

  .detail-code .code-line.has-match { background: #fffbeb; }
  .detail-code .code-ln {

  .detail-code .match {
    background: var(--highlight-bg); color: var(--highlight-text);

  /* TriGrep empty state — shown when a new chat is started inside the split view */
  .trigrep-empty {

</style>

<script>
// ===================================================================
// Greeter logo — Moddy spinner Lottie (autoplay once, rest on final frame)

(function initGreeterSpinner() {
  const container = document.getElementById('greeter-spinner');
  if (!container || typeof lottie === 'undefined') return;
  lottie.loadAnimation({
    container,
    renderer: 'svg',
    loop: false,
    autoplay: true,
    path: 'assets/moddy-spinner/moddy-spinner.json',
  });
})();

// ===================================================================
// Left nav data
// ===================================================================
// Nav items mirror day-zero v2-sandbox order (Moddy active for this prototype).
const NAV_ITEMS = [
  { id: 'moddy',       label: 'Moddy',       badge: 'Beta', active: true,
    svg: '<path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M19 13l.75 2.25L22 16l-2.25.75L19 19l-.75-2.25L16 16l2.25-.75L19 13z"/>' },
  { id: 'devcenter',   label: 'DevCenter',
    svg: '<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>' },
  { id: 'marketplace', label: 'Marketplace',
    svg: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>' },
  { id: 'builder',     label: 'Builder',
    svg: '<rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/><rect x="2" y="14" width="8" height="8" rx="1"/><rect x="14" y="14" width="8" height="8" rx="1"/>' },
  { id: 'activity',    label: 'Activity',
    svg: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>' },
  { id: 'changelog',   label: 'Changelog',   badge: 'Beta',
    svg: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>' },
];

// Overflow items shown inside the More popover at the bottom of the rail.
const MORE_ITEMS = [
  { id: 'repos',  label: 'Repositories',
    svg: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="2"/><path d="M14 13h3"/><path d="M7 13h3"/>' },
  { id: 'deploy', label: 'Deploy',
    svg: '<path d="M16.5 9.4l-9-5.19"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>' },
];

function renderNavItem(item) {
  const el = document.createElement('div');
  el.className = 'nav-item' + (item.active ? ' active' : '');
  el.innerHTML = `
    <div class="nav-icon-container">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${item.svg}</svg>
    </div>
    <span class="nav-label">${item.label}</span>
    ${item.badge ? `<span class="nav-badge">${item.badge}</span>` : ''}
  `;
  return el;
}

const navList = document.getElementById('left-nav-items');
NAV_ITEMS.forEach(item => navList.appendChild(renderNavItem(item)));

const morePopover = document.getElementById('nav-more-popover');
MORE_ITEMS.forEach(item => morePopover.appendChild(renderNavItem(item)));

const moreTrigger = document.getElementById('nav-more-trigger');
moreTrigger.addEventListener('click', () => {
  const isOpen = !morePopover.hasAttribute('hidden');
  if (isOpen) {
    morePopover.setAttribute('hidden', '');
    moreTrigger.classList.remove('active');
  } else {
    morePopover.removeAttribute('hidden');
    moreTrigger.classList.add('active');
  }
});

// ===================================================================
// DOM refs
// ===================================================================
const greeter = document.getElementById('greeter');
const conversation = document.getElementById('conversation');
const promptInput = document.getElementById('prompt-input');
const sendBtn = document.getElementById('send-btn');
const moddyPanel = document.getElementById('moddy-panel');
const trigrepPanel = document.getElementById('trigrep-panel');
const divider = document.getElementById('divider');
const dividerToggle = document.getElementById('divider-toggle');
const moddyReopen = document.getElementById('moddy-reopen');

// ===================================================================
// Suggestion tile click → only the primed tile advances the demo.
// Other tiles are hoverable but inert (per interview spec).
// ===================================================================
document.querySelectorAll('.suggestion.is-primed').forEach(btn => {
  btn.addEventListener('click', () => startFlow(btn.dataset.q));
});

// Send button / Enter in input → in Phase 1: also kick off the canned flow; in Phase 2: append user msg
sendBtn.addEventListener('click', handleSend);
promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
function handleSend() {
  const text = promptInput.value.trim();
  if (!text) return;
  promptInput.value = '';
  if (!flowStarted) {
    startFlow(text);
  } else {
    // Append user message; Phase 2 only — Moddy doesn't respond (prototype)
    appendUserMessage(text);
    conversation.scrollTop = conversation.scrollHeight;
  }
}

// ===================================================================
// Phase 1: streaming chat flow
// ===================================================================
let flowStarted = false;

function startFlow(userText) {
  if (flowStarted) return;
  flowStarted = true;
  greeter.classList.add('hidden');
  conversation.classList.remove('hidden');

  // Step 2: user message
  appendUserMessage(userText);

  // If we're already in the split view (e.g. user hit "+ new chat" and is
  // running a fresh search), populate the TriGrep left panel in sync with
  // the streaming chat so both panels reflect the same search session.
  if (document.body.classList.contains('phase-2') && !phase2Built) {
    trigrepPanel.innerHTML = buildTrigrepPanel();
    trigrepPanel.setAttribute('aria-hidden', 'false');
    phase2Built = true;
    wireTrigrepInteractions();
  }

  // Build the Moddy response container
  const moddy = document.createElement('div');
  moddy.className = 'msg-moddy';
  conversation.appendChild(moddy);

  // Staggered streaming, 200ms between each. Derived query appears just before
  // the action buttons (between "Showing 4 of 42…" and the actions).
  let t = 200;
  setTimeout(() => { moddy.appendChild(buildScopeLine()); scrollChat(); }, t);
  t += 200;
  setTimeout(() => { moddy.appendChild(buildModulesRow()); scrollChat(); }, t);
  t += 200;
  setTimeout(() => { moddy.appendChild(buildResultsBlock()); scrollChat(); }, t);
  t += 200;
  setTimeout(() => { moddy.appendChild(buildDerivedQuery()); scrollChat(); }, t);
  t += 200;
  setTimeout(() => { moddy.appendChild(buildActionButtons()); scrollChat(); }, t);
}

function appendUserMessage(text) {
  const el = document.createElement('div');
  el.className = 'msg-user fade-in';
  el.innerHTML = `<div class="avatar">A</div><div class="msg-user-text"></div>`;
  el.querySelector('.msg-user-text').textContent = text;
  conversation.appendChild(el);
}

function scrollChat() { conversation.scrollTop = conversation.scrollHeight; }

// ===================================================================
// Component builders
// ===================================================================
function buildDerivedQuery() {
  const wrap = document.createElement('div');
  wrap.className = 'derived-query fade-in';
  wrap.innerHTML = `
    <div class="derived-query-head">
      <span class="derived-query-head-title">Searched for · Trigrep</span>
      <button class="derived-query-copy" title="Copy command" aria-label="Copy command">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    <div class="derived-query-cmd"><span class="cd">$ </span><span class="cb">mod search</span> working-set <span class="cs">'org.apache.log4j'</span> <span class="cb">--syntax</span> sourcegraph</div>
  `;
  wrap.querySelector('.derived-query-copy').addEventListener('click', (e) => copyDerived(e.currentTarget));
  return wrap;
}

function copyDerived(btn) {
  try { navigator.clipboard.writeText(SEARCH_CMD); } catch (e) {}
  const original = btn.innerHTML;
  btn.classList.add('copied');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.innerHTML = original;
  }, 1500);
}

function buildScopeLine() {
  const el = document.createElement('div');
  el.className = 'scope-line fade-in';
  el.textContent = SCOPE_LINE;
  return el;
}

function buildModulesRow() {
  const el = document.createElement('div');
  el.className = 'modules-row fade-in';
  const chips = MODULES.map(m => `<button class="module-chip">${m.name}<span class="count">${m.count}</span></button>`).join('');
  el.innerHTML = `<span class="modules-label">12 modules affected</span> ${chips} <button class="modules-more">and ${MODULES_MORE} more…</button>`;
  return el;
}

function buildResultsBlock() {
  const wrap = document.createElement('div');
  wrap.className = 'results fade-in';
  FILE_CARDS.forEach(card => wrap.appendChild(buildFileCard(card)));
  // Overflow row
  const overflow = document.createElement('div');
  overflow.className = 'overflow-row';
  overflow.innerHTML = `<span>Showing <strong>4 of ${TOTAL_FILES}</strong> files (${TOTAL_MATCHES} matches)</span><button class="more-link" id="show-more-btn">Show more results</button>`;
  wrap.appendChild(overflow);
  overflow.querySelector('.more-link').addEventListener('click', enterPhase2);
  return wrap;
}

function buildFileCard(card) {
  const el = document.createElement('div');
  el.className = 'file-group fade-in';
  const linesHtml = card.lines.map(l =>
    `<div class="match-line"><span class="lineno">${l.n}</span><span class="code">${l.code.replace(/<m>/g, '<mark>').replace(/<\/m>/g, '</mark>')}</span></div>`
  ).join('');
  el.innerHTML = `
    <div class="file-header">
      <span class="lang-dot"></span>
      <span class="file-path">${card.file}</span>
      <span class="file-module">— ${card.module}</span>
      <span class="file-count">${card.count} matches</span>
      <svg class="file-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="file-body">${linesHtml}</div>
  `;
  el.querySelector('.file-header').addEventListener('click', () => el.classList.toggle('collapsed'));
  return el;
}

function buildActionButtons() {
  const wrap = document.createElement('div');
  wrap.className = 'followup-actions fade-in';
  wrap.innerHTML = `

// ===================================================================
// Phase 2: transition + TriGrep panel build
// ===================================================================
let phase2Built = false;

function enterPhase2() {
  if (phase2Built) {
    // Re-entry after "Back to chat" — just shift layout, conversation is preserved.
    document.body.classList.add('phase-2');
    promptInput.placeholder = 'Ask about these results or run a recipe';
    setTimeout(() => { conversation.scrollTop = conversation.scrollHeight; }, 320);
    return;
  }
  phase2Built = true;

  // Build TriGrep left panel content
  trigrepPanel.innerHTML = buildTrigrepPanel();
  trigrepPanel.setAttribute('aria-hidden', 'false');

  // Update input placeholder for Phase 2 context
  promptInput.placeholder = 'Ask about these results or run a recipe';

  // Trigger the layout shift
  document.body.classList.add('phase-2');

  // After transition, scroll chat to bottom
  setTimeout(() => {
    conversation.scrollTop = conversation.scrollHeight;
    wireTrigrepInteractions();
  }, 320);
}

// "Refine search" → coordinated update of chat (always) + TriGrep search pane
// (when present). In Phase 1 only the chat updates; in Phase 2 both panes sync.
let refinementApplied = false;
function refineSearch() {
  if (refinementApplied) return;
  refinementApplied = true;

  // 1. Conversation: user msg + Moddy response with new derived query + scope + brief text.
  appendUserMessage('Narrow to actual Logger calls (skip imports)');

  const moddy = document.createElement('div');
  moddy.className = 'msg-moddy fade-in';

  const dq = document.createElement('div');
  dq.className = 'derived-query';
  dq.innerHTML = `
    <div class="derived-query-head">
      <span class="derived-query-head-title">Searched for · Trigrep</span>
      <button class="derived-query-copy" title="Copy command" aria-label="Copy command">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    <div class="derived-query-cmd"><span class="cd">$ </span><span class="cb">mod search</span> working-set <span class="cs">'Logger\\.\\w+\\('</span> <span class="cb">--type</span> call-site <span class="cb">--syntax</span> sourcegraph</div>
  `;
  dq.querySelector('.derived-query-copy').addEventListener('click', (e) => copyDerived(e.currentTarget));
  moddy.appendChild(dq);

  const scope = document.createElement('div');
  scope.className = 'scope-line';
  scope.textContent = '73 matches across 31 files in 89ms · 847 repositories searched';
  moddy.appendChild(scope);

  const text = document.createElement('div');
  text.className = 'moddy-text';
  text.innerHTML = `Filtered to actual <code>Logger</code> call sites (excluding import statements). These are the lines the recipe will rewrite — imports get cleaned up automatically.`;
  moddy.appendChild(text);

  conversation.appendChild(moddy);
  conversation.scrollTop = conversation.scrollHeight;

  // 2. TriGrep panel: add a chip, update summary count.
  const searchBox = trigrepPanel.querySelector('.trigrep-search-box');
  if (searchBox) {
    const chip = document.createElement('span');
    chip.className = 'trigrep-chip';
    chip.dataset.chip = 'type';
    chip.innerHTML = `<strong>type:</strong>call-site<button class="trigrep-chip-x" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>`;
    const queryInput = searchBox.querySelector('.trigrep-query');
    searchBox.insertBefore(chip, queryInput);
    chip.querySelector('.trigrep-chip-x').addEventListener('click', (e) => {
      e.stopPropagation();
      chip.remove();
    });
  }
  const summaryCount = trigrepPanel.querySelector('#summary-count');
  const summaryFiles = trigrepPanel.querySelector('#summary-files');
  if (summaryCount) summaryCount.textContent = '73';
  if (summaryFiles) summaryFiles.textContent = '31';

  // 3. Visually retire the "Refine search" buttons so the user can't stack refinements.
  document.querySelectorAll('.followup.tertiary').forEach(b => {
    b.disabled = true;
    b.style.opacity = '0.5';
    b.style.cursor = 'default';
  });
}

// ===================================================================
// Phase 2 interactions
// ===================================================================
function wireTrigrepInteractions() {
  // Filter group collapse
  trigrepPanel.querySelectorAll('.filter-group-head').forEach(head => {
    head.addEventListener('click', () => head.parentElement.classList.toggle('collapsed'));
  });
  const collapseAll = trigrepPanel.querySelector('#collapse-all');
  collapseAll.addEventListener('click', () => {
    const groups = trigrepPanel.querySelectorAll('.filter-group');
    const anyOpen = [...groups].some(g => !g.classList.contains('collapsed'));
    groups.forEach(g => g.classList.toggle('collapsed', anyOpen));
    collapseAll.textContent = anyOpen ? 'Expand all' : 'Collapse all';
  });

  // Filter item toggle + summary update
  const BASE_MATCHES = 187, BASE_FILES = 42;
  const activeFilters = new Map();
  const summaryCount = trigrepPanel.querySelector('#summary-count');
  const summaryFiles = trigrepPanel.querySelector('#summary-files');
  trigrepPanel.querySelectorAll('.filter-item').forEach(item => {
    item.addEventListener('click', () => {
      const key = item.querySelector('.filter-item-name').textContent.trim();
      const count = parseInt(item.dataset.count, 10) || 0;
      if (activeFilters.has(key)) activeFilters.delete(key);
      else activeFilters.set(key, count);
      item.classList.toggle('active');
      if (activeFilters.size === 0) {
        summaryCount.textContent = BASE_MATCHES;
        summaryFiles.textContent = BASE_FILES;
      } else {
        const total = [...activeFilters.values()].reduce((a, b) => a + b, 0);
        summaryCount.textContent = total;
        summaryFiles.textContent = Math.max(1, Math.ceil(total / 4.5));
      }
    });
  });

  // Chip removal
  trigrepPanel.querySelectorAll('.trigrep-chip-x').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      btn.closest('.trigrep-chip').remove();
    });
  });

  // Topic search filter
  const topicSearch = trigrepPanel.querySelector('#topic-search');
  if (topicSearch) {
    topicSearch.addEventListener('input', () => {
      const q = topicSearch.value.toLowerCase().trim();
      const group = topicSearch.closest('.filter-group-body');
      group.querySelectorAll('.filter-item').forEach(item => {
        const name = item.querySelector('.filter-item-name').textContent.toLowerCase();
        item.style.display = (q === '' || name.includes(q)) ? '' : 'none';
      });
    });
  }

  // Result card collapse
  trigrepPanel.querySelectorAll('.chevron-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.result-card').classList.toggle('collapsed'));
  });

  // File path drill-down. Every card opens its own full-file detail view.
  trigrepPanel.querySelectorAll('.result-card-file').forEach(el => {
    const key = fileKeyFromCardEl(el);
    if (key && FILE_DETAILS[key]) {
      el.classList.add('is-clickable');
      el.addEventListener('click', () => showFileDetail(FILE_DETAILS[key]));
    }
  });
}

function showFileDetail(file) {
  const body = trigrepPanel.querySelector('.trigrep-body');
  if (!body) return;
  let detail = body.querySelector('.trigrep-detail');
  if (!detail) {
    detail = document.createElement('div');
    detail.className = 'trigrep-detail';
    body.appendChild(detail);
  }
  detail.innerHTML = buildFileDetailHTML(file);
  detail.querySelector('.detail-back').addEventListener('click', showResultsList);

  body.style.opacity = '0';
  setTimeout(() => {
    body.classList.add('detail-mode');
    body.style.opacity = '1';
  }, 100);
}

function showResultsList() {
  const body = trigrepPanel.querySelector('.trigrep-body');
  if (!body) return;
  body.style.opacity = '0';
  setTimeout(() => {
    body.classList.remove('detail-mode');
    body.style.opacity = '1';
  }, 100);
}

function buildFileDetailHTML(file) {
  const linesHtml = file.lines.map(l => {
    const code = (l.code || ' ').replace(/<m>/g, '<span class="match">').replace(/<\/m>/g, '</span>');
    return `<div class="code-line ${l.hasMatch ? 'has-match' : ''}"><span class="code-ln">${l.n}</span><span class="code-text">${code}</span></div>`;
  }).join('');
  return `
    <div class="detail-breadcrumb">
      <button class="detail-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Search results
      </button>
      <span class="detail-crumb-sep">/</span>
      <span class="detail-crumb-current">${file.name}</span>
    </div>
    <div class="detail-search-row">
      <label class="detail-search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search in file…" spellcheck="false">
        <span class="kbd-hint">⌘F</span>
      </label>
    </div>
    <div class="detail-header">
      <div class="detail-header-row">
        <div class="detail-file-path"><span class="file-dot"></span>${file.path}</div>
        <span class="result-card-meta">${file.matchCount} matches</span>
      </div>
      <div class="detail-module">${file.module}</div>
    </div>
    <div class="detail-code">${linesHtml}</div>
  `;
}

// ===================================================================
// Divider drag + collapse toggle (Phase 2 only)
// ===================================================================
let dragging = false, dragStartX = 0, startModdyWidth = 0;
divider.addEventListener('mousedown', (e) => {
  if (!document.body.classList.contains('phase-2')) return;
  if (e.target.closest('.divider-toggle')) return;
  if (moddyPanel.classList.contains('collapsed')) return;
  dragging = true;
  dragStartX = e.clientX;
  startModdyWidth = moddyPanel.getBoundingClientRect().width;
  divider.classList.add('dragging');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'col-resize';
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX;
  const newWidth = startModdyWidth - dx;
  const pageWidth = document.getElementById('page').getBoundingClientRect().width;
  const min = Math.max(320, pageWidth * 0.25);
  const max = pageWidth * 0.5;
  const clamped = Math.min(Math.max(newWidth, min), max);
  moddyPanel.style.transition = 'none';
  moddyPanel.style.flex = `0 0 ${clamped}px`;
});
window.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  divider.classList.remove('dragging');
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
  setTimeout(() => { moddyPanel.style.transition = ''; }, 50);
});

function setModdyCollapsed(collapsed) {
  if (collapsed) {
    moddyPanel.dataset.lastFlex = moddyPanel.style.flex || '';
    moddyPanel.style.flex = '';
    moddyPanel.classList.add('collapsed');
    moddyReopen.classList.add('visible');
    dividerToggle.title = 'Open Moddy';
    dividerToggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
  } else {
    moddyPanel.classList.remove('collapsed');
    if (moddyPanel.dataset.lastFlex) moddyPanel.style.flex = moddyPanel.dataset.lastFlex;
    moddyReopen.classList.remove('visible');
    dividerToggle.title = 'Collapse Moddy';
    dividerToggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  }
}
dividerToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  setModdyCollapsed(!moddyPanel.classList.contains('collapsed'));
});
moddyReopen.addEventListener('click', () => setModdyCollapsed(false));

// ===================================================================
// New chat (only available in split view) — keeps the layout, clears
// both panels so the user can start a fresh search session.
// ===================================================================
function newChatInSplit() {
  flowStarted = false;
  phase2Built = false;  // allow a future "Open in TriGrep" to rebuild
  refinementApplied = false;
  conversation.innerHTML = '';
  conversation.classList.add('hidden');
  greeter.classList.remove('hidden');
  trigrepPanel.innerHTML = buildTrigrepEmpty();
  promptInput.placeholder = 'Ask Moddy to search, refine, or run a recipe';
}

function buildTrigrepEmpty() {
  return `
    <div class="trigrep-empty">
      <span class="trigrep-empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <div class="trigrep-empty-title">No active search</div>
      <div class="trigrep-empty-desc">Ask Moddy a question to see search results here.</div>
    </div>
  `;
}

document.getElementById('new-chat-btn').addEventListener('click', newChatInSplit);
