function App() {
  const [showWelcome, setShowWelcome] = useState(true);
  const [runTour, setRunTour] = useState(false);
  const [stepIndex, setStepIndex] = useState(0);
  const [currentView, setCurrentView] = useState('marketplace');
  const [orgSelected, setOrgSelected] = useState(false);
  const [orgName, setOrgName] = useState('');
  const [showOrgDropdown, setShowOrgDropdown] = useState(false);
  const [showSearchDropdown, setShowSearchDropdown] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  const [showDebug, setShowDebug] = useState(false);
  const [spotlightRect, setSpotlightRect] = useState(null);

  useEffect(() => {
    if (!runTour) {
      setSpotlightRect(null);
      return;
    }
    const step = tourSteps[stepIndex];
    if (!step || step.disableOverlay || step.placement === 'center') {
      setSpotlightRect(null);
      return;
    }
    let raf;
    const commitRect = () => {
      const target = document.querySelector(step.target);
      if (!target) return;
      const rect = target.getBoundingClientRect();
      setSpotlightRect({
        top: rect.top,
        left: rect.left,
        width: rect.width,
        height: rect.height,
      });
    };
    // Walk up looking for an ancestor with actual scroll space.
    const findScrollableParent = (el) => {
      let p = el.parentElement;
      while (p && p !== document.body) {
        const style = getComputedStyle(p);
        const oy = style.overflowY;
        if ((oy === 'auto' || oy === 'scroll' || oy === 'hidden') &&
            p.scrollHeight > p.clientHeight) {
          return p;
        }
        p = p.parentElement;
      }
      return null;
    };
    const ensureVisible = (target) => {
      const bottomReserve = 60;
      const rect = target.getBoundingClientRect();
      const overflowBottom = rect.bottom - (window.innerHeight - bottomReserve);
      const overflowTop = -rect.top;
      if (overflowBottom <= 0 && overflowTop <= 0) return;
      const scrollable = findScrollableParent(target);
      if (!scrollable) return;
      const delta = overflowBottom > 0 ? overflowBottom + 80 : -overflowTop - 80;
      scrollable.scrollTop = Math.max(
        0,
        Math.min(scrollable.scrollTop + delta, scrollable.scrollHeight - scrollable.clientHeight)
      );
    };
    const updateRect = () => {
      const target = document.querySelector(step.target);
      if (!target) return;
      ensureVisible(target);
      commitRect();
    };
    // Initial pass + several frames so the spotlight stays glued as layout settles.
    updateRect();
    let frames = 0;
    const tick = () => {
      const target = document.querySelector(step.target);
      if (target) ensureVisible(target);
      commitRect();
      frames += 1;
      if (frames < 30) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    const handler = () => commitRect();
    window.addEventListener('scroll', handler, true);
    window.addEventListener('resize', handler);
    return () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('scroll', handler, true);
      window.removeEventListener('resize', handler);
    };
  }, [runTour, stepIndex, currentView]);

  const activeSidebar = runTour ? (stepToSidebar[stepIndex] || 'marketplace') : (orgSelected ? 'marketplace' : 'marketplace');

  const handleStartTour = useCallback(() => {
    setShowWelcome(false);
    setCurrentView('marketplace');
    setOrgSelected(false);
    setOrgName('');
    setShowOrgDropdown(false);
    setShowSearchDropdown(false);
    setSearchQuery('');
    setStepIndex(0);
    setTimeout(() => setRunTour(true), 100);
  }, []);

  const handleDismissWelcome = useCallback(() => {
    setShowWelcome(false);
  }, []);

  const advanceTour = useCallback(() => {
    setStepIndex((prev) => {
      const nextIndex = prev + 1;
      if (nextIndex >= tourSteps.length) {
        setRunTour(false);
        return prev;
      }
      const nextView = stepToView[nextIndex];
      if (nextView) {
        setCurrentView(nextView);
      }
      if (nextIndex >= 2) {
        setOrgSelected(true);
      }
      return nextIndex;
    });
  }, []);

  // Navigate to an arbitrary step, restoring the UI state the user saw there.
  // Used by the Back button so returning to a step re-opens the dropdown/panel
  // its spotlight targets, instead of landing on a blank screen.
  const goToStep = useCallback((idx) => {
    // Panels
    setShowOrgDropdown(idx === 1);
    setShowSearchDropdown(idx === 3 || idx === 4);
    // Search query the user had typed by that step
    setSearchQuery(idx >= 4 ? 'common static' : '');
    // Org is chosen from step 2 onward
    setOrgSelected(idx >= 2);
    // Underlying page view
    const view = stepToView[idx];
    if (view) setCurrentView(view);
    setStepIndex(idx);
  }, []);

  const handleJoyrideCallback = useCallback((data) => {
    const { action, index, status, type } = data;

    if (status === 'finished') {
      setRunTour(false);
      return;
    }

    if (status === 'skipped') {
      // If on last step, restart the tour
      if (index === tourSteps.length - 1) {
        setRunTour(false);
        setCurrentView('marketplace');
        setOrgSelected(false);
        setOrgName('');
        setShowOrgDropdown(false);
        setShowSearchDropdown(false);
        setSearchQuery('');
        setStepIndex(0);
        setTimeout(() => setRunTour(true), 100);
      } else {
        setRunTour(false);
        setCurrentView('marketplace');
        setOrgSelected(true);
        setOrgName((prev) => prev || 'Default');
        setShowOrgDropdown(false);
        setShowSearchDropdown(false);
      }
      return;
    }

    // Back button: works from any step (including requiresAction steps),
    // restoring the UI state the user saw at the target step.
    if (type === 'step:after' && action === 'prev') {
      const prevIndex = index - 1;
      if (prevIndex >= 0) goToStep(prevIndex);
      return;
    }

    // Only advance on "Next" button clicks for non-action steps
    if (type === 'step:after') {
      const step = tourSteps[index];
      if (step?.data?.requiresAction) return; // handled by click handlers
      const nextIndex = index + (action === 'prev' ? -1 : 1);
      if (nextIndex >= tourSteps.length) {
        setRunTour(false);
        return;
      }
      if (nextIndex >= 0 && nextIndex < tourSteps.length) {
        const nextView = stepToView[nextIndex];
        if (nextView) {
          setCurrentView(nextView);
        }
        if (nextIndex >= 2) {
          setOrgSelected(true);
        }
        setStepIndex(nextIndex);
      }
    }
  }, []);

  const handleOrgClick = useCallback(() => {
    if (runTour && stepIndex === 0) {
      setShowOrgDropdown(true);
      // Advance to step 1 after dropdown renders
      setTimeout(() => advanceTour(), 100);
      return;
    }
    if (!runTour) {
      setShowOrgDropdown((prev) => !prev);
    }
  }, [runTour, stepIndex, advanceTour]);

  const handleOrgSelect = useCallback((name) => {
    setOrgName(name);
    setOrgSelected(true);
    setShowOrgDropdown(false);
    if (runTour && stepIndex === 1) {
      advanceTour();
    }
  }, [runTour, stepIndex, advanceTour]);

  const handleOrgClose = useCallback(() => {
    setShowOrgDropdown(false);
  }, []);

  const handleSearchClose = useCallback(() => {
    setShowSearchDropdown(false);
    setSearchQuery('');
  }, []);

  const handleSearchClick = useCallback(() => {
    if (runTour && stepIndex === 2) {
      setShowSearchDropdown(true);
      setTimeout(() => advanceTour(), 100);
    }
  }, [runTour, stepIndex, advanceTour]);

  const handleSearchQueryChange = useCallback((value) => {
    setSearchQuery(value);
  }, []);

  // Advance from step 3 → 4 once results are visible
  useEffect(() => {
    if (runTour && stepIndex === 3 && searchQuery.length >= 3) {
      const timer = setTimeout(() => advanceTour(), 400);
      return () => clearTimeout(timer);
    }
  }, [runTour, stepIndex, searchQuery, advanceTour]);

  const handleSearchResultClick = useCallback(() => {
    if (runTour && stepIndex === 4) {
      setShowSearchDropdown(false);
      advanceTour();
    }
  }, [runTour, stepIndex, advanceTour]);

  const handleDryRunClick = useCallback(() => {
    if (runTour && stepIndex === 7) {
      advanceTour();
    }
  }, [runTour, stepIndex, advanceTour]);

  const handleActivityRowClick = useCallback(() => {
    if (runTour && stepIndex === 6) {
      advanceTour();
    }
  }, [runTour, stepIndex, advanceTour]);

  const handleWhyClick = useCallback(() => {
    if (runTour && stepIndex === 7) {
      advanceTour();
    }
  }, [runTour, stepIndex, advanceTour]);

  const handleCommitClick = useCallback(() => {
    if (runTour && stepIndex === 99) {
      advanceTour();
    }
  }, [runTour, stepIndex, advanceTour]);

  const handleCancelCommit = useCallback(() => {
    setCurrentView('results-drawer');
  }, []);

  const handleCommitSubmit = useCallback(() => {
    if (runTour && stepIndex === 99) {
      setCurrentView('commit-results');
      setStepIndex(9);
    }
  }, [runTour, stepIndex]);

  // Determine if the current view needs the content wrapper (white bg + rounded)
  const isResultsView = currentView === 'results' || currentView === 'results-commit' || currentView === 'results-drawer' || currentView === 'commit-results';

  let pageContent;
  switch (currentView) {
    case 'repos':
      pageContent = html`<${ReposPage} />`;
      break;
    case 'marketplace':
      pageContent = html`<${MarketplacePage} />`;
      break;
    case 'marketplace-search':
      pageContent = html`<${MarketplaceSearchPage} />`;
      break;
    case 'recipe':
      pageContent = html`<${RecipeDetailPage} onDryRunClick=${handleDryRunClick} />`;
      break;
    case 'activity':
      pageContent = html`<${ActivityPage} onActivityRowClick=${handleActivityRowClick} />`;
      break;
    case 'results-review':
      pageContent = html`<${ResultsPage} mode="review" onCommitClick=${handleCommitClick} onWhyClick=${handleWhyClick} onCancelCommit=${handleCancelCommit} onCommitSubmit=${handleCommitSubmit} />`;
      break;
    case 'results-drawer':
      pageContent = html`<${ResultsPage} mode="drawer" onCommitClick=${handleCommitClick} onWhyClick=${handleWhyClick} onCancelCommit=${handleCancelCommit} onCommitSubmit=${handleCommitSubmit} />`;
      break;
    case 'results-commit':
      pageContent = html`<${ResultsPage} mode="commit" onCommitClick=${handleCommitClick} onWhyClick=${handleWhyClick} onCancelCommit=${handleCancelCommit} onCommitSubmit=${handleCommitSubmit} />`;
      break;
    case 'commit-results':
      pageContent = html`<${CommitResultsPage} />`;
      break;
    default:
      pageContent = html`<${EmptyState} />`;
  }

  return html`
    <div className="app-shell">
      <${NeoSpotlight} rect=${spotlightRect} visible=${runTour} />
      <${LeftNavigation} activeItem=${activeSidebar} />
      <div className="main-area">
        <${GlobalNavBar}
          orgSelected=${orgSelected}
          orgName=${orgName}
          showOrgDropdown=${showOrgDropdown}
          onOrgClick=${handleOrgClick}
          onOrgSelect=${handleOrgSelect}
          onOrgClose=${handleOrgClose}
          onSearchClick=${handleSearchClick}
          onSearchClose=${handleSearchClose}
          showSearchDropdown=${showSearchDropdown}
          searchQuery=${searchQuery}
          onSearchQueryChange=${handleSearchQueryChange}
          onSearchResultClick=${handleSearchResultClick}
          onStartTour=${handleStartTour}
        />
        <div className="content-wrapper" style=${runTour ? { paddingBottom: '36px' } : {}}>
          ${pageContent}
        </div>
        ${runTour ? html`
          <div className="tour-progress">
            ${icons.info(12, 'var(--surface-primary-filled)')}
            <span>${stepIndex >= tourSteps.length - 1 ? 'Tour complete' : 'Step ' + getHighLevelStep(stepIndex).number + ' of ' + highLevelSteps.length + ': ' + getHighLevelStep(stepIndex).label}</span>
            <div className="progress-dots">
              ${Array.from({ length: highLevelSteps.length }, (_, i) => html`
                <div key=${i} className=${'progress-dot' + (stepIndex >= tourSteps.length - 1 || i + 1 < getHighLevelStep(stepIndex).number ? ' done' : '') + (stepIndex < tourSteps.length - 1 && i + 1 === getHighLevelStep(stepIndex).number ? ' current' : '')}></div>
              `)}
            </div>
            <button className="progress-dismiss" onClick=${() => { setRunTour(false); setCurrentView('marketplace'); setOrgSelected(true); setOrgName((prev) => prev || 'Default'); setShowOrgDropdown(false); setShowSearchDropdown(false); }}>Dismiss</button>
          </div>
        ` : null}
      </div>
      <${Joyride}
        steps=${tourSteps}
        run=${runTour}
        stepIndex=${stepIndex}
        continuous=${true}
        showSkipButton=${true}
        disableOverlay=${true}
        disableOverlayClose=${true}
        disableCloseOnEsc=${false}
        disableScrolling=${true}
        spotlightPadding=${8}
        callback=${handleJoyrideCallback}
        tooltipComponent=${CustomTooltip}
        styles=${{
          options: {
            arrowColor: '#FFFFFF',
            backgroundColor: '#FFFFFF',
            overlayColor: 'rgba(17, 24, 39, 0.55)',
            primaryColor: '#2F42FF',
            textColor: '#111827',
            spotlightShadow: '0 0 0 9999px rgba(17, 24, 39, 0.55)',
            zIndex: 10010,
          },
          spotlight: {
            display: 'none',
          },
        }}
      />
      ${showWelcome ? html`
        <div className="welcome-overlay">
          <div className="welcome-backdrop" onClick=${handleDismissWelcome}></div>
          <div className="welcome-card">
            <div className="welcome-icon" dangerouslySetInnerHTML=${{ __html: '<svg width="36" height="36" viewBox="0 0 47 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M46.2205 0.092002C45.777 -0.0920021 45.2677 0.00862519 44.9272 0.350758L24.4951 20.8816C23.1532 9.14558 13.2189 0 1.18742 0C0.872678 0 0.572248 0.126503 0.349071 0.350758C0.125895 0.575013 0 0.876894 0 1.19315V23.5899V45.9895C0 46.0097 0.00858372 46.0269 0.00858372 46.047C0.00858372 46.1045 0.0228899 46.1592 0.0343349 46.2167C0.0457799 46.277 0.0572248 46.3374 0.0772535 46.3949C0.082976 46.4122 0.082976 46.4294 0.0886985 46.4467C0.103005 46.4812 0.128756 46.507 0.145923 46.5415C0.174536 46.5962 0.203148 46.6508 0.240344 46.6997C0.274679 46.7457 0.311875 46.7859 0.351933 46.8262C0.39199 46.8664 0.432047 46.9067 0.480688 46.9412C0.52933 46.9786 0.580832 47.0073 0.635195 47.0361C0.66953 47.0533 0.695282 47.0792 0.729616 47.0936C0.743923 47.0993 0.758229 47.0964 0.772535 47.1022C0.901291 47.1511 1.03863 47.1856 1.18455 47.1856H45.7627C46.4179 47.1856 46.9501 46.6508 46.9501 45.9924V1.19315C46.9501 0.710141 46.6611 0.276006 46.2176 0.092002H46.2205ZM44.5781 4.07109V22.3968H26.3406L44.5781 4.07109ZM44.5781 33.5951H24.661V24.7802H44.5781V33.5951ZM2.37483 43.1087V24.7831H20.6124L11.4936 33.9459L2.37483 43.1087ZM2.37483 2.41793C13.0673 3.01594 21.6625 11.6526 22.2576 22.3968H2.37483V2.41793ZM13.1703 35.6335L22.2891 26.4707V44.7964H4.05152L13.1703 35.6335ZM24.6639 44.7964V35.9814H44.581V44.7964H24.6639Z" fill="#041834" stroke="#041834" stroke-width="1.4" stroke-linejoin="round"/></svg>' }}></div>
            <h2>Welcome to Moderne</h2>
            <p>Moderne runs automated code transformations across all your repositories at once. Let\u2019s get you to your first result in a few minutes.</p>
            <div className="welcome-buttons">
              <button className="wb-primary" onClick=${handleStartTour}>Show me how</button>
              <button className="wb-secondary" onClick=${handleDismissWelcome}>I\u2019ll explore on my own \u2014 restart from Help anytime</button>
            </div>
          </div>
        </div>
      ` : null}
      ${showDebug ? html`
        <div className="debug-panel">
          <div className="debug-panel-title">Views</div>
          <div className="debug-panel-section">
            ${['marketplace', 'recipe', 'results-review', 'results-drawer', 'results-commit', 'commit-results'].map(v => html`
              <button key=${v} className=${currentView === v ? 'debug-active' : ''} onClick=${() => { setCurrentView(v); setRunTour(false); setShowWelcome(false); setOrgSelected(true); setOrgName('Default'); setShowOrgDropdown(false); setShowSearchDropdown(false); }}>${v}</button>
            `)}
          </div>
          <div className="debug-panel-title" style=${{ marginTop: '4px' }}>Tour steps</div>
          <div className="debug-panel-section">
            ${tourSteps.map((s, i) => html`
              <button key=${i} className=${runTour && stepIndex === i ? 'debug-active' : ''} onClick=${() => { setShowWelcome(false); setOrgSelected(true); setOrgName('Default'); setShowOrgDropdown(false); setShowSearchDropdown(false); const v = stepToView[i]; if (v) setCurrentView(v); setStepIndex(i); setRunTour(true); }}>${i}: ${s.target.replace('.', '')}</button>
            `)}
          </div>
          <button style=${{ marginTop: '4px', background: '#442', borderColor: '#663' }} onClick=${() => setShowDebug(false)}>Close</button>
        </div>
      ` : html`
        <button className="debug-toggle" onClick=${() => setShowDebug(true)}>Debug</button>
      `}
    </div>
  `;
}

// ============================================================
// MOUNT
// ============================================================
const root = createRoot(document.getElementById('root'));
root.render(html`<${App} />`);
</script>

</body>
</html>
