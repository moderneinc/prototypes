<style>
/* ================================================
   NEO DESIGN SYSTEM — BRAND TOKENS (Tier 1)
   ================================================ */
:root {
  --brand-white: #FFFFFF;
  --brand-black: #000000;
  --brand-digital-blue-100: #F2F3FF;
  --brand-digital-blue-200: #DCE0FF;
  --brand-digital-blue-300: #B6BFFF;
  --brand-digital-blue-400: #8D99FF;
  --brand-digital-blue-500: #2F42FF;
  --brand-digital-blue-600: #2637E6;
  --brand-digital-blue-700: #1E2EC2;
  --brand-digital-blue-800: #131E7A;
  --brand-digital-blue-900: #000855;
  --brand-green-100: #F3FFF5;
  --brand-green-200: #CFFFD7;
  --brand-green-500: #72E184;
  --brand-green-600: #5EC46F;
  --brand-green-700: #4CA75A;
  --brand-green-800: #3B8948;
  --brand-red-100: #FEF2F2;
  --brand-red-400: #FCA5A5;
  --brand-red-500: #F87171;
  --brand-red-600: #CB3446;
  --brand-red-700: #A92232;
  --brand-red-800: #871421;
  --brand-orange-100: #FFF8E5;
  --brand-orange-600: #FFB800;
  --brand-orange-700: #D69B00;
  --brand-orange-800: #856000;
  --brand-grey-100: #F9FAFB;
  --brand-grey-200: #F3F4F6;
  --brand-grey-300: #E5E7EB;
  --brand-grey-400: #D1D5DB;
  --brand-grey-500: #9CA3AF;
  --brand-grey-600: #6B7280;
  --brand-grey-700: #4B5563;
  --brand-grey-800: #374151;
  --brand-grey-900: #1F2937;
  --brand-grey-1000: #111827;
  --brand-violet-500: #AD59C7;
  --brand-violet-600: #992FB9;
  --brand-teal-600: #3BCCA6;
  --brand-font-family-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --brand-font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  --brand-font-weight-regular: 400;
  --brand-font-weight-medium: 500;
  --brand-font-weight-semibold: 600;
  --brand-font-weight-bold: 700;
  --brand-font-size-100: 10px;
  --brand-font-size-200: 12px;
  --brand-font-size-300: 14px;
  --brand-font-size-400: 16px;
  --brand-font-size-500: 18px;
  --brand-font-size-600: 20px;
  --brand-font-size-700: 24px;
  --brand-font-size-800: 28px;
  --brand-spacing-0: 0;
  --brand-spacing-100: 4px;
  --brand-spacing-200: 8px;
  --brand-spacing-300: 12px;
  --brand-spacing-400: 16px;
  --brand-spacing-500: 20px;
  --brand-spacing-600: 24px;
  --brand-spacing-800: 32px;
  --brand-spacing-1000: 40px;
  --brand-radius-0: 0;
  --brand-radius-100: 4px;
  --brand-radius-200: 6px;
  --brand-radius-300: 8px;
  --brand-radius-400: 12px;
  --brand-radius-500: 16px;
  --brand-radius-full: 9999px;
  --brand-shadow-100: 0 1px 3px rgba(31, 41, 55, 0.1);
  --brand-shadow-200: 0 2px 4px rgba(31, 41, 55, 0.1);
  --brand-shadow-300: 0 8px 15px rgba(31, 41, 55, 0.1);
  --brand-shadow-400: 0 4px 4px rgba(31, 41, 55, 0.1), 0 8px 24px rgba(31, 41, 55, 0.1);
  --brand-shadow-500: 0 8px 15px rgba(31, 41, 55, 0.1);
  --brand-transition-fast: 150ms ease;
  --brand-transition-base: 200ms ease;
  --brand-line-height-200: 20px;
  --brand-line-height-300: 24px;
  --brand-line-height-400: 28px;
}

/* ================================================
   NEO DESIGN SYSTEM — ALIAS TOKENS (Tier 2)
   ================================================ */
:root {
  --alias-primary-100: var(--brand-digital-blue-100);
  --alias-primary-200: var(--brand-digital-blue-200);
  --alias-primary-300: var(--brand-digital-blue-300);
  --alias-primary-500: var(--brand-digital-blue-500);
  --alias-primary-600: var(--brand-digital-blue-600);
  --alias-primary-700: var(--brand-digital-blue-700);
  --alias-primary-800: var(--brand-digital-blue-800);
  --alias-success-100: var(--brand-green-100);
  --alias-success-600: var(--brand-green-600);
  --alias-success-700: var(--brand-green-700);
  --alias-error-100: var(--brand-red-100);
  --alias-error-600: var(--brand-red-600);
  --alias-error-700: var(--brand-red-700);
  --alias-warning-100: var(--brand-orange-100);
  --alias-warning-600: var(--brand-orange-600);
  --alias-neutral-light-100: var(--brand-grey-100);
  --alias-neutral-light-200: var(--brand-grey-200);
  --alias-neutral-light-300: var(--brand-grey-300);
  --alias-neutral-light-400: var(--brand-grey-400);
  --alias-neutral-dark-500: var(--brand-grey-500);
  --alias-neutral-dark-600: var(--brand-grey-600);
  --alias-neutral-dark-700: var(--brand-grey-700);
  --alias-neutral-dark-800: var(--brand-grey-800);
  --alias-neutral-dark-900: var(--brand-grey-900);
  --alias-neutral-dark-1000: var(--brand-grey-1000);
  --alias-foundation-white: var(--brand-white);
  --alias-foundation-black: var(--brand-black);
  --alias-font-heading: var(--brand-font-family-sans);
  --alias-font-body: var(--brand-font-family-sans);
  --alias-font-code: var(--brand-font-family-mono);
}

/* ================================================
   NEO DESIGN SYSTEM — MAPPED TOKENS (Tier 3)
   Components consume ONLY these.
   ================================================ */
:root {
  --surface-primary: var(--alias-foundation-white);
  --surface-page: #f4f4f4;
  --surface-secondary: var(--alias-neutral-light-100);
  --surface-tertiary: var(--alias-neutral-light-200);
  --surface-disabled: var(--alias-neutral-light-200);
  --surface-error: var(--alias-error-100);
  --surface-success: var(--alias-success-100);
  --surface-information: var(--alias-primary-100);
  --surface-warning: var(--alias-warning-100);
  --surface-primary-filled: var(--alias-primary-500);
  --surface-error-filled: var(--alias-error-600);
  --surface-success-filled: var(--alias-success-600);
  --surface-primary-hover: var(--alias-primary-100);
  --surface-primary-pressed: var(--alias-primary-200);
  --surface-primary-filled-hover: var(--alias-primary-700);
  --surface-primary-filled-pressed: var(--alias-primary-800);
  --surface-primary-active: #3776F01A;
  --surface-error-filled-hover: var(--alias-error-700);
  --text-primary: var(--alias-neutral-dark-1000);
  --text-secondary: var(--alias-neutral-dark-600);
  --text-tertiary: var(--alias-neutral-dark-500);
  --text-disabled: var(--alias-neutral-light-400);
  --text-error: var(--alias-error-600);
  --text-success: var(--alias-success-700);
  --text-information: var(--alias-primary-700);
  --text-on-primary: var(--alias-foundation-white);
  --text-on-error: var(--alias-foundation-white);
  --text-primary-hover: var(--alias-primary-700);
  --icon-primary: var(--alias-neutral-dark-1000);
  --icon-secondary: var(--alias-neutral-dark-600);
  --icon-tertiary: var(--alias-neutral-dark-500);
  --icon-on-primary: var(--alias-foundation-white);
  --border-primary: var(--alias-neutral-light-300);
  --border-secondary: var(--alias-neutral-light-400);
  --border-hover: var(--alias-neutral-light-400);
  --border-focus: var(--alias-primary-600);
  --content-heading: var(--alias-neutral-dark-1000);
  --content-body: var(--alias-neutral-dark-800);
  --content-caption: var(--alias-neutral-dark-600);
  --content-placeholder: var(--alias-neutral-dark-500);
  --font-heading: var(--alias-font-heading);
  --font-body: var(--alias-font-body);
  --font-code: var(--alias-font-code);
  --space-1: var(--brand-spacing-100);
  --space-2: var(--brand-spacing-200);
  --space-3: var(--brand-spacing-300);
  --space-4: var(--brand-spacing-400);
  --space-5: var(--brand-spacing-500);
  --space-6: var(--brand-spacing-600);
  --space-8: var(--brand-spacing-800);
  --space-10: var(--brand-spacing-1000);
  --radius-sm: var(--brand-radius-100);
  --radius-md: var(--brand-radius-200);
  --radius-lg: var(--brand-radius-300);
  --radius-xl: var(--brand-radius-400);
  --radius-2xl: var(--brand-radius-500);
  --radius-full: var(--brand-radius-full);
  --shadow-xs: var(--brand-shadow-100);
  --shadow-sm: var(--brand-shadow-200);
  --shadow-md: var(--brand-shadow-300);
  --shadow-lg: var(--brand-shadow-400);
  --shadow-xl: var(--brand-shadow-500);
  --transition-fast: var(--brand-transition-fast);
  --transition-base: var(--brand-transition-base);
}

/* Legacy tokens still consumed by the rest of this file */
:root {
    --grey-25:  #f9fafb;
    --grey-50:  #f3f4f6;
    --grey-100: #e5e7eb;
    --grey-200: #d1d5db;
    --grey-300: #9ca3af;
    --grey-500: #6b7280;
    --grey-600: #4b5563;
    --grey-700: #374151;
    --grey-800: #1f2937;
    --grey-900: #111827;
    --bg: #ffffff;

    --neo-digital-blue-300: #8d99ff;
    --neo-digital-blue-500: #2f42ff;
    --neo-red-500: #cb3446;

    --neo-red: #FF3232;
    --roseate: #DB4197;
    --violet: #461DDE;
    --digital-blue: #2F42FF;
    --digital-green: #3DDC84;

    --highlight: #fbbf24;
    --highlight-bg: #fef3c7;
    --highlight-text: #78350f;
    --java-dot: #e76f00;
    --code-bg: #0d1117;

    --code-near-black: #0A0F1E;
    --code-cb: #7B9FFF;
    --code-cs: #A0A4C0;
    --code-cd: rgba(255,255,255,0.25);
    --code-slate-mid: #636687;

    /* Moderne UI palette (recipe results page) — used in Phase 2 trigrep
       to mirror FileDiffView / ResultExpansionPanel visuals.
       Source: themes/moderne-theme.ts in moderneinc/moderne-ui. */
    --mui-grey-100: #F8F9FA;   /* row hover bg, page bg */
    --mui-grey-150: #EDEFEF;   /* tab strip bg */
    --mui-grey-200: #E9ECEF;
    --mui-grey-300: #DEE2E6;
    --mui-grey-400: #CED4DA;   /* borders */
    --mui-grey-500: #ADB5BD;   /* line numbers */
    --mui-grey-600: #6C757D;   /* count text */
    --mui-grey-700: #495057;
    --mui-grey-800: #343A40;   /* body text */
    --mui-card-bg: #F4F4F4;    /* newGreys.15 — FileDiffView card bg */
    --mui-card-body-bg: #FFFFFF;
    --mui-divider: #C1C1C1;    /* sticky paper bottom border */
    --mui-blue: #2F42FF;       /* blue.main — count badge color, accents */
    --mui-blue-200: #9FA8FF;   /* search-hit row bg */
    --mui-gold: #FFC107;       /* neoGold[300] — search match highlight */
    --mui-gold-soft: #FFF3B0;  /* gold highlight bg */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--grey-50);
    color: var(--grey-700);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.55;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }

  /* ===== Shell ===== */
  body { background: var(--surface-page); }
  .shell { height: 100vh; display: flex; flex-direction: column; }
  .grid {
    display: grid;
    grid-template-columns: 98px 1fr;
    grid-template-areas: "nav content";
    flex: 1;
    overflow: hidden;
    gap: 0;
    background: var(--surface-page);
  }

/* ================================================
   LEFT NAVIGATION RAIL (98px) — v2-sandbox spec
   ================================================ */
.left-nav {
  grid-area: nav;
  width: 98px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  padding: 2px 8px 24px;
  gap: 0;
  background: var(--surface-page);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  overflow: visible;
}

.left-nav-top {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  gap: 4px;
}

.nav-item-home {
  padding: 0 4px;
}

.nav-item-home .nav-icon-container {
  padding: 4px;
}

.nav-item {
  width: 100%;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  position: relative;
  text-decoration: none;
  background: transparent;
}

.nav-icon-container {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: var(--radius-lg);
  border: 1px solid transparent;
  background: transparent;
  transition: background-color 150ms ease, border-color 150ms ease;
}

.nav-item:hover .nav-icon-container,
.nav-item.active .nav-icon-container {
  background: var(--brand-digital-blue-100);
  border-color: var(--brand-digital-blue-200);
}

.nav-item svg {
  width: 22px;
  height: 22px;
  min-width: 22px;
  color: var(--brand-grey-900);
  flex-shrink: 0;
}

.nav-label {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: var(--brand-font-weight-regular);
  line-height: 1;
  color: var(--brand-grey-900);
  text-align: center;
  white-space: normal;
  width: 100%;
  transition: color 150ms ease;
}

.nav-item:hover .nav-label {
  color: var(--brand-digital-blue-600);
}

.nav-item.active .nav-label {
  font-weight: var(--brand-font-weight-semibold);
  color: var(--brand-digital-blue-800);
}

.nav-badge {
  font-size: 11px;
  padding: 0 6px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--brand-grey-200);
  color: var(--brand-grey-800);
  border: 1px solid rgba(107, 114, 128, 0.5);
  font-weight: var(--brand-font-weight-medium);
  line-height: 1;
  text-align: center;
  letter-spacing: 0;
}

.nav-home-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
  padding: 4px 0;
}

.nav-version-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--brand-digital-blue-500) 0%, var(--brand-violet-500) 100%);
  color: var(--brand-white);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: var(--brand-font-weight-semibold);
  line-height: 1;
  letter-spacing: 0;
}

.nav-more-wrapper {
  position: relative;
  margin-top: auto;
}

.nav-more-popover {
  position: absolute;
  left: calc(100% + 4px);
  bottom: 0;
  background: var(--surface-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 96px;
  z-index: 100;
}

.nav-more-popover[hidden] { display: none; }

.nav-more-popover .nav-item {
  padding: 8px 4px;
}

/* ================================================
   MAIN CONTENT AREA
   ================================================ */
.main-area {
  grid-area: content;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* ================================================
   GLOBAL NAVIGATION BAR (65px toolbar)
   ================================================ */
.global-nav {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 12px 20px;
  gap: 12px;
  flex-shrink: 0;
  position: relative;
  width: 100%;
}

.global-nav::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 70%;
  transform: translate(-50%, -50%);
  width: 1000px;
  max-width: 90%;
  height: 65px;
  background: radial-gradient(ellipse at center, var(--brand-red-100) 0%, var(--brand-red-100) 40%, transparent 70%);
  filter: blur(20px);
  z-index: 0;
  pointer-events: none;
}

.global-nav > * {
  position: relative;
  z-index: 1;
}

.org-selector {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  color: var(--text-primary);
  cursor: pointer;
  padding: 10px 16px;
  border-radius: var(--radius-full);
  transition: all var(--transition-fast);
  background: var(--surface-primary);
  border: 1px solid var(--border-secondary);
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-transform: none;
}

.org-selector:hover {
  background: var(--brand-grey-200);
  border-color: var(--border-primary);
}

.org-selector.selected {
  color: var(--text-primary);
  font-weight: var(--brand-font-weight-regular);
}

.org-selector-wrapper {
  position: relative;
  flex: 0 1 auto;
  min-width: 0;
  max-width: 50vw;
}

.nav-spacer {
  flex: 1;
}

.search-input {
  height: 40px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-secondary);
  padding: 10px 16px;
  font-size: var(--brand-font-size-300);
  color: var(--text-tertiary);
  background: var(--surface-primary);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: background var(--transition-fast), border-color var(--transition-fast);
  flex-shrink: 0;
  user-select: none;
}

.search-input:hover {
  background: var(--brand-grey-200);
  border-color: var(--border-primary);
}

.search-input > span:first-of-type {
  flex: 1;
  white-space: nowrap;
}

.search-input-keys {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.search-input kbd {
  font-size: var(--brand-font-size-100);
  background: var(--surface-tertiary);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-tertiary);
  font-family: var(--font-body);
  border: 1px solid var(--border-primary);
  min-width: 18px;
  text-align: center;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 64px;
}

.nav-action-btn {
  width: 40px;
  height: 40px;
  border-radius: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background var(--transition-fast), transform 200ms ease-in;
  border: none;
  background: transparent;
  color: var(--brand-grey-900);
  flex-shrink: 0;
}

.nav-action-btn:hover {
  background: var(--brand-grey-200);
}

.nav-action-btn.open {
  background: var(--surface-primary);
  box-shadow: var(--shadow-xs);
}

.nav-action-btn svg { width: 20px; height: 20px; }

.avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background: #E45A4F;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: var(--brand-font-weight-semibold);
  color: var(--brand-white);
  flex-shrink: 0;
}

  /* ===== Page (split container) — transitions between Phase 1 and Phase 2 ===== */
  .page {
    flex: 1;
    background: var(--bg);
    border-radius: 8px;
    overflow: hidden;
    margin: 0 8px 8px 0;
    min-height: 0;
    display: flex;
    position: relative;
  }
  /* Trigrep panel: collapsed to width 0 in Phase 1; expanded to flex 1 in Phase 2 */
  .trigrep-panel {
    width: 0;
    flex-shrink: 0;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: width 300ms cubic-bezier(0.4, 0, 0.2, 1),
                flex-basis 300ms cubic-bezier(0.4, 0, 0.2, 1),
                flex-grow 300ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* Divider hidden in Phase 1 */
  .divider {
    width: 0;
    background: transparent;
    cursor: col-resize;
    position: relative;
    flex-shrink: 0;
    transition: width 300ms cubic-bezier(0.4, 0, 0.2, 1), background 0.15s ease;
  }
  .divider:hover, .divider.dragging { background: var(--grey-100); }
  .divider-toggle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 22px; height: 38px;
    border-radius: 6px;
    background: #fff;
    border: 1px solid var(--grey-100);
    box-shadow: 0 1px 2px rgba(15,23,42,0.06);
    display: none; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--grey-500);
    z-index: 2;
  }
  .divider-toggle:hover { color: var(--grey-900); border-color: var(--grey-200); }
  .divider-toggle svg { width: 12px; height: 12px; }

  /* Moddy panel: full flex in Phase 1; 30% in Phase 2 */
  .moddy-panel {
    flex: 1;
    min-width: 0;
    display: flex; flex-direction: column;
    background: #fff;
    overflow: hidden;
    transition: width 300ms cubic-bezier(0.4, 0, 0.2, 1),
                flex-basis 300ms cubic-bezier(0.4, 0, 0.2, 1),
                flex-grow 300ms cubic-bezier(0.4, 0, 0.2, 1),
                border-left-width 300ms ease;
    border-left: 0 solid var(--grey-100);
  }
  .moddy-panel.collapsed { width: 0 !important; min-width: 0; border-left-width: 0; flex: 0 0 0 !important; }

  /* === Phase 2 active state === */
  body.phase-2 .trigrep-panel {
    width: auto;
    flex: 1 1 auto;
  }
  body.phase-2 .divider {
    width: 6px;
  }
  body.phase-2 .divider-toggle { display: none; }
  body.phase-2 .moddy-panel {
    flex: 0 0 30%;
    border-left-width: 1px;
  }

  /* Reopen tab for Moddy when collapsed */
  .moddy-reopen {
    position: absolute;
    right: 0; top: 50%;
    transform: translateY(-50%);
    padding: 12px 6px;
    background: #fff;
    border: 1px solid var(--grey-100);
    border-right: none;
    border-radius: 8px 0 0 8px;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    color: var(--grey-700);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    writing-mode: vertical-rl;
  }
  .moddy-reopen.visible { display: inline-flex; }

  /* ===== Moddy chat container (lives inside .moddy-panel — flexes width with phase) ===== */
  .chat-inner {
    flex: 1;
    display: flex; flex-direction: column;
    min-height: 0;
    width: 100%;
    transition: max-width 300ms cubic-bezier(0.4, 0, 0.2, 1), padding 300ms ease;
    margin: 0 auto;
    /* Phase 1: centered, capped width */
    max-width: 720px;
    padding: 0 24px;
  }
  body.phase-2 .chat-inner {
    max-width: 100%;
    padding: 0;
  }

  /* Moddy header (only shown in Phase 2) */
  .moddy-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--grey-50);
    display: none; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  body.phase-2 .moddy-head { display: flex; }
  .back-to-chat {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px;
    background: transparent; border: none;
    padding: 0;
    color: var(--grey-500);
    cursor: pointer;
    border-radius: 6px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .back-to-chat:hover { color: var(--neo-digital-blue-500); background: var(--grey-50); }
  .back-to-chat svg { width: 16px; height: 16px; }
  .moddy-head-left {
    display: inline-flex; align-items: center; gap: 10px;
    min-width: 0;
  }
  .moddy-head-title {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: var(--grey-900);
  }
  .moddy-head-title .moddy-mark {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--grey-900, #041834);
  }
  .moddy-head-title .moddy-mark svg { width: 18px; height: 18px; }
  .moddy-head-actions { display: inline-flex; gap: 4px; }

  /* Greeter — Phase 1 step 1 only.
     Centered as a single focused group (perplexity-inspired): logo,
     headline, prompts, the search input itself, "or try asking" links,
     and the disclaimer all live in one vertical stack. */
  .greeter {
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 0 16px; gap: 18px;
    width: 100%;
    justify-content: center;
  }
  .greeter.hidden { display: none; }
  /* When the search input lives INSIDE the greeter, drop the footer styling
     (no bottom padding, no fade gradient — it's no longer pinned). */
  .greeter .prompt-wrap {
    padding: 4px 0 0;
    background: none;
    width: 100%;
  }
  .greeter-logo {
    width: 135px; height: 135px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .greeter-logo svg { width: 100%; height: 100%; }
  #greeter-spinner { width: 100%; height: 100%; }
  .greeter-headline {
    text-align: center;
    font-size: 22px; font-weight: 500; color: var(--grey-800);
    line-height: 1.3;
  }
  .suggestions {
    display: flex; flex-direction: column; align-items: stretch;
    gap: 8px;
    /* Hug the widest child — all tiles share that width */
    width: max-content;
    max-width: 100%;
    margin: 4px auto 0;
  }
  .suggestion {
    display: block; width: 100%;
    text-align: center;
    padding: 10px 20px;
    border: 1px solid var(--grey-200);
    border-radius: 999px;
    background: #fff;
    color: var(--grey-900);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s, transform 0.15s;
    line-height: 1.3;
  }
  .suggestion:hover {
    border-color: var(--neo-digital-blue-500);
    background: rgba(47, 66, 255, 0.04);
    color: var(--neo-digital-blue-500);
  }
  .suggestion:active { transform: translateY(1px); }
  .greeter-disclaimer {
    text-align: center;
    font-size: 12px;
    color: var(--grey-600);
    padding: 20px 16px 16px;
    line-height: 1.5;
  }
  .greeter-disclaimer svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; color: var(--neo-digital-blue-500); }

  /* Conversation (shared between phases) */
  .conversation {
    flex: 1; overflow-y: auto;
    padding: 24px 4px 24px;
    display: flex; flex-direction: column; gap: 20px;
    scrollbar-gutter: stable;
  }
  body.phase-2 .conversation { padding: 18px 18px 12px; gap: 14px; }
  .conversation.hidden { display: none; }
  .conversation::-webkit-scrollbar { width: 6px; }
  .conversation::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 3px; }

  /* User message — Phase 1 style (full-width grey bubble) */
  .msg-user {
    align-self: stretch;
    display: flex; flex-direction: row; gap: 10px; align-items: flex-start;
    background: var(--grey-50);
    border-radius: 16px;
    padding: 12px 14px;
  }
  body.phase-2 .msg-user {
    align-self: flex-end;
    max-width: 88%;
    border-radius: 14px 14px 4px 14px;
    padding: 10px 14px;
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
  }
  body.phase-2 .msg-user .avatar { display: none; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: var(--grey-100); color: var(--grey-700);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .msg-user-text { color: var(--grey-800); font-size: 15px; padding-top: 4px; }
  body.phase-2 .msg-user-text { padding-top: 0; font-size: 13.5px; color: var(--grey-900); line-height: 1.5; }

  /* Moddy message */
  .msg-moddy { display: flex; flex-direction: column; gap: 12px; color: var(--grey-600); font-size: 16px; }
  body.phase-2 .msg-moddy { font-size: 13.5px; gap: 10px; }
  .msg-moddy p { margin: 0; }
  .msg-moddy .inline-code, .msg-moddy code {
    background: var(--grey-25); border: 1px solid var(--grey-50);
    padding: 0 5px; border-radius: 4px;
    font-size: 13px; color: var(--violet);
    font-family: 'JetBrains Mono', monospace;
  }
  body.phase-2 .msg-moddy code { font-size: 12px; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeInUp 380ms cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* Derived query — Neo mini-code-card */
  .derived-query {
    background: var(--code-near-black);
    border-radius: 8px;
    overflow: hidden;
  }
  .derived-query-head {
    padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .derived-query-head-title {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    color: var(--code-slate-mid);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .derived-query-cmd {
    padding: 14px 16px;
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(255,255,255,0.6);
    white-space: pre;
    overflow-x: auto;
  }
  /* In the narrow Moddy panel, wrap the command so it stays readable. */
  body.phase-2 .derived-query-cmd {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-x: hidden;
  }
  .derived-query-cmd .cb { color: var(--code-cb); }
  .derived-query-cmd .cs { color: var(--code-cs); }
  .derived-query-cmd .cd { color: var(--code-cd); }
  .derived-query-copy {
    width: 24px; height: 24px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.08);
    background: transparent;
    color: var(--code-cs);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .derived-query-copy:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .derived-query-copy svg { width: 12px; height: 12px; }
  .derived-query-copy.copied {
    background: rgba(61,220,132,0.18);
    border-color: rgba(61,220,132,0.4);
    color: var(--digital-green);
  }

  /* Scope line */
  .scope-line {
    font-size: 12px; color: var(--grey-600);
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  }
  .scope-line .scope-sep { color: var(--grey-300); }

  /* Module grouping */
  .modules-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    font-size: 14px; color: var(--grey-600);
  }
  body.phase-2 .modules-row { font-size: 13px; }
  .modules-label { font-weight: 600; color: var(--grey-800); margin-right: 4px; }
  .module-chip {
    border: 1px solid var(--grey-100); background: #fff;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px; color: var(--grey-700);
    cursor: pointer; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit;
  }
  .module-chip:hover { border-color: var(--violet); color: var(--violet); background: rgba(70,29,222,0.04); }
  .module-chip .count {
    background: var(--grey-50); color: var(--grey-500);
    border-radius: 999px; padding: 0 6px; font-size: 11px;
  }
  .module-chip:hover .count { background: rgba(70,29,222,0.1); color: var(--violet); }
  .modules-more {
    background: none; border: none; padding: 0;
    color: var(--violet); cursor: pointer;
    font-family: inherit; font-size: 13px;
    text-decoration: underline;
  }

  /* Java dot — used by Phase 2 filter items */
  .lang-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--java-dot);
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(231, 111, 0, 0.15);
  }

  /* Followup action buttons (Phase 2 contextual block) */
  .followup-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .followup-actions.stacked { flex-direction: column; align-items: stretch; gap: 8px; }
  body.phase-2 .followup-actions { flex-direction: column; align-items: stretch; gap: 8px; }
  .followup {
    border: 1px solid var(--grey-200); background: #fff;
    border-radius: 8px; padding: 9px 14px;
    font-size: 13px; color: var(--grey-900); cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .followup:hover { border-color: var(--grey-300); background: var(--grey-25); }
  body.phase-2 .followup { width: 100%; text-align: left; }
  .followup.primary {
    background: var(--neo-digital-blue-500);
    color: #fff; border-color: var(--neo-digital-blue-500);
    font-weight: 600;
  }
  .followup.primary:hover { background: #1f30e6; }
  .followup.primary svg { width: 14px; height: 14px; }
  .followup.tertiary {
    border: none; background: transparent;
    padding: 8px 6px; color: var(--neo-digital-blue-500);
    font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .followup.tertiary:hover { background: rgba(47, 66, 255, 0.06); color: var(--neo-digital-blue-500); }
  .followup svg { width: 14px; height: 14px; }

  /* Conversational Moddy chat (Phase 1) */
  .moddy-summary,
  .moddy-prose,
  .best-match-prose {
    margin: 0 0 10px 0;
    font-size: 14px;
    color: var(--grey-700, #2b2b2b);
    line-height: 1.55;
  }
  .moddy-summary code,
  .moddy-prose code,
  .best-match-prose code,
  .results-link-card-label code {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    background: var(--grey-50, #f5f5f5);
    border: 1px solid var(--grey-100, #ececec);
    border-radius: 4px;
    padding: 1px 5px;
  }
  /* Clickable "View N search results" card — same affordance as
     "View Recipe Run Results" in the existing Moderne UI. */
  .results-link-card {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--grey-200, #e6e6e6);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 12px 0;
    color: var(--grey-800, #2b2b2b);
    font-family: inherit;
    font-size: 14px; font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .results-link-card:hover {
    background: var(--grey-25, #fafafa);
    border-color: var(--neo-digital-blue-500);
  }
  .results-link-card-icon {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--grey-50, #f5f5f5);
    color: var(--grey-600, #555);
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .results-link-card-icon svg { width: 14px; height: 14px; }
  .results-link-card-label { flex: 1; }
  .results-link-card-arrow {
    width: 14px; height: 14px; color: var(--grey-500, #777);
    flex: 0 0 auto;
  }
  .results-link-card:hover .results-link-card-arrow { color: var(--neo-digital-blue-500); }
  /* Recipes list inside the expandable recipe card */
  .recipe-links { display: flex; flex-direction: column; gap: 4px; }
  .recipe-link {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    color: var(--neo-digital-blue-500);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    text-decoration: none;
    transition: background 0.12s ease;
  }
  .recipe-link:hover { background: var(--grey-50, #f5f5f5); text-decoration: underline; }
  .recipe-link-arrow { width: 12px; height: 12px; flex: 0 0 auto; }
  /* Hover tooltip for recipe links */
  .recipe-link { position: relative; }
  .recipe-link[data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    right: 8px;
    background: var(--mui-grey-800, #343A40);
    color: #fff;
    font-family: inherit;
    font-size: 11px; font-weight: 500;
    line-height: 1;
    padding: 5px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.12s ease 0.25s, transform 0.12s ease 0.25s;
    z-index: 40;
  }
  .recipe-link[data-tooltip]:hover::after,
  .recipe-link[data-tooltip]:focus-visible::after {
    opacity: 1;
    transform: translateY(0);
  }
  /* Hover tooltip for the "View N search results" card */
  .results-link-card { position: relative; }
  .results-link-card[data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    right: 12px;
    background: var(--mui-grey-800, #343A40);
    color: #fff;
    font-family: inherit;
    font-size: 11px; font-weight: 500;
    line-height: 1;
    padding: 5px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.12s ease 0.25s, transform 0.12s ease 0.25s;
    z-index: 40;
  }
  .results-link-card[data-tooltip]:hover::after,
  .results-link-card[data-tooltip]:focus-visible::after {
    opacity: 1;
    transform: translateY(0);
  }
  /* Best match prose block */
  .best-match-prose { margin: 0 0 12px 0; }
  /* Bottom actions: outlined buttons row + Refine search text link */
  .followup-actions.chat-bottom-actions {
    display: flex; flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    margin-top: 4px;
  }
  body.phase-2 .followup-actions.chat-bottom-actions {
    flex-direction: column; align-items: flex-start; gap: 10px;
  }
  .chat-bottom-buttons {
    display: flex; flex-direction: column; align-items: stretch;
    gap: 8px;
    width: 100%;
  }
  .chat-bottom-buttons .btn-outlined { text-align: center; }
  /* Neo secondary button — white fill, digital-blue border + text */
  .btn-outlined {
    background: #fff;
    border: 1px solid var(--neo-digital-blue-500);
    color: var(--neo-digital-blue-500);
    padding: 8px 16px;
    border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .btn-outlined:hover {
    background: rgba(47, 66, 255, 0.06);
    border-color: var(--neo-digital-blue-500);
  }
  .btn-outlined:active {
    background: rgba(47, 66, 255, 0.12);
  }
  .followup.tertiary.text-link.refine-link {
    background: transparent; border: 0; padding: 0;
    color: var(--neo-digital-blue-500);
    font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: baseline;
    cursor: pointer;
  }
  .followup.tertiary.text-link.refine-link:hover {
    background: transparent; text-decoration: underline;
  }
  .recipe-card {
    border: 1px solid var(--grey-200, #e6e6e6);
    border-radius: 8px;
    background: #fff;
    margin: 0 0 10px 0;
    overflow: hidden;
  }
  .recipe-card-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    background: transparent; border: 0;
    padding: 10px 12px;
    font-size: 13px; color: var(--grey-700, #2b2b2b);
    text-align: left; cursor: pointer;
  }
  .recipe-card-head:hover { background: var(--grey-25, #fafafa); }
  .recipe-card-title strong { font-weight: 600; }
  .recipe-card-chev {
    width: 14px; height: 14px;
    color: var(--grey-500, #777);
    transition: transform 200ms ease;
    flex: 0 0 auto;
  }
  .recipe-card[data-expanded="1"] .recipe-card-chev { transform: rotate(90deg); }
  .recipe-card-body {
    display: none;
    padding: 0 12px 12px 12px;
    border-top: 1px solid var(--grey-100, #f0f0f0);
    padding-top: 10px;
    font-size: 13px; line-height: 1.5; color: var(--grey-700, #2b2b2b);
  }
  .recipe-card[data-expanded="1"] .recipe-card-body { display: block; }
  .recipe-card-body p { margin: 0; }
  .recipe-card-body code,
  .inline-lead code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    background: var(--grey-50, #f5f5f5);
    border: 1px solid var(--grey-100, #ececec);
    border-radius: 4px;
    padding: 1px 5px;
  }
  /* Chat input */
  .prompt-wrap {
    padding: 16px 0 24px;
    background: linear-gradient(to bottom, transparent, var(--bg) 30%);
    flex-shrink: 0;
  }
  body.phase-2 .prompt-wrap {
    padding: 14px 18px 12px;
    background: #fff;
    border-top: 1px solid var(--grey-50);
  }
  .prompt-gradient {
    position: relative; padding: 1px; border-radius: 10px;
    background: linear-gradient(60deg, var(--neo-red), var(--roseate), var(--violet), var(--digital-blue), var(--digital-green));
    background-size: 300% 300%;
    animation: gradient-shift 10s ease alternate infinite;
    box-shadow: rgba(0,0,0,0.12) 0px 1px 8px 0px;
  }
  body.phase-2 .prompt-gradient {
    background: var(--grey-200);
    animation: none;
    box-shadow: none;
  }
  @keyframes gradient-shift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .prompt-inner {
    background: var(--bg); border-radius: 9px;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px 10px 18px;
  }
  body.phase-2 .prompt-inner { padding: 6px 6px 6px 14px; }
  .prompt-input {
    flex: 1; border: none; outline: none; resize: none;
    font-family: inherit; font-size: 15px; color: var(--grey-700);
    background: transparent; padding: 8px 0;
    height: 24px; line-height: 1.5;
    overflow-y: auto;
  }
  body.phase-2 .prompt-input { font-size: 13.5px; padding: 6px 0; }
  .prompt-input::placeholder { color: var(--grey-300); }
  /* Send button — icon-only, mirrors the nav-action-btn icon treatment
     (transparent, no border) but sized to sit flush inside the input wrapper. */
  .send-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: transparent;
    color: var(--neo-digital-blue-500);
    border: none;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: color 0.15s ease;
  }
  .send-btn:hover { color: var(--brand-grey-900); }
  .send-btn svg { width: 22px; height: 22px; }
  body.phase-2 .send-btn { width: 30px; height: 30px; }
  body.phase-2 .send-btn svg { width: 20px; height: 20px; }
  .prompt-footnote {
    font-size: 11px; color: var(--grey-600);
    text-align: left;
    margin-top: 8px;
    padding-left: 4px;
  }
  body.phase-2 .prompt-footnote { text-align: center; padding-left: 0; }

  /* ===== Trigrep left panel ===== */
  /* Page header — mirrors ModernePageContent (28px/600 title, 14px subtitle) */
  .trigrep-page-header {
    padding: 20px 24px 12px;
    background: #ffffff;
    flex-shrink: 0;
  }
  .trigrep-page-title {
    font-family: var(--font-heading, 'Inter', sans-serif);
    font-size: 21px;
    font-weight: 400;
    color: var(--grey-900, #111827);
    line-height: 1.4;
  }
  .trigrep-page-subtitle {
    font-size: 14px;
    color: var(--grey-600, #6B7280);
    margin-top: 2px;
  }
  .trigrep-head {
    padding: 8px 24px 12px;
    border-bottom: 1px solid var(--mui-divider);
    flex-shrink: 0;
    background: #ffffff;
  }
  .trigrep-search-row {
    display: flex; align-items: center; gap: 10px;
  }
  .trigrep-search-box {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    background: #fff;
    border: 1px solid var(--grey-200);
    border-radius: 8px;
    padding: 6px 10px 6px 12px;
    min-height: 40px;
  }
  .trigrep-search-box:focus-within {
    border-color: var(--neo-digital-blue-500);
    box-shadow: 0 0 0 3px rgba(47, 66, 255, 0.12);
  }
  .trigrep-search-icon { width: 16px; height: 16px; color: var(--grey-500); flex-shrink: 0; }
  /* Syntax selector — understated dropdown on the left edge of the search bar */
  .syntax-selector { position: relative; flex-shrink: 0; }
  .syntax-selector-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; border: 0;
    padding: 4px 6px;
    font-size: 12px; color: var(--grey-600, #555);
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
  }
  .syntax-selector-btn:hover { background: var(--grey-50, #f5f5f5); color: var(--grey-700, #2b2b2b); }
  .syntax-selector-btn svg { width: 10px; height: 10px; color: var(--grey-500, #777); }
  .syntax-selector[data-open="1"] .syntax-selector-btn svg { transform: rotate(180deg); }
  .syntax-selector-divider {
    width: 1px; height: 18px;
    background: var(--grey-200, #e6e6e6);
    flex-shrink: 0;
    margin: 0 2px;
  }
  .syntax-selector-menu {
    position: absolute;
    top: calc(100% + 6px); left: 0;
    margin: 0; padding: 4px;
    list-style: none;
    background: #fff;
    border: 1px solid var(--grey-200, #e6e6e6);
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    z-index: 30;
    min-width: 130px;
  }
  .syntax-selector-menu li {
    padding: 6px 10px;
    font-size: 12px;
    color: var(--grey-700, #2b2b2b);
    cursor: pointer;
    border-radius: 4px;
  }
  .syntax-selector-menu li:hover { background: var(--grey-50, #f5f5f5); }
  .syntax-selector-menu li[aria-selected="true"] {
    color: var(--neo-digital-blue-500);
    font-weight: 500;
  }
  .trigrep-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--grey-50);
    color: var(--grey-700);
    border: 1px solid var(--grey-100);
    border-radius: 6px;
    padding: 3px 4px 3px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    white-space: nowrap;
  }
  .trigrep-chip strong { color: var(--grey-500); font-weight: 500; margin-right: 1px; }
  .trigrep-chip-x {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: none; background: transparent;
    color: var(--grey-500); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .trigrep-chip-x:hover { background: var(--grey-200); color: var(--grey-900); }
  .trigrep-chip-x svg { width: 10px; height: 10px; }
  .trigrep-query {
    flex: 1; min-width: 80px;
    border: none; outline: none; background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--grey-900);
  }
  .btn-search {
    background: var(--neo-digital-blue-500);
    color: #fff; border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .btn-search:hover { background: #1f30e6; }
  /* Active filter chips — appear directly below the search bar.
     Summary text (matches across files in ms) sits right-aligned on the same row. */
  .trigrep-chips-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
  }
  .trigrep-chips-list {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1 1 auto;
  }
  .trigrep-chips-row .trigrep-summary {
    flex: 0 0 auto;
    text-align: right;
    white-space: nowrap;
  }
  /* Meta row — mirrors StickyPaper toolbar (body 14px/500 left, link right) */
  .trigrep-meta-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
    font-size: 14px;
    color: var(--mui-grey-700);
  }
  .trigrep-meta-row a {
    color: var(--mui-grey-600); text-decoration: none; font-size: 12px;
  }
  .trigrep-meta-row a:hover { color: var(--mui-blue); }
  .trigrep-summary {
    color: var(--mui-grey-800);
    font-weight: 500;
    font-size: 14px;
  }
  .trigrep-summary .summary-count {
    color: var(--mui-grey-800); font-weight: 700;
  }

  .trigrep-body {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  /* Sidebar — two stacked panes: Filters (top) and Repositories (bottom).
     Each pane has its own header, scrollable body, and 1px divider. */
  .trigrep-sidebar {
    width: 280px;
    flex-shrink: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--mui-grey-200);
    background: #ffffff;
    font-size: 12px;
    min-height: 0;
  }
  .trigrep-pane {
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .trigrep-pane + .trigrep-pane {
    border-top: 1px solid var(--mui-grey-200);
  }
  /* Top (Filters) pane grows to fill; bottom (Repos) pane sized to content with a cap. */
  .trigrep-pane-filters { flex: 1 1 auto; }
  .trigrep-pane-repos   { flex: 0 1 auto; max-height: 45%; }
  .trigrep-pane-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px 8px;
    font-size: 11px;
    color: var(--mui-grey-600);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .trigrep-pane-head .collapse-all {
    color: var(--mui-blue); cursor: pointer;
    text-transform: none; letter-spacing: 0; font-weight: 500;
    font-size: 11.5px;
  }
  .trigrep-pane-head .collapse-all:hover { text-decoration: underline; }
  .trigrep-pane-body {
    overflow-y: auto;
    padding: 0 8px 12px;
    min-height: 0;
  }
  .trigrep-pane-body::-webkit-scrollbar { width: 6px; }
  .trigrep-pane-body::-webkit-scrollbar-thumb { background: var(--mui-grey-300); border-radius: 3px; }
  .filter-group {
    margin: 4px 0 2px;
  }
  /* Header: 28px row, chevron + 14px/700 label, matches ResultExpansionPanel */
  .filter-group-head {
    display: flex; align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 6px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px; font-weight: 700;
    color: var(--mui-grey-800);
  }
  .filter-group-head:hover { background: var(--mui-grey-100); }
  .filter-group-head svg {
    width: 14px; height: 14px;
    color: var(--mui-grey-600);
    transition: transform 0.2s ease;
    flex: 0 0 auto;
  }
  .filter-group.collapsed .filter-group-head svg { transform: rotate(-90deg); }
  .filter-group.collapsed .filter-group-body { display: none; }
  /* Body indented to align under the title (icon width + gap) */
  .filter-group-body { padding: 2px 0 6px 8px; margin-left: 12px; }
  .topic-search {
    width: calc(100% - 8px);
    margin: 4px 0 6px;
    padding: 5px 9px;
    border: 1px solid var(--mui-grey-300);
    border-radius: 4px;
    font-family: inherit; font-size: 12px;
    color: var(--mui-grey-800);
    background: #ffffff;
    outline: none;
  }
  .topic-search:focus { border-color: var(--mui-blue); }
  /* Item row: 28px tall, 12px sans, hover mui-grey-100, no card chrome */
  .filter-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    min-height: 28px;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    color: var(--mui-grey-800);
  }
  .filter-item:hover { background: var(--mui-grey-100); }
  .filter-item .count {
    color: var(--mui-grey-600);
    font-size: 12px;
    flex: 0 0 auto;
  }
  .filter-item.active {
    background: rgba(47, 66, 255, 0.06);
    color: var(--mui-blue);
    font-weight: 600;
  }
  .filter-item.active .count { color: var(--mui-blue); }
  .filter-item .lang-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    display: inline-block;
    box-shadow: none;
  }
  .filter-item-name {
    display: inline-flex; align-items: center;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Repository list — mirrors the ResultsTreeItem repo row from moderne-ui:
     blue count text, repo-style row, +N more link below. */
  .filter-group.is-repo-list .filter-item .count {
    color: var(--mui-blue);
    font-weight: 500;
  }
  .filter-group.is-repo-list .filter-item.active .count { color: var(--mui-blue); }
  .filter-more-link {
    display: block;
    background: transparent; border: 0;
    padding: 4px 6px;
    margin-top: 2px;
    font-family: inherit; font-size: 12px;
    color: var(--mui-blue);
    cursor: pointer;
    text-align: left;
  }
  .filter-more-link:hover { text-decoration: underline; }
  /* Repo list — no expandable header, search field on top. */
  .filter-group.is-repo-list.flat { margin: 4px 0 2px; }
  .filter-group.is-repo-list.flat .repo-list-body {
    padding: 4px 0 6px;
    margin-left: 0;
  }
  .repo-search-wrap {
    display: flex; align-items: center; gap: 6px;
    margin: 4px 0 6px;
    padding: 4px 9px;
    border: 1px solid var(--mui-grey-300);
    border-radius: 4px;
    background: #fff;
  }
  .repo-search-wrap:focus-within {
    border-color: var(--mui-blue);
  }
  .repo-search-icon {
    width: 12px; height: 12px;
    color: var(--mui-grey-500);
    flex-shrink: 0;
  }
  .repo-search {
    flex: 1; min-width: 0;
    border: 0; outline: none;
    background: transparent;
    font-family: inherit; font-size: 12px;
    color: var(--mui-grey-800);
  }
  .repo-search::placeholder { color: var(--mui-grey-500); }

  .trigrep-results {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px 32px;
    background: var(--grey-25);
  }
  .trigrep-results::-webkit-scrollbar { width: 8px; }
  .trigrep-results::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 4px; }

  /* Result card — mirrors FileDiffView: outlined card on F4F4F4,
     header with mono 14px file path + kebab + chevron, white body. */
  .result-card {
    background: var(--mui-card-bg);
    border: 1px solid var(--mui-grey-300);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: none;
  }
  .result-card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1px 8px 1px 12px;
    background: var(--mui-card-bg);
    min-height: 36px;
  }
  .result-card-file {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    color: var(--mui-grey-800);
    font-weight: 500;
    min-width: 0;
  }
  .result-card-file .file-module {
    color: var(--mui-grey-600); font-weight: 400;
    font-family: inherit;
    font-size: 13px;
    margin-left: 2px;
  }
  .result-card-actions { display: inline-flex; align-items: center; gap: 2px; }
  .result-card-meta {
    font-size: 12px; color: var(--mui-grey-600); margin-right: 6px;
  }
  .icon-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: none; background: transparent;
    color: var(--mui-grey-600);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--mui-grey-200); color: var(--mui-grey-800); }
  .icon-btn svg { width: 14px; height: 14px; }
  .chevron-btn svg { transition: transform 0.2s ease; }
  .result-card.collapsed .chevron-btn svg { transform: rotate(-90deg); }
  .result-card.collapsed .result-card-body { display: none; }
  .result-card-body {
    background: var(--mui-card-body-bg);
    border-top: 1px solid var(--mui-grey-300);
  }

  /* Hunk-range header — mirrors ResultsHunkTableCell (F4F4F4 strip
     between hunks, mono 12px, grey caption text) */
  .hunk-label {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 14px;
    background: var(--mui-card-bg);
    border-top: 1px solid var(--mui-grey-300);
    border-bottom: 1px solid var(--mui-grey-300);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--mui-grey-600);
  }
  .hunk-label .hunk-text { color: var(--mui-grey-700); }
  .hunk-label .icon-btn { width: 22px; height: 22px; }
  .hunk-label .icon-btn svg { width: 12px; height: 12px; }

  /* Code body — mirrors unified-diff-view: white bg, mono code,
     line-number cells grey.500 mono centered, search match in gold. */
  .code-body {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--mui-grey-800);
    background: var(--mui-card-body-bg);
    overflow-x: auto;
    padding: 4px 0;
  }
  .code-line {
    display: grid;
    grid-template-columns: 5ch 5ch 24px 1fr;
    align-items: center;
    min-height: 22px;
  }
  /* Search results use a simpler 2-col layout: lineno + code */
  .code-line.simple { grid-template-columns: 5ch 1fr; }
  .code-ln {
    color: var(--mui-grey-500);
    text-align: center;
    padding: 0;
    user-select: none;
    font-size: 12px;
  }
  .code-marker {
    text-align: center;
    color: var(--mui-grey-500);
    user-select: none;
    font-weight: 600;
  }
  .code-text {
    padding: 0 14px 0 8px;
    white-space: pre;
    color: var(--mui-grey-800);
  }
  .code-line.simple .code-text { padding-left: 12px; }
  /* Search-hit row tint — matches palette.blue['200'] from unified-diff-view */
  .code-line.is-hit { background: rgba(159, 168, 255, 0.12); }
  .code-line:hover { background: var(--mui-grey-100); }
  /* Diff lines (file detail view) — keep the GitHub-like green/red */
  .code-line.removed { background: #FFEBEB; }
  .code-line.removed .code-marker { color: #cf222e; }
  .code-line.added { background: #F3FFF5; }
  .code-line.added .code-marker { color: #1a7f37; }
  /* Search match highlight — gold underline-bg like SearchResultMarker */
  .match {
    background: var(--mui-gold-soft);
    color: var(--mui-grey-800);
    padding: 0 2px;
    border-radius: 2px;
    box-shadow: inset 0 -2px 0 var(--mui-gold);
  }
  .code-line.removed .match { background: #ffdce0; color: #82071e; box-shadow: none; }
  .code-line.added .match { background: #aceebb; color: #0f5132; box-shadow: none; }

  /* File detail drill-down */
  .trigrep-body { transition: opacity 100ms ease; }
  .trigrep-body.detail-mode > .trigrep-sidebar,
  .trigrep-body.detail-mode > .trigrep-results { display: none; }
  .trigrep-detail {
    display: none;
    flex: 1; flex-direction: column;
    min-width: 0;
    overflow: hidden;
    background: #fff;
  }
  .trigrep-body.detail-mode > .trigrep-detail { display: flex; }
  .result-card-file.is-clickable { cursor: pointer; }
  .result-card-file.is-clickable:hover { color: var(--mui-blue); }

  .detail-breadcrumb {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 24px;
    font-size: 13px;
    border-bottom: 1px solid var(--grey-50);
    background: #fff;
    flex-shrink: 0;
  }
  .detail-back {
    background: none; border: none; padding: 2px 0;
    color: var(--neo-digital-blue-500);
    cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .detail-back:hover { text-decoration: underline; }
  .detail-back svg { width: 12px; height: 12px; }
  .detail-crumb-sep { color: var(--grey-300); }
  .detail-crumb-current {
    color: var(--grey-900); font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
  }
  .detail-search-row {
    padding: 10px 24px;
    border-bottom: 1px solid var(--grey-50);
    background: #fff;
    flex-shrink: 0;
  }
  .detail-search-box {
    display: flex; align-items: center; gap: 8px;
    background: #fff;
    border: 1px solid var(--grey-200);
    border-radius: 6px;
    padding: 6px 12px;
  }
  .detail-search-box:focus-within {
    border-color: var(--neo-digital-blue-500);
    box-shadow: 0 0 0 3px rgba(47, 66, 255, 0.12);
  }
  .detail-search-box svg {
    width: 14px; height: 14px;
    color: var(--grey-500);
    flex-shrink: 0;
  }
  .detail-search-box input {
    flex: 1;
    border: none; outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    color: var(--grey-900);
  }
  .detail-search-box input::placeholder { color: var(--grey-500); }
  .detail-search-box .kbd-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 1px 5px;
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    border-radius: 4px;
    color: var(--grey-600);
    flex-shrink: 0;
  }

  .detail-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--grey-50);
    background: #fff;
    flex-shrink: 0;
  }
  .detail-header-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .detail-file-path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--grey-900);
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .detail-module {
    color: var(--grey-600);
    font-size: 12px;
    margin-top: 4px;
  }
  .detail-code {
    flex: 1;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.7;
    background: #fff;
    padding: 12px 0;
  }
  .detail-code::-webkit-scrollbar { width: 8px; }
  .detail-code::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 4px; }
  .detail-code .code-line {
    display: grid;
    grid-template-columns: 56px 1fr;
    align-items: center;
    min-height: 22px;
  }
  .detail-code .code-line.has-match { background: #fffbeb; }
  .detail-code .code-ln {
    text-align: right;
    color: var(--grey-300);
    padding: 0 12px 0 0;
    user-select: none;
    font-size: 11.5px;
  }
  .detail-code .code-text {
    padding: 0 14px;
    white-space: pre;
    color: var(--grey-900);
  }
  .detail-code .kw { color: var(--neo-digital-blue-500); }
  .detail-code .str { color: #b45309; }
  .detail-code .ann { color: var(--violet); }
  .detail-code .match {
    background: var(--highlight-bg); color: var(--highlight-text);
    padding: 0 2px; border-radius: 2px;
  }

  /* Trigrep empty state — shown when a new chat is started inside the split view */
  .trigrep-empty {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 40px 24px;
    background: var(--grey-25);
  }
  .trigrep-empty-icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--grey-100);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--grey-300);
    margin-bottom: 4px;
  }
  .trigrep-empty-icon svg { width: 24px; height: 24px; }
  .trigrep-empty-title { font-size: 15px; font-weight: 600; color: var(--grey-700); }
  .trigrep-empty-desc { font-size: 13px; color: var(--grey-600); max-width: 320px; line-height: 1.5; }

  /* Scoping buttons — used when user types a broad question */
  .scoping-prompt { font-size: 15px; color: var(--grey-700); line-height: 1.5; }
  body.phase-2 .scoping-prompt { font-size: 13.5px; }
  .scoping-buttons {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 4px;
  }
  .scoping-btn {
    display: flex; flex-direction: column; gap: 4px;
    text-align: left;
    padding: 12px 14px;
    border: 1px solid var(--grey-200);
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .scoping-btn:hover {
    border-color: var(--neo-digital-blue-400, #8D99FF);
    background: rgba(47, 66, 255, 0.03);
  }
  .scoping-btn-label {
    font-size: 13.5px; font-weight: 600;
    color: var(--grey-900);
  }
  .scoping-btn-query {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--grey-600);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .scoping-btn-query.muted { color: var(--grey-500); font-style: italic; font-family: inherit; }


  /* Fallback (typed text that doesn't match any flow) */
  .fallback-msg {
    background: var(--brand-orange-100, #FFF8E5);
    border: 1px solid #F3D690;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    color: var(--grey-800);
    line-height: 1.55;
  }
  .fallback-msg strong { color: var(--grey-900); }
  .fallback-msg code {
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(0,0,0,0.06);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--grey-900);
  }

  /* Chat history pane (ported from moddy.html) */
  .main-row { flex: 1; display: flex; min-height: 0; position: relative; }
  .moderne-history {
    width: 256px;
    flex-shrink: 0;
    border-right: 1px solid var(--grey-50);
    display: flex; flex-direction: column;
    background: #fff;
    transition: width 200ms ease, opacity 150ms ease;
    overflow: hidden;
    position: relative;
  }
  .moderne-history.collapsed { width: 0; opacity: 0; border-right-color: transparent; }
  /* Hide the chat-history sidebar (and its floating reopen button) in the split panel view */
  body.phase-2 .moderne-history,
  body.phase-2 .moderne-history-reopen { display: none; }
  .moderne-history-head {
    /* Top padding clears the absolute-positioned toggle button (top:14 + 32 + 8 gap) */
    padding: 56px 0 6px;
    display: flex; flex-direction: column; gap: 2px;
    flex-shrink: 0;
  }
  /* Shared row treatment for "+ New Chat" and "History" — flush-left at
     x=14 so they align under the toggle button at the sidebar's left edge. */
  /* "+ New Chat" — Neo tertiary button.
     Default: grey-900 text + icon, no background.
     Hover/Pressed: switches text + icon to digital-blue, no background tint.
     Focus: digital-blue text + icon, navy rounded outline.
     Disabled: muted grey. */
  .moderne-history-newchat {
    display: inline-flex; align-items: center; gap: 10px;
    align-self: flex-start;
    margin-left: 7px;
    padding: 8px 12px 8px 7px;
    border: 2px solid transparent; background: transparent;
    color: var(--grey-900);
    font-family: inherit;
    font-size: 14px; font-weight: 500;
    text-align: left;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .moderne-history-newchat:hover,
  .moderne-history-newchat:active { color: var(--neo-digital-blue-500); }
  .moderne-history-newchat:focus-visible {
    outline: none;
    color: var(--neo-digital-blue-500);
    border-color: var(--brand-digital-blue-900, #000855);
  }
  .moderne-history-newchat svg {
    width: 18px; height: 18px;
    color: currentColor;
    flex-shrink: 0;
    transition: color 0.15s ease;
  }
  .moderne-history-newchat:disabled {
    color: var(--grey-400);
    cursor: not-allowed;
  }
  /* "History" — a Neo-style section label (uppercase eyebrow), flush-left with the toggle */
  .moderne-history-title {
    display: flex; align-items: center;
    padding: 16px 14px 6px;
    color: var(--grey-500);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .moderne-history-title-label { flex: 1; }

  /* History list — Neo list rows: full-width, flush-left, subtle hover, light-grey active */
  .moderne-history-list {
    flex: 1; overflow-y: auto;
    padding: 0 0 16px;
  }
  .moderne-history-list::-webkit-scrollbar { width: 6px; }
  .moderne-history-list::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 3px; }
  .moderne-history-item {
    display: block; width: 100%;
    text-align: left;
    border: none; background: transparent;
    padding: 8px 14px;
    color: var(--grey-900);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.4;
  }
  .moderne-history-item:hover { background: var(--grey-25); }
  .moderne-history-item.active { background: var(--grey-100); font-weight: 500; }
  /* Toggle button — always pinned top-left. left:7 so the centered 18px icon
     sits at x=14, matching the "+" icon and text in the rows below. */
  .moderne-history-toggle {
    position: absolute;
    top: 14px; left: 7px;
    border: none;
    background: transparent;
    width: 32px; height: 32px;
    border-radius: 8px;
    color: var(--grey-500);
    cursor: pointer;
    display: inline-flex;
    align-items: center; justify-content: center;
    z-index: 5;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .moderne-history-toggle:hover { background: var(--grey-100); color: var(--grey-700); }
  .moderne-history-toggle svg { width: 18px; height: 18px; }
  body.phase-2 .moderne-history-toggle { display: none; }

  /* "Or try asking:" — conversational prompts below the tiles */
  .try-asking {
    margin-top: 20px;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }
  .try-asking-label {
    font-size: 12px;
    color: var(--grey-500);
    letter-spacing: 0.01em;
    margin-bottom: 2px;
  }
  .try-asking-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent;
    border: none;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--grey-600);
    transition: color 0.15s, background 0.15s;
  }
  .try-asking-link svg {
    width: 13px; height: 13px;
    color: var(--grey-400);
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }
  .try-asking-link:hover {
    color: var(--neo-digital-blue-500);
    background: rgba(47, 66, 255, 0.04);
  }
  .try-asking-link:hover svg { color: var(--neo-digital-blue-500); transform: translateX(2px); }

  /* Secondary outlined variant for action buttons (matches Neo secondary) */
  .followup.secondary {
    background: #fff;
    color: var(--neo-digital-blue-500);
    border-color: var(--neo-digital-blue-500);
  }
  .followup.secondary:hover {
    background: rgba(47, 66, 255, 0.06);
    border-color: var(--neo-digital-blue-500);
  }

  /* ============================================================
     TRIGREP-LANDING ADDITIONS (overrides + new components)
     ============================================================ */

  /* In trigrep-landing mode, the chat-history pane is hidden so the
     trigrep page sits flush against the platform nav. */
  body.trigrep-landing .moderne-history,
  body.trigrep-landing .moderne-history-toggle,
  body.trigrep-landing .moderne-history-reopen { display: none !important; }

  /* Default body to trigrep landing — split view always on, Moddy
     panel collapsed unless explicitly opened. */
  body.trigrep-landing .trigrep-panel { width: auto; flex: 1 1 auto; }
  body.trigrep-landing .moddy-panel { flex: 0 0 30%; border-left: 1px solid var(--grey-100); }
  body.trigrep-landing .moddy-panel.collapsed { flex: 0 0 0 !important; border-left-width: 0; }
  body.trigrep-landing .divider { width: 6px; }
  body.trigrep-landing .moddy-head { display: flex; }
  body.trigrep-landing .chat-inner { max-width: 100%; padding: 0; }
  /* Hide back-to-chat + new-chat in landing mode — close button (×) handles dismiss */
  body.trigrep-landing #back-to-chat,
  body.trigrep-landing #new-chat-btn { display: none; }
  body.trigrep-landing .moddy-reopen { display: none !important; }

  /* Top-bar Moddy button — separated from Search input by a divider */
  .topbar-divider {
    width: 1px; height: 24px;
    background: var(--grey-200);
    margin: 0 8px;
    flex-shrink: 0;
  }
  .topbar-moddy-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px 8px 12px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--border-secondary);
    color: var(--text-primary);
    font-family: inherit;
    font-size: var(--brand-font-size-300);
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition-fast);
    flex-shrink: 0;
  }
  .topbar-moddy-btn:hover {
    background: var(--brand-grey-100);
    border-color: var(--border-primary);
  }
  .topbar-moddy-btn.active {
    background: var(--brand-digital-blue-100);
    border-color: var(--brand-digital-blue-300);
    color: var(--brand-digital-blue-700);
  }
  .topbar-moddy-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ===== Trigrep landing empty state ===== */
  .trigrep-landing-empty {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 80px 24px 40px;
    gap: 20px;
    background: var(--grey-25);
    overflow-y: auto;
  }
  .trigrep-landing-greeting {
    font-size: 24px; font-weight: 500;
    color: var(--grey-900);
    text-align: center;
  }
  .trigrep-landing-helper {
    font-size: 14px; color: var(--grey-600);
    text-align: center;
    max-width: 480px;
    line-height: 1.55;
    margin-bottom: 4px;
  }
  .trigrep-examples {
    display: flex; flex-direction: column; gap: 22px;
    margin-top: 12px;
    width: 100%;
    max-width: 640px;
  }
  .trigrep-examples-group-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: var(--grey-500);
    margin-bottom: 8px;
  }
  .trigrep-examples-list {
    display: flex; flex-direction: column; gap: 6px;
  }
  .trigrep-example {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border: 1px solid var(--grey-100);
    background: #fff;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--grey-800);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }
  .trigrep-example:hover {
    border-color: var(--neo-digital-blue-500);
    background: rgba(47, 66, 255, 0.03);
    color: var(--neo-digital-blue-500);
  }
  .trigrep-example.is-syntax {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--grey-900);
  }
  .trigrep-example svg {
    width: 14px; height: 14px;
    flex-shrink: 0;
    color: var(--grey-400);
    transition: color 0.15s, transform 0.15s;
  }
  .trigrep-example:hover svg { color: var(--neo-digital-blue-500); transform: translateX(2px); }

  /* Trigrep landing search bar (centered on empty state, larger than head bar) */
  .trigrep-landing-search-wrap {
    width: 100%;
    max-width: 720px;
    margin: 8px auto 0;
  }

  /* ===== Syntax selector — extended menu rows ===== */
  .syntax-selector-menu li {
    display: flex; flex-direction: column;
    gap: 2px;
  }
  .syntax-selector-menu .opt-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 500;
    color: var(--grey-900);
  }
  .syntax-selector-menu .opt-label svg { width: 12px; height: 12px; color: var(--grey-500); }
  .syntax-selector-menu .opt-desc {
    font-size: 11px; color: var(--grey-500);
    font-family: 'JetBrains Mono', monospace;
  }
  .syntax-selector-menu li[aria-selected="true"] .opt-label { color: var(--neo-digital-blue-500); }
  .syntax-selector-menu li[aria-selected="true"] .opt-label svg { color: var(--neo-digital-blue-500); }
  .syntax-selector-menu { min-width: 260px; padding: 4px; }
  .syntax-selector-menu li { padding: 8px 10px; }

  /* ===== NL translation card ===== */
  .nl-translation-card {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid var(--neo-digital-blue-300);
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(47, 66, 255, 0.08);
  }
  .nl-translation-left {
    display: flex; align-items: center; gap: 10px;
    flex: 1; min-width: 0;
  }
  .nl-translation-arrow {
    width: 18px; height: 18px;
    flex-shrink: 0;
    color: var(--neo-digital-blue-500);
  }
  .nl-translation-syntax {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--grey-900);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nl-translation-actions { display: inline-flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .nl-translation-edit {
    background: transparent; border: 0; padding: 4px 6px;
    color: var(--neo-digital-blue-500);
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer;
  }
  .nl-translation-edit:hover { text-decoration: underline; }
  .nl-translation-run {
    background: var(--neo-digital-blue-500);
    color: #fff; border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .nl-translation-run:hover { background: #1f30e6; }
  .nl-translation-thinking {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--grey-25);
    border: 1px dashed var(--grey-200);
    border-radius: 8px;
    color: var(--grey-600);
    font-size: 13px;
  }
  .nl-translation-thinking .dots span {
    display: inline-block; width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--neo-digital-blue-500);
    margin-right: 4px;
    animation: dotPulse 1.2s infinite ease-in-out;
  }
  .nl-translation-thinking .dots span:nth-child(2) { animation-delay: 0.15s; }
  .nl-translation-thinking .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dotPulse {
    0%, 60%, 100% { opacity: 0.3; transform: scale(0.85); }
    30% { opacity: 1; transform: scale(1.1); }
  }

  /* ===== Search-bar help text (persistent muted line below the search bar) ===== */
  .search-help {
    margin-top: 6px;
    font-size: 12px;
    color: var(--grey-500);
    line-height: 1.5;
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px;
  }
  .search-help code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--grey-700);
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    padding: 0 4px;
    border-radius: 3px;
  }
  .search-help .help-sep {
    color: var(--grey-300);
    margin: 0 2px;
  }
  .search-help-link {
    background: transparent; border: 0; padding: 0;
    color: var(--neo-digital-blue-500);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
  }
  .search-help-link:hover { text-decoration: underline; }

  /* ===== Breadcrumb — shows NL → derived syntax mapping ===== */
  .translated-from {
    margin-top: 6px;
    display: inline-flex; align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--grey-500);
    flex-wrap: wrap;
  }
  .translated-from .translated-nl {
    color: var(--grey-600);
    font-style: italic;
  }
  .translated-from .translated-arrow {
    width: 12px; height: 12px;
    color: var(--grey-400);
    flex-shrink: 0;
  }
  .translated-from .translated-syntax {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--grey-700);
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    padding: 1px 6px;
    border-radius: 3px;
  }

  /* ===== Results toolbar strip — full-width band above sidebar+results ===== */
  .results-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 8px 24px;
    background: #fff;
    border-bottom: 1px solid var(--mui-divider);
    flex-shrink: 0;
  }
  .results-toolbar-left {
    display: inline-flex; align-items: center;
  }
  .results-toolbar-right {
    display: inline-flex; align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--mui-grey-600);
    margin-left: auto;
  }
  .results-toolbar-summary {
    color: var(--mui-grey-700);
  }
  .results-toolbar-summary strong { color: var(--grey-900); font-weight: 600; }
  .results-toolbar-time {
    color: var(--mui-grey-500);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .results-toolbar-export {
    color: var(--neo-digital-blue-500);
    text-decoration: none;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .results-toolbar-export:hover { text-decoration: underline; }
  .results-toolbar-export svg { width: 11px; height: 11px; }
  .results-toolbar-sep {
    width: 1px; height: 14px; background: var(--grey-200);
  }

  /* "N recipes available" card on toolbar — play icon + text + arrow */
  .recipes-available-card {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(47, 66, 255, 0.04);
    border: 1px solid var(--brand-digital-blue-200);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--neo-digital-blue-500);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
  }
  .recipes-available-card:hover {
    background: rgba(47, 66, 255, 0.09);
    border-color: var(--brand-digital-blue-300);
  }
  .recipes-available-card .play-icon {
    width: 14px; height: 14px;
    flex-shrink: 0;
  }
  .recipes-available-card .arrow-icon {
    width: 12px; height: 12px;
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .recipes-available-card:hover .arrow-icon { transform: translateX(2px); }

  /* ===== Sidebar width ===== */
  body.trigrep-landing .trigrep-sidebar { width: 260px; }
  /* Repositories first, then Filters */
  body.trigrep-landing .trigrep-pane-repos { flex: 0 1 auto; max-height: 40%; }
  body.trigrep-landing .trigrep-pane-filters { flex: 1 1 auto; }
  /* Pane head with count badge */
  .trigrep-pane-head .pane-count {
    color: var(--mui-grey-500);
    font-weight: 600;
    text-transform: none;
    margin-left: 4px;
  }
  /* Group section labels — uppercase eyebrow */
  .filter-group-label {
    padding: 10px 6px 4px;
    font-size: 10px;
    color: var(--mui-grey-500);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  /* Active filter item — checkmark + info bg, no chip */
  .filter-item .filter-check {
    width: 12px; height: 12px;
    flex-shrink: 0;
    color: transparent;
    margin-right: 6px;
  }
