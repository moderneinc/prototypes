  .filter-item.active .filter-check {
    color: var(--mui-blue);
  }
  .filter-item.active {
    background: rgba(47, 66, 255, 0.06);
    color: var(--mui-blue);
    font-weight: 500;
  }
  .filter-item.active .count { color: var(--mui-blue); font-weight: 500; }

  /* ===== Breakdown callout (left-border accent) ===== */
  .breakdown-callout {
    margin: 0 0 16px;
    padding: 12px 16px;
    background: #fff;
    border: 1px solid var(--mui-grey-300);
    border-left: 3px solid var(--neo-digital-blue-500);
    border-radius: 4px;
    font-size: 13.5px;
    color: var(--grey-800);
    line-height: 1.55;
  }
  .breakdown-callout p { margin: 0 0 6px 0; }
  .breakdown-callout p:last-of-type { margin-bottom: 0; }
  .breakdown-callout strong { color: var(--grey-900); font-weight: 600; }
  .breakdown-callout-divider {
    border: 0;
    border-top: 1px solid var(--grey-100);
    margin: 10px 0;
  }
  .breakdown-recipes-link {
    background: transparent; border: 0; padding: 0;
    color: var(--neo-digital-blue-500);
    font-family: inherit;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    text-align: left;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .breakdown-recipes-link:hover { text-decoration: underline; }

  /* ===== Overflow indicator below results ===== */
  .results-overflow {
    margin: 16px 0 4px;
    padding: 12px 16px;
    text-align: center;
    color: var(--grey-600);
    font-size: 13px;
  }
  .results-overflow strong { color: var(--grey-900); font-weight: 600; }
  .results-overflow .show-more {
    background: none; border: 0; padding: 0;
    margin-left: 12px;
    color: var(--neo-digital-blue-500);
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .results-overflow .show-more:hover { text-decoration: underline; }

  /* ===== Inline Export link on summary row ===== */
  .summary-export-link {
    color: var(--neo-digital-blue-500);
    text-decoration: none;
    font-size: 12px;
    margin-left: 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .summary-export-link:hover { text-decoration: underline; }
  .summary-export-link svg { width: 11px; height: 11px; }

  /* ===== Moddy contextual response styles ===== */
  .moddy-context-msg {
    font-size: 14px;
    color: var(--grey-800);
    line-height: 1.6;
    margin: 0 0 12px;
  }
  .moddy-context-msg.lead {
    font-weight: 500;
    color: var(--grey-900);
  }
  .moddy-context-msg code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--violet);
  }
  .moddy-context-msg strong { color: var(--grey-900); font-weight: 600; }

  /* Recipe box list inside Moddy free-flow response — clickable, hoverable */
  .moddy-recipe-box-list {
    display: flex; flex-direction: column; gap: 6px;
    margin: 4px 0 12px;
  }
  .moddy-recipe-box {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid var(--grey-200);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .moddy-recipe-box:hover {
    border-color: var(--neo-digital-blue-500);
    background: rgba(47, 66, 255, 0.03);
  }
  .moddy-recipe-box-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--neo-digital-blue-500);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .moddy-recipe-box svg { width: 12px; height: 12px; color: var(--neo-digital-blue-500); flex-shrink: 0; }

  /* ===== Flow C diagram ===== */
  .flow-c-diagram {
    background: var(--grey-25);
    border: 1px solid var(--grey-100);
    border-radius: 8px;
    padding: 16px 14px;
    margin: 10px 0 14px;
  }
  .flow-c-diagram-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
  }
  .flow-c-diagram-row:last-of-type { margin-bottom: 0; }
  .flow-c-node {
    background: #fff;
    border: 1px solid var(--grey-200);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11.5px;
    line-height: 1.3;
    color: var(--grey-900);
    flex-shrink: 0;
    text-align: center;
    min-width: 80px;
  }
  .flow-c-node.server { border-color: var(--neo-digital-blue-500); background: rgba(47, 66, 255, 0.04); }
  .flow-c-node strong { display: block; font-weight: 700; color: var(--grey-900); font-size: 12.5px; }
  .flow-c-node .role { display: block; color: var(--grey-500); font-size: 10.5px; margin-top: 2px; }
  .flow-c-arrow {
    display: inline-flex; align-items: center;
    color: var(--grey-400);
    font-size: 11px;
    flex-shrink: 0;
  }
  .flow-c-arrow .arrow-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--grey-500);
    margin: 0 4px;
  }
  .flow-c-clients {
    display: flex; flex-direction: column; gap: 6px;
    flex: 1;
  }
  .flow-c-diagram-note {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--grey-200);
    font-size: 12px;
    color: var(--grey-700);
    text-align: center;
  }
  .flow-c-diagram-note strong { color: var(--neo-digital-blue-500); font-weight: 600; }

function renderNavItem(item) {
  const el = document.createElement('div');
  el.className = 'nav-item' + (item.active ? ' active' : '');
  el.innerHTML = `
    <div class="nav-icon-container">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${item.svg}</svg>
    </div>
    <span class="nav-label">${item.label}</span>
    ${item.badge ? `<span class="nav-badge">${item.badge}</span>` : ''}
  `;
  return el;
}

const navList = document.getElementById('left-nav-items');
NAV_ITEMS.forEach(item => navList.appendChild(renderNavItem(item)));

const morePopover = document.getElementById('nav-more-popover');
MORE_ITEMS.forEach(item => morePopover.appendChild(renderNavItem(item)));

const moreTrigger = document.getElementById('nav-more-trigger');
moreTrigger.addEventListener('click', () => {
  const isOpen = !morePopover.hasAttribute('hidden');
  if (isOpen) {
    morePopover.setAttribute('hidden', '');
    moreTrigger.classList.remove('active');
  } else {
    morePopover.removeAttribute('hidden');
    moreTrigger.classList.add('active');
  }
});
document.addEventListener('click', (e) => {
  if (!moreTrigger.contains(e.target) && !morePopover.contains(e.target)) {
    morePopover.setAttribute('hidden', '');
    moreTrigger.classList.remove('active');
  }
});

// Tokenize a query string into spans that match Phase 1's derived-query
// styling (--syntax, working-set, single-quoted args, leading $, etc.)
function tokenizeQuery(cmd) {
  // Already-trimmed command starting from "mod search ..."
  let html = cmd
    .replace(/^/, '<span class="cd">$ </span>')
    .replace(/\bmod search\b/g, '<span class="cb">mod search</span>')
    .replace(/(--[a-z\-]+)/g, '<span class="cb">$1</span>')
    .replace(/('[^']*')/g, '<span class="cs">$1</span>');
  return html;
}

function tokenizeMultiQuery(cmds) {
  return cmds.map(tokenizeQuery).join('\n');
}

// ===================================================================
// DOM refs
// ===================================================================
const greeter = document.getElementById('greeter');
const conversation = document.getElementById('conversation');
const promptInput = document.getElementById('prompt-input');
const sendBtn = document.getElementById('send-btn');
const moddyPanel = document.getElementById('moddy-panel');
const trigrepPanel = document.getElementById('trigrep-panel');
const divider = document.getElementById('divider');
const dividerToggle = document.getElementById('divider-toggle');
const moddyReopen = document.getElementById('moddy-reopen');
const chatInner = document.getElementById('chat-inner');
const promptWrap = document.querySelector('.prompt-wrap');

// ===================================================================
// State
// ===================================================================
let currentFlow = null;    // 'a' | 'b' | 'c' once a flow starts
let flowStarted = false;
let phase2Built = false;
let refinementApplied = false;
let enteredViaTile = false; // true if user started via tile click (not scoping)

// Merge tileVariant overrides when the flow was entered via tile click.
// Variant fields override base fields shallowly (phase2/contextualMsg are
// whole-object overrides). Flows without a tileVariant return as-is.
function getEffectiveFlow(flowId) {
  const f = FLOWS[flowId];
  if (!f) return null;
  return (enteredViaTile && f.tileVariant) ? { ...f, ...f.tileVariant } : f;
}

// ===================================================================
// Greeter layout — pull the search input into the centered group on the
// empty state, return it to the bottom of the panel once a flow starts.
// ===================================================================
function placeInputInGreeter() {
  if (!promptWrap || !greeter) return;
  // Insert the input between "Prototype triggers" (above) and the prompt tiles (below)
  const suggestions = document.getElementById('suggestions');
  if (suggestions && suggestions.parentElement === greeter) {
    greeter.insertBefore(promptWrap, suggestions);
  } else {
    greeter.appendChild(promptWrap);
  }
}
function placeInputAtBottom() {
  if (!promptWrap || !chatInner) return;
  chatInner.appendChild(promptWrap);
}
// Initial placement: empty state → input lives inside the greeter
placeInputInGreeter();

// ===================================================================
// Tile click → direct flow (skips scoping)
// ===================================================================
document.querySelectorAll('.suggestion[data-flow]').forEach(btn => {
  btn.addEventListener('click', () => startDirectFlow(btn.dataset.flow));
});

// ===================================================================
// "Or try asking:" links → scoping flow (as if the user typed the question)
// ===================================================================
document.querySelectorAll('.try-asking-link[data-scoped]').forEach(btn => {
  btn.addEventListener('click', () => startScopingFlow(btn.dataset.scoped));
});

// ===================================================================
// Chat history sidebar — collapse, new chat, item activation
// ===================================================================
const historyPane = document.getElementById('historyPane');
const historyToggleBtn = document.getElementById('history-toggle');
const historyNewChatBtn = document.getElementById('history-newchat');

historyToggleBtn.addEventListener('click', () => historyPane.classList.toggle('collapsed'));

historyNewChatBtn.addEventListener('click', () => resetToGreeter());

document.querySelectorAll('.moderne-history-item[data-history]').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.moderne-history-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    // Items are hardcoded for prototype realism — no real conversation switching.
  });
});

function resetToGreeter() {
  flowStarted = false;
  phase2Built = false;
  refinementApplied = false;
  enteredViaTile = false;
  currentFlow = null;
  conversation.innerHTML = '';
  conversation.classList.add('hidden');
  greeter.classList.remove('hidden');
  if (document.body.classList.contains('phase-2')) {
    document.body.classList.remove('phase-2');
    setNavActive('moddy');
  }
  trigrepPanel.innerHTML = '';
  trigrepPanel.setAttribute('aria-hidden', 'true');
  promptInput.placeholder = 'Ask Moddy to search, refine, or run a recipe';
  document.querySelectorAll('.moderne-history-item').forEach(i => i.classList.remove('active'));
  placeInputInGreeter();
}

// ===================================================================
// Input — Enter / Send button
//   - Phase 1, no flow yet:
//       * Tile-matching text → direct flow
//       * Scoped-trigger text → scoping flow
//       * Anything else      → fallback message
//   - Phase 2 or flow already started: appended as a user bubble (prototype: Moddy doesn't respond)
// ===================================================================
sendBtn.addEventListener('click', handleSend);
promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

function handleSend() {
  const text = promptInput.value.trim();
  if (!text) return;
  promptInput.value = '';

  if (flowStarted) {
    appendUserMessage(text);
    scrollChat();
    return;
  }

  const lc = text.toLowerCase();
  // Direct tile match (typed verbatim)
  const directMatch = Object.values(FLOWS).find(f => f.tileText.toLowerCase() === lc);
  if (directMatch) { startDirectFlow(directMatch.id); return; }

  // Scoped broad question match
  if (SCOPED_TRIGGERS[lc]) { startScopingFlow(SCOPED_TRIGGERS[lc]); return; }

  // Fallback — don't start a flow, just show a one-off message
  showFallback(text);
}

function showFallback(text) {
  placeInputAtBottom();
  greeter.classList.add('hidden');
  conversation.classList.remove('hidden');
  appendUserMessage(text);
  const moddy = document.createElement('div');
  moddy.className = 'msg-moddy fade-in';
  moddy.innerHTML = `
    <div class="fallback-msg">
      This is a prototype — try one of the prompt tiles or questions above.
    </div>
  `;
  conversation.appendChild(moddy);
  scrollChat();
}

// ===================================================================
// Direct flow — tile click (skips scoping)
// ===================================================================
function startDirectFlow(flowId) {
  if (flowStarted) return;
  const flow = FLOWS[flowId];
  if (!flow) return;
  flowStarted = true;
  currentFlow = flowId;
  enteredViaTile = true;
  placeInputAtBottom();
  greeter.classList.add('hidden');
  conversation.classList.remove('hidden');

  // Some flows (Flow B) render a tile-specific variant — both Phase 1 results
  // and the Phase 2 Trigrep panel use the variant data so the two stay in
  // sync with each other.
  const effectiveFlow = getEffectiveFlow(flowId);
  appendUserMessage(effectiveFlow.tileText);
  setTimeout(() => streamResults(effectiveFlow), 400);
}

// ===================================================================
// Scoping flow — typed broad question
// ===================================================================
function startScopingFlow(flowId) {
  if (flowStarted) return;
  const flow = FLOWS[flowId];
  if (!flow) return;
  flowStarted = true;
  currentFlow = flowId;
  enteredViaTile = false;
  placeInputAtBottom();
  greeter.classList.add('hidden');
  conversation.classList.remove('hidden');

  appendUserMessage(flow.scopedTrigger);
  setTimeout(() => {
    conversation.appendChild(buildScopingResponse(flow));
    scrollChat();
  }, 400);
}

function buildScopingResponse(flow) {
  const msg = document.createElement('div');
  msg.className = 'msg-moddy fade-in';
  const buttons = flow.scoping.options.map((opt, i) => {
    if (opt.custom) {
      return `<button class="scoping-btn" data-custom="1">
        <span class="scoping-btn-label">${opt.label}</span>
        <span class="scoping-btn-query muted">opens chat input</span>
      </button>`;
    }
    const queryClass = opt.muted ? 'scoping-btn-query muted' : 'scoping-btn-query';
    return `<button class="scoping-btn" data-idx="${i}">
      <span class="scoping-btn-label">${opt.label}</span>
      <span class="${queryClass}">${opt.query}</span>
    </button>`;
  }).join('');
  msg.innerHTML = `
    <div class="scoping-prompt">${flow.scoping.prompt}</div>
    <div class="scoping-buttons">${buttons}</div>
  `;
  msg.querySelectorAll('.scoping-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.custom) { promptInput.focus(); return; }
      // Lock the scoping buttons after choice
      msg.querySelectorAll('.scoping-btn').forEach(b => { b.disabled = true; b.style.opacity = '0.6'; b.style.cursor = 'default'; });
      btn.style.opacity = '1';
      btn.style.borderColor = 'var(--neo-digital-blue-500)';
      streamResults(flow);
    });
  });
  return msg;
}

// ===================================================================
// Streamed results — common path for both direct + scoped flows
// ===================================================================
function streamResults(flow) {
  // If we're in split view already (after Back-to-chat + new flow), rebuild left panel
  if (document.body.classList.contains('phase-2') && !phase2Built) {
    buildAndShowTrigrep(flow);
  }

  const moddy = document.createElement('div');
  moddy.className = 'msg-moddy';
  conversation.appendChild(moddy);

  let t = 200;
  setTimeout(() => { moddy.appendChild(buildModdySummary(flow)); scrollChat(); }, t);
  t += 200;
  setTimeout(() => { moddy.appendChild(buildResultsLinkCard(flow)); scrollChat(); }, t);
  t += 200;
  setTimeout(() => { moddy.appendChild(buildRecipesIntro(flow)); scrollChat(); }, t);
  t += 200;
  setTimeout(() => { moddy.appendChild(buildRecipesCard(flow)); scrollChat(); }, t);
  t += 200;
  setTimeout(() => { moddy.appendChild(buildBestMatch(flow)); scrollChat(); }, t);
  t += 200;
  setTimeout(() => { moddy.appendChild(buildBottomActions(flow)); scrollChat(); }, t);
}

function appendUserMessage(text) {
  const el = document.createElement('div');
  el.className = 'msg-user fade-in';
  el.innerHTML = `<div class="avatar">A</div><div class="msg-user-text"></div>`;
  el.querySelector('.msg-user-text').textContent = text;
  conversation.appendChild(el);
  scrollChat();
}

function scrollChat() { conversation.scrollTop = conversation.scrollHeight; }

// ===================================================================
// Component builders
// ===================================================================
function buildDerivedQuery(flow) {
  const wrap = document.createElement('div');
  wrap.className = 'derived-query fade-in';
  wrap.innerHTML = `
    <div class="derived-query-head">
      <span class="derived-query-head-title">Searched for · Trigrep</span>
      <button class="derived-query-copy" title="Copy command" aria-label="Copy command">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    <div class="derived-query-cmd">${flow.derivedQueryHtml}</div>
  `;
  wrap.querySelector('.derived-query-copy').addEventListener('click', (e) => copyDerived(e.currentTarget, flow.searchCmd));
  return wrap;
}

function copyDerived(btn, cmd) {
  try { navigator.clipboard.writeText(cmd || ''); } catch (e) {}
  const original = btn.innerHTML;
  btn.classList.add('copied');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.innerHTML = original;
  }, 1500);
}

function buildRecipesCard(flow) {

function buildBestMatch(flow) {

function buildBottomActions(flow) {
  // Keep .followup-actions class so existing refinement code finds + moves this block.
  // Keep .followup.tertiary on the Refine link so the delegated handler still fires.
  const wrap = document.createElement('div');
  wrap.className = 'followup-actions chat-bottom-actions fade-in';
  wrap.innerHTML = `
    <div class="chat-bottom-buttons">
      <button type="button" class="btn-outlined">Run recipe</button>
      <button type="button" class="btn-outlined">Export results to CSV</button>
    </div>
    <button type="button" class="followup tertiary text-link refine-link">Refine search →</button>
  `;

}

// Delegated handler for "Refine search" — works in both Phase 1 and Phase 2
document.body.addEventListener('click', (e) => {
  const btn = e.target.closest('.followup.tertiary');
  if (btn && !btn.disabled) refineSearch();
});

function refineSearch() {
  if (refinementApplied || !currentFlow) return;
  refinementApplied = true;
  const flow = FLOWS[currentFlow];

  // Per-flow refinement copy
  const refinements = {
    a: { typed: 'Just show admin-tier authorization rules',
         cmd:  "mod search working-set '(@PreAuthorize or @Secured or @RolesAllowed) /ADMIN/ visibility:public' lang:java --syntax sourcegraph",
         scope: '412 admin-tier authorization annotations across 87 repos in 64ms',
         note: 'Filtered to admin-tier annotations only. These are the rules that gate sensitive operations — the recipe will preserve their semantics while standardizing on @PreAuthorize.' },
    b: { typed: 'Narrow to actual Logger calls (skip imports)',
         cmd:  "mod search working-set 'Logger type:symbol /log\\.(error|warn|info|debug)\\(/' lang:java --syntax sourcegraph",
         scope: '8,219 logger call sites across 312 repos in 73ms',
         note: 'Filtered to actual <code>Logger</code> call sites (excluding import statements). These are the lines the recipe will rewrite — imports get cleaned up automatically.' },
    c: { typed: 'Just the legacy clients (RestTemplate)',
         cmd:  "mod search working-set 'type:symbol RestTemplate' lang:java --syntax sourcegraph",
         scope: '612 RestTemplate references across 134 repos in 81ms',
         note: 'Filtered to the legacy <code>RestTemplate</code> clients. These are the primary migration targets to <code>WebClient</code> or <code>RestClient</code>.' },
  };
  const r = refinements[currentFlow];

  appendUserMessage(r.typed);

  const moddy = document.createElement('div');
  moddy.className = 'msg-moddy fade-in';

  // Show the revised search command at the top, same component as the
  // initial results render so users see the refined query syntax.
  moddy.appendChild(buildDerivedQuery({ searchCmd: r.cmd, derivedQueryHtml: tokenizeQuery(r.cmd) }));

  const scope = document.createElement('div');
  scope.className = 'scope-line';
  scope.textContent = r.scope;
  moddy.appendChild(scope);

  const text = document.createElement('div');
  text.className = 'moddy-text';
  text.innerHTML = r.note;
  moddy.appendChild(text);

  // The result set changed, so re-surface the "View N search results" card
  // with the refined count — mirrors the initial results message layout.
  const refinedCount = (r.scope.match(/[\d,]+/) || [''])[0];
  moddy.appendChild(buildResultsLinkCard({
    moddyChat: { resultsCardLabel: `View ${refinedCount} search results` }
  }));

  conversation.appendChild(moddy);

  // Action buttons should always sit below the latest results return — move the
  // existing Phase 1 action block from the original results message into this
  // refinement message so it ends up right after the refined results card.
  const existingActions = conversation.querySelector('.followup-actions');
  if (existingActions) moddy.appendChild(existingActions);

  scrollChat();

  // Sync the Trigrep panel so the split view reflects the refinement.
  // - Update the query input to the refined inner query (between single quotes in r.cmd)
  // - Update both summary numbers (matches + files/repos) from r.scope
  if (phase2Built) {
    const queryInput = trigrepPanel.querySelector('.trigrep-query');
    if (queryInput) {
      const innerQuery = (r.cmd.match(/'([^']+)'/) || [, ''])[1];
      if (innerQuery) queryInput.value = innerQuery;
    }
    const nums = (r.scope.match(/[\d,]+/g) || []);
    const summaryCount = trigrepPanel.querySelector('#summary-count');
    const summaryFiles = trigrepPanel.querySelector('#summary-files');
    if (summaryCount && nums[0]) summaryCount.textContent = nums[0];
    if (summaryFiles && nums[1]) summaryFiles.textContent = nums[1];
  }

  // Disable all "Refine search" buttons
  document.querySelectorAll('.followup.tertiary').forEach(b => {
    b.disabled = true;
    b.style.opacity = '0.5';
    b.style.cursor = 'default';
  });
}

// ===================================================================
// Phase 2 transition
// ===================================================================
function enterPhase2() {
  if (!currentFlow) return;
  if (phase2Built) {
    document.body.classList.add('phase-2');
    setNavActive('trigrep');
    promptInput.placeholder = 'Ask about these results or run a recipe';
    setTimeout(() => { scrollChat(); }, 320);
    return;
  }
  buildAndShowTrigrep(getEffectiveFlow(currentFlow));
  promptInput.placeholder = 'Ask about these results or run a recipe';
  document.body.classList.add('phase-2');
  setNavActive('trigrep');
  setTimeout(() => {
    scrollChat();
    wireTrigrepInteractions();
  }, 320);
}

function buildAndShowTrigrep(flow) {
  trigrepPanel.innerHTML = buildTrigrepPanel(flow);
  trigrepPanel.setAttribute('aria-hidden', 'false');
  phase2Built = true;
}

function exitPhase2() {
  document.body.classList.remove('phase-2');
  setNavActive('moddy');
  if (moddyPanel.classList.contains('collapsed')) setModdyCollapsed(false);
  promptInput.placeholder = 'Ask Moddy to search, refine, or run a recipe';
  setTimeout(() => { scrollChat(); }, 320);
}
document.getElementById('back-to-chat').addEventListener('click', exitPhase2);

// Update nav rail active state
function setNavActive(id) {
  document.querySelectorAll('#left-nav-items .nav-item, #nav-more-popover .nav-item').forEach(el => {
    el.classList.remove('active');
  });
  // Find the right item by label
  const labelMap = { moddy: 'Moddy', trigrep: 'Trigrep' };
  const label = labelMap[id] || id;
  document.querySelectorAll('#left-nav-items .nav-item').forEach(el => {
    if (el.querySelector('.nav-label')?.textContent === label) el.classList.add('active');
  });
}

// ===================================================================
// Phase 2 — Trigrep panel
// ===================================================================
function buildTrigrepPanel(flow) {
  const chips = flow.phase2.chips || [];
  const chipsHtml = chips.map(c =>
    `<span class="trigrep-chip" data-chip="${c.label}"><strong>${c.label}:</strong>${c.value}<button class="trigrep-chip-x" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button></span>`
  ).join('');
  const summaryHtml = `<div class="trigrep-summary">${flow.phase2.summary}</div>`;
  const chipsRowHtml = `<div class="trigrep-chips-row">
      <div class="trigrep-chips-list">${chipsHtml}</div>
      ${summaryHtml}
    </div>`;

  const renderGroup = (group) => {
    const repoClass = group.isRepoList ? ' is-repo-list' : '';
    const overflow = group.overflowMore
      ? `<button type="button" class="filter-more-link">+${group.overflowMore.toLocaleString()} more</button>`
      : '';
    const itemsHtml = group.items.map(it => {
      const dot = it.dot ? `<span class="lang-dot" style="background:${it.dot};box-shadow:none;"></span>` : '';
      return `<div class="filter-item" data-count="${it.count}"><span class="filter-item-name">${dot}${it.name}</span><span class="count">${it.count.toLocaleString()}</span></div>`;
    }).join('');
    // Repo list: drop the "By repository" expandable header and lead with a
    // search field instead — the parent pane already labels the section.
    if (group.isRepoList) {
      return `
    <div class="filter-group is-repo-list flat" data-group="${group.id}">
      <div class="repo-search-wrap">

      </div>

    }
    return `

      <div class="filter-group-head"><span>${group.title}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div>

  return `

      <div class="trigrep-page-title">Trigrep</div>

    <div class="trigrep-head">
      <div class="trigrep-search-row">

          <div class="syntax-selector" id="syntax-selector">

// ===================================================================
// Phase 2 interactions
// ===================================================================
function wireTrigrepInteractions() {
  // Syntax selector dropdown (NL · Sourcegraph · Comby · Regex)
  const selector = trigrepPanel.querySelector('#syntax-selector');
  if (selector) {
    const btn = selector.querySelector('.syntax-selector-btn');
    const menu = selector.querySelector('.syntax-selector-menu');
    const label = selector.querySelector('.syntax-selector-label');
    const queryInput = trigrepPanel.querySelector('.trigrep-query');
    const closeMenu = () => {
      menu.hidden = true;
      selector.removeAttribute('data-open');
      btn.setAttribute('aria-expanded', 'false');
    };
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = !menu.hidden;
      if (open) { closeMenu(); return; }
      menu.hidden = false;
      selector.setAttribute('data-open', '1');
      btn.setAttribute('aria-expanded', 'true');
    });
    menu.querySelectorAll('li[role="option"]').forEach(li => {
      li.addEventListener('click', () => {
        menu.querySelectorAll('li[role="option"]').forEach(o => o.removeAttribute('aria-selected'));
        li.setAttribute('aria-selected', 'true');
        label.textContent = li.textContent.trim();
        closeMenu();
        if (queryInput && li.dataset.value === 'nl') {
          queryInput.placeholder = 'Describe what you want to find — Moddy translates to a query';
        } else if (queryInput) {
          queryInput.placeholder = '';
        }
      });
    });
    document.addEventListener('click', (e) => {
      if (!selector.contains(e.target)) closeMenu();
    });
  }

  // Filter group collapse
  trigrepPanel.querySelectorAll('.filter-group-head').forEach(head => {
    head.addEventListener('click', () => head.parentElement.classList.toggle('collapsed'));
  });
  const collapseAll = trigrepPanel.querySelector('#collapse-all');
  if (collapseAll) {
    collapseAll.addEventListener('click', () => {
      const groups = trigrepPanel.querySelectorAll('.filter-group');
      const anyOpen = [...groups].some(g => !g.classList.contains('collapsed'));
      groups.forEach(g => g.classList.toggle('collapsed', anyOpen));
      collapseAll.textContent = anyOpen ? 'Expand all' : 'Collapse all';
    });
  }

  // Filter item toggle + summary update
  const flow = getEffectiveFlow(currentFlow);
  const baseMatches = flow.phase2.baseMatches;
  const baseFiles = flow.phase2.baseFiles;
  const activeFilters = new Map();
  const summaryCount = trigrepPanel.querySelector('#summary-count');
  const summaryFiles = trigrepPanel.querySelector('#summary-files');
  trigrepPanel.querySelectorAll('.filter-item').forEach(item => {
    item.addEventListener('click', () => {
      const key = item.querySelector('.filter-item-name').textContent.trim();
      const count = parseInt(item.dataset.count, 10) || 0;
      if (activeFilters.has(key)) activeFilters.delete(key);
      else activeFilters.set(key, count);
      item.classList.toggle('active');
      if (activeFilters.size === 0) {
        summaryCount.textContent = baseMatches.toLocaleString();
        summaryFiles.textContent = baseFiles.toLocaleString();
      } else {
        const total = [...activeFilters.values()].reduce((a, b) => a + b, 0);
        summaryCount.textContent = total.toLocaleString();
        summaryFiles.textContent = Math.max(1, Math.ceil(total / 5.5)).toLocaleString();
      }
    });
  });

  // Chip removal
  trigrepPanel.querySelectorAll('.trigrep-chip-x').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      btn.closest('.trigrep-chip').remove();
    });
  });

  // Topic search filter
  const topicSearch = trigrepPanel.querySelector('.topic-search');
  if (topicSearch) {
    topicSearch.addEventListener('input', () => {
      const q = topicSearch.value.toLowerCase().trim();
      const group = topicSearch.closest('.filter-group-body');
      group.querySelectorAll('.filter-item').forEach(item => {
        const name = item.querySelector('.filter-item-name').textContent.toLowerCase();
        item.style.display = (q === '' || name.includes(q)) ? '' : 'none';
      });
    });
  }

  // Result card collapse via chevron
  trigrepPanel.querySelectorAll('.chevron-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.result-card').classList.toggle('collapsed'));
  });

  // File path drill-down — every card knows its own id
  trigrepPanel.querySelectorAll('.result-card .result-card-file').forEach(el => {
    const card = el.closest('.result-card');
    const id = card?.dataset.cardId;
    if (id && FILE_DETAILS[id]) {
      el.addEventListener('click', () => showFileDetail(FILE_DETAILS[id]));
    } else {
      el.classList.remove('is-clickable');
    }
  });
}

function showFileDetail(file) {
  const body = trigrepPanel.querySelector('.trigrep-body');
  if (!body) return;
  let detail = body.querySelector('.trigrep-detail');
  if (!detail) {
    detail = document.createElement('div');
    detail.className = 'trigrep-detail';
    body.appendChild(detail);
  }
  detail.innerHTML = buildFileDetailHTML(file);
  detail.querySelector('.detail-back').addEventListener('click', showResultsList);

  body.style.opacity = '0';
  setTimeout(() => {
    body.classList.add('detail-mode');
    body.style.opacity = '1';
  }, 100);
}

function showResultsList() {
  const body = trigrepPanel.querySelector('.trigrep-body');
  if (!body) return;
  body.style.opacity = '0';
  setTimeout(() => {
    body.classList.remove('detail-mode');
    body.style.opacity = '1';
  }, 100);
}

function buildFileDetailHTML(file) {
  const linesHtml = file.lines.map(l => {
    const code = (l.code || ' ').replace(/<m>/g, '<span class="match">').replace(/<\/m>/g, '</span>');
    return `<div class="code-line ${l.hasMatch ? 'has-match' : ''}"><span class="code-ln">${l.n}</span><span class="code-text">${code}</span></div>`;
  }).join('');
  return `
    <div class="detail-breadcrumb">
      <button class="detail-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Search results
      </button>
      <span class="detail-crumb-sep">/</span>
      <span class="detail-crumb-current">${file.name}</span>
    </div>
    <div class="detail-search-row">
      <label class="detail-search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search in file…" spellcheck="false">
        <span class="kbd-hint">⌘F</span>
      </label>
    </div>
    <div class="detail-header">
      <div class="detail-header-row">
        <div class="detail-file-path">${file.path}</div>
        <span class="result-card-meta">${file.matchCount} match${file.matchCount === 1 ? '' : 'es'}</span>
      </div>
      <div class="detail-module">${file.module}</div>
    </div>
    <div class="detail-code">${linesHtml}</div>
  `;
}

// ===================================================================
// Divider drag + collapse toggle (Phase 2 only)
// ===================================================================
let dragging = false, dragStartX = 0, startModdyWidth = 0;
divider.addEventListener('mousedown', (e) => {
  if (!document.body.classList.contains('phase-2')) return;
  if (e.target.closest('.divider-toggle')) return;
  if (moddyPanel.classList.contains('collapsed')) return;
  dragging = true;
  dragStartX = e.clientX;
  startModdyWidth = moddyPanel.getBoundingClientRect().width;
  divider.classList.add('dragging');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'col-resize';
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX;
  const newWidth = startModdyWidth - dx;
  const pageWidth = document.getElementById('page').getBoundingClientRect().width;
  const min = Math.max(320, pageWidth * 0.25);
  const max = pageWidth * 0.5;
  const clamped = Math.min(Math.max(newWidth, min), max);
  moddyPanel.style.transition = 'none';
  moddyPanel.style.flex = `0 0 ${clamped}px`;
});
window.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  divider.classList.remove('dragging');
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
  setTimeout(() => { moddyPanel.style.transition = ''; }, 50);
});

function setModdyCollapsed(collapsed) {
  if (collapsed) {
    moddyPanel.dataset.lastFlex = moddyPanel.style.flex || '';
    moddyPanel.style.flex = '';
    moddyPanel.classList.add('collapsed');
    moddyReopen.classList.add('visible');
    dividerToggle.title = 'Open Moddy';
    dividerToggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
  } else {
    moddyPanel.classList.remove('collapsed');
    if (moddyPanel.dataset.lastFlex) moddyPanel.style.flex = moddyPanel.dataset.lastFlex;
    moddyReopen.classList.remove('visible');
    dividerToggle.title = 'Collapse Moddy';
    dividerToggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  }
}
dividerToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  setModdyCollapsed(!moddyPanel.classList.contains('collapsed'));
});
moddyReopen.addEventListener('click', () => setModdyCollapsed(false));
const moddyCloseBtn = document.getElementById('moddy-close-btn');
if (moddyCloseBtn) {
  moddyCloseBtn.addEventListener('click', () => setModdyCollapsed(true));
}

// TRIGREP LANDING MODE (new entry point) — overrides the source's
// Phase 1 / Phase 2 dance. Trigrep is always visible and active;
// Moddy lives as an optional side panel that starts collapsed.
// ===================================================================
// Defer to next tick so all let/const declarations later in the script
// (FLOWS, FILE_DETAILS, HELP_TEXT, trigrepCurrentMode, …) finish initializing
// before this init code runs and references them.
setTimeout(initTrigrepLandingBoot, 0);
function initTrigrepLandingBoot() {
  // Activate trigrep as the active nav item
  setNavActive('trigrep');

  // Moddy panel starts collapsed in landing mode
  setModdyCollapsed(true);
  // Hide the moddy "reopen" tab — discoverability lives in the top-bar button now
  moddyReopen.style.display = 'none';

  // Build trigrep landing (empty) — search bar + example queries + sidebar empty
  trigrepPanel.innerHTML = buildTrigrepLandingHTML();
  trigrepPanel.setAttribute('aria-hidden', 'false');
  wireTrigrepLanding();

  // Hide greeter that source rendered for Phase 1 — we don't need it
  if (greeter) greeter.classList.add('hidden');
  if (conversation) conversation.classList.remove('hidden');
  placeInputAtBottom();
  promptInput.placeholder = 'Ask Moddy about these results…';

  // Top-bar Moddy button toggles the Moddy panel
  const topbarBtn = document.getElementById('topbar-moddy-btn');
  if (topbarBtn) {
    topbarBtn.addEventListener('click', () => {
      const collapsed = moddyPanel.classList.contains('collapsed');
      setModdyCollapsed(!collapsed);
      topbarBtn.classList.toggle('active', collapsed);
    });
  }

  // When user clicks Moddy panel close, also un-activate top-bar button
  const closeBtn = document.getElementById('moddy-close-btn');
  if (closeBtn) {
    closeBtn.addEventListener('click', () => {
      if (topbarBtn) topbarBtn.classList.remove('active');
    });
  }
}

function setSyntaxMode(mode) {

// Crude NL vs syntax auto-detection: if the text has any of the common
// syntax tokens (@, lang:, type:, visibility:, /regex/, structural :[ ),
// treat it as syntax; otherwise NL.
function looksLikeSyntax(text) {
  if (!text) return false;
  const t = text.trim();
  if (/^[@/]/.test(t)) return true;
  if (/\b(lang|type|visibility|extends|implements|returns|throws|file|repo)\s*:/i.test(t)) return true;
  if (/:\[/.test(t)) return true;
  if (/\b(or|and)\b.*@/i.test(t)) return true;
  if (/^[a-z][a-zA-Z0-9.]*$/.test(t) && t.includes('.')) return true;
  return false;
}

function wireTrigrepSearchBar() {
  const input = trigrepPanel.querySelector('#trigrep-query-input');
  const btn = trigrepPanel.querySelector('#trigrep-search-btn');
  if (!input || !btn) return;

  // Auto-detect mode as user types
  input.addEventListener('input', () => {
    const v = input.value;
    if (!v) return;
    const syntaxy = looksLikeSyntax(v);
    if (syntaxy && trigrepCurrentMode === 'moddy') setSyntaxMode('sourcegraph');
    else if (!syntaxy && trigrepCurrentMode !== 'moddy' && v.length > 12) setSyntaxMode('moddy');
  });

  const submit = () => {
    const text = (input.value || '').trim();
    if (!text) return;
    // Match against example queries (NL or syntax) — happy paths
    const nlMatch = Object.entries(NL_EXAMPLES).find(([, t]) => t.toLowerCase() === text.toLowerCase());
    if (nlMatch) { startNLTranslation(nlMatch[0], text); return; }
    const syntaxMatch = Object.entries(SYNTAX_EXAMPLES).find(([, t]) => t.toLowerCase() === text.toLowerCase());
    if (syntaxMatch) { executeSearch(syntaxMatch[0], { fromNL: null }); return; }
    // If we're in Moddy mode, attempt NL translation for typed text
    if (trigrepCurrentMode === 'moddy') {
      // Default to a fallback message
      showSearchFallback();
      return;
    }
    showSearchFallback();
  };

  btn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
}

// ===================================================================
// NL search — translates and executes in one step. The teaching surface
// is the breadcrumb under the search bar (NL → derived syntax). Users
// who want to edit the syntax just type in the search bar.
// ===================================================================
function startNLTranslation(flowId, nlText) {
  executeSearch(flowId, { fromNL: nlText });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ===================================================================
// Execute a search — flips trigrep to results state for that flow,
// rebuilds sidebar + results, sets the breadcrumb if it came from NL.
// ===================================================================
function executeSearch(flowId, opts) {
  const flow = (FLOWS[flowId] && FLOWS[flowId].tileVariant) ? { ...FLOWS[flowId], ...FLOWS[flowId].tileVariant } : FLOWS[flowId];
  if (!flow) return;
  currentFlow = flowId;
  enteredViaTile = (flowId === 'b'); // Log4j uses the tileVariant data
  translatedFromNL = (opts && opts.fromNL) || null;

  // Wipe NL translation slot
  const slot = trigrepPanel.querySelector('#nl-translation-slot');
  if (slot) slot.innerHTML = '';

  // Update the search bar input value to the final query
  const input = trigrepPanel.querySelector('#trigrep-query-input');
  if (input) {
    input.value = FINAL_QUERIES[flowId] || flow.phase2.query;
    input.style.color = '';
  }
  setSyntaxMode('sourcegraph');

  // Rebuild results + sidebar
  renderTrigrepResults(flow);
  // Rebuild Moddy panel content (latent — only visible when user opens panel)
  rebuildModdyForFlow(flowId);
  phase2Built = true;
}

// Filters to pre-activate per flow — derived from the search query semantics

const PRESET_ACTIVE_FILTERS = {

  // Remove pre-existing results toolbar (if user is running a second search)

  // ----- Sidebar groups -----
  const activeSet = PRESET_ACTIVE_FILTERS[currentFlow] || new Set();
  const renderGroup = (group) => {
    const repoClass = group.isRepoList ? ' is-repo-list' : '';

  const nonRepoFilters = flow.phase2.filters.filter(g => !g.isRepoList);

  const repoFiltersHtml    = repoFilters.map(renderGroup).join('');

  const repoCount = flow.phase2.baseFiles || 0;

  // ----- Result cards -----
  const initialCards = [...flow.cards, ...(flow.phase2.extraCards || []).slice(0, 3)];

  // ----- Results toolbar — sits ABOVE the body row (full-width band) -----
  const ff = (typeof MODDY_FREEFLOW !== 'undefined' && MODDY_FREEFLOW[currentFlow]) || null;
  const recipeCountEffective = (ff && ff.recipes && ff.recipes.length) || 3;
  // Pull match + file numbers out of the summary HTML (e.g. "1,892" + "234" + "89ms")
  const summaryRaw = flow.phase2.summary || '';
  const nums = (summaryRaw.replace(/<[^>]+>/g, '').match(/[\d,]+/g) || []);
  const matchCount = nums[0] || '';
  const fileCount = nums[1] || '';
  const timeMs = (summaryRaw.match(/([\d.]+ms)/) || [, ''])[1];
  const toolbarHtml = `
    <div class="results-toolbar">
      <div class="results-toolbar-left">
        <button class="recipes-available-card" type="button" data-open-moddy="1" title="Open Moddy recipe recommendations">

          <span>${recipeCountEffective} recipes available</span>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
      <div class="results-toolbar-right">
        <span class="results-toolbar-summary"><strong id="summary-count">${matchCount}</strong> matches across <strong id="summary-files">${fileCount}</strong> files</span>
        <a class="results-toolbar-export" href="#" onclick="return false;" title="Export results as CSV">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </a>
        <span class="results-toolbar-time">${timeMs}</span>
      </div>
    </div>

  // Insert toolbar between head and body
  head.insertAdjacentHTML('afterend', toolbarHtml);

  // Replace body content (no chips, no breakdown — sidebar shows active filters)
  body.innerHTML = `
    <aside class="trigrep-sidebar" aria-label="Repositories and filters">
      ${repoFiltersHtml ? `
      <section class="trigrep-pane trigrep-pane-repos" aria-label="Repositories">

  wireResultsInteractions(flow, remainingCards);

function buildResultCardHTML(card) {
  return `
    <article class="result-card" data-card-id="${card.id}">

        </div>
      </div>

          ${card.lines.map(l => `<div class="code-line simple"><span class="code-ln">${l.n}</span><span class="code-text">${l.code.replace(/<m>/g, '<span class="match">').replace(/<\/m>/g, '</span>')}</span></div>`).join('')}
        </div>
      </div>
    </article>
  `;
}

function wireResultsInteractions(flow, remainingCards) {
  const baseMatches = flow.phase2.baseMatches;
  const baseFiles = flow.phase2.baseFiles;
  const activeFilters = new Map();
  const summaryCount = trigrepPanel.querySelector('#summary-count');
  const summaryFiles = trigrepPanel.querySelector('#summary-files');

  // Filter group collapse
  trigrepPanel.querySelectorAll('.filter-group-head').forEach(head => {
    head.addEventListener('click', () => head.parentElement.classList.toggle('collapsed'));
  });
  const collapseAll = trigrepPanel.querySelector('#collapse-all');
  if (collapseAll) {
    collapseAll.addEventListener('click', () => {
      const groups = trigrepPanel.querySelectorAll('.filter-group');
      const anyOpen = [...groups].some(g => !g.classList.contains('collapsed'));
      groups.forEach(g => g.classList.toggle('collapsed', anyOpen));
      collapseAll.textContent = anyOpen ? 'Expand all' : 'Collapse all';
    });
  }
  trigrepPanel.querySelectorAll('.filter-item').forEach(item => {
    item.addEventListener('click', () => {
      const key = item.querySelector('.filter-item-name').textContent.trim();
      const count = parseInt(item.dataset.count, 10) || 0;
      if (activeFilters.has(key)) activeFilters.delete(key);
      else activeFilters.set(key, count);
      item.classList.toggle('active');
      if (activeFilters.size === 0) {
        if (summaryCount) summaryCount.textContent = baseMatches.toLocaleString();
        if (summaryFiles) summaryFiles.textContent = baseFiles.toLocaleString();
      } else {
        const total = [...activeFilters.values()].reduce((a, b) => a + b, 0);
        if (summaryCount) summaryCount.textContent = total.toLocaleString();
        if (summaryFiles) summaryFiles.textContent = Math.max(1, Math.ceil(total / 5.5)).toLocaleString();
      }
    });
  });
  // Chip removal
  trigrepPanel.querySelectorAll('.trigrep-chip-x').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); btn.closest('.trigrep-chip').remove(); });
  });
  // Topic search
  const topicSearch = trigrepPanel.querySelector('.topic-search');
  if (topicSearch) {
    topicSearch.addEventListener('input', () => {
      const q = topicSearch.value.toLowerCase().trim();
      const group = topicSearch.closest('.filter-group-body');
      group.querySelectorAll('.filter-item').forEach(item => {
        const name = item.querySelector('.filter-item-name').textContent.toLowerCase();
        item.style.display = (q === '' || name.includes(q)) ? '' : 'none';
      });
    });
  }
  // Repo search
  const repoSearch = trigrepPanel.querySelector('.repo-search');
  if (repoSearch) {
    repoSearch.addEventListener('input', () => {
      const q = repoSearch.value.toLowerCase().trim();
      const list = repoSearch.closest('.filter-group').querySelector('.repo-list-body');
      list.querySelectorAll('.filter-item').forEach(item => {
        const name = item.querySelector('.filter-item-name').textContent.toLowerCase();
        item.style.display = (q === '' || name.includes(q)) ? '' : 'none';
      });
    });
  }
  // Chevron collapse
  trigrepPanel.querySelectorAll('.chevron-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.result-card').classList.toggle('collapsed'));
  });
  // File drill-down
  trigrepPanel.querySelectorAll('.result-card .result-card-file').forEach(el => {
    const card = el.closest('.result-card');
    const id = card?.dataset.cardId;
    if (id && FILE_DETAILS[id]) {
      el.addEventListener('click', () => showFileDetail(FILE_DETAILS[id]));
    } else {
      el.classList.remove('is-clickable');
    }
  });
  // Breakdown "N recipes…" link → opens Moddy panel
  const breakdownLink = trigrepPanel.querySelector('.breakdown-recipes-link[data-open-moddy]');
  if (breakdownLink) {
    breakdownLink.addEventListener('click', () => {
      setModdyCollapsed(false);
      const topbarBtn = document.getElementById('topbar-moddy-btn');
      if (topbarBtn) topbarBtn.classList.add('active');
    });
  }
  // Show more
  const showMoreBtn = trigrepPanel.querySelector('#show-more-btn');
  if (showMoreBtn) {
    showMoreBtn.addEventListener('click', () => {
      if (!remainingCards.length) {
        showMoreBtn.style.display = 'none';
        return;
      }
      const list = trigrepPanel.querySelector('#result-cards-list');
      const toAdd = remainingCards.splice(0, 2);
      const html = toAdd.map(buildResultCardHTML).join('');
      list.insertAdjacentHTML('beforeend', html);
      // Re-wire newly added cards
      toAdd.forEach(card => {
        const el = list.querySelector(`.result-card[data-card-id="${card.id}"]`);
        if (!el) return;
        el.querySelector('.chevron-btn').addEventListener('click', () => el.classList.toggle('collapsed'));
        const fileEl = el.querySelector('.result-card-file');
        if (FILE_DETAILS[card.id]) {
          fileEl.addEventListener('click', () => showFileDetail(FILE_DETAILS[card.id]));
        } else {
          fileEl.classList.remove('is-clickable');
        }
      });
      if (!remainingCards.length) showMoreBtn.style.display = 'none';
    });
  }
}

function rebuildModdyForFlow(flowId) {
  // Clear conversation, append new structured response for this flow
  conversation.innerHTML = '';
  conversation.classList.remove('hidden');
  if (greeter) greeter.classList.add('hidden');
  placeInputAtBottom();
  promptInput.placeholder = 'Ask Moddy about these results…';

  const data = MODDY_FREEFLOW[flowId];
  if (!data) return;

  const moddy = document.createElement('div');
  moddy.className = 'msg-moddy fade-in';
  conversation.appendChild(moddy);

  let html = '';
  data.intro.forEach((p, i) => {
    html += `<p class="moddy-context-msg${i === 0 ? ' lead' : ''}">${p}</p>`;
  });
  if (data.diagram) {
    html += buildFlowCDiagramHTML();
  }
  if (data.afterDiagram) {
    data.afterDiagram.forEach(p => {
      html += `<p class="moddy-context-msg">${p}</p>`;
    });
  }
  if (data.recipes) {
    html += `<div class="moddy-recipe-box-list">`;
    data.recipes.forEach(r => {
      html += `
        <div class="moddy-recipe-box" data-recipe-id="${r.id}">
          <span class="moddy-recipe-box-name">${r.id}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      `;
    });
    html += `</div>`;
  }
  if (data.outro) {
    data.outro.forEach(p => {
      html += `<p class="moddy-context-msg">${p}</p>`;
    });
  }

  moddy.innerHTML = html;

  // Recipe box hover/click (non-functional placeholder)
  moddy.querySelectorAll('.moddy-recipe-box').forEach(box => {
    box.addEventListener('click', () => {
      box.style.borderColor = 'var(--neo-digital-blue-500)';
      const name = box.querySelector('.moddy-recipe-box-name')?.textContent;
      // No-op for prototype — just visual feedback
    });
  });

  scrollChat();
}

// ===================================================================
// Moddy chat input — typed broad questions trigger scoping cards
// ===================================================================
const MODDY_BROAD_QUESTIONS = {
  'how is authentication handled?': 'a',
  'how is logging done across our services?': 'b',
  'how are our rest apis structured?': 'c',
};

// Override the existing handleSend (defined earlier in the file) — it's
// a function declaration so we reassign via a wrapper. The original is
// also bound via sendBtn click + keydown, which still call this name.
const _origHandleSend = handleSend;
handleSend = function() {
  const text = promptInput.value.trim();
  if (!text) return;
  promptInput.value = '';

  const lc = text.toLowerCase();
  // Broad questions → scoping cards
  if (MODDY_BROAD_QUESTIONS[lc]) {
    const flowId = MODDY_BROAD_QUESTIONS[lc];
    appendUserMessage(text);
    setTimeout(() => {
      const flow = FLOWS[flowId];
      conversation.appendChild(buildScopingResponseTrigrep(flow, flowId));
      scrollChat();
    }, 400);
    return;
  }
  // Anything else → fallback
  appendUserMessage(text);
  const fallback = document.createElement('div');
  fallback.className = 'msg-moddy fade-in';
  fallback.innerHTML = `
    <div class="fallback-msg">
      This is a prototype — try asking about <strong>authentication</strong>, <strong>logging</strong>, or <strong>REST APIs</strong>.
    </div>
  `;
  conversation.appendChild(fallback);
  scrollChat();
};
// Rewire input handlers to the new handleSend
sendBtn.replaceWith(sendBtn.cloneNode(true));
const newSendBtn = document.getElementById('send-btn');
newSendBtn.addEventListener('click', handleSend);
promptInput.replaceWith(promptInput.cloneNode(true));
const newPromptInput = document.getElementById('prompt-input');
newPromptInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

function buildScopingResponseTrigrep(flow, flowId) {
  const msg = document.createElement('div');
  msg.className = 'msg-moddy fade-in';
  const buttons = flow.scoping.options.map((opt, i) => {
    if (opt.custom) {
      return `<button class="scoping-btn" data-custom="1">
        <span class="scoping-btn-label">${opt.label}</span>
        <span class="scoping-btn-query muted">opens chat input</span>
      </button>`;
    }
    const queryClass = opt.muted ? 'scoping-btn-query muted' : 'scoping-btn-query';
    return `<button class="scoping-btn" data-idx="${i}">
      <span class="scoping-btn-label">${opt.label}</span>
      <span class="${queryClass}">${opt.query}</span>
    </button>`;
  }).join('');
  msg.innerHTML = `
    <div class="scoping-prompt">${flow.scoping.prompt}</div>
    <div class="scoping-buttons">${buttons}</div>
  `;
  msg.querySelectorAll('.scoping-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.custom) { document.getElementById('prompt-input').focus(); return; }
      msg.querySelectorAll('.scoping-btn').forEach(b => { b.disabled = true; b.style.opacity = '0.6'; b.style.cursor = 'default'; });
      btn.style.opacity = '1';
      btn.style.borderColor = 'var(--neo-digital-blue-500)';
      const idx = parseInt(btn.dataset.idx, 10);
      const opt = flow.scoping.options[idx];
      // Populate search bar and run the flow's search
      const input = trigrepPanel.querySelector('#trigrep-query-input');
      if (input) input.value = opt.query;
      executeSearch(flowId, { fromNL: null });
    });
  });
  return msg;
}
