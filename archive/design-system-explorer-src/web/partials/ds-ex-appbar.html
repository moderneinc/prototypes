<!-- Shared example-screen app bar (mirrors GlobalNavigationBar), restyled with
     our tokens. Static, no data. -->
<div class="ds-appbar">
  <button class="org">
    <svg class="ds-ic" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2.5" width="8" height="13" rx="1"/><path d="M11 6h4v9.5H3M6 5.5h2M6 8h2M6 10.5h2"/></svg>
    Moderne
    <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l4 4 4-4"/></svg>
  </button>
  <span class="spacer"></span>
  <span class="ds-input-wrap" style="max-width:280px">
    <svg class="ds-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M11 11l3 3"/></svg>
    <input class="ds-input ds-input--sm" placeholder="Search recipes, repos…" aria-label="Search" />
  </span>
  <button class="ds-btn ds-btn--icon ds-btn--subtle" aria-label="Navigation menu" title="Navigation menu">
    <svg class="ds-ic" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="3.5" r="1.4"/><circle cx="8" cy="3.5" r="1.4"/><circle cx="12.5" cy="3.5" r="1.4"/><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/><circle cx="3.5" cy="12.5" r="1.4"/><circle cx="8" cy="12.5" r="1.4"/><circle cx="12.5" cy="12.5" r="1.4"/></svg>
  </button>
  <span class="ds-avatar ds-avatar--sm" title="User account">JJ</span>
</div>
