  * { margin: 0; padding: 0; box-sizing: border-box; }

    background: var(--mod-bg);
    color: var(--mod-bone-dim);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.55;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }

  /* ===== Shell ===== */
  body { background: var(--surface-page); }
  .shell { height: 100vh; display: flex; flex-direction: column; }
  .grid {
    display: grid;
    grid-template-columns: 98px 1fr;
    grid-template-areas: "nav content";
    flex: 1;
    overflow: hidden;
    gap: 0;
    background: var(--surface-page);
  }

/* ================================================
   LEFT NAVIGATION RAIL (98px) — v2-sandbox spec
   ================================================ */
.left-nav {
  grid-area: nav;
  width: 98px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  padding: 2px 8px 24px;
  gap: 0;
  background: var(--surface-page);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  overflow: visible;
}

.left-nav-top {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  gap: 4px;
}

.nav-item-home { padding: 0 4px; }
.nav-item-home .nav-icon-container { padding: 4px; }

.nav-item {
  width: 100%;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  position: relative;
  text-decoration: none;
  background: transparent;
}

.nav-icon-container {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: var(--radius-lg);
  border: 1px solid transparent;
  background: transparent;
  transition: background-color 150ms ease, border-color 150ms ease;
}

.nav-item:hover .nav-icon-container,
.nav-item.active .nav-icon-container {
  background: var(--brand-digital-blue-100);
  border-color: var(--brand-digital-blue-200);
}

.nav-item svg {
  width: 22px;
  height: 22px;
  min-width: 22px;
  color: var(--brand-grey-900);
  flex-shrink: 0;
}

.nav-label {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: var(--brand-font-weight-regular);
  line-height: 1;
  color: var(--brand-grey-900);
  text-align: center;
  white-space: normal;
  width: 100%;
  transition: color 150ms ease;
}

.nav-item:hover .nav-label { color: var(--brand-digital-blue-600); }
.nav-item.active .nav-label {
  font-weight: var(--brand-font-weight-semibold);
  color: var(--brand-digital-blue-800);
}

.nav-badge {
  font-size: 11px;
  padding: 0 6px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--brand-grey-200);
  color: var(--brand-grey-800);
  border: 1px solid rgba(107, 114, 128, 0.5);
  font-weight: var(--brand-font-weight-medium);
  line-height: 1;
  text-align: center;
  letter-spacing: 0;
}

.nav-home-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
  padding: 4px 0;
}

.nav-version-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--brand-digital-blue-500) 0%, var(--brand-violet-500) 100%);
  color: var(--brand-white);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: var(--brand-font-weight-semibold);
  line-height: 1;
  letter-spacing: 0;
}

.nav-more-wrapper { position: relative; margin-top: auto; }

.nav-more-popover {
  position: absolute;
  left: calc(100% + 4px);
  bottom: 0;
  background: var(--surface-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 96px;
  z-index: 100;
}

.nav-more-popover[hidden] { display: none; }
.nav-more-popover .nav-item { padding: 8px 4px; }

/* ================================================
   MAIN CONTENT AREA
   ================================================ */
.main-area {
  grid-area: content;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* ================================================
   GLOBAL NAVIGATION BAR (65px toolbar)
   ================================================ */
.global-nav {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 12px 20px;
  gap: 12px;
  flex-shrink: 0;
  position: relative;
  width: 100%;
}

.global-nav::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 70%;
  transform: translate(-50%, -50%);
  width: 1000px;
  max-width: 90%;
  height: 65px;
  background: radial-gradient(ellipse at center, var(--brand-red-100) 0%, var(--brand-red-100) 40%, transparent 70%);
  filter: blur(20px);
  z-index: 0;
  pointer-events: none;
}

.global-nav > * { position: relative; z-index: 1; }

.org-selector {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  color: var(--text-primary);
  cursor: pointer;
  padding: 10px 16px;
  border-radius: var(--radius-full);
  transition: all var(--transition-fast);
  background: var(--surface-primary);
  border: 1px solid var(--border-secondary);
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-transform: none;
}

.org-selector:hover {
  background: var(--brand-grey-200);
  border-color: var(--border-primary);
}

.org-selector.selected {
  color: var(--text-primary);
  font-weight: var(--brand-font-weight-regular);
}

.org-selector-wrapper {
  position: relative;
  flex: 0 1 auto;
  min-width: 0;
  max-width: 50vw;
}

.nav-spacer { flex: 1; }

.search-input {
  height: 40px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-secondary);
  padding: 10px 16px;
  font-size: var(--brand-font-size-300);
  color: var(--text-tertiary);
  background: var(--surface-primary);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: background var(--transition-fast), border-color var(--transition-fast);
  flex-shrink: 0;
  user-select: none;
}

.search-input:hover {
  background: var(--brand-grey-200);
  border-color: var(--border-primary);
}

.search-input > span:first-of-type { flex: 1; white-space: nowrap; }
.search-input-keys { display: inline-flex; align-items: center; gap: 2px; }

.search-input kbd {
  font-size: var(--brand-font-size-100);
  background: var(--surface-tertiary);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-tertiary);
  font-family: var(--font-body);
  border: 1px solid var(--border-primary);
  min-width: 18px;
  text-align: center;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 64px;
}

.nav-action-btn {
  width: 40px;
  height: 40px;
  border-radius: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background var(--transition-fast), transform 200ms ease-in;
  border: none;
  background: transparent;
  color: var(--brand-grey-900);
  flex-shrink: 0;
}

.nav-action-btn:hover { background: var(--brand-grey-200); }
.nav-action-btn.open { background: var(--surface-primary); box-shadow: var(--shadow-xs); }
.nav-action-btn svg { width: 20px; height: 20px; }

.avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background: var(--mod-green);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: var(--brand-font-weight-semibold);
  color: var(--mod-on-accent);
  flex-shrink: 0;
}

  /* ===== Page (full-width trigrep panel) ===== */
  .page {
    flex: 1;
    background:
      radial-gradient(ellipse 1100px 600px at 50% -10%,
        rgba(255, 90, 71, 0.14) 0%,
        rgba(255, 90, 71, 0.04) 35%,
        transparent 65%),
      radial-gradient(ellipse 900px 700px at 95% 105%,
        rgba(95, 230, 168, 0.10) 0%,
        rgba(95, 230, 168, 0.03) 40%,
        transparent 70%),
      var(--bg);
    border-radius: 8px;
    overflow: hidden;
    margin: 0 8px 8px 0;
    min-height: 0;
    display: flex;
    position: relative;
  }
  .trigrep-panel {
    flex: 1 1 auto;
    min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ===== Trigrep left panel ===== */
  .trigrep-page-header {
    padding: 20px 24px 12px;
    background: var(--mod-panel);
    flex-shrink: 0;
  }
  .trigrep-page-title {
    font-family: var(--font-heading, 'Inter', sans-serif);
    font-size: 21px;
    font-weight: 400;
    color: var(--grey-900, #111827);
    line-height: 1.4;
  }
  .trigrep-page-subtitle {
    font-size: 14px;
    color: var(--grey-600, #6B7280);
    margin-top: 2px;
  }
  .trigrep-head {
    padding: 8px 24px 12px;
    border-bottom: 1px solid var(--mui-divider);
    flex-shrink: 0;
    background: var(--mod-panel);
  }
  .trigrep-search-row {
    display: flex; align-items: center; gap: 10px;
  }
  .trigrep-search-box {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    background: var(--mod-panel);
    border: 1px solid var(--grey-200);
    border-radius: 8px;
    padding: 6px 10px 6px 12px;
    min-height: 40px;
  }
  .trigrep-search-box:focus-within {
    border-color: var(--neo-digital-blue-500);
    box-shadow: 0 0 0 3px rgba(51, 255, 153, 0.18);
  }
  .trigrep-search-icon { width: 16px; height: 16px; color: var(--grey-500); flex-shrink: 0; }
  /* Syntax selector */
  .syntax-selector { position: relative; flex-shrink: 0; }
  .syntax-selector-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; border: 0;
    padding: 4px 6px;
    font-size: 12px; color: var(--grey-600, #555);
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
  }
  .syntax-selector-btn:hover { background: var(--grey-50, #f5f5f5); color: var(--grey-700, #2b2b2b); }
  .syntax-selector-btn svg { width: 10px; height: 10px; color: var(--grey-500, #777); }
  .syntax-selector[data-open="1"] .syntax-selector-btn svg { transform: rotate(180deg); }
  .syntax-selector-divider {
    width: 1px; height: 18px;
    background: var(--grey-200, #e6e6e6);
    flex-shrink: 0;
    margin: 0 2px;
  }
  .syntax-selector-menu {
    position: absolute;
    top: calc(100% + 6px); left: 0;
    margin: 0; padding: 4px;
    list-style: none;
    background: var(--mod-panel);
    border: 1px solid var(--grey-200, #e6e6e6);
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    z-index: 30;
    min-width: 260px;
  }
  .syntax-selector-menu li {
    padding: 8px 10px;
    font-size: 12px;
    color: var(--grey-700, #2b2b2b);
    cursor: pointer;
    border-radius: 4px;
    display: flex; flex-direction: column;
    gap: 2px;
  }
  .syntax-selector-menu li:hover { background: var(--grey-50, #f5f5f5); }
  .syntax-selector-menu li[aria-selected="true"] {
    color: var(--neo-digital-blue-500);
    font-weight: 500;
  }
  .syntax-selector-menu .opt-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 500;
    color: var(--grey-900);
  }
  .syntax-selector-menu .opt-label svg { width: 12px; height: 12px; color: var(--grey-500); }
  .syntax-selector-menu .opt-desc {
    font-size: 11px; color: var(--grey-500);
    font-family: 'JetBrains Mono', monospace;
  }
  .syntax-selector-menu li[aria-selected="true"] .opt-label { color: var(--neo-digital-blue-500); }
  .syntax-selector-menu li[aria-selected="true"] .opt-label svg { color: var(--neo-digital-blue-500); }
  .trigrep-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--grey-50);
    color: var(--grey-700);
    border: 1px solid var(--grey-100);
    border-radius: 6px;
    padding: 3px 4px 3px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    white-space: nowrap;
  }
  .trigrep-chip strong { color: var(--grey-500); font-weight: 500; margin-right: 1px; }
  .trigrep-chip-x {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: none; background: transparent;
    color: var(--grey-500); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .trigrep-chip-x:hover { background: var(--grey-200); color: var(--grey-900); }
  .trigrep-chip-x svg { width: 10px; height: 10px; }
  .trigrep-query {
    flex: 1; min-width: 80px;
    border: none; outline: none; background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--grey-900);
  }
  .trigrep-query::placeholder {
    font-family: var(--brand-font-family-sans);
    font-size: 13.5px;
    color: var(--grey-500);
    opacity: 1;
  }
  .btn-search {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 40px;
    background: var(--mod-green);
    color: var(--mod-on-accent); border: none;
    padding: 0 16px;
    border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .btn-search:hover { background: var(--mod-green-soft); }

  /* Search-bar help text */
  .search-help-row {
    margin-top: 12px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    min-height: 18px;
  }
  /* Collapse the row when there's nothing to show (no result stats yet)
     so the empty state and results pane sit tight under the assist row. */
  .search-help-row:has(> .search-help-stats:empty),
  .search-help-row:not(:has(*:not(:empty))) {
    margin-top: 0;
    min-height: 0;
  }
  .search-help {
    font-size: 12px;
    color: var(--grey-500);
    line-height: 1.5;
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .search-help code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--grey-700);
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    padding: 0 4px;
    border-radius: 3px;
  }
  .search-help-stats {
    display: inline-flex; align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--mui-grey-600);
    flex-shrink: 0;
  }
  .search-help-stats:empty { display: none; }
  .results-toolbar-summary { color: var(--mui-grey-700); }
  .results-toolbar-summary strong { color: var(--grey-900); font-weight: 600; }
  .results-toolbar-recipes { color: var(--mui-grey-700); }
  .results-toolbar-recipes strong { color: var(--grey-900); font-weight: 600; }
  .results-toolbar-time {
    color: var(--mui-grey-500);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .results-toolbar-export {
    color: var(--neo-digital-blue-500);
    text-decoration: none;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .results-toolbar-export:hover { text-decoration: underline; }
  .results-toolbar-export svg { width: 11px; height: 11px; }

  .trigrep-body {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  /* Sidebar */
  .trigrep-sidebar {
    flex: 0 0 24%;
    min-width: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--mui-grey-200);
    background: var(--mod-panel);
    font-size: 12px;
    min-height: 0;
  }
  .trigrep-pane {
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .trigrep-pane + .trigrep-pane {
    border-top: 1px solid var(--mui-grey-200);
  }
  .trigrep-pane-filters { flex: 1 1 auto; }
  .trigrep-pane-repos   { flex: 0 1 auto; max-height: 40%; }
  .trigrep-pane-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px 8px;
    font-size: 11px;
    color: var(--mui-grey-600);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .trigrep-pane-head .pane-count {
    color: var(--mui-grey-500);
    font-weight: 600;
    text-transform: none;
    margin-left: 4px;
  }
  .trigrep-pane-head .collapse-all {
    color: var(--mui-blue); cursor: pointer;
    text-transform: none; letter-spacing: 0; font-weight: 500;
    font-size: 11.5px;
  }
  .trigrep-pane-head .collapse-all:hover { text-decoration: underline; }
  .trigrep-pane-body {
    overflow-y: auto;
    padding: 0 8px 12px;
    min-height: 0;
  }
  .trigrep-pane-body::-webkit-scrollbar { width: 6px; }
  .trigrep-pane-body::-webkit-scrollbar-thumb { background: var(--mui-grey-300); border-radius: 3px; }
  .filter-group { margin: 4px 0 2px; }
  .filter-group-head {
    display: flex; align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 6px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px; font-weight: 700;
    color: var(--mui-grey-800);
  }
  .filter-group-head:hover { background: var(--mui-grey-100); }
  .filter-group-head svg {
    width: 14px; height: 14px;
    color: var(--mui-grey-600);
    transition: transform 0.2s ease;
    flex: 0 0 auto;
  }
  .filter-group.collapsed .filter-group-head svg { transform: rotate(-90deg); }
  .filter-group.collapsed .filter-group-body { display: none; }
  .filter-group-body { padding: 2px 0 6px 8px; margin-left: 12px; }
  .filter-group-label {
    padding: 10px 6px 4px;
    font-size: 10px;
    color: var(--mui-grey-500);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .topic-search {
    width: calc(100% - 8px);
    margin: 4px 0 6px;
    padding: 5px 9px;
    border: 1px solid var(--mui-grey-300);
    border-radius: 4px;
    font-family: inherit; font-size: 12px;
    color: var(--mui-grey-800);
    background: var(--mod-panel);
    outline: none;
  }
  .topic-search:focus { border-color: var(--mui-blue); }
  .filter-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    min-height: 28px;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    color: var(--mui-grey-800);
  }
  .filter-item:hover { background: var(--mui-grey-100); }
  .filter-item .count {
    color: var(--mui-grey-600);
    font-size: 12px;
    flex: 0 0 auto;
  }
  .filter-item.active {
    background: rgba(51, 255, 153, 0.08);
    color: var(--mui-blue);
    font-weight: 500;
  }
  .filter-item.active .count { color: var(--mui-blue); font-weight: 500; }
  .filter-item .lang-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    display: inline-block;
    box-shadow: none;
  }
  .filter-item-name {
    display: inline-flex; align-items: center;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .filter-item .filter-check {
    width: 12px; height: 12px;
    flex-shrink: 0;
    color: transparent;
    margin-right: 6px;
  }
  .filter-item.active .filter-check {
    color: var(--mui-blue);
  }
  .filter-group.is-repo-list .filter-item .count {
    color: var(--mui-blue);
    font-weight: 500;
  }
  .filter-group.is-repo-list .filter-item.active .count { color: var(--mui-blue); }
  .filter-more-link {
    display: block;
    background: transparent; border: 0;
    padding: 4px 6px;
    margin-top: 2px;
    font-family: inherit; font-size: 12px;
    color: var(--mui-blue);
    cursor: pointer;
    text-align: left;
  }
  .filter-more-link:hover { text-decoration: underline; }
  .filter-group.is-repo-list.flat { margin: 4px 0 2px; }
  .filter-group.is-repo-list.flat .repo-list-body {
    padding: 4px 0 6px;
    margin-left: 0;
  }
  .repo-search-wrap {
    display: flex; align-items: center; gap: 6px;
    margin: 4px 0 6px;
    padding: 4px 9px;
    border: 1px solid var(--mui-grey-300);
    border-radius: 4px;
    background: var(--mod-panel);
  }
  .repo-search-wrap:focus-within {
    border-color: var(--mui-blue);
  }
  .repo-search-icon {
    width: 12px; height: 12px;
    color: var(--mui-grey-500);
    flex-shrink: 0;
  }
  .repo-search {
    flex: 1; min-width: 0;
    border: 0; outline: none;
    background: transparent;
    font-family: inherit; font-size: 12px;
    color: var(--mui-grey-800);
  }
  .repo-search::placeholder { color: var(--mui-grey-500); }

  .trigrep-results {
    flex: 1 1 0;
    min-width: 0;
    overflow-y: auto;
    padding: 16px 24px 32px;
    background: transparent;
  }
  .trigrep-results::-webkit-scrollbar { width: 8px; }
  .trigrep-results::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 4px; }

  /* Result card */
  .result-card {
    background: var(--mui-card-bg);
    border: 1px solid var(--mui-grey-300);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: none;
  }
  .result-card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1px 8px 1px 12px;
    background: var(--mui-card-bg);
    min-height: 36px;
  }
  .result-card-file {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    color: var(--mui-grey-800);
    font-weight: 500;
    min-width: 0;
  }
  .result-card-file .file-module {
    color: var(--mui-grey-600); font-weight: 400;
    font-family: inherit;
    font-size: 13px;
    margin-left: 2px;
  }
  .result-card-actions { display: inline-flex; align-items: center; gap: 2px; }
  .result-card-meta {
    font-size: 12px; color: var(--mui-grey-600); margin-right: 6px;
  }
  .icon-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: none; background: transparent;
    color: var(--mui-grey-600);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--mui-grey-200); color: var(--mui-grey-800); }
  .icon-btn svg { width: 14px; height: 14px; }
  .chevron-btn svg { transition: transform 0.2s ease; }
  .result-card.collapsed .chevron-btn svg { transform: rotate(-90deg); }
  .result-card.collapsed .result-card-body { display: none; }
  .result-card-body {
    background: var(--mui-card-body-bg);
    border-top: 1px solid var(--mui-grey-300);
  }

  /* Hunk-range header */
  .hunk-label {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 14px;
    background: var(--mui-card-bg);
    border-top: 1px solid var(--mui-grey-300);
    border-bottom: 1px solid var(--mui-grey-300);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--mui-grey-600);
  }
  .hunk-label .hunk-text { color: var(--mui-grey-700); }
  .hunk-label .icon-btn { width: 22px; height: 22px; }
  .hunk-label .icon-btn svg { width: 12px; height: 12px; }

  /* Code body */
  .code-body {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--mui-grey-800);
    background: var(--mui-card-body-bg);
    overflow-x: auto;
    padding: 4px 0;
  }
  .code-line {
    display: grid;
    grid-template-columns: 5ch 5ch 24px 1fr;
    align-items: center;
    min-height: 22px;
  }
  .code-line.simple { grid-template-columns: 5ch 1fr; }
  .code-ln {
    color: var(--mui-grey-500);
    text-align: center;
    padding: 0;
    user-select: none;
    font-size: 12px;
  }
  .code-marker {
    text-align: center;
    color: var(--mui-grey-500);
    user-select: none;
    font-weight: 600;
  }
  .code-text {
    padding: 0 14px 0 8px;
    white-space: pre;
    color: var(--mui-grey-800);
  }
  .code-line.simple .code-text { padding-left: 12px; }
  .code-line.is-hit { background: rgba(51, 255, 153, 0.08); }
  .code-line:hover { background: rgba(241,236,224,0.025); }
  .code-line.removed { background: rgba(255, 90, 71, 0.10); }
  .code-line.removed .code-marker { color: var(--mod-red-ink); }
  .code-line.added { background: rgba(51, 255, 153, 0.10); }
  .code-line.added .code-marker { color: var(--mod-green-ink); }
  .match {
    background: rgba(255, 225, 77, 0.18);
    color: var(--mod-bone);
    padding: 0 2px;
    border-radius: 2px;
    box-shadow: inset 0 -2px 0 var(--mod-spec-gold);
  }
  .code-line.removed .match { background: rgba(255, 90, 71, 0.22); color: var(--mod-diff-del); box-shadow: none; }
  .code-line.added .match { background: rgba(51, 255, 153, 0.22); color: var(--mod-diff-add); box-shadow: none; }

  /* File detail drill-down */
  .trigrep-body { transition: opacity 100ms ease; }
  .trigrep-body.detail-mode > .trigrep-sidebar,
  .trigrep-body.detail-mode > .trigrep-results { display: none; }
  .trigrep-detail {
    display: none;
    flex: 1; flex-direction: column;
    min-width: 0;
    overflow: hidden;
    background: var(--mod-panel);
  }
  .trigrep-body.detail-mode > .trigrep-detail { display: flex; }
  .result-card-file.is-clickable { cursor: pointer; }
  .result-card-file.is-clickable:hover { color: var(--mui-blue); }

  .detail-breadcrumb {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 24px;
    font-size: 13px;
    border-bottom: 1px solid var(--grey-50);
    background: var(--mod-panel);
    flex-shrink: 0;
  }
  .detail-back {
    background: none; border: none; padding: 2px 0;
    color: var(--neo-digital-blue-500);
    cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .detail-back:hover { text-decoration: underline; }
  .detail-back svg { width: 12px; height: 12px; }
  .detail-crumb-sep { color: var(--grey-300); }
  .detail-crumb-current {
    color: var(--grey-900); font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
  }
  .detail-search-row {
    padding: 10px 24px;
    border-bottom: 1px solid var(--grey-50);
    background: var(--mod-panel);
    flex-shrink: 0;
  }
  .detail-search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--mod-panel);
    border: 1px solid var(--grey-200);
    border-radius: 6px;
    padding: 6px 12px;
  }
  .detail-search-box:focus-within {
    border-color: var(--neo-digital-blue-500);
    box-shadow: 0 0 0 3px rgba(51, 255, 153, 0.18);
  }
  .detail-search-box svg {
    width: 14px; height: 14px;
    color: var(--grey-500);
    flex-shrink: 0;
  }
  .detail-search-box input {
    flex: 1;
    border: none; outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    color: var(--grey-900);
  }
  .detail-search-box input::placeholder { color: var(--grey-500); }
  .detail-search-box .kbd-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 1px 5px;
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    border-radius: 4px;
    color: var(--grey-600);
    flex-shrink: 0;
  }

  .detail-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--grey-50);
    background: var(--mod-panel);
    flex-shrink: 0;
  }
  .detail-header-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .detail-file-path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--grey-900);
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .detail-module {
    color: var(--grey-600);
    font-size: 12px;
    margin-top: 4px;
  }
  .detail-code {
    flex: 1;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.7;
    background: var(--mod-panel);
    padding: 12px 0;
  }
  .detail-code::-webkit-scrollbar { width: 8px; }
  .detail-code::-webkit-scrollbar-thumb { background: var(--grey-100); border-radius: 4px; }
  .detail-code .code-line {
    display: grid;
    grid-template-columns: 56px 1fr;
    align-items: center;
    min-height: 22px;
  }
  .detail-code .code-line.has-match { background: rgba(255, 225, 77, 0.10); }
  .detail-code .code-ln {
    text-align: right;
    color: var(--grey-300);
    padding: 0 12px 0 0;
    user-select: none;
    font-size: 11.5px;
  }
  .detail-code .code-text {
    padding: 0 14px;
    white-space: pre;
    color: var(--grey-900);
  }
  .detail-code .kw { color: var(--neo-digital-blue-500); }
  .detail-code .str { color: var(--mod-spec-gold); }
  .detail-code .ann { color: var(--mod-spec-violet-ink); }
  .detail-code .cmt { color: var(--grey-500); font-style: italic; }
  .detail-code .match {
    background: var(--highlight-bg); color: var(--highlight-text);
    padding: 0 2px; border-radius: 2px;
  }

  /* Lang dot */
  .lang-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--java-dot);
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(231, 111, 0, 0.15);
  }

  /* ===== Trigrep start state (centered hero) ===== */
  .trigrep-start-state {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px 64px;
    background: transparent;
    overflow-y: auto;
  }
  .trigrep-start-hero {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%; max-width: 560px;
    text-align: center;
  }
  .trigrep-start-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(51, 255, 153, 0.10);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--neo-digital-blue-500);
  }
  .trigrep-start-icon svg { width: 28px; height: 28px; }
  .trigrep-start-title {
    font-size: 22px; font-weight: 600;
    color: var(--grey-900);
    margin: 6px 0 0;
  }
  .trigrep-start-subtitle {
    font-size: 14.5px;
    color: var(--grey-600);
    line-height: 1.55;
    max-width: 480px;
  }
  .trigrep-start-examples-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--grey-500);
    margin-top: 18px;
  }
  .trigrep-start-examples-list {
    display: flex; flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-top: 4px;
  }
  .trigrep-start-example {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: var(--mod-panel);
    border: 1px solid var(--grey-100);
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    font-family: inherit;
    width: 100%;
  }
  .trigrep-start-example:hover {
    border-color: var(--neo-digital-blue-500);
    background: rgba(51, 255, 153, 0.05);
  }
  .trigrep-start-example-text {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .trigrep-start-example-query {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--neo-digital-blue-500);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trigrep-start-example-desc {
    font-size: 12.5px;
    color: var(--grey-500);
  }
  .trigrep-start-example-icon {
    width: 16px; height: 16px;
    color: var(--grey-400);
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .trigrep-start-example:hover .trigrep-start-example-icon {
    color: var(--neo-digital-blue-500);
  }
  .trigrep-start-divider {
    width: 100%;
    height: 1px;
    background: var(--grey-200);
    margin-top: 14px;
  }
  .trigrep-start-reference-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 18px;
    border: 1px solid var(--brand-digital-blue-200);
    border-radius: 9999px;
    color: var(--neo-digital-blue-500);
    font-size: 13px;
    font-weight: 500;
    background: var(--mod-panel);
    cursor: pointer;
    text-decoration: none;
    margin-top: 14px;
  }
  .trigrep-start-reference-link:hover {
    background: rgba(51, 255, 153, 0.06);
    border-color: var(--neo-digital-blue-500);
  }
  .trigrep-start-reference-link svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* Overflow indicator below results */
  .results-overflow {
    margin: 16px 0 4px;
    padding: 12px 16px;
    text-align: center;
    color: var(--grey-600);
    font-size: 13px;
  }
  .results-overflow strong { color: var(--grey-900); font-weight: 600; }
  .results-overflow .show-more {
    background: none; border: 0; padding: 0;
    margin-left: 12px;
    color: var(--neo-digital-blue-500);
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .results-overflow .show-more:hover { text-decoration: underline; }

  /* Search-fallback empty state */
  .trigrep-empty {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 40px 24px;
    background: var(--grey-25);
  }
  .trigrep-empty-title { font-size: 15px; font-weight: 600; color: var(--grey-700); }
  .trigrep-empty-desc { font-size: 13px; color: var(--grey-600); max-width: 360px; line-height: 1.5; }

  /* =====================================================================
     Trigrep query bar — lean v1: filter pills, recognition autocomplete,
     and a silent-reformulation banner. No prose parser, no catalog modal.
     ===================================================================== */
  .tg-assist-row {
    margin-top: 8px;
    display: flex; align-items: flex-start;
    gap: 8px;
  }
  .tg-chip-strip {
    flex: 1 1 auto;
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 4px;
    min-height: 22px;
  }
  .tg-chip-strip:empty::before {
    content: "Tip — start typing a filter like \201Clang:\201D or \201Cvisibility:\201D to see suggestions.";
    color: var(--grey-500); font-size: 12px;
  }
  /* Filter pill: "filter: value" with a remove × and an optional NOT badge */
  .tg-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--alias-primary-100, #F2F3FF);
    color: var(--grey-800);
    border: 1px solid var(--neo-digital-blue-300);
    border-radius: 999px;
    padding: 2px 4px 2px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.4;
    white-space: nowrap;
    cursor: pointer;
  }
  .tg-pill .tg-pill-key { color: var(--neo-digital-blue-500); font-weight: 500; }
  .tg-pill .tg-pill-op  { color: var(--grey-500); font-style: italic; font-family: var(--brand-font-family-sans); font-size: 11px; }
  .tg-pill .tg-pill-val { color: var(--grey-900); }
  .tg-pill.is-not { background: var(--brand-red-100); border-color: var(--brand-red-400); }
  .tg-pill.is-not .tg-pill-key { color: var(--brand-red-700); }
  .tg-pill.is-unverified { background: var(--brand-orange-100); border-color: var(--brand-orange-600); }
  .tg-pill.is-unverified .tg-pill-key { color: var(--brand-orange-800); }
  .tg-pill.is-unverified::after {
    content: "·";
    font-size: 14px;
    color: var(--brand-orange-800);
    margin-left: -2px;
  }
  /* Free-text tokens (literal / regex / structural) live alongside pills */
  .tg-tok {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--mod-panel);
    color: var(--grey-700);
    border: 1px dashed var(--grey-200);
    border-radius: 6px;
    padding: 2px 4px 2px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .tg-tok.is-regex      { background: rgba(255, 225, 77, 0.10); border-color: rgba(255, 225, 77, 0.35); color: var(--mod-spec-gold); border-style: solid; }
  .tg-tok.is-structural { background: rgba(155, 92, 255, 0.12); border-color: rgba(155, 92, 255, 0.40); color: var(--mod-spec-violet-ink); border-style: solid; }
  .tg-op-chip {
    display: inline-flex; align-items: center;
    color: var(--grey-500); font-size: 11px;
    padding: 0 4px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tg-pill-x, .tg-tok-x {
    width: 16px; height: 16px;
    border-radius: 999px;
    border: none; background: transparent;
    color: inherit; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1;
  }
  .tg-pill-x:hover, .tg-tok-x:hover { background: rgba(0,0,0,0.08); }

  /* Silent-reformulation banner — "Showing results for: <reformulated>" */
  .tg-reform-banner {
    margin-top: 6px;
    padding: 6px 10px;
    background: var(--brand-orange-100);
    border: 1px solid var(--brand-orange-600);
    border-radius: 6px;
    font-size: 12px;
    color: var(--brand-orange-800);
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px;
  }
  .tg-reform-banner[hidden] { display: none; }
  .tg-reform-banner code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    background: var(--mod-panel);
    border: 1px solid var(--grey-100);
    padding: 0 4px;
    border-radius: 3px;
    color: var(--grey-800);
  }
  .tg-reform-banner .tg-reform-action {
    margin-left: auto;
    background: transparent;
    color: var(--neo-digital-blue-500);
    border: 0;
    cursor: pointer;
    font-size: 12px;
    text-decoration: underline;
  }
  .tg-reform-banner .tg-reform-dismiss {
    border: 0; background: transparent; cursor: pointer;
    color: var(--brand-orange-800);
    font-size: 14px; line-height: 1;
    padding: 0 4px;
  }

  /* Recognition-over-recall autocomplete dropdown */
  .tg-autocomplete {
    position: absolute;
    background: var(--mod-panel);
    border: 1px solid var(--grey-200);
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.10);
    z-index: 40;
    min-width: 280px; max-width: 420px;
    padding: 4px;
    max-height: 320px; overflow: auto;
  }
  .tg-autocomplete[hidden] { display: none; }
  .tg-ac-section {
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--grey-500);
    padding: 8px 10px 4px;
  }
  .tg-ac-item {
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
  }
  .tg-ac-item .tg-ac-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--grey-900);
    flex: 0 0 auto;
  }
  .tg-ac-item .tg-ac-name b { color: var(--neo-digital-blue-500); font-weight: 600; }
  .tg-ac-item .tg-ac-desc {
    font-size: 11.5px; color: var(--grey-500);
    flex: 1 1 auto; text-align: right;
  }
  .tg-ac-item.is-active, .tg-ac-item:hover {
    background: var(--alias-primary-100, #F2F3FF);
  }
  .tg-ac-item.is-active .tg-ac-name, .tg-ac-item:hover .tg-ac-name {
    color: var(--neo-digital-blue-500);
  }

  /* Scope-it-down panel (shown after Search when a theme is detected) */
  .trigrep-empty.tg-scope { padding-top: 56px; }
  .tg-scope-list {
    margin-top: 4px;
    width: min(560px, 100%);
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .tg-scope-option {
    text-align: left;
    background: var(--mod-panel);
    border: 1px solid var(--grey-200);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex; flex-direction: column;
    gap: 4px;
    cursor: pointer;
    font: inherit;
  }
  .tg-scope-option:hover {
    border-color: var(--neo-digital-blue-500);
    background: var(--alias-primary-100, #F2F3FF);
  }
  .tg-scope-label { font-size: 13px; font-weight: 600; color: var(--grey-900); }
  .tg-scope-desc  { font-size: 12px; color: var(--grey-600); }
  .tg-scope-option code {
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--grey-700);
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    padding: 2px 6px;
    border-radius: 4px;
    align-self: flex-start;
  }

</style>

    <!-- MAIN CONTENT AREA -->
    <div class="main-area">
      <!-- GLOBAL NAV -->
      <div class="global-nav">

  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function setNavActive(id) {
  document.querySelectorAll('#left-nav-items .nav-item, #nav-more-popover .nav-item').forEach(el => {
    el.classList.remove('active');
  });
  const labelMap = { trigrep: 'Trigrep' };
  const label = labelMap[id] || id;
  document.querySelectorAll('#left-nav-items .nav-item').forEach(el => {
    if (el.querySelector('.nav-label')?.textContent === label) el.classList.add('active');
  });
}

function setSyntaxMode(mode) {
  trigrepCurrentMode = mode;
  const label = trigrepPanel.querySelector('.syntax-selector-label');
  if (label) label.textContent = SYNTAX_LABELS[mode] || 'Sourcegraph';
  const menu = trigrepPanel.querySelector('.syntax-selector-menu');
  if (menu) {
    menu.querySelectorAll('li[role="option"]').forEach(o => {
      if (o.dataset.value === mode) o.setAttribute('aria-selected', 'true');
      else o.removeAttribute('aria-selected');
    });
  }
  const input = trigrepPanel.querySelector('#trigrep-query-input');
  if (input) input.placeholder = PLACEHOLDERS[mode] || '';
}

function wireSyntaxSelector() {
  const selector = trigrepPanel.querySelector('#syntax-selector');
  if (!selector) return;
  const btn = selector.querySelector('.syntax-selector-btn');
  const menu = selector.querySelector('.syntax-selector-menu');
  const closeMenu = () => {
    menu.hidden = true;
    selector.removeAttribute('data-open');
    btn.setAttribute('aria-expanded', 'false');
  };
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = !menu.hidden;
    if (open) { closeMenu(); return; }
    menu.hidden = false;
    selector.setAttribute('data-open', '1');
    btn.setAttribute('aria-expanded', 'true');
  });
  menu.querySelectorAll('li[role="option"]').forEach(li => {
    li.addEventListener('click', () => {
      setSyntaxMode(li.dataset.value);
      closeMenu();
    });
  });
  document.addEventListener('click', (e) => {
    if (!selector.contains(e.target)) closeMenu();
  });
}

      <svg class="trigrep-start-example-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  `).join('');
  slot.querySelectorAll('.trigrep-start-example').forEach(card => {
    card.addEventListener('click', () => {
      const mode = card.dataset.mode;
      if (mode) setSyntaxMode(mode);
      const action = card.dataset.action;
      if (action === 'fallback') { showSearchFallback(); return; }
      if (action && action.startsWith('syntax-')) {
        const flowId = action.slice('syntax-'.length);
        executeSearch(flowId);
        return;
      }
    });
  });
}

function wireTrigrepSearchBar() {
  const input = trigrepPanel.querySelector('#trigrep-query-input');
  const btn = trigrepPanel.querySelector('#trigrep-search-btn');
  if (!input || !btn) return;

  const submit = () => tgSubmit((input.value || '').trim());

  btn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
}

function showSearchFallback() {
  const results = trigrepPanel.querySelector('#trigrep-results');
  if (!results) return;
  results.innerHTML = `
    <div class="trigrep-empty">
      <div class="trigrep-empty-title">No matches in this prototype</div>
      <div class="trigrep-empty-desc">This is a prototype — try one of the example queries on the empty state, or run one of the syntax-mode happy paths.</div>
    </div>
  `;
}

// ===================================================================
// Execute a search — flip trigrep to results state for the given flow
// ===================================================================
function executeSearch(flowId) {
  const flow = FLOWS[flowId];
  if (!flow) return;
  currentFlow = flowId;

  const input = trigrepPanel.querySelector('#trigrep-query-input');
  if (input) {
    input.value = FINAL_QUERIES[flowId] || flow.phase2.query;
    input.style.color = '';
  }
  setSyntaxMode('sourcegraph');

  renderTrigrepResults(flow);
}

const PRESET_ACTIVE_FILTERS = {

const CHECK_ICON_SVG = '<svg class="filter-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function renderTrigrepResults(flow) {
  const body = trigrepPanel.querySelector('#trigrep-body');
  if (!body) return;

  // Clear any inline stats from a previous search
  const inlineStats = trigrepPanel.querySelector('#search-help-stats');
  if (inlineStats) inlineStats.innerHTML = '';

  // ----- Sidebar groups -----
  const activeSet = PRESET_ACTIVE_FILTERS[currentFlow] || new Set();
  const renderGroup = (group) => {
    const repoClass = group.isRepoList ? ' is-repo-list' : '';
    const overflow = group.overflowMore
      ? `<button type="button" class="filter-more-link">+${group.overflowMore.toLocaleString()} more</button>`
      : '';
    const itemsHtml = group.items.map(it => {
      const dot = it.dot ? `<span class="lang-dot" style="background:${it.dot};box-shadow:none;"></span>` : '';
      const isActive = activeSet.has(it.name);
      return `<div class="filter-item${isActive ? ' active' : ''}" data-count="${it.count}">
        <span class="filter-item-name">${CHECK_ICON_SVG}${dot}${it.name}</span>
        <span class="count">${it.count.toLocaleString()}</span>
      </div>`;
    }).join('');
    if (group.isRepoList) {
      return `
      <div class="filter-group is-repo-list flat" data-group="${group.id}">
        <div class="repo-search-wrap">
          <svg class="repo-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="repo-search" placeholder="Filter repos…">
        </div>
        <div class="filter-group-body repo-list-body">
          ${itemsHtml}
          ${overflow}
        </div>
      </div>`;
    }
    return `
    <div class="filter-group${repoClass}" data-group="${group.id}">
      <div class="filter-group-label">${group.title.replace(/^By\s+/i, '').toUpperCase()}</div>
      <div class="filter-group-body" style="margin-left: 0; padding: 0;">
        ${group.searchable ? '<input class="topic-search" placeholder="Search topics…">' : ''}
        ${itemsHtml}
        ${overflow}
      </div>
    </div>`;
  };
  const nonRepoFilters = flow.phase2.filters.filter(g => !g.isRepoList);
  const repoFilters    = flow.phase2.filters.filter(g => g.isRepoList);
  const nonRepoFiltersHtml = nonRepoFilters.map(renderGroup).join('');
  const repoFiltersHtml    = repoFilters.map(renderGroup).join('');

  const repoCount = flow.phase2.baseFiles || 0;

  // ----- Result cards (cap initial display at 5) -----
  const extraCards = flow.phase2.extraCards || [];
  const extraSlice = Math.max(0, 5 - flow.cards.length);
  const initialCards = [...flow.cards, ...extraCards.slice(0, extraSlice)];
  const remainingCards = extraCards.slice(extraSlice);
  const cardsHtml = initialCards.map(buildResultCardHTML).join('');
  const overflowText = flow.overflow || '';

  // ----- Results stats — inline on the right of the search-help row -----
  const summaryRaw = flow.phase2.summary || '';
  const nums = (summaryRaw.replace(/<[^>]+>/g, '').match(/[\d,]+/g) || []);
  const matchCount = nums[0] || '';
  const fileCount = nums[1] || '';
  const timeMs = (summaryRaw.match(/([\d.]+ms)/) || [, ''])[1];
  const statsHtml = `
    <span class="results-toolbar-summary"><strong id="summary-count">${matchCount}</strong> matches across <strong id="summary-files">${fileCount}</strong> files</span>
    <a class="results-toolbar-export" href="#" onclick="return false;" title="Export results as CSV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </a>
    <span class="results-toolbar-time">${timeMs}</span>
  `;
  if (inlineStats) inlineStats.innerHTML = statsHtml;

  body.innerHTML = `
    <aside class="trigrep-sidebar" aria-label="Repositories and filters">
      ${repoFiltersHtml ? `
      <section class="trigrep-pane trigrep-pane-repos" aria-label="Repositories">
        <div class="trigrep-pane-head">
          <span>Repositories <span class="pane-count">(${repoCount.toLocaleString()})</span></span>
        </div>
        <div class="trigrep-pane-body">
          ${repoFiltersHtml}
        </div>
      </section>` : ''}
      <section class="trigrep-pane trigrep-pane-filters" aria-label="Filters">
        <div class="trigrep-pane-head">
          <span>Filters</span>
        </div>
        <div class="trigrep-pane-body">
          ${nonRepoFiltersHtml}
        </div>
      </section>
    </aside>
    <div class="trigrep-results" id="trigrep-results">
      <div id="result-cards-list">${cardsHtml}</div>
      <div class="results-overflow">
        ${overflowText} <button class="show-more" id="show-more-btn">Show more results</button>
      </div>

  wireResultsInteractions(flow, remainingCards);
}

function wireResultsInteractions(flow, remainingCards) {
  const baseMatches = flow.phase2.baseMatches;
  const baseFiles = flow.phase2.baseFiles;
  const activeFilters = new Map();
  const summaryCount = trigrepPanel.querySelector('#summary-count');
  const summaryFiles = trigrepPanel.querySelector('#summary-files');

  // Filter group collapse
  trigrepPanel.querySelectorAll('.filter-group-head').forEach(head => {
    head.addEventListener('click', () => head.parentElement.classList.toggle('collapsed'));
  });
  const collapseAll = trigrepPanel.querySelector('#collapse-all');
  if (collapseAll) {
    collapseAll.addEventListener('click', () => {
      const groups = trigrepPanel.querySelectorAll('.filter-group');
      const anyOpen = [...groups].some(g => !g.classList.contains('collapsed'));
      groups.forEach(g => g.classList.toggle('collapsed', anyOpen));
      collapseAll.textContent = anyOpen ? 'Expand all' : 'Collapse all';
    });
  }

  // Seed active filters from preset state so the summary reflects what's
  // shown as "active" in the sidebar on first render.
  trigrepPanel.querySelectorAll('.filter-item.active').forEach(item => {
    const key = item.querySelector('.filter-item-name').textContent.trim();
    const count = parseInt(item.dataset.count, 10) || 0;
    activeFilters.set(key, count);
  });

  function recomputeSummary() {
    if (activeFilters.size === 0) {
      if (summaryCount) summaryCount.textContent = baseMatches.toLocaleString();
      if (summaryFiles) summaryFiles.textContent = baseFiles.toLocaleString();
    } else {
      const total = [...activeFilters.values()].reduce((a, b) => a + b, 0);
      if (summaryCount) summaryCount.textContent = total.toLocaleString();
      if (summaryFiles) summaryFiles.textContent = Math.max(1, Math.ceil(total / 5.5)).toLocaleString();
    }
  }

  trigrepPanel.querySelectorAll('.filter-item').forEach(item => {
    item.addEventListener('click', () => {
      const key = item.querySelector('.filter-item-name').textContent.trim();
      const count = parseInt(item.dataset.count, 10) || 0;
      const wasActive = activeFilters.has(key);
      if (wasActive) activeFilters.delete(key);
      else activeFilters.set(key, count);
      item.classList.toggle('active', !wasActive);
      recomputeSummary();
    });
  });

  // Chip removal
  trigrepPanel.querySelectorAll('.trigrep-chip-x').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); btn.closest('.trigrep-chip').remove(); });
  });

  // Topic search
  const topicSearch = trigrepPanel.querySelector('.topic-search');
  if (topicSearch) {
    topicSearch.addEventListener('input', () => {
      const q = topicSearch.value.toLowerCase().trim();
      const group = topicSearch.closest('.filter-group-body');
      group.querySelectorAll('.filter-item').forEach(item => {
        const name = item.querySelector('.filter-item-name').textContent.toLowerCase();
        item.style.display = (q === '' || name.includes(q)) ? '' : 'none';
      });
    });
  }

  // Repo search
  const repoSearch = trigrepPanel.querySelector('.repo-search');
  if (repoSearch) {
    repoSearch.addEventListener('input', () => {
      const q = repoSearch.value.toLowerCase().trim();
      const list = repoSearch.closest('.filter-group').querySelector('.repo-list-body');
      list.querySelectorAll('.filter-item').forEach(item => {
        const name = item.querySelector('.filter-item-name').textContent.toLowerCase();
        item.style.display = (q === '' || name.includes(q)) ? '' : 'none';
      });
    });
  }

  // Chevron collapse
  trigrepPanel.querySelectorAll('.chevron-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.result-card').classList.toggle('collapsed'));
  });

  // File drill-down
  trigrepPanel.querySelectorAll('.result-card .result-card-file').forEach(el => {
    const card = el.closest('.result-card');
    const id = card?.dataset.cardId;
    if (id && FILE_DETAILS[id]) {
      el.addEventListener('click', () => showFileDetail(FILE_DETAILS[id]));
    } else {
      el.classList.remove('is-clickable');
    }
  });

  // Show more
  const showMoreBtn = trigrepPanel.querySelector('#show-more-btn');
  if (showMoreBtn) {
    showMoreBtn.addEventListener('click', () => {
      if (!remainingCards.length) {
        showMoreBtn.style.display = 'none';
        return;
      }
      const list = trigrepPanel.querySelector('#result-cards-list');
      const toAdd = remainingCards.splice(0, 2);
      const html = toAdd.map(buildResultCardHTML).join('');
      list.insertAdjacentHTML('beforeend', html);
      toAdd.forEach(card => {
        const el = list.querySelector(`.result-card[data-card-id="${card.id}"]`);
        if (!el) return;
        el.querySelector('.chevron-btn').addEventListener('click', () => el.classList.toggle('collapsed'));
        const fileEl = el.querySelector('.result-card-file');
        if (FILE_DETAILS[card.id]) {
          fileEl.addEventListener('click', () => showFileDetail(FILE_DETAILS[card.id]));
        } else {
          fileEl.classList.remove('is-clickable');
        }
      });
      if (!remainingCards.length) showMoreBtn.style.display = 'none';
    });
  }
}

function showFileDetail(file) {

  if (!detail) {

    body.classList.remove('detail-mode');
    body.style.opacity = '1';
  }, 100);
}

// Fillers used to expand sparse FILE_DETAILS data into a continuous file view —
// the prototype only stores match-bearing lines, so gaps get plausible Java filler.
const DETAIL_FILLERS = [
  '',
  '    <span class="cmt">// ...</span>',
  '    <span class="kw">private final</span> Repository repo;',
  '    <span class="kw">private final</span> Logger log = LoggerFactory.getLogger(getClass());',
  '',
  '    <span class="kw">public</span> Response handle(Request req) {',
  '        <span class="kw">return</span> repo.find(req.getId());',
  '    }',
  '',
  '    <span class="cmt">// validate request</span>',
  '        <span class="kw">if</span> (req == <span class="kw">null</span>) <span class="kw">throw new</span> IllegalArgumentException();',
  '',
];

function expandFileLines(lines) {
  if (!lines.length) return lines;
  const out = [];
  let prev = 0;
  for (const line of lines) {
    while (prev + 1 < line.n) {
      prev++;
      out.push({ n: prev, code: DETAIL_FILLERS[prev % DETAIL_FILLERS.length] });
    }
    out.push(line);
    prev = line.n;
  }
  return out;
}

function buildFileDetailHTML(file) {
  const linesHtml = expandFileLines(file.lines).map(l => {
    const code = (l.code || ' ').replace(/<m>/g, '<span class="match">').replace(/<\/m>/g, '</span>');
    return `<div class="code-line ${l.hasMatch ? 'has-match' : ''}"><span class="code-ln">${l.n}</span><span class="code-text">${code}</span></div>`;
  }).join('');
  return `
    <div class="detail-breadcrumb">
      <button class="detail-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>

    <div class="detail-search-row">

      <div class="detail-header-row">
        <div class="detail-file-path">${file.path}</div>

// === Levenshtein (capped) — used for autocomplete fuzzy matching ======
function tgLev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  if (Math.abs(m - n) > 3) return 99;
  let prev = new Array(n + 1), curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      curr[j] = Math.min(curr[j-1] + 1, prev[j] + 1, prev[j-1] + cost);
    }
    [prev, curr] = [curr, prev];
  }
  return prev[n];
}

// === Lexer + parser — raw query only, no prose pipeline =============
function tgLexRaw(s) {
  const out = [];
  const re = /(\()|(\))|(\/(?:\\.|[^/\\])+\/)|("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])*')|(struct(?:ural)?:'(?:\\.|[^'\\])*')|([A-Za-z_][\w-]*:[^\s()]+)|(-?[^\s()]+)/g;
  let m;
  while ((m = re.exec(s))) {
    const tok = m[0];
    if (!tok.trim()) continue;
    out.push(tok);
  }
  return out;
}

function tgValidateValue(filterKey, value) {
  const list = TG_VALUES[filterKey] || [];
  if (!value) return 'invalid';
  const pool = list.map(v => (typeof v === 'string' ? v : v.value).toLowerCase());
  return pool.includes(value.toLowerCase()) ? 'valid' : 'unverified';
}

function tgParseRaw(s) {
  const atoms = tgLexRaw(s || '');
  const tokens = [];
  for (const a of atoms) {
    const low = a.toLowerCase();
    if (a === '(' || a === ')') { tokens.push({ kind:'op', value:a }); continue; }
    if (low === 'or' || low === 'and') { tokens.push({ kind:'op', value: low }); continue; }
    if (a.startsWith('-') && a.length > 1) {
      const rest = a.slice(1);
      const rc = rest.indexOf(':');
      if (rc > 0 && /^[A-Za-z_][\w-]*$/.test(rest.slice(0, rc))) {
        tokens.push({ kind:'op', value:'not' });
        const rawKey = rest.slice(0, rc);
        const value = rest.slice(rc + 1);
        const canon = TG_ALIAS_TO_CANON[rawKey.toLowerCase()] || rawKey;
        const status = TG_FILTERS[canon] ? tgValidateValue(canon, value) : 'unverified';
        tokens.push({ kind:'filter', key:canon, value, raw:rest, status });
        continue;
      }
      if (!rest.includes(':')) {
        tokens.push({ kind:'op', value:'not' });
        tokens.push({ kind:'term', value: rest, mode:'literal' });
        continue;
      }
    }
    if (/^\/.+\/$/.test(a)) { tokens.push({ kind:'term', value:a, mode:'regex' }); continue; }
    if (/^struct(ural)?:/.test(a)) { tokens.push({ kind:'term', value:a, mode:'structural' }); continue; }
    const colon = a.indexOf(':');
    if (colon > 0 && /^[A-Za-z_][\w-]*$/.test(a.slice(0, colon))) {
      const rawKey = a.slice(0, colon);
      const value = a.slice(colon + 1);
      const canon = TG_ALIAS_TO_CANON[rawKey.toLowerCase()] || rawKey;
      const status = TG_FILTERS[canon] ? tgValidateValue(canon, value) : 'unverified';
      tokens.push({ kind:'filter', key:canon, value, raw:a, status });
      continue;
    }
    tokens.push({ kind:'term', value:a, mode:'literal' });
  }
  return tokens;
}

function tgSerialize(tokens) {
  const parts = [];
  for (const t of tokens) {
    if (t.kind === 'op') {
      if (t.value === 'not') parts.push('-NEG');
      else parts.push(t.value);
    } else if (t.kind === 'filter') {
      parts.push(`${t.key}:${t.value}`);
    } else {
      parts.push(t.value);
    }
  }
  return parts.join(' ').replace(/-NEG\s+/g, '-').replace(/\s+/g, ' ').trim();
}

// === State + glue =====================================================
const TGState = { tokens: [], ac: { open:false, items:[], active:0, mode:null, ctx:null }, lastSubmitted: '' };

function tgEscape(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// === Canonicalizer ====================================================
function tgCanonical(input) {
  const tokens = typeof input === 'string' ? tgParseRaw(input) : input;
  const filters = [], terms = [], ops = [];
  for (const t of tokens) {
    if (t.kind === 'filter') filters.push(`${t.key}:${t.value}`);
    else if (t.kind === 'term') terms.push(t.value);
    else if (t.kind === 'op' && (t.value === 'or' || t.value === 'not')) ops.push(t.value);
  }
  filters.sort(); terms.sort(); ops.sort();
  return [...terms, ...filters, ...ops].join(' ');
}

// === Happy-path queries (Appendix A) + signature & phrase routing ======
const TG_HAPPY_QUERIES = {
  authOpt1: { flow: 'a', query: '(@PreAuthorize or @Secured or @RolesAllowed) visibility:public lang:java' },
  authOpt2: { flow: 'a', query: 'implements:AuthenticationEntryPoint' },
  authOpt3: { flow: 'a', query: 'visibility:public' },
  logOpt1:  { flow: 'b', query: '/log\\.(error|warn)\\(/' },
  logOpt2:  { flow: 'b', query: 'Logger type:symbol' },
  logOpt3:  { flow: 'b', query: 'Logger type:symbol -file:**/test/**' },
  restOpt1: { flow: 'c', query: '@RestController lang:java' },
  restOpt2: { flow: 'c', query: 'type:symbol RestTemplate or type:symbol WebClient or type:symbol RestClient lang:java' },
};

// Precomputed canonical bags for "did the user assemble a happy path?"
const TG_HAPPY_BAGS = {};
for (const [k, h] of Object.entries(TG_HAPPY_QUERIES)) TG_HAPPY_BAGS[k] = tgCanonical(h.query);

function tgRouteSignature(tokens) {
  const literals = tokens.filter(t => t.kind === 'term' && t.mode === 'literal').map(t => t.value);
  const regexes  = tokens.filter(t => t.kind === 'term' && t.mode === 'regex').map(t => t.value);
  const filters  = tokens.filter(t => t.kind === 'filter');
  const hasFilter = (k, v) => filters.some(f => f.key === k && (v == null || f.value.toLowerCase() === v.toLowerCase()));
  const hasNegFile = (glob) => {
    for (let i = 0; i < tokens.length - 1; i++) {
      if (tokens[i].kind === 'op' && tokens[i].value === 'not'
          && tokens[i+1].kind === 'filter' && tokens[i+1].key === 'file' && tokens[i+1].value === glob) return true;
    }
    return false;
  };
  if (literals.some(v => /^@(PreAuthorize|Secured|RolesAllowed)$/.test(v))
      && (hasFilter('visibility','public') || hasFilter('lang','java'))) return TG_HAPPY_QUERIES.authOpt1;
  if (hasFilter('implements','AuthenticationEntryPoint')) return TG_HAPPY_QUERIES.authOpt2;
  if (filters.length === 1 && hasFilter('visibility','public') && literals.length === 0 && regexes.length === 0) return TG_HAPPY_QUERIES.authOpt3;
  if (regexes.some(r => /log\\?\.\(\s*(error\s*\|\s*warn|warn\s*\|\s*error)\s*\)\\?\(/.test(r))) return TG_HAPPY_QUERIES.logOpt1;
  const isLoggerByType = literals.includes('Logger') && hasFilter('type','symbol');
  if (isLoggerByType && hasNegFile('**/test/**')) return TG_HAPPY_QUERIES.logOpt3;
  if (isLoggerByType) return TG_HAPPY_QUERIES.logOpt2;
  if (hasFilter('type','symbol') && literals.some(v => /^(RestTemplate|WebClient|RestClient)$/.test(v))) return TG_HAPPY_QUERIES.restOpt2;
  if (literals.includes('@RestController')) return TG_HAPPY_QUERIES.restOpt1;
  return null;
}

// Small fixed phrase bridge — not a parser. A handful of broad questions
// that mature search products bridge to a known query (Sourcegraph
// Smart Search–style). No stemming, no concept index, no fuzzy English.
const TG_PHRASE_ROUTES = [
  { rx: /\b(production code only|exclude tests?|no tests?|skip tests?)\b/i,                    key: 'logOpt3' },
  { rx: /\b(logger declarations?|what loggers do we use|logger types?|loggers?\b)\b/i,         key: 'logOpt2' },
  { rx: /\b(error logging|where do we log errors?|log errors?|warnings?|error\/warn)\b/i,      key: 'logOpt1' },
  { rx: /\b(public[- ]?facing|public only|just public|exposed services?)\b/i,                  key: 'authOpt3' },
  { rx: /\b(auth(entication)? entry points?|where authentication starts|entry points?)\b/i,    key: 'authOpt2' },
  { rx: /\b(@PreAuthorize|@Secured|@RolesAllowed|public authorization|authorization (rules?|annotations?))\b/i, key: 'authOpt1' },
  { rx: /\b(outbound|client calls?|http clients?|RestTemplate|WebClient|RestClient)\b/i,       key: 'restOpt2' },
  { rx: /\b(server[- ]?side controllers?|rest controllers?|@RestController|REST APIs?)\b/i,    key: 'restOpt1' },
];
function tgRoutePhrase(text) {
  for (const r of TG_PHRASE_ROUTES) if (r.rx.test(text)) return TG_HAPPY_QUERIES[r.key];
  return null;
}

const TG_THEME_WORDS = {
  auth:    /\b(authentication|auth|login|security|authorize|authorization|@PreAuthorize|@Secured|@RolesAllowed|entry points?|public[- ]?facing)\b/i,
  logging: /\b(logging|log|logger|loggers|slf4j|log4j|error logging|warnings?|audit log)\b/i,
  rest:    /\b(rest|api|apis|endpoints?|controllers?|@RestController|outbound|client|RestTemplate|WebClient|RestClient)\b/i,
};
function tgDetectTheme(text) {
  for (const [theme, rx] of Object.entries(TG_THEME_WORDS)) if (rx.test(text)) return theme;
  return null;
}
const TG_THEMES = {
  auth:    { title: 'Authentication', question: 'How is authentication handled?', options: [
    { label: 'Public authorization rules',  desc: '@PreAuthorize / @Secured / @RolesAllowed on public methods', key: 'authOpt1' },
    { label: 'Auth entry points',           desc: 'Classes that implement AuthenticationEntryPoint',           key: 'authOpt2' },
    { label: 'Just public-facing services', desc: 'Anything tagged visibility:public',                          key: 'authOpt3' },

  logging: { title: 'Logging', question: 'How is logging done across our services?', options: [

    { label: 'Outbound REST calls (client)',   desc: 'RestTemplate / WebClient / RestClient',    key: 'restOpt2' },
  ]},
};
function tgShowScope(themeId) {
  const theme = TG_THEMES[themeId];

  if (!theme || !results) { showSearchFallback(); return; }

function tgRunCanned(query, flowId) {
  const flow = FLOWS[flowId];
  if (!flow) return;
  currentFlow = flowId;
  const input = document.getElementById('trigrep-query-input');
  if (input) input.value = query;
