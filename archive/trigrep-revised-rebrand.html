// === Filter pills + free-text token chips =============================
// A `NOT` op followed by a `filter` token renders as ONE pill with an
// "is not" badge. Free-text terms / regex / structural units render as
// their own neutral chips alongside the pills.
function tgRenderPills() {
  const strip = document.getElementById('tg-chip-strip');
  if (!strip) return;
  const html = [];
  const tokens = TGState.tokens;
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.kind === 'op' && t.value === 'not' && tokens[i+1] && tokens[i+1].kind === 'filter') {
      const f = tokens[i+1];
      const cls = ['tg-pill','is-not', f.status === 'unverified' ? 'is-unverified' : ''].filter(Boolean).join(' ');
      html.push(`<span class="${cls}" data-idx="${i+1}" data-pair="${i}">
        <span class="tg-pill-key">${tgEscape(f.key)}</span>
        <span class="tg-pill-op">is not</span>
        <span class="tg-pill-val">${tgEscape(f.value)}</span>
        <button class="tg-pill-x" data-x-pair="${i},${i+1}" title="Remove" aria-label="Remove ${tgEscape(f.key)}: ${tgEscape(f.value)}">×</button>
      </span>`);
      i++;
      continue;
    }
    if (t.kind === 'filter') {
      const cls = ['tg-pill', t.status === 'unverified' ? 'is-unverified' : ''].filter(Boolean).join(' ');
      html.push(`<span class="${cls}" data-idx="${i}">
        <span class="tg-pill-key">${tgEscape(t.key)}:</span>
        <span class="tg-pill-val">${tgEscape(t.value)}</span>
        <button class="tg-pill-x" data-x="${i}" title="Remove" aria-label="Remove ${tgEscape(t.key)}: ${tgEscape(t.value)}">×</button>
      </span>`);
      continue;
    }
    if (t.kind === 'op') {
      html.push(`<span class="tg-op-chip" data-idx="${i}">${tgEscape(t.value)}</span>`);
      continue;
    }
    const modeCls = t.mode === 'regex' ? ' is-regex' : (t.mode === 'structural' ? ' is-structural' : '');
    html.push(`<span class="tg-tok${modeCls}" data-idx="${i}">${tgEscape(t.value)}<button class="tg-tok-x" data-x="${i}" title="Remove" aria-label="Remove ${tgEscape(t.value)}">×</button></span>`);
  }
  strip.innerHTML = html.join('');
  strip.querySelectorAll('[data-x]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.x, 10);
      TGState.tokens.splice(idx, 1);
      tgWriteBack();
    });
  });
  strip.querySelectorAll('[data-x-pair]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const [a, b] = btn.dataset.xPair.split(',').map(n => parseInt(n, 10));
      TGState.tokens.splice(Math.min(a,b), 2);
      tgWriteBack();
    });
  });
  // Click on a pill (not the ×) → re-edit its value via the autocomplete.
  strip.querySelectorAll('.tg-pill').forEach(p => {
    p.addEventListener('click', e => {
      if (e.target.closest('.tg-pill-x')) return;
      const idx = parseInt(p.dataset.idx, 10);
      const t = TGState.tokens[idx];
      if (!t || t.kind !== 'filter') return;
      const input = document.getElementById('trigrep-query-input');
      if (!input) return;
      // Strip the pill from tokens, then plant `key:` in the input so the
      // value dropdown opens and the user picks again.
      const pairOp = p.dataset.pair != null ? parseInt(p.dataset.pair, 10) : null;
      if (pairOp != null) TGState.tokens.splice(Math.min(pairOp, idx), 2);
      else TGState.tokens.splice(idx, 1);
      const baseRaw = tgSerialize(TGState.tokens);
      input.value = (baseRaw ? baseRaw + ' ' : '') + `${t.key}:`;
      const newPos = input.value.length;
      input.focus();
      input.setSelectionRange(newPos, newPos);
      tgSyncFromInput();
      setTimeout(tgRenderAutocomplete, 0);
    });
  });
}

function tgWriteBack() {
  const input = document.getElementById('trigrep-query-input');
  if (input) input.value = tgSerialize(TGState.tokens);
  tgRenderPills();
}

// === Recognition-over-recall autocomplete =============================
// On focus / empty caret token → list of filters with descriptions.
// After `key:` → values for that filter (curated, with scope hints).
function tgCaretContext(input) {
  const v = input.value;
  const pos = input.selectionStart || v.length;
  let start = pos;
  while (start > 0 && !/\s/.test(v[start - 1])) start--;
  const tokenSoFar = v.slice(start, pos);
  const colon = tokenSoFar.indexOf(':');
  if (colon < 0) {
    return { mode: 'filter', prefix: tokenSoFar.toLowerCase(), start, pos };
  }
  const key = tokenSoFar.slice(0, colon);
  const prefix = tokenSoFar.slice(colon + 1);
  const canon = TG_ALIAS_TO_CANON[key.toLowerCase()];
  if (!canon) return null;
  return { mode: 'value', canon, prefix, start, pos };
}

function tgValueLookup(filterKey, prefix='') {
  const list = (TG_VALUES[filterKey] || []).map(v => typeof v === 'string' ? { value: v } : v);
  const p = (prefix || '').toLowerCase();
  if (!p) return list.slice(0, 12);
  const starts = list.filter(v => v.value.toLowerCase().startsWith(p));
  const contains = list.filter(v => !v.value.toLowerCase().startsWith(p) && v.value.toLowerCase().includes(p));
  const fuzzy = list.filter(v => !v.value.toLowerCase().includes(p) && tgLev(v.value.toLowerCase(), p) <= 2);
  return [...starts, ...contains, ...fuzzy].slice(0, 12);
}

function tgFilterLookup(prefix='') {
  const p = (prefix || '').toLowerCase();
  const all = TG_FILTER_ORDER.map(k => ({ key: k, desc: TG_FILTERS[k].desc }));
  if (!p) return all;
  const starts = all.filter(f => f.key.startsWith(p));
  const contains = all.filter(f => !f.key.startsWith(p) && f.key.includes(p));
  const aliasHits = all.filter(f => !f.key.includes(p) && TG_FILTERS[f.key].aliases.some(a => a.startsWith(p)));
  return [...starts, ...contains, ...aliasHits];
}

function tgRenderAutocomplete() {
  const ac = document.getElementById('tg-autocomplete');
  const input = document.getElementById('trigrep-query-input');
  if (!ac || !input) return;
  if (document.activeElement !== input) { ac.hidden = true; TGState.ac.open = false; return; }
  const ctx = tgCaretContext(input);
  if (!ctx) { ac.hidden = true; TGState.ac.open = false; return; }
  let items, sectionTitle;
  if (ctx.mode === 'filter') {
    items = tgFilterLookup(ctx.prefix).map(f => ({ kind:'filter', name: `${f.key}:`, desc: f.desc, insert: `${f.key}:` }));
    sectionTitle = ctx.prefix ? `Filters matching "${ctx.prefix}"` : 'Available filters';
  } else {
    const raw = tgValueLookup(ctx.canon, ctx.prefix);
    items = raw.map(v => ({ kind:'value', name: v.value, desc: v.desc || '', insert: v.value }));
    sectionTitle = `Values for ${ctx.canon}:`;
  }
  if (!items.length) { ac.hidden = true; TGState.ac.open = false; return; }
  TGState.ac = { open: true, items, active: 0, mode: ctx.mode, ctx };
  const renderName = (name) => {
    if (ctx.mode === 'filter') {
      const m = ctx.prefix && name.toLowerCase().startsWith(ctx.prefix) ? ctx.prefix.length : 0;
      return m ? `<b>${tgEscape(name.slice(0, m))}</b>${tgEscape(name.slice(m))}` : tgEscape(name);
    }
    const m = ctx.prefix && name.toLowerCase().startsWith(ctx.prefix.toLowerCase()) ? ctx.prefix.length : 0;
    return m ? `<b>${tgEscape(name.slice(0, m))}</b>${tgEscape(name.slice(m))}` : tgEscape(name);
  };
  ac.innerHTML = `<div class="tg-ac-section">${tgEscape(sectionTitle)}</div>` +
    items.map((it, i) => `
      <div class="tg-ac-item${i === 0 ? ' is-active' : ''}" data-i="${i}">
        <span class="tg-ac-name">${renderName(it.name)}</span>
        <span class="tg-ac-desc">${tgEscape(it.desc || '')}</span>
      </div>`).join('');
  const box = document.getElementById('trigrep-search-box');
  if (box) {
    ac.style.left = (box.offsetLeft + 120) + 'px';
    ac.style.top = (box.offsetTop + box.offsetHeight + 4) + 'px';
  }
  ac.hidden = false;
  ac.querySelectorAll('.tg-ac-item').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      tgAcCommit(parseInt(el.dataset.i, 10));
    });
  });
}

function tgAcCommit(i) {
  const ac = document.getElementById('tg-autocomplete');
  const input = document.getElementById('trigrep-query-input');
  if (!ac || !input || !TGState.ac.open) return;
  const item = TGState.ac.items[i];
  const ctx = TGState.ac.ctx;
  const before = input.value.slice(0, ctx.start);
  const after = input.value.slice(ctx.pos);
  let insert;
  if (ctx.mode === 'filter') {
    insert = item.insert;
  } else {
    insert = `${ctx.canon}:${item.insert}`;
  }
  input.value = before + insert + after;
  const newPos = (before + insert).length;
  input.setSelectionRange(newPos, newPos);
  if (ctx.mode === 'value') {
    ac.hidden = true; TGState.ac.open = false;
  }
  tgSyncFromInput();
  // After committing a filter key, re-open to show its value list.
  if (ctx.mode === 'filter') setTimeout(tgRenderAutocomplete, 0);
}
function tgAcMove(delta) {
  const ac = document.getElementById('tg-autocomplete');
  if (!ac) return;
  const n = TGState.ac.items.length;
  if (!n) return;
  TGState.ac.active = ((TGState.ac.active + delta) % n + n) % n;
  ac.querySelectorAll('.tg-ac-item').forEach((el, i) => el.classList.toggle('is-active', i === TGState.ac.active));
  // Scroll the active item into view (keyboard nav with long lists).
  const active = ac.querySelector('.tg-ac-item.is-active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

// === Silent reformulation (Sourcegraph Smart Search–style) ============
// Try deterministic rewrites in order; first one that lands on a happy
// path wins. Capped to ~6 cheap rules. No prose parsing.
function tgReformulate(text) {
  const tokens = tgParseRaw(text);
  // R1 — exact canonical match against a happy-path bag.
  const bag = tgCanonical(tokens);
  for (const [k, b] of Object.entries(TG_HAPPY_BAGS)) {
    if (bag === b) return { ...TG_HAPPY_QUERIES[k], source: 'exact', original: text };
  }
  // R2 — token shape matches a happy-path signature.
  const sig = tgRouteSignature(tokens);
  if (sig) return { ...sig, source: 'signature', original: text };
  // R3 — drop a trailing unverified/unknown filter that's too narrow.
  if (tokens.length >= 2) {
    const last = tokens[tokens.length - 1];
    if (last.kind === 'filter' && last.status !== 'valid') {
      const stripped = tokens.slice(0, -1);
      const sig2 = tgRouteSignature(stripped);
      if (sig2) return { ...sig2, source: 'stripped-trailing-filter', original: text };
    }
  }
  // R4 — treat bare terms as regex (only when nothing else fired).
  const bareTerms = tokens.filter(t => t.kind === 'term' && t.mode === 'literal');
  if (bareTerms.length === 1) {
    const candidate = tgParseRaw(`/${bareTerms[0].value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}/`);
    const sig3 = tgRouteSignature(candidate);
    if (sig3) return { ...sig3, source: 'as-regex', original: text };
  }
  // R5 — small fixed phrase bridge (not NL parsing).
  const ph = tgRoutePhrase(text);
  if (ph) return { ...ph, source: 'phrase', original: text };
  return null;
}

function tgShowReformBanner(originalQuery, reformulatedQuery, sourceLabel) {
  const el = document.getElementById('tg-reform-banner');
  if (!el) return;
  el.innerHTML = `
    Showing results for: <code>${tgEscape(reformulatedQuery)}</code>
    <button class="tg-reform-action" type="button" data-act="exact">Search exactly what I typed instead</button>
    <button class="tg-reform-dismiss" type="button" data-act="dismiss" aria-label="Dismiss">×</button>
  `;
  el.dataset.original = originalQuery;
  el.hidden = false;
  el.querySelector('[data-act="exact"]').addEventListener('click', () => {
    const input = document.getElementById('trigrep-query-input');
    if (input) input.value = originalQuery;
    tgHideReformBanner();
    showSearchFallback();
  });
  el.querySelector('[data-act="dismiss"]').addEventListener('click', tgHideReformBanner);
}
function tgHideReformBanner() {
  const el = document.getElementById('tg-reform-banner');
  if (!el) return;
  el.hidden = true;
  el.innerHTML = '';
}

// === Submit pipeline ==================================================
function tgSubmit(text) {
  if (!text) return;
  TGState.lastSubmitted = text;
  // 1) Exact canned syntax-example match (start-state cards path).
  const syntaxMatch = Object.entries(SYNTAX_EXAMPLES).find(([, t]) => t.toLowerCase() === text.toLowerCase());
  if (syntaxMatch) { tgHideReformBanner(); executeSearch(syntaxMatch[0]); return; }
  // 2) Silent reformulation → run the matched happy path.
  const hit = tgReformulate(text);
  if (hit) {
    if (hit.source === 'exact') tgHideReformBanner();
    else tgShowReformBanner(text, hit.query, hit.source);
    tgRunCanned(hit.query, hit.flow);
    return;
  }
  // 3) Theme detected → scope-it-down chips (no fixture matched).
  const theme = tgDetectTheme(text);
  if (theme) { tgHideReformBanner(); tgShowScope(theme); return; }
  // 4) Honest empty state — this prototype only has scripted fixtures.
  tgHideReformBanner();
  showSearchFallback();
}

// === Input → tokens → views ===========================================
function tgRenderAll() { tgRenderPills(); }
let tgDebounce = null;
function tgSyncFromInput() {
  const input = document.getElementById('trigrep-query-input');
  if (!input) return;
  if (tgDebounce) clearTimeout(tgDebounce);
  tgDebounce = setTimeout(() => {
    TGState.tokens = tgParseRaw(input.value);
    tgRenderAll();
    tgRenderAutocomplete();
  }, 180);
}

function tgWireAll() {
  const input = document.getElementById('trigrep-query-input');
  const ac = document.getElementById('tg-autocomplete');
  if (!input) return;
  input.addEventListener('input', tgSyncFromInput);
  input.addEventListener('focus', () => setTimeout(tgRenderAutocomplete, 0));
  input.addEventListener('click', tgRenderAutocomplete);
  input.addEventListener('keyup', () => { if (!TGState.ac.open) tgRenderAutocomplete(); });
  input.addEventListener('blur', () => setTimeout(() => { if (ac) ac.hidden = true; TGState.ac.open = false; }, 150));
  input.addEventListener('keydown', (e) => {
    if (TGState.ac.open) {
      if (e.key === 'ArrowDown') { e.preventDefault(); tgAcMove(1); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); tgAcMove(-1); return; }
      if (e.key === 'Enter' && TGState.ac.items.length) { e.preventDefault(); tgAcCommit(TGState.ac.active); return; }
      if (e.key === 'Tab' && TGState.ac.items.length)   { e.preventDefault(); tgAcCommit(TGState.ac.active); return; }
      if (e.key === 'Escape') { ac.hidden = true; TGState.ac.open = false; return; }
    }
  });
}

// === Acceptance tests — runLeanV1Tests() ==============================
window.runLeanV1Tests = function tgRunLeanV1Tests() {
  const cases = [];
  // Autocomplete
  cases.push({ section:'autocomplete', name: 'focusing empty input lists filters with descriptions',
    check: () => {
      const all = tgFilterLookup('');
      return all.length >= 10 && all.every(f => f.desc && f.desc.length > 5);
    } });
  cases.push({ section:'autocomplete', name: 'lang: suggests only real languages (no zero-result values)',
    check: () => {
      const vs = tgValueLookup('lang','');
      return vs.length >= 4 && vs.every(v => TG_VALUES.lang.includes(v.value) || TG_VALUES.lang.some(x => (typeof x === 'string' ? x : x.value) === v.value));
    } });
  cases.push({ section:'autocomplete', name: 'file: suggestions include repo scope where relevant',
    check: () => {
      const vs = tgValueLookup('file','OrderController');
      return vs.length >= 1 && vs[0].desc === 'payments-api';
    } });
  cases.push({ section:'autocomplete', name: 'value lookup prefix match: vis → public',
    check: () => tgValueLookup('visibility','pub').some(v => v.value === 'public') });

  // Pills
  cases.push({ section:'pills', name: 'Auth Opt 1 parses into 3 free-text + 2 pills',
    check: () => {
      const t = tgParseRaw('(@PreAuthorize or @Secured or @RolesAllowed) visibility:public lang:java');
      return t.filter(x => x.kind === 'filter').length === 2
          && t.filter(x => x.kind === 'term' && x.mode === 'literal').length === 3;
    } });
  cases.push({ section:'pills', name: '-file:**/test/** parses to NOT + filter (rendered as one is-not pill)',
    check: () => {
      const t = tgParseRaw('Logger type:symbol -file:**/test/**');
      const not = t.findIndex(x => x.kind === 'op' && x.value === 'not');
      return not >= 0 && t[not+1] && t[not+1].kind === 'filter' && t[not+1].key === 'file';
    } });
  cases.push({ section:'pills', name: 'editing a value → still serializes valid query',
    check: () => {
      const t = tgParseRaw('lang:java visibility:public');
      t[0].value = 'kotlin';
      return tgSerialize(t) === 'lang:kotlin visibility:public';
    } });
  cases.push({ section:'pills', name: 'removing a pill → others survive',
    check: () => {
      const t = tgParseRaw('lang:java visibility:public select:symbol.method');
      t.splice(1, 1);
      return tgSerialize(t) === 'lang:java select:symbol.method';
    } });
  for (const [k, h] of Object.entries(TG_HAPPY_QUERIES)) {
    cases.push({ section:'pills', name: `roundtrip canonical: ${k}`,
      check: () => tgCanonical(tgParseRaw(tgSerialize(tgParseRaw(h.query)))) === TG_HAPPY_BAGS[k] });
  }

  // Silent reformulation
  cases.push({ section:'reform', name: 'exact happy-path query → no banner (exact match)',
    check: () => {
      const r = tgReformulate('@RestController lang:java');
      return r && r.source === 'exact';
    } });
  cases.push({ section:'reform', name: 'near-miss: "public java authorization annotations" → Auth Opt 1',
    check: () => {
      const r = tgReformulate('public java authorization annotations');
      return r && r.flow === 'a' && (r.source === 'phrase' || r.source === 'signature');
    } });
  cases.push({ section:'reform', name: 'reorder-tolerant: tokens in different order still hit Auth Opt 1',
    check: () => {
      const r = tgReformulate('lang:java visibility:public (@PreAuthorize or @Secured or @RolesAllowed)');
      return r && r.flow === 'a';
    } });
  cases.push({ section:'reform', name: 'truly off-script "payment processing" → no reformulation',
    check: () => tgReformulate('payment processing') === null });
  cases.push({ section:'reform', name: 'phrase bridge: "where do we log errors" → Log Opt 1',
    check: () => {
      const r = tgReformulate('where do we log errors');
      return r && r.query === TG_HAPPY_QUERIES.logOpt1.query;
    } });

  // Removed surfaces are no longer reachable
  cases.push({ section:'removed', name: 'tgParseNL no longer defined',
    check: () => typeof tgParseNL === 'undefined' });
  cases.push({ section:'removed', name: 'TG_CONCEPTS no longer defined',
    check: () => typeof TG_CONCEPTS === 'undefined' });
  cases.push({ section:'removed', name: 'TG_CATALOG no longer defined',
    check: () => typeof TG_CATALOG === 'undefined' });
  cases.push({ section:'removed', name: 'tgApplySyntaxMode no longer defined (patternType: parse-only)',
    check: () => typeof tgApplySyntaxMode === 'undefined' });
  cases.push({ section:'removed', name: 'patternType: still PARSES from a pasted query',
    check: () => {
      const t = tgParseRaw('lang:java patternType:structural');
      return t.some(x => x.kind === 'filter' && x.key === 'patternType' && x.value === 'structural');
    } });

  // Theme fallback when no reformulation fires
  cases.push({ section:'theme', name: '"how is authentication handled?" → auth scope panel',
    check: () => tgDetectTheme('how is authentication handled?') === 'auth' });

  let pass = 0;
  const report = [];
  for (const c of cases) {
    let ok = false, detail = '';
    try { ok = !!c.check(); } catch (e) { detail = 'ERR: ' + e.message; }
    if (ok) pass++;
    report.push({ section: c.section, name: c.name, ok, detail });
  }
  const sections = {};
  for (const r of report) { sections[r.section] = sections[r.section] || { p:0, t:0 }; sections[r.section].t++; if (r.ok) sections[r.section].p++; }
  console.group(`[trigrep] lean v1 tests: ${pass}/${cases.length} passed`);
  for (const [s, x] of Object.entries(sections)) console.log(`   ${x.p === x.t ? '✅' : '❌'} ${s}: ${x.p}/${x.t}`);
  for (const r of report) {
    const tag = r.ok ? '✅' : '❌';
    if (r.ok) console.log(`${tag} [${r.section}] ${r.name}`);
    else console.warn(`${tag} [${r.section}] ${r.name} ${r.detail}`);
  }
  console.groupEnd();
  return { pass, total: cases.length, report };
};

// Boot

setNavActive('trigrep');
trigrepPanel.innerHTML = buildTrigrepLandingHTML();
wireSyntaxSelector();
wireTrigrepSearchBar();
setSyntaxMode('sourcegraph');
renderStartExamples();
tgWireAll();
tgRenderAll();
try { window.runLeanV1Tests(); } catch (e) { console.warn('[trigrep] lean-v1 test error:', e); }
</script>
