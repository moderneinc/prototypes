<style>
/* ================================================
   NEO DESIGN SYSTEM — BRAND TOKENS (Tier 1)
   ================================================ */
:root {
  --brand-white: #FFFFFF;
  --brand-black: #000000;
  --brand-digital-blue-100: #F2F3FF;
  --brand-digital-blue-200: #DCE0FF;
  --brand-digital-blue-300: #B6BFFF;
  --brand-digital-blue-400: #8D99FF;
  --brand-digital-blue-500: #2F42FF;
  --brand-digital-blue-600: #2637E6;
  --brand-digital-blue-700: #1E2EC2;
  --brand-digital-blue-800: #131E7A;
  --brand-digital-blue-900: #000855;
  --brand-green-100: #F3FFF5;
  --brand-green-200: #CFFFD7;
  --brand-green-500: #72E184;
  --brand-green-600: #5EC46F;
  --brand-green-700: #4CA75A;
  --brand-green-800: #3B8948;
  --brand-red-100: #FEF2F2;
  --brand-red-400: #FCA5A5;
  --brand-red-500: #F87171;
  --brand-red-600: #CB3446;
  --brand-red-700: #A92232;
  --brand-red-800: #871421;
  --brand-orange-100: #FFF8E5;
  --brand-orange-600: #FFB800;
  --brand-orange-700: #D69B00;
  --brand-orange-800: #856000;
  --brand-grey-100: #F9FAFB;
  --brand-grey-200: #F3F4F6;
  --brand-grey-300: #E5E7EB;
  --brand-grey-400: #D1D5DB;
  --brand-grey-500: #9CA3AF;
  --brand-grey-600: #6B7280;
  --brand-grey-700: #4B5563;
  --brand-grey-800: #374151;
  --brand-grey-900: #1F2937;
  --brand-grey-1000: #111827;
  --brand-violet-500: #AD59C7;
  --brand-violet-600: #992FB9;
  --brand-teal-600: #3BCCA6;
  --brand-font-family-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --brand-font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  --brand-font-weight-regular: 400;
  --brand-font-weight-medium: 500;
  --brand-font-weight-semibold: 600;
  --brand-font-weight-bold: 700;
  --brand-font-size-100: 10px;
  --brand-font-size-200: 12px;
  --brand-font-size-300: 14px;
  --brand-font-size-400: 16px;
  --brand-font-size-500: 18px;
  --brand-font-size-600: 20px;
  --brand-font-size-700: 24px;
  --brand-font-size-800: 28px;
  --brand-spacing-0: 0;
  --brand-spacing-100: 4px;
  --brand-spacing-200: 8px;
  --brand-spacing-300: 12px;
  --brand-spacing-400: 16px;
  --brand-spacing-500: 20px;
  --brand-spacing-600: 24px;
  --brand-spacing-800: 32px;
  --brand-spacing-1000: 40px;
  --brand-radius-0: 0;
  --brand-radius-100: 4px;
  --brand-radius-200: 6px;
  --brand-radius-300: 8px;
  --brand-radius-400: 12px;
  --brand-radius-500: 16px;
  --brand-radius-full: 9999px;
  --brand-shadow-100: 0 1px 3px rgba(31, 41, 55, 0.1);
  --brand-shadow-200: 0 2px 4px rgba(31, 41, 55, 0.1);
  --brand-shadow-300: 0 8px 15px rgba(31, 41, 55, 0.1);
  --brand-shadow-400: 0 4px 4px rgba(31, 41, 55, 0.1), 0 8px 24px rgba(31, 41, 55, 0.1);
  --brand-shadow-500: 0 8px 15px rgba(31, 41, 55, 0.1);
  --brand-transition-fast: 150ms ease;
  --brand-transition-base: 200ms ease;
  --brand-line-height-200: 20px;
  --brand-line-height-300: 24px;
  --brand-line-height-400: 28px;
}

/* ================================================
   NEO DESIGN SYSTEM — ALIAS TOKENS (Tier 2)
   ================================================ */
:root {
  --alias-primary-100: var(--brand-digital-blue-100);
  --alias-primary-200: var(--brand-digital-blue-200);
  --alias-primary-300: var(--brand-digital-blue-300);
  --alias-primary-500: var(--brand-digital-blue-500);
  --alias-primary-600: var(--brand-digital-blue-600);
  --alias-primary-700: var(--brand-digital-blue-700);
  --alias-primary-800: var(--brand-digital-blue-800);
  --alias-success-100: var(--brand-green-100);
  --alias-success-600: var(--brand-green-600);
  --alias-success-700: var(--brand-green-700);
  --alias-error-100: var(--brand-red-100);
  --alias-error-600: var(--brand-red-600);
  --alias-error-700: var(--brand-red-700);
  --alias-warning-100: var(--brand-orange-100);
  --alias-warning-600: var(--brand-orange-600);
  --alias-neutral-light-100: var(--brand-grey-100);
  --alias-neutral-light-200: var(--brand-grey-200);
  --alias-neutral-light-300: var(--brand-grey-300);
  --alias-neutral-light-400: var(--brand-grey-400);
  --alias-neutral-dark-500: var(--brand-grey-500);
  --alias-neutral-dark-600: var(--brand-grey-600);
  --alias-neutral-dark-700: var(--brand-grey-700);
  --alias-neutral-dark-800: var(--brand-grey-800);
  --alias-neutral-dark-900: var(--brand-grey-900);
  --alias-neutral-dark-1000: var(--brand-grey-1000);
  --alias-foundation-white: var(--brand-white);
  --alias-foundation-black: var(--brand-black);
  --alias-font-heading: var(--brand-font-family-sans);
  --alias-font-body: var(--brand-font-family-sans);
  --alias-font-code: var(--brand-font-family-mono);
}

/* ================================================
   NEO DESIGN SYSTEM — MAPPED TOKENS (Tier 3)
   ================================================ */
:root {
  --surface-primary: var(--alias-foundation-white);
  --surface-page: #f4f4f4;
  --surface-secondary: var(--alias-neutral-light-100);
  --surface-tertiary: var(--alias-neutral-light-200);
  --surface-disabled: var(--alias-neutral-light-200);
  --surface-error: var(--alias-error-100);
  --surface-success: var(--alias-success-100);
  --surface-information: var(--alias-primary-100);
  --surface-warning: var(--alias-warning-100);
  --surface-primary-filled: var(--alias-primary-500);
  --surface-error-filled: var(--alias-error-600);
  --surface-success-filled: var(--alias-success-600);
  --surface-primary-hover: var(--alias-primary-100);
  --surface-primary-pressed: var(--alias-primary-200);
  --surface-primary-filled-hover: var(--alias-primary-700);
  --surface-primary-filled-pressed: var(--alias-primary-800);
  --surface-primary-active: #3776F01A;
  --surface-error-filled-hover: var(--alias-error-700);
  --text-primary: var(--alias-neutral-dark-1000);
  --text-secondary: var(--alias-neutral-dark-600);
  --text-tertiary: var(--alias-neutral-dark-500);
  --text-disabled: var(--alias-neutral-light-400);
  --text-error: var(--alias-error-600);
  --text-success: var(--alias-success-700);
  --text-information: var(--alias-primary-700);
  --text-on-primary: var(--alias-foundation-white);
  --text-on-error: var(--alias-foundation-white);
  --text-primary-hover: var(--alias-primary-700);
  --icon-primary: var(--alias-neutral-dark-1000);
  --icon-secondary: var(--alias-neutral-dark-600);
  --icon-tertiary: var(--alias-neutral-dark-500);
  --icon-on-primary: var(--alias-foundation-white);
  --border-primary: var(--alias-neutral-light-300);
  --border-secondary: var(--alias-neutral-light-400);
  --border-hover: var(--alias-neutral-light-400);
  --border-focus: var(--alias-primary-600);
  --content-heading: var(--alias-neutral-dark-1000);
  --content-body: var(--alias-neutral-dark-800);
  --content-caption: var(--alias-neutral-dark-600);
  --content-placeholder: var(--alias-neutral-dark-500);
  --font-heading: var(--alias-font-heading);
  --font-body: var(--alias-font-body);
  --font-code: var(--alias-font-code);
  --space-1: var(--brand-spacing-100);
  --space-2: var(--brand-spacing-200);
  --space-3: var(--brand-spacing-300);
  --space-4: var(--brand-spacing-400);
  --space-5: var(--brand-spacing-500);
  --space-6: var(--brand-spacing-600);
  --space-8: var(--brand-spacing-800);
  --space-10: var(--brand-spacing-1000);
  --radius-sm: var(--brand-radius-100);
  --radius-md: var(--brand-radius-200);
  --radius-lg: var(--brand-radius-300);
  --radius-xl: var(--brand-radius-400);
  --radius-2xl: var(--brand-radius-500);
  --radius-full: var(--brand-radius-full);
  --shadow-xs: var(--brand-shadow-100);
  --shadow-sm: var(--brand-shadow-200);
  --shadow-md: var(--brand-shadow-300);
  --shadow-lg: var(--brand-shadow-400);
  --shadow-xl: var(--brand-shadow-500);
  --transition-fast: var(--brand-transition-fast);
  --transition-base: var(--brand-transition-base);
}

/* Legacy tokens still consumed by the rest of this file */
:root {
    --grey-25:  #f9fafb;
    --grey-50:  #f3f4f6;
    --grey-100: #e5e7eb;
    --grey-200: #d1d5db;
    --grey-300: #9ca3af;
    --grey-500: #6b7280;
    --grey-600: #4b5563;
    --grey-700: #374151;
    --grey-800: #1f2937;
    --grey-900: #111827;
    --bg: #ffffff;

    --neo-digital-blue-300: #8d99ff;
    --neo-digital-blue-500: #2f42ff;
    --neo-red-500: #cb3446;

    --neo-red: #FF3232;
    --roseate: #DB4197;
    --violet: #461DDE;
    --digital-blue: #2F42FF;
    --digital-green: #3DDC84;

    --highlight: #fbbf24;
    --highlight-bg: #fef3c7;
    --highlight-text: #78350f;
    --java-dot: #e76f00;
    --code-bg: #0d1117;

    --code-near-black: #0A0F1E;
    --code-cb: #7B9FFF;
    --code-cs: #A0A4C0;
    --code-cd: rgba(255,255,255,0.25);
    --code-slate-mid: #636687;

    /* Moderne UI palette (recipe results page) — used in Trigrep
       to mirror FileDiffView / ResultExpansionPanel visuals. */
    --mui-grey-100: #F8F9FA;
    --mui-grey-150: #EDEFEF;
    --mui-grey-200: #E9ECEF;
    --mui-grey-300: #DEE2E6;
    --mui-grey-400: #CED4DA;
    --mui-grey-500: #ADB5BD;
    --mui-grey-600: #6C757D;
    --mui-grey-700: #495057;
    --mui-grey-800: #343A40;
    --mui-card-bg: #F4F4F4;
    --mui-card-body-bg: #FFFFFF;
    --mui-divider: #C1C1C1;
    --mui-blue: #2F42FF;
    --mui-blue-200: #9FA8FF;
    --mui-gold: #FFC107;
    --mui-gold-soft: #FFF3B0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--grey-50);
    color: var(--grey-700);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.55;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }

  /* ===== Shell ===== */
  body { background: var(--surface-page); }
  .shell { height: 100vh; display: flex; flex-direction: column; }
  .grid {
    display: grid;
    grid-template-columns: 98px 1fr;
    grid-template-areas: "nav content";
    flex: 1;
    overflow: hidden;
    gap: 0;
    background: var(--surface-page);
  }

/* ================================================
   LEFT NAVIGATION RAIL (98px) — v2-sandbox spec
   ================================================ */
.left-nav {
  grid-area: nav;
  width: 98px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  padding: 2px 8px 24px;
  gap: 0;
  background: var(--surface-page);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  overflow: visible;
}

.left-nav-top {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  gap: 4px;
}

.nav-item-home { padding: 0 4px; }
.nav-item-home .nav-icon-container { padding: 4px; }

.nav-item {
  width: 100%;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border-radius: var(--radius-lg);
  cursor: pointer;
  position: relative;
  text-decoration: none;
  background: transparent;
}

.nav-icon-container {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: var(--radius-lg);
  border: 1px solid transparent;
  background: transparent;
  transition: background-color 150ms ease, border-color 150ms ease;
}

.nav-item:hover .nav-icon-container,
.nav-item.active .nav-icon-container {
  background: var(--brand-digital-blue-100);
  border-color: var(--brand-digital-blue-200);
}

.nav-item svg {
  width: 22px;
  height: 22px;
  min-width: 22px;
  color: var(--brand-grey-900);
  flex-shrink: 0;
}

.nav-label {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: var(--brand-font-weight-regular);
  line-height: 1;
  color: var(--brand-grey-900);
  text-align: center;
  white-space: normal;
  width: 100%;
  transition: color 150ms ease;
}

.nav-item:hover .nav-label { color: var(--brand-digital-blue-600); }
.nav-item.active .nav-label {
  font-weight: var(--brand-font-weight-semibold);
  color: var(--brand-digital-blue-800);
}

.nav-badge {
  font-size: 11px;
  padding: 0 6px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--brand-grey-200);
  color: var(--brand-grey-800);
  border: 1px solid rgba(107, 114, 128, 0.5);
  font-weight: var(--brand-font-weight-medium);
  line-height: 1;
  text-align: center;
  letter-spacing: 0;
}

.nav-home-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
  padding: 4px 0;
}

.nav-version-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  padding: 0 8px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--brand-digital-blue-500) 0%, var(--brand-violet-500) 100%);
  color: var(--brand-white);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: var(--brand-font-weight-semibold);
  line-height: 1;
  letter-spacing: 0;
}

.nav-more-wrapper { position: relative; margin-top: auto; }

.nav-more-popover {
  position: absolute;
  left: calc(100% + 4px);
  bottom: 0;
  background: var(--surface-primary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 96px;
  z-index: 100;
}

.nav-more-popover[hidden] { display: none; }
.nav-more-popover .nav-item { padding: 8px 4px; }

/* ================================================
   MAIN CONTENT AREA
   ================================================ */
.main-area {
  grid-area: content;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

/* ================================================
   GLOBAL NAVIGATION BAR (65px toolbar)
   ================================================ */
.global-nav {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 12px 20px;
  gap: 12px;
  flex-shrink: 0;
  position: relative;
  width: 100%;
}

.global-nav::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 70%;
  transform: translate(-50%, -50%);
  width: 1000px;
  max-width: 90%;
  height: 65px;
  background: radial-gradient(ellipse at center, var(--brand-red-100) 0%, var(--brand-red-100) 40%, transparent 70%);
  filter: blur(20px);
  z-index: 0;
  pointer-events: none;
}

.global-nav > * { position: relative; z-index: 1; }

.org-selector {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-body);
  font-size: var(--brand-font-size-300);
  color: var(--text-primary);
  cursor: pointer;
  padding: 10px 16px;
  border-radius: var(--radius-full);
  transition: all var(--transition-fast);
  background: var(--surface-primary);
  border: 1px solid var(--border-secondary);
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-transform: none;
}

.org-selector:hover {
  background: var(--brand-grey-200);
  border-color: var(--border-primary);
}

.org-selector.selected {
  color: var(--text-primary);
  font-weight: var(--brand-font-weight-regular);
}

.org-selector-wrapper {
  position: relative;
  flex: 0 1 auto;
  min-width: 0;
  max-width: 50vw;
}

.nav-spacer { flex: 1; }

.search-input {
  height: 40px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-secondary);
  padding: 10px 16px;
  font-size: var(--brand-font-size-300);
  color: var(--text-tertiary);
  background: var(--surface-primary);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: background var(--transition-fast), border-color var(--transition-fast);
  flex-shrink: 0;
  user-select: none;
}

.search-input:hover {
  background: var(--brand-grey-200);
  border-color: var(--border-primary);
}

.search-input > span:first-of-type { flex: 1; white-space: nowrap; }
.search-input-keys { display: inline-flex; align-items: center; gap: 2px; }

.search-input kbd {
  font-size: var(--brand-font-size-100);
  background: var(--surface-tertiary);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-tertiary);
  font-family: var(--font-body);
  border: 1px solid var(--border-primary);
  min-width: 18px;
  text-align: center;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 64px;
}

.nav-action-btn {
  width: 40px;
  height: 40px;
  border-radius: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background var(--transition-fast), transform 200ms ease-in;
  border: none;
  background: transparent;
  color: var(--brand-grey-900);
  flex-shrink: 0;
}

.nav-action-btn:hover { background: var(--brand-grey-200); }
.nav-action-btn.open { background: var(--surface-primary); box-shadow: var(--shadow-xs); }
.nav-action-btn svg { width: 20px; height: 20px; }

.avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background: #E45A4F;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: var(--brand-font-weight-semibold);
  color: var(--brand-white);
  flex-shrink: 0;
}

  /* ===== Page (full-width trigrep panel) ===== */
  .page {
    flex: 1;
    background: var(--bg);
    border-radius: 8px;
    overflow: hidden;
    margin: 0 8px 8px 0;
    min-height: 0;
    display: flex;
    position: relative;
  }
  .trigrep-panel {
    flex: 1 1 auto;
    min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .trigrep-panel[hidden] { display: none; }
  .activity-panel {
    flex: 1 1 auto;
    min-width: 0;
    display: flex; flex-direction: column;
    overflow: auto;
    background: #fafafa;
  }
  .activity-panel[hidden] { display: none; }

  /* ===== Activity page (scoped) ===== */
  .activity-panel {
    --ap-bg:           #fafafa;
    --ap-bg-2:         #f9fafb;
    --ap-panel:        #ffffff;
    --ap-text:         #1f2937;
    --ap-text-sec:     #6b7280;
    --ap-text-mute:    #9ca3af;
    --ap-text-strong:  #111827;
    --ap-line:         #e5e7eb;
    --ap-line-soft:    #f3f4f6;
    --ap-link:         #2f42ff;
    --ap-c-trigrep:        #ecb81f;
    --ap-c-trigrep-text:   #bd9319;
    --ap-c-trigrep-bg:     #fef3c7;
    --ap-c-recipe:         #992fb9;
    --ap-c-recipe-text:    #7e2497;
    --ap-c-commit:         #2f42ff;
    --ap-c-commit-text:    #2f42ff;
    --ap-c-viz:            #27aa88;
    --ap-c-viz-text:       #1f8a6e;
    --ap-c-none:           #e5e7eb;
    --ap-success:          #1e7e34;
    --ap-success-bg:       #e6f4ea;
    --ap-info:             #2f42ff;
    --ap-info-bg:          #e8eaff;
    --ap-warn:             #92400e;
    --ap-warn-bg:          #fef3c7;
    --ap-running:          #7e2497;
    --ap-running-bg:       #f5e6fa;
    --ap-fail:             #b91c1c;
    --ap-fail-bg:          #fee2e2;
    --ap-row-h: 42px;
    --ap-col-act: 34px;
    color: var(--ap-text);
  }
  .activity-panel .ap-main {
    padding: 28px 32px 64px;
    width: 100%;
    max-width: none;
  }
  .activity-panel .ap-crumbs {
    font-size: 12px;
    color: var(--ap-text-sec);
    margin-bottom: 14px;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .activity-panel .ap-legend .li.commit  .sw { background: var(--ap-c-commit); }
  .activity-panel .ap-legend .li.viz     .sw { background: var(--ap-c-viz); }

  /* ===== Trigrep left panel ===== */
  .trigrep-page-header {
    padding: 20px 24px 12px;
    background: #ffffff;
    flex-shrink: 0;
  }
  .trigrep-page-title {
    font-family: var(--font-heading, 'Inter', sans-serif);
    font-size: 21px;
    font-weight: 400;
    color: var(--grey-900, #111827);
    line-height: 1.4;
  }
  .trigrep-page-subtitle {
    font-size: 14px;
    color: var(--grey-600, #6B7280);
    margin-top: 2px;
  }
  .trigrep-head {
    padding: 8px 24px 12px;
    border-bottom: 1px solid var(--mui-divider);
    flex-shrink: 0;
    background: #ffffff;
  }
  .trigrep-search-row {
    display: flex; align-items: center; gap: 10px;
  }
  .trigrep-search-box {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    background: #fff;
    border: 1px solid var(--grey-200);
    border-radius: 8px;
    padding: 6px 10px 6px 12px;
    min-height: 40px;
  }
  .trigrep-search-box:focus-within {
    border-color: var(--brand-digital-blue-500);
    box-shadow: 0 0 0 3px rgba(47, 66, 255, 0.12);
  }
  .trigrep-search-icon { width: 16px; height: 16px; color: var(--grey-500); flex-shrink: 0; }
  /* Syntax selector */
  .syntax-selector { position: relative; flex-shrink: 0; }
  .syntax-selector-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; border: 0;
    padding: 4px 6px;
    font-size: 12px; color: var(--grey-600, #555);
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
  }
  .syntax-selector-btn:hover { background: var(--grey-50, #f5f5f5); color: var(--grey-700, #2b2b2b); }
  .syntax-selector-btn svg { width: 10px; height: 10px; color: var(--grey-500, #777); }
  .syntax-selector[data-open="1"] .syntax-selector-btn svg { transform: rotate(180deg); }
  .syntax-selector-divider {
    width: 1px; height: 18px;
    background: var(--grey-200, #e6e6e6);
    flex-shrink: 0;
    margin: 0 2px;
  }
  .syntax-selector-menu {
    position: absolute;
    top: calc(100% + 6px); left: 0;
    margin: 0; padding: 4px;
    list-style: none;
    background: #fff;
    border: 1px solid var(--grey-200, #e6e6e6);
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    z-index: 30;
    min-width: 260px;
  }
  .syntax-selector-menu li {
    padding: 8px 10px;
    font-size: 12px;
    color: var(--grey-700, #2b2b2b);
    cursor: pointer;
    border-radius: 4px;
    display: flex; flex-direction: column;
    gap: 2px;
  }
  .syntax-selector-menu li:hover { background: var(--grey-50, #f5f5f5); }
  .syntax-selector-menu li[aria-selected="true"] {
    color: var(--brand-digital-blue-500);
    font-weight: 500;
  }
  .syntax-selector-menu .opt-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 500;
    color: var(--grey-900);
  }
  .syntax-selector-menu .opt-label svg { width: 12px; height: 12px; color: var(--grey-500); }
  .syntax-selector-menu .opt-desc {
    font-size: 11px; color: var(--grey-500);
    font-family: 'JetBrains Mono', monospace;
  }
  .syntax-selector-menu li[aria-selected="true"] .opt-label { color: var(--brand-digital-blue-500); }
  .syntax-selector-menu li[aria-selected="true"] .opt-label svg { color: var(--brand-digital-blue-500); }
  .trigrep-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--grey-50);
    color: var(--grey-700);
    border: 1px solid var(--grey-100);
    border-radius: 6px;
    padding: 3px 4px 3px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    white-space: nowrap;
  }
  .trigrep-chip strong { color: var(--grey-500); font-weight: 500; margin-right: 1px; }
  .trigrep-chip-x {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: none; background: transparent;
    color: var(--grey-500); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .trigrep-chip-x:hover { background: var(--grey-200); color: var(--grey-900); }
  .trigrep-chip-x svg { width: 10px; height: 10px; }
  .trigrep-query {
    flex: 1; min-width: 80px;
    border: none; outline: none; background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--grey-900);
  }
  .trigrep-query::placeholder {
    font-family: var(--brand-font-family-sans);
    font-size: 13.5px;
    color: var(--grey-500);
    opacity: 1;
  }
  .btn-search {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 40px;
    background: var(--brand-digital-blue-500);
    color: #fff; border: none;
    padding: 0 16px;
    border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .btn-search:hover { background: #1f30e6; }

  /* Clear-query button inside the search box */
  .trigrep-query-clear {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: var(--grey-100);
    color: var(--grey-500);
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: background 0.1s, color 0.1s;
  }
  .trigrep-query-clear:hover { background: var(--grey-200); color: var(--grey-800); }
  .trigrep-query-clear svg { width: 12px; height: 12px; }

  /* Bookmark / saved-search controls inside the search box */
  .bookmark-controls {
    position: relative;
    display: inline-flex; align-items: center;
    flex-shrink: 0;
    margin-left: 2px;
  }
  .bookmark-divider {
    width: 1px; height: 18px;
    background: var(--grey-200);
    margin: 0 6px 0 4px;
    flex-shrink: 0;
  }
  .bookmark-toggle, .bookmark-list-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--grey-500);
    cursor: pointer;
    padding: 0;
    border-radius: 4px;
    transition: background 0.12s, color 0.12s;
  }
  .bookmark-toggle { width: 24px; }
  .bookmark-list-btn { width: 18px; }
  .bookmark-toggle:hover, .bookmark-list-btn:hover {
    background: var(--grey-100);
    color: var(--grey-800);
  }
  .bookmark-toggle:disabled {

  .bookmark-list-btn svg { width: 11px; height: 11px; }

    color: var(--brand-digital-blue-500);
  }
  .bookmark-toggle[data-saved="1"] svg { fill: currentColor; }
  .bookmark-controls[data-open="1"] .bookmark-list-btn svg { transform: rotate(180deg); }

  .bookmark-popover {
    position: absolute;
    top: calc(100% + 8px); right: 0;
    width: 340px;
    background: #fff;
    border: 1px solid var(--grey-200);

  }
  .bookmark-popover-header {
    display: flex; align-items: center; justify-content: space-between;

    border-bottom: 1px solid var(--grey-100);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--grey-500);
    background: var(--grey-50);
  }
  .bookmark-popover-header .bookmark-popover-count {
    font-size: 11px;

    text-transform: none;

  }
  .bookmark-popover-list {
    max-height: 320px;
    overflow-y: auto;
  }
  .bookmark-popover-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px;
    border-top: 1px solid var(--grey-100);
    cursor: pointer;
    background: transparent;
    border-left: none; border-right: none; border-bottom: none;
    text-align: left;
    width: 100%;
    font-family: inherit;
    transition: background 0.12s;
  }
  .bookmark-popover-item:first-child { border-top: none; }
  .bookmark-popover-item:hover { background: rgba(47, 66, 255, 0.04); }
  .bookmark-popover-icon {
    width: 14px; height: 14px;
    color: var(--brand-digital-blue-500);
    flex-shrink: 0;
  }
  .bookmark-popover-icon svg { width: 14px; height: 14px; fill: currentColor; }
  .bookmark-popover-text {
    flex: 1 1 auto; min-width: 0;
    display: flex; flex-direction: column;
    gap: 2px;
  }
  .bookmark-popover-label {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--grey-900);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bookmark-popover-query {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--grey-600);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bookmark-popover-mode {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--grey-50);
    color: var(--grey-600);
    flex-shrink: 0;
  }
  .bookmark-popover-mode.mode-sourcegraph {
    background: rgba(47, 66, 255, 0.08);
    color: var(--brand-digital-blue-500);
  }
  .bookmark-popover-mode.mode-comby {
    background: rgba(153, 47, 185, 0.08);
    color: #7e2497;
  }
  .bookmark-popover-mode.mode-regex {
    background: rgba(236, 184, 31, 0.14);
    color: #8a6a10;
  }
  .bookmark-popover-remove {
    width: 22px; height: 22px;
    border: none;
    background: transparent;
    color: var(--grey-400);
    cursor: pointer;
    border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.12s, background 0.12s, color 0.12s;
  }
  .bookmark-popover-item:hover .bookmark-popover-remove { opacity: 1; }
  .bookmark-popover-remove:hover { background: var(--grey-100); color: var(--grey-800); }
  .bookmark-popover-remove svg { width: 11px; height: 11px; }
  .bookmark-popover-empty {
    padding: 20px 16px;
    text-align: center;
    color: var(--grey-500);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .bookmark-popover-empty strong { color: var(--grey-700); font-weight: 600; }

  /* Search-bar help text */
  .search-help-row {
    margin-top: 8px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    min-height: 18px;
  }
  /* Collapse the row only when EVERY slot is empty (no help line + no
     stats). With the persistent help line we want a small consistent gap
     under the search bar. */
  .search-help-row:not(:has(*:not(:empty))) {
    margin-top: 0;
    min-height: 0;
  }
  .search-help {
    font-size: 12px;
    color: var(--grey-500);
    line-height: 1.5;
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .search-help code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--grey-700);
    background: var(--grey-50);
    border: 1px solid var(--grey-100);
    padding: 0 4px;
    border-radius: 3px;
  }
  .search-help-stats {
    display: inline-flex; align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--mui-grey-600);
    flex-shrink: 0;
  }
  .search-help-stats:empty { display: none; }
  .results-toolbar-summary { color: var(--mui-grey-700); }
  .results-toolbar-summary strong { color: var(--grey-900); font-weight: 600; }
  .results-toolbar-recipes { color: var(--mui-grey-700); }
  .results-toolbar-recipes strong { color: var(--grey-900); font-weight: 600; }
  .results-toolbar-time {
    color: var(--mui-grey-500);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .results-toolbar-export {
    color: var(--brand-digital-blue-500);
    text-decoration: none;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .results-toolbar-export:hover { text-decoration: underline; }
  .results-toolbar-export svg { width: 11px; height: 11px; }

  /* Summary panel card — ported from recipe-results .summary. Lives at the
     top of the sidebar (matching the recipe-results layout) and replaces
     the inline matches / files / time stats. */
  .trigrep-sidebar-summary {
    padding: 12px 12px 4px;
    flex-shrink: 0;
  }
  .tg-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 24px;
    background: #fff;
    border: 1px solid var(--brand-grey-300);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .tg-summary-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
    padding: 2px 0;
    font-size: 12.5px;
  }
  .tg-summary-row-wide { grid-column: 1 / -1; }
  .tg-summary-key { color: var(--mui-grey-600); }
  .tg-summary-val {
    color: var(--grey-900);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tg-summary-val.link {
    color: var(--brand-digital-blue-500);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    text-decoration: none;
  }
  .tg-summary-val.link:hover { text-decoration: underline; }
  .tg-summary-val.link svg { width: 11px; height: 11px; }
  .tg-summary-val.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  .trigrep-body {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  /* Sidebar */
  .trigrep-sidebar {
    flex: 0 0 var(--tg-sidebar-w, 40%);
    min-width: 280px;
    max-width: 60%;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--brand-grey-300);
    background: #ffffff;
    font-size: 12px;
    min-height: 0;
    padding: 18px 16px 0;
    position: relative;
  }
  /* Drag handle on the sidebar's right edge — mirrors the recipe-results
     prototype's .results-divider: 7px hit area, a 1px hairline that turns
     into a 2px blue accent on hover/drag, plus a centered grip pill that
     fades in to make the affordance discoverable. */
  .trigrep-sidebar-handle {
    position: absolute;
    top: 0; bottom: 0; right: -3px;
    width: 7px;
    cursor: col-resize;
    background: transparent;
    z-index: 10;
    user-select: none;
    touch-action: none;
  }
  .trigrep-sidebar-handle::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 3px;
    width: 1px;
    background: var(--brand-grey-300);
    transition: background 120ms ease, width 120ms ease, left 120ms ease;
  }
  .trigrep-sidebar-handle::after {
    content: "";
    position: absolute;
    left: 1px; top: 50%;
    transform: translateY(-50%);
    width: 4px; height: 30px;
    border-radius: 3px;
    background: var(--brand-grey-300);
    opacity: 0;
    transition: opacity 120ms ease, background 120ms ease;
  }
  .trigrep-sidebar-handle:hover::before,
  .trigrep-sidebar-handle.is-dragging::before {
    background: var(--brand-digital-blue-400);
    width: 2px;
    left: 2.5px;
  }
  .trigrep-sidebar-handle:hover::after,
  .trigrep-sidebar-handle.is-dragging::after {
    opacity: 1;
    background: var(--brand-digital-blue-400);
  }
  body.tg-resizing,
  body.tg-resizing * { cursor: col-resize !important; user-select: none !important; }
  .trigrep-pane {
    display: flex; flex-direction: column;
    min-height: 0;
    flex: 1 1 50%;
  }
  .trigrep-pane + .trigrep-pane {
    margin-top: 12px;
  }
  .trigrep-pane-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px 8px;
    font-size: 11px;
    color: var(--mui-grey-600);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .trigrep-pane-head .pane-count {
    color: var(--mui-grey-500);
    font-weight: 600;
    text-transform: none;
    margin-left: 4px;
  }
  .trigrep-pane-head .collapse-all {
    color: var(--brand-digital-blue-500); cursor: pointer;
    text-transform: none; letter-spacing: 0; font-weight: 500;
    font-size: 11.5px;
  }

  .trigrep-pane-body {
    overflow-y: auto;
    padding: 0 8px 12px;
    min-height: 0;
  }
  .trigrep-pane-body::-webkit-scrollbar { width: 6px; }
  .trigrep-pane-body::-webkit-scrollbar-thumb { background: var(--brand-grey-300); border-radius: 3px; }
  .filter-group { margin: 4px 0 2px; }
  .filter-group-head {
    display: flex; align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 6px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px; font-weight: 700;
    color: var(--mui-grey-800);
  }
  .filter-group-head:hover { background: var(--mui-grey-100); }
  .filter-group-head svg {
    width: 14px; height: 14px;
    color: var(--mui-grey-600);
    transition: transform 0.2s ease;
    flex: 0 0 auto;
  }
  .filter-group.collapsed .filter-group-head svg { transform: rotate(-90deg); }
  .filter-group.collapsed .filter-group-body { display: none; }
  .filter-group-body { padding: 2px 0 6px 8px; margin-left: 12px; }
  .filter-group-label {
    padding: 14px 6px 6px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .filter-group + .filter-group .filter-group-label {

  .filters-card {
    border: 1px solid var(--brand-grey-300);
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
    padding-bottom: 8px;
  }
  .filters-card .filter-group-label { padding: 14px 12px 6px; }

  .filters-card .filter-item { padding: 4px 12px; border-radius: 0; }
  .filter-group-key {

    color: var(--mui-grey-900);
    letter-spacing: 0;

  .filter-item.is-mono .filter-item-name {
    font-family: 'JetBrains Mono', monospace;

  }
  .filter-item-not {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--brand-red-700);
    background: var(--brand-red-100);
    border: 1px solid var(--brand-red-400);
    border-radius: 3px;
    padding: 0 4px;
    margin-right: 6px;
    line-height: 14px;
  }
  .topic-search {
    width: calc(100% - 8px);
    margin: 4px 0 6px;
    padding: 5px 9px;
    border: 1px solid var(--brand-grey-300);
    border-radius: 4px;

  .filter-item {

    color: var(--mui-grey-600);
    font-size: 12px;
    flex: 0 0 auto;
  }
  .filter-item.active {
    background: rgba(47, 66, 255, 0.06);
    color: var(--brand-digital-blue-500);
    font-weight: 500;
  }

  .filter-item .lang-dot {
    width: 8px; height: 8px;
    border-radius: 50%;

  }

    display: inline-flex; align-items: center;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

    flex-shrink: 0;
    color: transparent;
    margin-right: 6px;
  }

    color: var(--brand-digital-blue-500);
  }
  .filter-group.is-repo-list .filter-item .count {
    color: var(--brand-digital-blue-500);

  }
