// Single source of truth for the totals shown anywhere in the prototype
// (tree, scope bar, hierarchy header, recipe-run drawer). Derived from the
// actual cards so every number reconciles.
function flowTotals(flow) {
  // Once the tree is built (which includes the generated bulk pool), prefer
  // its tallies so every counter in the UI agrees. Falls back to the raw
  // fixture totals before the tree exists.
  if (typeof tgTreeData !== 'undefined' && tgTreeData && tgTreeData.length
      && tgCurrentFlow && tgCurrentFlow.id === flow.id) {
    const matches = tgTreeData.reduce((s, r) => s + (r.results || 0), 0);
    const files   = tgTreeData.reduce((s, r) => s + (r.files ? r.files.length : 0), 0);
    const repos   = tgTreeData.filter(r => (r.status || 'ok') === 'ok' && r.results > 0).length;
    const m = (flow.phase2.summary || '').match(/([\d.]+ms)/);
    return { matches, files, repos, time: m ? m[1] : '' };
  }
  const all = [...(flow.cards || []), ...(flow.phase2.extraCards || [])];
  const matches = all.reduce((s, c) => s + (c.count || 0), 0);
  const files = all.length;
  const repos = new Set(all.map(c => c.module || 'unknown')).size;
  const m = (flow.phase2.summary || '').match(/([\d.]+ms)/);
  return { matches, files, repos, time: m ? m[1] : '' };
}

function tgBuildTreeData(flow) {
  const all = [...(flow.cards || []), ...(flow.phase2.extraCards || [])];
  const repoMap = new Map();
  all.forEach((card) => {
    const repoName = card.module || 'unknown';
    if (!repoMap.has(repoName)) {
      repoMap.set(repoName, {
        id: 'tgr_' + repoMap.size,
        name: repoName,
        branch: 'main',
        status: 'ok',
        files: [],
        results: 0,
      });
    }
    const repo = repoMap.get(repoName);
    const fileId = repo.id + '__' + card.id;
    const matches = (card.lines || []).map((l, i) => ({
      id: fileId + '__m' + i,
      n: l.n,
      code: l.code,
    }));
    repo.files.push({
      id: fileId,
      cardId: card.id,
      file: card.file,
      count: card.count,
      matches,
    });
    repo.results += card.count;
  });
  const handAuthored = Array.from(repoMap.values());
  // Pad with a large generated pool so the tree convincingly shows results
  // across hundreds of repositories — mirrors the recipe-results scale.
  const bulk = tgGenerateRepoPool(flow, handAuthored, 220);
  return [...handAuthored, ...bulk];
}

// === Bulk-repo fixture generator ======================================
// Mirrors the recipe-results prototype's mix of statuses (most repos have
// results, a chunk show "no results", a few error out). Match snippets are
// recycled from the active flow's hand-authored cards so the right-pane
// card UI still renders real-looking code.
const TG_REPO_POOL_NAMES = [
  'analytics-pipeline','fraud-detector','audit-log','event-bus','message-router',

  'marketing-emails','marketing-push','marketing-segments','growth-experiments','growth-ab',

  'docs-portal','dev-docs','api-docs','spec-generator','swagger-tooling',
  'tax-engine','tax-rules','vat-calculator','customs-broker','invoicing',
  'subscriptions','billing-cycles','billing-retry','dunning-svc','collections',
  'risk-rules','risk-decisioning','risk-models','kyc-pipeline','kyc-decision',
  'aml-screening','sanctions-list','watchlist-sync','transaction-monitor','case-mgmt',
  'webhook-dispatcher','webhook-receiver','api-gateway-edge','api-gateway-core','api-throttle',
  'rate-limiter','cache-warmer','cdn-edge','image-pipeline','image-cdn',
  'video-encoder','video-cdn','search-frontend','search-backend','search-tuning',
  'recsys-eval','recsys-ranking','ml-pipeline','ml-features','ml-serving',
  'model-registry','model-monitor','prompt-router','llm-gateway','llm-eval',
  'embeddings-svc','vector-store','rag-pipeline','agent-runtime','agent-tools',
  'gameday-runbooks','chaos-experiments','dr-failover','backup-controller','restore-svc',
  'secrets-broker','keyring','jwt-issuer','jwt-verifier','oauth-broker',
  'sso-bridge','saml-bridge','scim-bridge','user-directory','group-directory',
  'permission-engine','policy-engine','policy-store','abac-decider','rbac-mapper',
  'audit-trail','tamper-log','change-feed','event-store','event-replay',
  'job-scheduler','job-runner','cron-supervisor','workflow-engine','workflow-ui',
  'queue-broker','queue-dlq','queue-replay','priority-queue','delay-queue',
  'feed-ingest','feed-normalizer','feed-router','feed-publisher','feed-archive',
  'taxonomy-service','glossary-svc','dictionary-svc','translation-svc','locale-service',
  'fx-conversion','geo-routing','geo-ip','region-router','region-sync',
  'admin-tools','operator-console','engineering-onboarding','ci-orchestrator','release-trainer',
];
const TG_REPO_BRANCHES = ['main','main','main','main','master','develop','release/2024','release/2025'];
function tgGenerateRepoPool(flow, handAuthored, target) {
  const handNames = new Set(handAuthored.map(r => r.name));
  const seedCards = [...(flow.cards || []), ...(flow.phase2.extraCards || [])];
  if (!seedCards.length) return [];
  const palette = TG_REPO_POOL_NAMES.filter(n => !handNames.has(n));
  let s = 0; for (const c of flow.id) s = (s * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0xFFFFFFFF; };
  const need = Math.max(0, target - handAuthored.length);
  const out = [];
  let nextId = handAuthored.length;
  for (let i = 0; i < need && i < palette.length; i++) {
    const r = rnd();
    let status = 'ok';
    if (r > 0.72 && r <= 0.92) status = 'none';
    else if (r > 0.92) status = 'error';
    const repoId = 'tgr_' + (nextId++);
    const repo = {
      id: repoId,
      name: palette[i],
      branch: TG_REPO_BRANCHES[(i * 7 + Math.floor(rnd() * 7)) % TG_REPO_BRANCHES.length],
      status,
      files: [],
      results: 0,
    };
    if (status === 'ok') {
      const nFiles = 1 + Math.floor(rnd() * 3);
      for (let f = 0; f < nFiles; f++) {
        const seed = seedCards[Math.floor(rnd() * seedCards.length)];
        const fileId = repo.id + '__gen' + f;
        const lineOffset = 4 + Math.floor(rnd() * 90);
        const matches = (seed.lines || []).slice(0, 2 + Math.floor(rnd() * 4)).map((l, mi) => ({
          id: fileId + '__m' + mi,
          n: (l.n || 1) + lineOffset,
          code: l.code,
        }));
        if (!matches.length) continue;
        repo.files.push({
          id: fileId,
          cardId: seed.id + '_gen_' + repoId + '_' + f,
          file: seed.file,
          count: matches.length,
          matches,
        });
        repo.results += matches.length;
      }
      if (repo.files.length === 0) repo.status = 'none';
    }
    out.push(repo);
  }
  return out;
}

function tgChevHTML(expanded) {
  return `<button type="button" class="chev-btn hn-chev ${expanded ? '' : 'collapsed'}" tabindex="-1" aria-label="Expand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>`;
}
function tgCbHTML(kind, id, sel) {
  const checked = sel === 'all' || sel === true;
  const ind = sel === 'some';
  return `<input type="checkbox" class="ckbox hn-check" data-cbk="${kind}" data-cid="${id}" ${checked ? 'checked' : ''} ${ind ? 'data-ind="1"' : ''}>`;
}

function tgFileMatchKeys(file) { return file.matches.map(m => m.id); }
function tgRepoMatchKeys(repo) { return repo.files.flatMap(tgFileMatchKeys); }
function tgRollup(keys) {
  if (!keys.length) return 'none';
  const n = keys.filter(k => tgTreeState.selMatches.has(k)).length;
  return n === 0 ? 'none' : (n === keys.length ? 'all' : 'some');
}
function tgFileSel(file) { return tgRollup(tgFileMatchKeys(file)); }
function tgRepoSel(repo) { return tgRollup(tgRepoMatchKeys(repo)); }

function tgAct(type, id) {
  const s = tgTreeState.scope;
  return !!(s && s.type === type && s.id === id);
}

const TG_PAD = d => `style="padding-left:${12 + d * 20}px"`;

function tgRepoNodeHTML(r, d) {
  const expanded = tgTreeState.expanded.has(r.id);
  const status = r.status || (r.results > 0 ? 'ok' : 'none');
  let resTxt, resCls;
  if (status === 'error') { resTxt = 'Error'; resCls = 'is-error'; }
  else if (status === 'none' || r.results === 0) { resTxt = 'No results'; resCls = 'is-none'; }
  else { resTxt = `${r.results.toLocaleString()} result${r.results === 1 ? '' : 's'}`; resCls = ''; }
  const dotCls = status === 'error' ? 'error' : (status === 'none' ? 'none' : 'ok');
  const dotTitle = status === 'error' ? 'Failed to scan' : (status === 'none' ? 'No matches in this repo' : 'Has results');
  // Skip the chevron entirely for repos with nothing to drill into.
  const chev = status === 'ok' && r.files.length > 0 ? tgChevHTML(expanded) : '<span class="chev-spacer"></span>';
  let html = `<div class="hn-row n-repo n-repo-${status} ${tgAct('repo', r.id) ? 'active' : ''}" data-node="repo" data-id="${r.id}" ${TG_PAD(d)}>
    ${chev}
    ${tgCbHTML('repo', r.id, tgRepoSel(r))}
    <span class="repo-status-dot ${dotCls}" title="${dotTitle}"></span>
    <span class="hn-name">${escapeHtml(r.name)} <span class="hn-repo-branch">@ ${escapeHtml(r.branch)}</span></span>
    <span class="hn-spacer"></span>
    <span class="hn-count ${resCls}">${resTxt}</span>
  </div>`;
  if (expanded && status === 'ok') r.files.forEach(f => { html += tgFileNodeHTML(r, f, d + 1); });
  return html;
}

function tgFileNodeHTML(r, f, d) {
  const expanded = tgTreeState.expanded.has(f.id);
  let html = `<div class="hn-row n-file ${tgAct('file', f.id) ? 'active' : ''}" data-node="file" data-id="${f.id}" data-rid="${r.id}" ${TG_PAD(d)}>
    ${tgChevHTML(expanded)}
    ${tgCbHTML('file', f.id, tgFileSel(f))}
    ${TG_IC_FILE}<span class="hn-name">${escapeHtml(f.file)}</span>
    <span class="hn-spacer"></span>
    <span class="hn-count">${f.count} match${f.count === 1 ? '' : 'es'}</span>
  </div>`;
  if (expanded) f.matches.forEach(m => { html += tgMatchNodeHTML(r, f, m, d + 1); });
  return html;
}

function tgMatchNodeHTML(r, f, m, d) {
  const snippet = (m.code || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  const display = snippet.length > 80 ? snippet.slice(0, 80) + '…' : snippet;
  return `<div class="hn-row n-match ${tgAct('match', m.id) ? 'active' : ''}" data-node="match" data-id="${m.id}" data-rid="${r.id}" data-fid="${f.id}" ${TG_PAD(d)}>
    <span class="chev-spacer"></span>
    <input type="checkbox" class="ckbox hn-check" data-cbk="match" data-cid="${m.id}" ${tgTreeState.selMatches.has(m.id) ? 'checked' : ''}>
    ${TG_IC_MATCH}<span class="hn-name hn-match"><span class="hn-line-no">L${m.n}</span>${escapeHtml(display)}</span>
    <span class="hn-spacer"></span>

}

// Read the names of currently-active filter items in the left sidebar.
function tgActiveFilterNames() {
  const out = new Set();
  trigrepPanel.querySelectorAll('.filter-item.active .filter-item-name').forEach(el => {
    out.add(el.textContent.trim().toLowerCase());
  });
  return out;
}

// Apply existing filters to top-level repos: if any filter is active and
// any active filter name matches a repo name, restrict to that subset.
// Otherwise (no active filters), show all repos. Then narrow further by the
// repository-name search input (the "Filter repositories…" field).
let tgRepoSearchQuery = '';
function tgFilteredRepos() {
  let repos = tgTreeData;
  const active = tgActiveFilterNames();
  if (active.size > 0) {
    const matches = repos.filter(r => active.has(r.name.toLowerCase()));
    if (matches.length > 0) repos = matches;
  }
  const q = (tgRepoSearchQuery || '').trim().toLowerCase();
  if (q) repos = repos.filter(r => r.name.toLowerCase().includes(q));
  return repos;
}

// Structural signature for a match line. Strips HTML, normalises string
// literals and numeric/identifier args to placeholders, then lower-cases.
// Two matches that share a call shape end up with the same signature even
// if the argument values differ — that's the cluster predicate.
function tgMatchSignature(code) {
  if (!code) return '';
  let s = String(code);
  s = s.replace(/<[^>]+>/g, '');
  s = s.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  // String literals → "…" so different args don't fragment the bucket.
  s = s.replace(/"(?:[^"\\]|\\.)*"/g, '"…"');
  s = s.replace(/'(?:[^'\\]|\\.)*'/g, "'…'");
  // Numbers → N
  s = s.replace(/\b\d+(?:\.\d+)?\b/g, 'N');
  s = s.replace(/\s+/g, ' ').trim().toLowerCase();
  return s;
}

// Pretty-print the same line for the cluster header — keeps original
// capitalisation/punctuation but still collapses string contents so
// the bucket label reads as a pattern, not a single example.
function tgMatchSignatureDisplay(code) {
  if (!code) return '';
  let s = String(code);
  s = s.replace(/<[^>]+>/g, '');
  s = s.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  s = s.replace(/"(?:[^"\\]|\\.)*"/g, '"…"');
  s = s.replace(/'(?:[^'\\]|\\.)*'/g, "'…'");
  s = s.replace(/\b\d+(?:\.\d+)?\b/g, 'N');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

// One signature per repo: the most-frequent line-shape across its matches.
// Repos with no matches at all get a stable '__none__' bucket so they can
// be surfaced (collapsed) under an "Other / no matches" cluster.
function tgRepoSignature(repo) {
  const counts = new Map();
  const displays = new Map();
  for (const f of repo.files) {
    for (const m of f.matches) {
      const sig = tgMatchSignature(m.code);
      if (!sig) continue;
      counts.set(sig, (counts.get(sig) || 0) + 1);
      if (!displays.has(sig)) displays.set(sig, tgMatchSignatureDisplay(m.code));
    }
  }
  if (counts.size === 0) return { key: '__none__', display: '' };
  // Pick the dominant signature; ties broken by lexicographic order so the
  // bucketing is deterministic across renders.
  let bestSig = null, bestCount = -1;
  for (const [sig, n] of counts) {
    if (n > bestCount || (n === bestCount && bestSig !== null && sig < bestSig)) {
      bestSig = sig; bestCount = n;
    }
  }
  return { key: bestSig, display: displays.get(bestSig) || bestSig };
}

// Bucket the filtered repo list by signature. Returns an array of clusters
// sorted by size (largest first) so the most-impactful patterns surface at
// the top — same heuristic IntelliJ uses for similar-usages clustering.
function tgClusterReposBySimilarity(repos) {
  const map = new Map();
  for (const r of repos) {
    const { key, display } = tgRepoSignature(r);
    if (!map.has(key)) map.set(key, { key, display, repos: [] });
    map.get(key).repos.push(r);
    // Prefer a non-empty display label when one shows up later in the bucket.
    if (!map.get(key).display && display) map.get(key).display = display;
  }
  const clusters = [...map.values()];
  clusters.sort((a, b) => {
    // "Other / no matches" always sinks to the bottom.
    if (a.key === '__none__') return 1;
    if (b.key === '__none__') return -1;
    return b.repos.length - a.repos.length;
  });
  return clusters;
}

function tgClusterHeaderHTML(cluster, index) {
  const id = 'cl_' + index;
  const collapsed = tgCollapsedClusters.has(id);
  const isOther = cluster.key === '__none__';
  const label = isOther
    ? 'Other / no extracted pattern'
    : `<span class="hn-cluster-mark">${escapeHtml(cluster.display || cluster.key)}</span>`;
  const repoCount = cluster.repos.length;
  const totalResults = cluster.repos.reduce((s, r) => s + r.results, 0);
  const countText = isOther
    ? `${repoCount.toLocaleString()} repo${repoCount === 1 ? '' : 's'}`
    : `${repoCount.toLocaleString()} repo${repoCount === 1 ? '' : 's'} · ${totalResults.toLocaleString()} result${totalResults === 1 ? '' : 's'}`;
  return `<div class="hn-cluster ${isOther ? 'is-other' : ''} ${collapsed ? 'collapsed' : ''}" data-cluster-id="${id}">
    <button type="button" class="chev-btn ${collapsed ? 'collapsed' : ''}" tabindex="-1" aria-label="Toggle cluster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    <span class="hn-cluster-label">${label}</span>
    <span class="hn-cluster-count">${countText}</span>
  </div>`;
}

function tgRenderTree() {
  const body = trigrepPanel.querySelector('#tg-tree-body');
  if (!body) return;
  const repos = tgFilteredRepos();
  const totalResults = repos.reduce((s, r) => s + r.results, 0);
  if (!repos.length) {
    body.innerHTML = `<div style="padding:16px;font-size:12.5px;color:var(--grey-500)">No repositories match the active filters.</div>`;
  } else if (tgGroupBySimilarity) {
    const clusters = tgClusterReposBySimilarity(repos);
    body.innerHTML = clusters.map((cluster, i) => {
      const id = 'cl_' + i;
      const header = tgClusterHeaderHTML(cluster, i);
      if (tgCollapsedClusters.has(id)) return header;
      return header + cluster.repos.map(r => tgRepoNodeHTML(r, 0)).join('');
    }).join('');
  } else {
    body.innerHTML = repos.map(r => tgRepoNodeHTML(r, 0)).join('');
  }
  body.querySelectorAll('.hn-check[data-ind="1"]').forEach(c => { c.indeterminate = true; });
  const footer = trigrepPanel.querySelector('#tg-footer-summary');
  if (footer) {
    if (tgGroupBySimilarity && repos.length) {
      const clusters = tgClusterReposBySimilarity(repos);
      footer.textContent = `${clusters.length.toLocaleString()} pattern${clusters.length === 1 ? '' : 's'} · ${repos.length.toLocaleString()} of ${tgTreeData.length.toLocaleString()} repositor${tgTreeData.length === 1 ? 'y' : 'ies'} · ${totalResults.toLocaleString()} result${totalResults === 1 ? '' : 's'}`;
    } else {
      footer.textContent = `Showing ${repos.length.toLocaleString()} of ${tgTreeData.length.toLocaleString()} repositor${tgTreeData.length === 1 ? 'y' : 'ies'} · ${totalResults.toLocaleString()} result${totalResults === 1 ? '' : 's'}`;
    }
  }
  const selCount = trigrepPanel.querySelector('#tg-sel-count');
  if (selCount) selCount.textContent = tgTreeState.selMatches.size.toLocaleString();
  const expandLink = trigrepPanel.querySelector('#tg-cluster-expand-all');
  if (expandLink) {
    if (tgGroupBySimilarity && repos.length) {
      const clusters = tgClusterReposBySimilarity(repos);
      const allIds = clusters.map((_, i) => 'cl_' + i);
      const anyCollapsed = allIds.some(id => tgCollapsedClusters.has(id));
      expandLink.textContent = anyCollapsed ? 'Expand all' : 'Collapse all';
      expandLink.hidden = false;
    } else {
      expandLink.hidden = true;
    }
  }
}

// Reuse the original trigrep-activity start-state visual treatment as the
// detail-pane empty state so it matches the rest of the prototype.
const TG_EMPTY_DETAIL = `<div class="trigrep-start-state">
  <div class="trigrep-start-hero">
    <div class="trigrep-start-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><polyline points="8.5 8 6 11 8.5 14"/><polyline points="13.5 8 16 11 13.5 14"/></svg>
    </div>
    <div class="trigrep-start-title">Pick a result to inspect it</div>
    <div class="trigrep-start-subtitle">Select a repository, file, or match in the hierarchy to view its matches and the surrounding code.</div>
  </div>
</div>`;

// The right pane now always shows the full results set with surrounding
// context on. Tree row clicks scroll/jump to the matching card rather than
// re-rendering the pane. Mirrors recipe-results' detail panel UX.
const TG_DETAIL_PAGE_SIZE = 30;
let tgDetailVisible = TG_DETAIL_PAGE_SIZE;
function tgRenderDetail() {
  const slot = trigrepPanel.querySelector('#tg-detail-slot');
  if (!slot) return;
  if (!tgTreeData || tgTreeData.length === 0) { slot.innerHTML = TG_EMPTY_DETAIL; return; }
  const allCards = tgTreeData.flatMap(r => r.files.map(f => ({ repo: r, file: f })));
  tgDetailVisible = Math.min(allCards.length, TG_DETAIL_PAGE_SIZE);
  const remaining = allCards.length - tgDetailVisible;
  const moreHTML = remaining > 0
    ? `<button type="button" class="tg-detail-more" id="tg-detail-more">Show ${Math.min(remaining, TG_DETAIL_PAGE_SIZE).toLocaleString()} more files <span class="tg-detail-more-sub">· ${remaining.toLocaleString()} of ${allCards.length.toLocaleString()} files left</span></button>`
    : '';
  const stats = tgFlowStats || {};
  const statsLine = `<strong>${stats.matches || allCards.length.toLocaleString()}</strong> matches in <strong>${stats.files || allCards.length.toLocaleString()}</strong> files across <strong>${(stats.repos || tgTreeData.length).toLocaleString()}</strong> repos`;
  slot.innerHTML = `
    <div class="tg-detail-toolbar" id="tg-detail-toolbar">
      <span class="tg-detail-toolbar-title">${statsLine}${stats.time ? `<span class="tg-detail-toolbar-time">${stats.time}</span>` : ''}</span>
      <span class="tg-detail-toolbar-spacer"></span>
      <button type="button" class="dt-btn" id="tg-export-btn" title="Export results as CSV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export CSV</button>
      <button type="button" class="dt-btn icon" id="tg-collapse-toggle" title="Collapse all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg></button>
    </div>
    <div id="tg-match-list">${tgGroupedCardsHTML(allCards.slice(0, tgDetailVisible))}</div>
    ${moreHTML}
  `;
  tgWireDetail(slot);
  const moreBtn = slot.querySelector('#tg-detail-more');
  if (moreBtn) {
    moreBtn.addEventListener('click', () => {
      const prevVisible = tgDetailVisible;
      tgDetailVisible = Math.min(allCards.length, tgDetailVisible + TG_DETAIL_PAGE_SIZE);
      // Re-render the whole list so repo-group headers stay correct when a
      // new page extends a group that already had cards in the previous page.
      const list = slot.querySelector('#tg-match-list');
      list.innerHTML = tgGroupedCardsHTML(allCards.slice(0, tgDetailVisible));
      const rem = allCards.length - tgDetailVisible;
      if (rem <= 0) moreBtn.remove();
      else moreBtn.querySelector('.tg-detail-more-sub').textContent = `· ${rem.toLocaleString()} of ${allCards.length.toLocaleString()} files left`;
      tgWireDetail(slot);
    });
  }
}

// Render cards grouped by repo. Each group has an embedded header that
// can collapse/expand the cards underneath it.
function tgGroupedCardsHTML(cards) {
  const groups = [];
  let current = null;
  cards.forEach(({ repo, file }) => {
    if (!current || current.repo.id !== repo.id) {
      current = { repo, files: [] };
      groups.push(current);
    }
    current.files.push(file);
  });
  return groups.map(({ repo, files }) => {
    const repoMatches = repo.files.reduce((s, f) => s + f.count, 0);
    const sel = tgRepoSel(repo);
    const checked = sel === 'all' || sel === true;
    const indeterminate = sel === 'some';
    const headerHTML = `<div class="tg-repo-header" id="rh-${repo.id}" role="button" tabindex="0" aria-expanded="true">
      <input type="checkbox" class="ckbox tg-repo-header-check" data-repo-id="${repo.id}"${checked ? ' checked' : ''}${indeterminate ? ' data-ind="1"' : ''} aria-label="Include all matches in ${escapeHtml(repo.name)}">
      <svg class="tg-repo-header-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      <span class="tg-repo-header-path">${escapeHtml(repo.name)} <span class="tg-repo-header-branch">@ ${escapeHtml(repo.branch)}</span></span>
      <span class="tg-repo-header-count">${repoMatches.toLocaleString()} result${repoMatches === 1 ? '' : 's'}</span>
    </div>`;
    const cardsHTML = files.map(f => tgMatchCardHTML(f, null, repo)).join('');
    return `<div class="tg-repo-group" data-repo-id="${repo.id}">${headerHTML}<div class="tg-repo-group-body">${cardsHTML}</div></div>`;
  }).join('');
}

// Build the lines shown inside a match-card body. When `withContext` is
// true, pad ±3 lines around the matched range and fill gaps with filler
// code so the matches read in surrounding context (still illustrative —
// real file content isn't in the prototype seed).
function tgMatchBodyLines(matches, withContext) {
  const sorted = [...matches].sort((a, b) => a.n - b.n);
  if (!withContext || sorted.length === 0) {
    return sorted.map(m => ({ n: m.n, code: m.code, id: m.id, isMatch: true }));
  }
  const PAD = 3;
  const start = Math.max(1, sorted[0].n - PAD);
  const end = sorted[sorted.length - 1].n + PAD;
  const byLine = new Map(sorted.map(m => [m.n, m]));
  const out = [];
  for (let n = start; n <= end; n++) {
    const m = byLine.get(n);
    if (m) {
      out.push({ n, code: m.code, id: m.id, isMatch: true });
    } else {
      const filler = DETAIL_FILLERS[n % DETAIL_FILLERS.length] || '';
      out.push({ n, code: filler, isMatch: false });
    }
  }
  return out;
}

function tgMatchBodyHTML(matches, focusMatchId, withContext) {
  return tgMatchBodyLines(matches, withContext).map(l => {
    const code = (l.code || '').replace(/<m>/g, '<span class="match">').replace(/<\/m>/g, '</span>');
    const focus = (l.id && focusMatchId === l.id) ? ' focus' : '';
    const cls = l.isMatch ? `match-line is-hit${focus}` : 'match-line is-ctx';
    const dataAttr = l.id ? ` data-match-id="${l.id}"` : '';
    return `<div class="${cls}"${dataAttr}><span class="match-gutter"><span class="n">${l.n}</span></span><span class="match-code">${code}</span></div>`;
  }).join('');
}

function tgMatchCardHTML(f, focusMatchId, repo) {
  const lines = (f.matches || []);
  const repoPrefix = repo ? `<span class="match-file-repo">${escapeHtml(repo.name)}</span> · ` : '';
  // Each card identifies itself by repo + file so tree clicks can jump here;
  // file-id alone collides across repos (same basename in different repos).
  const repoId = repo ? repo.id : '';
  // Selection state mirrors the tree's per-match checkboxes.
  const keys = tgFileMatchKeys(f);
  const selCount = keys.filter(k => tgTreeState.selMatches.has(k)).length;
  const allSel = selCount === keys.length && keys.length > 0;
  const anySel = selCount > 0 && !allSel;
  // Hunk-style meta: line range + match count (mirrors recipe-results
  // `@@ -15,13 +15,13 @@` slot but expressed in trigrep terms).
  const ns = lines.map(l => l.n).filter(n => typeof n === 'number');
  const minN = ns.length ? Math.min(...ns) : null;
  const maxN = ns.length ? Math.max(...ns) : null;
  const rangeText = minN != null
    ? (minN === maxN ? `L${minN}` : `L${minN}–${maxN}`)
    : '';
  const hunkMeta = `${rangeText ? rangeText + ' · ' : ''}${lines.length} match${lines.length === 1 ? '' : 'es'}`;
  return `<div class="match-card" data-file-id="${f.id}" data-repo-id="${repoId}" id="mc-${repoId}-${f.id}">
    <div class="match-card-head">
      <input type="checkbox" class="ckbox match-check" data-file-id="${f.id}" data-repo-id="${repoId}"${allSel ? ' checked' : ''}${anySel ? ' data-ind="1"' : ''} title="Include this file in the recipe run">
      <svg class="match-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      <svg class="match-fileicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="match-file-path">${repoPrefix}${escapeHtml(f.file)}</span>
      <span class="match-hunk">${hunkMeta}</span>
      <div class="match-card-actions">
        <button type="button" class="match-act" title="More"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      </div>
    </div>
    <div class="match-body">${tgMatchBodyHTML(lines, focusMatchId, true)}</div>
  </div>`;
}

function tgWireDetail(slot) {
  // Per-card chevron expand/collapse (clicking the head, but not the
  // checkbox or action buttons).
  slot.querySelectorAll('.match-card-head').forEach(h => {
    h.addEventListener('click', (e) => {
      if (e.target.closest('.match-act') || e.target.closest('.match-check')) return;
      h.closest('.match-card').classList.toggle('collapsed');
    });
  });
  // Repo header expand/collapse — clicking anywhere on the header toggles
  // the cards in that group, except clicks on the include-all checkbox.
  slot.querySelectorAll('.tg-repo-header').forEach(h => {
    const group = h.closest('.tg-repo-group');
    const toggle = () => {
      const nowCollapsed = group.classList.toggle('collapsed');
      h.setAttribute('aria-expanded', nowCollapsed ? 'false' : 'true');
    };
    h.addEventListener('click', (e) => {
      if (e.target.closest('.tg-repo-header-check')) return;
      toggle();
    });
    h.addEventListener('keydown', (e) => {
      if (e.target.closest('.tg-repo-header-check')) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });
  // Repo-level checkbox in the header toggles every match in the repo and
  // keeps the sidebar tree in sync. Mirrors the per-file checkbox pattern.
  slot.querySelectorAll('.tg-repo-header-check[data-ind="1"]').forEach(cb => { cb.indeterminate = true; });
  slot.querySelectorAll('.tg-repo-header-check').forEach(cb => {
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', () => {
      const repo = tgTreeData.find(r => r.id === cb.dataset.repoId);
      if (!repo) return;
      const keys = tgRepoMatchKeys(repo);
      const on = cb.checked;
      keys.forEach(k => on ? tgTreeState.selMatches.add(k) : tgTreeState.selMatches.delete(k));
      tgRenderTree();
      // Refresh the detail pane so every per-file checkbox under this repo
      // reflects the new selection without scrolling away.
      tgRenderDetail();
    });
  });
  // File-level checkbox in the card head toggles every match in that file
  // and keeps the sidebar tree in sync.
  slot.querySelectorAll('.match-check[data-ind="1"]').forEach(cb => { cb.indeterminate = true; });
  slot.querySelectorAll('.match-check').forEach(cb => {
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', () => {
      const repoId = cb.dataset.repoId;
      const fileId = cb.dataset.fileId;
      const repo = tgTreeData.find(r => r.id === repoId);
      const file = repo && repo.files.find(f => f.id === fileId);
      if (!file) return;
      const keys = tgFileMatchKeys(file);
      const on = cb.checked;
      keys.forEach(k => on ? tgTreeState.selMatches.add(k) : tgTreeState.selMatches.delete(k));
      tgRenderTree();
    });
  });
  // Toolbar "Collapse all" / "Expand all" — flips every card.
  const ct = slot.querySelector('#tg-collapse-toggle');
  if (ct) {
    ct.addEventListener('click', () => {
      const cards = [...slot.querySelectorAll('.match-card')];
      const anyOpen = cards.some(c => !c.classList.contains('collapsed'));
      cards.forEach(c => c.classList.toggle('collapsed', anyOpen));
    });
  }
}

let tgJumpScrollSuppress = 0;

// Breadcrumb helpers — drive the "Jumped to:" indicator in the scope-bar.
function tgSetJumpedBreadcrumb(parts) {
  const el = trigrepPanel.querySelector('#tg-jumped-to');
  if (!el) return;
  const html = parts
    .map((p, i) => {
      const cls = i === parts.length - 1 ? 'sc-crumb cur' : 'sc-crumb';
      const sep = i > 0 ? '<span class="sc-sep">›</span>' : '';
      return `${sep}<span class="${cls}">${escapeHtml(p)}</span>`;
    })
    .join('');
  el.innerHTML = `<span class="sc-label">Jumped to</span>${html}`;
  el.hidden = false;
}
function tgClearJumpedBreadcrumb() {
  const el = trigrepPanel.querySelector('#tg-jumped-to');
  if (!el) return;
  el.hidden = true;
  el.innerHTML = '';
}

// Quick-link from a tree row to the matching card / line in the right pane.
// Scrolls into view, marks the card as active for a brief beat, and (if
// targeting a specific match) flashes the matched line.
function tgJumpToCard(repoId, fileId, matchId) {
  const slot = trigrepPanel.querySelector('#tg-detail-slot');
  if (!slot) return;
  const cardId = `mc-${repoId}-${fileId}`;
  const card = slot.querySelector(`#${CSS.escape(cardId)}`);
  if (!card) return;
  // Always expand the card before jumping so the target line is visible.
  card.classList.remove('collapsed');
  // Highlight the active card briefly so the click reads as taking effect.
  slot.querySelectorAll('.match-card.active').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  let target = card;
  let matchLine = null;
  if (matchId) {
    matchLine = card.querySelector(`.match-line[data-match-id="${CSS.escape(matchId)}"]`);
    if (matchLine) {
      slot.querySelectorAll('.match-line.focus').forEach(l => l.classList.remove('focus'));
      matchLine.classList.add('focus');
      target = matchLine;
    }
  }
  // Suppress the "scroll back to top clears breadcrumb" handler for the
  // duration of the smooth scroll animation we're about to trigger.
  tgJumpScrollSuppress = Date.now() + 900;
  target.scrollIntoView({ block: 'center', behavior: 'smooth' });
  // Reflect the jump destination in the scope-bar breadcrumb.
  const repo = tgTreeData.find(r => r.id === repoId);
  const file = repo && repo.files.find(f => f.id === fileId);
  if (repo && file) {
    const parts = [repo.name, file.file];
    if (matchLine) {
      const m = file.matches.find(x => x.id === matchId);
      if (m && typeof m.n === 'number') parts.push('L' + m.n);
    }
    tgSetJumpedBreadcrumb(parts);
  }
}

function tgExpandKey(row) {
  return row.dataset.id;
}

function tgWireTree() {
  const treeBody = trigrepPanel.querySelector('#tg-tree-body');
  if (!treeBody) return;

  treeBody.addEventListener('change', (e) => {
    const cb = e.target.closest('.hn-check');
    if (!cb) return;
    const kind = cb.dataset.cbk, id = cb.dataset.cid, on = cb.checked;
    let keys = [];
    if (kind === 'repo') {
      const r = tgTreeData.find(x => x.id === id);
      if (r) keys = tgRepoMatchKeys(r);
    } else if (kind === 'file') {
      const r = tgTreeData.find(x => x.files.some(f => f.id === id));
      const f = r && r.files.find(x => x.id === id);
      if (f) keys = tgFileMatchKeys(f);
    } else if (kind === 'match') {
      keys = [id];
    }
    keys.forEach(k => on ? tgTreeState.selMatches.add(k) : tgTreeState.selMatches.delete(k));
    tgRenderTree();
  });

  // Tree clicks are quick-links: they expand/collapse subtrees and jump the
  // right pane to the matching card / line — they never re-render the right
  // pane (it always shows the full result set).
  treeBody.addEventListener('click', (e) => {
    if (e.target.closest('.hn-check')) return;
    // Similarity-cluster header — toggle collapse for the whole bucket.
    const cluster = e.target.closest('.hn-cluster');
    if (cluster) {
      const id = cluster.dataset.clusterId;
      if (tgCollapsedClusters.has(id)) tgCollapsedClusters.delete(id);
      else tgCollapsedClusters.add(id);
      tgRenderTree();
      return;
    }
    const chev = e.target.closest('.hn-chev');
    if (chev) {
      const row = chev.closest('.hn-row');
      const key = tgExpandKey(row);
      if (tgTreeState.expanded.has(key)) tgTreeState.expanded.delete(key);
      else tgTreeState.expanded.add(key);
      tgRenderTree();
      return;
    }
    const row = e.target.closest('.hn-row');
    if (!row) return;
    const node = row.dataset.node;
    const id = row.dataset.id;
    const repoId = node === 'repo' ? id : row.dataset.rid;
    const fileId = node === 'match' ? row.dataset.fid : (node === 'file' ? id : null);
    const matchId = node === 'match' ? id : null;
    // Body click on non-leaf rows also toggles expand of the subtree.
    if (node !== 'match') {
      const key = tgExpandKey(row);
      if (tgTreeState.expanded.has(key)) tgTreeState.expanded.delete(key);
      else tgTreeState.expanded.add(key);
    }
    // Repo click → jump to the first file of that repo.
    let targetFileId = fileId;
    if (node === 'repo') {
      const r = tgTreeData.find(x => x.id === repoId);
      if (r && r.files.length) targetFileId = r.files[0].id;
    }
    if (targetFileId) tgJumpToCard(repoId, targetFileId, matchId);
    tgRenderTree();
  });
}

function tgWireDivider() {
  const layout = trigrepPanel.querySelector('#tg-results-layout');
  const divider = trigrepPanel.querySelector('#tg-results-divider');
  if (!layout || !divider) return;
  let dragging = false;
  divider.addEventListener('pointerdown', (e) => {
    dragging = true;
    divider.classList.add('dragging');
    document.body.classList.add('col-resizing');
    try { divider.setPointerCapture(e.pointerId); } catch (_) {}
  });
  divider.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = layout.getBoundingClientRect();
    let x = e.clientX - rect.left;
    const min = 300, max = rect.width - 340;
    x = Math.max(min, Math.min(max, x));
    layout.style.setProperty('--left-w', x + 'px');
  });
  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.classList.remove('col-resizing');
    try { divider.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  divider.addEventListener('pointerup', end);
  divider.addEventListener('pointercancel', end);
  divider.addEventListener('dblclick', () => layout.style.removeProperty('--left-w'));
}

function initTrigrepTree(flow) {
  tgCurrentFlow = flow;
  tgTreeData = tgBuildTreeData(flow);
  tgTreeState = {
    expanded: new Set(),
    selMatches: new Set(),
    scope: null,
  };
  // Default: pre-select every match so "Run recipe on selected" is meaningful
  tgTreeData.forEach(r => tgRepoMatchKeys(r).forEach(k => tgTreeState.selMatches.add(k)));
  tgRepoSearchQuery = '';
  const repoSearchInput = trigrepPanel.querySelector('#tg-repo-search');
  if (repoSearchInput) {
    repoSearchInput.value = '';
    repoSearchInput.addEventListener('input', () => {
      tgRepoSearchQuery = repoSearchInput.value;
      tgRenderTree();
    });
  }
  tgRenderTree();
  tgWireTree();
  tgWireViewToggle();
  // Right pane always shows the full result set; tree clicks scroll-link
  // into it rather than re-rendering it.
  tgRenderDetail();
}

function tgWireViewToggle() {
  const btnList = trigrepPanel.querySelector('#tg-view-list');
  const btnSim  = trigrepPanel.querySelector('#tg-view-similar');
  const btnExpand = trigrepPanel.querySelector('#tg-cluster-expand-all');
  if (!btnList || !btnSim) return;
  const setMode = (group) => {
    tgGroupBySimilarity = group;
    btnList.classList.toggle('active', !group);
    btnList.setAttribute('aria-selected', String(!group));
    btnSim.classList.toggle('active', group);
    btnSim.setAttribute('aria-selected', String(group));
    if (group) {
      // Default to overview mode: collapse every cluster so the user sees
      // just the pattern headers and can drill into the ones they care about.
      const clusters = tgClusterReposBySimilarity(tgFilteredRepos());
      tgCollapsedClusters = new Set(clusters.map((_, i) => 'cl_' + i));
    } else {
      tgCollapsedClusters.clear();
    }
    tgRenderTree();
  };
  btnList.addEventListener('click', () => setMode(false));
  btnSim.addEventListener('click', () => setMode(true));
  if (btnExpand) {
    btnExpand.addEventListener('click', () => {
      const clusters = tgClusterReposBySimilarity(tgFilteredRepos());
      const allIds = clusters.map((_, i) => 'cl_' + i);
      // If anything is collapsed, expand all; otherwise collapse all.
      const anyCollapsed = allIds.some(id => tgCollapsedClusters.has(id));
      tgCollapsedClusters = anyCollapsed ? new Set() : new Set(allIds);
      tgRenderTree();
    });
  }
}

function wireResultsInteractions(flow, remainingCards) {
  const baseMatches = flow.phase2.baseMatches;
  const baseFiles = flow.phase2.baseFiles;
  const activeFilters = new Map();
  const summaryCount = trigrepPanel.querySelector('#summary-count');
  const summaryFiles = trigrepPanel.querySelector('#summary-files');

  // Filter group collapse
  trigrepPanel.querySelectorAll('.filter-group-head').forEach(head => {
    head.addEventListener('click', () => head.parentElement.classList.toggle('collapsed'));
  });
  const collapseAll = trigrepPanel.querySelector('#collapse-all');
  if (collapseAll) {
    collapseAll.addEventListener('click', () => {
      const groups = trigrepPanel.querySelectorAll('.filter-group');
      const anyOpen = [...groups].some(g => !g.classList.contains('collapsed'));
      groups.forEach(g => g.classList.toggle('collapsed', anyOpen));
      collapseAll.textContent = anyOpen ? 'Expand all' : 'Collapse all';
    });
  }

  // Seed active filters from preset state so the summary reflects what's
  // shown as "active" in the sidebar on first render.
  trigrepPanel.querySelectorAll('.filter-item.active').forEach(item => {
    const key = item.querySelector('.filter-item-name').textContent.trim();
    const count = parseInt(item.dataset.count, 10) || 0;
    activeFilters.set(key, count);
  });

  function recomputeSummary() {
    if (activeFilters.size === 0) {
      if (summaryCount) summaryCount.textContent = baseMatches.toLocaleString();
      if (summaryFiles) summaryFiles.textContent = baseFiles.toLocaleString();
    } else {
      const total = [...activeFilters.values()].reduce((a, b) => a + b, 0);
      if (summaryCount) summaryCount.textContent = total.toLocaleString();
      if (summaryFiles) summaryFiles.textContent = Math.max(1, Math.ceil(total / 5.5)).toLocaleString();
    }
  }

  trigrepPanel.querySelectorAll('.filter-item').forEach(item => {
    item.addEventListener('click', () => {
      const fkey = item.dataset.fkey;
      const fval = item.dataset.fval;
      const fnot = item.dataset.fnot === '1';
      // Sidebar items mapped to a trigrep filter key push/remove a token
      // from the query bar — tgWriteBack re-syncs the active class.
      if (fkey && fval != null) {
        tgToggleFilter(fkey, fval, fnot);
      } else {
        // Legacy free-form item (e.g. repo list rows) — just toggle locally.
        const key = item.querySelector('.filter-item-name').textContent.trim();
        const count = parseInt(item.dataset.count, 10) || 0;
        const wasActive = activeFilters.has(key);
        if (wasActive) activeFilters.delete(key);
        else activeFilters.set(key, count);
        item.classList.toggle('active', !wasActive);
      }
      recomputeSummary();
      if (typeof tgRefreshFromFilters === 'function') tgRefreshFromFilters();
    });
  });

  // Chip removal
  trigrepPanel.querySelectorAll('.trigrep-chip-x').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); btn.closest('.trigrep-chip').remove(); });
  });

  // Topic search
  const topicSearch = trigrepPanel.querySelector('.topic-search');
  if (topicSearch) {
    topicSearch.addEventListener('input', () => {
      const q = topicSearch.value.toLowerCase().trim();
      const group = topicSearch.closest('.filter-group-body');
      group.querySelectorAll('.filter-item').forEach(item => {
        const name = item.querySelector('.filter-item-name').textContent.toLowerCase();
        item.style.display = (q === '' || name.includes(q)) ? '' : 'none';
      });
    });
  }

  // Repo search
  const repoSearch = trigrepPanel.querySelector('.repo-search');
  if (repoSearch) {
    repoSearch.addEventListener('input', () => {
      const q = repoSearch.value.toLowerCase().trim();
      const list = repoSearch.closest('.filter-group').querySelector('.repo-list-body');
      list.querySelectorAll('.filter-item').forEach(item => {
        const name = item.querySelector('.filter-item-name').textContent.toLowerCase();
        item.style.display = (q === '' || name.includes(q)) ? '' : 'none';
      });
    });
  }

  // Chevron collapse
  trigrepPanel.querySelectorAll('.chevron-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.result-card').classList.toggle('collapsed'));
  });

  // File drill-down
  trigrepPanel.querySelectorAll('.result-card .result-card-file').forEach(el => {
    const card = el.closest('.result-card');
    const id = card?.dataset.cardId;
    if (id && FILE_DETAILS[id]) {
      el.addEventListener('click', () => showFileDetail(FILE_DETAILS[id]));
    } else {
      el.classList.remove('is-clickable');
    }
  });

  // Show more
  const showMoreBtn = trigrepPanel.querySelector('#show-more-btn');
  if (showMoreBtn) {
    showMoreBtn.addEventListener('click', () => {
      if (!remainingCards.length) {
        showMoreBtn.style.display = 'none';
        return;
      }
      const list = trigrepPanel.querySelector('#result-cards-list');
      const toAdd = remainingCards.splice(0, 2);
      const html = toAdd.map(buildResultCardHTML).join('');
      list.insertAdjacentHTML('beforeend', html);
      toAdd.forEach(card => {
        const el = list.querySelector(`.result-card[data-card-id="${card.id}"]`);
        if (!el) return;
        el.querySelector('.chevron-btn').addEventListener('click', () => el.classList.toggle('collapsed'));
        const fileEl = el.querySelector('.result-card-file');
        if (FILE_DETAILS[card.id]) {
          fileEl.addEventListener('click', () => showFileDetail(FILE_DETAILS[card.id]));
        } else {
          fileEl.classList.remove('is-clickable');
        }
      });
      if (!remainingCards.length) showMoreBtn.style.display = 'none';
    });
  }
}

function expandFileLines(lines) {
  if (!lines.length) return lines;
  const out = [];
  let prev = 0;
  for (const line of lines) {
    while (prev + 1 < line.n) {
      prev++;
      out.push({ n: prev, code: DETAIL_FILLERS[prev % DETAIL_FILLERS.length] });
    }
    out.push(line);
    prev = line.n;
  }
  return out;
}

// === Levenshtein (capped) — used for autocomplete fuzzy matching ======
function tgLev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  if (Math.abs(m - n) > 3) return 99;
  let prev = new Array(n + 1), curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      curr[j] = Math.min(curr[j-1] + 1, prev[j] + 1, prev[j-1] + cost);
    }
    [prev, curr] = [curr, prev];
  }
  return prev[n];
}

// === Lexer + parser — raw query only, no prose pipeline =============
function tgLexRaw(s) {
  const out = [];
  const re = /(\()|(\))|(\/(?:\\.|[^/\\])+\/)|("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])*')|(struct(?:ural)?:'(?:\\.|[^'\\])*')|([A-Za-z_][\w-]*:[^\s()]+)|(-?[^\s()]+)/g;
  let m;
  while ((m = re.exec(s))) {
    const tok = m[0];
    if (!tok.trim()) continue;
    out.push(tok);
  }
  return out;
}

function tgValidateValue(filterKey, value) {
  const list = TG_VALUES[filterKey] || [];
  if (!value) return 'invalid';
  const pool = list.map(v => (typeof v === 'string' ? v : v.value).toLowerCase());
  return pool.includes(value.toLowerCase()) ? 'valid' : 'unverified';
}

function tgParseRaw(s) {
  const atoms = tgLexRaw(s || '');
  const tokens = [];
  for (const a of atoms) {
    const low = a.toLowerCase();
    if (a === '(' || a === ')') { tokens.push({ kind:'op', value:a }); continue; }
    if (low === 'or' || low === 'and') { tokens.push({ kind:'op', value: low }); continue; }
    if (a.startsWith('-') && a.length > 1) {
      const rest = a.slice(1);
      const rc = rest.indexOf(':');
      if (rc > 0 && /^[A-Za-z_][\w-]*$/.test(rest.slice(0, rc))) {
        tokens.push({ kind:'op', value:'not' });
        const rawKey = rest.slice(0, rc);
        const value = rest.slice(rc + 1);
        const canon = TG_ALIAS_TO_CANON[rawKey.toLowerCase()] || rawKey;
        const status = TG_FILTERS[canon] ? tgValidateValue(canon, value) : 'unverified';
        tokens.push({ kind:'filter', key:canon, value, raw:rest, status });
        continue;
      }
      if (!rest.includes(':')) {
        tokens.push({ kind:'op', value:'not' });
        tokens.push({ kind:'term', value: rest, mode:'literal' });
        continue;
      }
    }
    if (/^\/.+\/$/.test(a)) { tokens.push({ kind:'term', value:a, mode:'regex' }); continue; }
    if (/^struct(ural)?:/.test(a)) { tokens.push({ kind:'term', value:a, mode:'structural' }); continue; }
    const colon = a.indexOf(':');
    if (colon > 0 && /^[A-Za-z_][\w-]*$/.test(a.slice(0, colon))) {
      const rawKey = a.slice(0, colon);
      const value = a.slice(colon + 1);
      const canon = TG_ALIAS_TO_CANON[rawKey.toLowerCase()] || rawKey;
      const status = TG_FILTERS[canon] ? tgValidateValue(canon, value) : 'unverified';
      tokens.push({ kind:'filter', key:canon, value, raw:a, status });
      continue;
    }
    tokens.push({ kind:'term', value:a, mode:'literal' });
  }
  return tokens;
}

function tgSerialize(tokens) {
  const parts = [];
  for (const t of tokens) {
    if (t.kind === 'op') {
      if (t.value === 'not') parts.push('-NEG');
      else parts.push(t.value);
    } else if (t.kind === 'filter') {
      parts.push(`${t.key}:${t.value}`);
    } else {
      parts.push(t.value);
    }
  }
  return parts.join(' ').replace(/-NEG\s+/g, '-').replace(/\s+/g, ' ').trim();
}

// === State + glue =====================================================
const TGState = { tokens: [], ac: { open:false, items:[], active:0, mode:null, ctx:null }, lastSubmitted: '' };

function tgEscape(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// === Canonicalizer ====================================================
function tgCanonical(input) {
  const tokens = typeof input === 'string' ? tgParseRaw(input) : input;
  const filters = [], terms = [], ops = [];
  for (const t of tokens) {
    if (t.kind === 'filter') filters.push(`${t.key}:${t.value}`);
    else if (t.kind === 'term') terms.push(t.value);
    else if (t.kind === 'op' && (t.value === 'or' || t.value === 'not')) ops.push(t.value);
  }
  filters.sort(); terms.sort(); ops.sort();
  return [...terms, ...filters, ...ops].join(' ');
}

// === Happy-path queries (Appendix A) + signature & phrase routing ======
const TG_HAPPY_QUERIES = {
  authOpt1: { flow: 'a', query: '(@PreAuthorize or @Secured or @RolesAllowed) visibility:public lang:java' },
  authOpt2: { flow: 'a', query: 'implements:AuthenticationEntryPoint' },
  authOpt3: { flow: 'a', query: 'visibility:public' },
  logOpt1:  { flow: 'b', query: '/log\\.(error|warn)\\(/' },
  logOpt2:  { flow: 'b', query: 'Logger type:symbol' },
  logOpt3:  { flow: 'b', query: 'Logger type:symbol -file:**/test/**' },
  restOpt1: { flow: 'c', query: '@RestController lang:java' },
  restOpt2: { flow: 'c', query: 'type:symbol RestTemplate or type:symbol WebClient or type:symbol RestClient lang:java' },
};

// Precomputed canonical bags for "did the user assemble a happy path?"
const TG_HAPPY_BAGS = {};
for (const [k, h] of Object.entries(TG_HAPPY_QUERIES)) TG_HAPPY_BAGS[k] = tgCanonical(h.query);

function tgRouteSignature(tokens) {
  const literals = tokens.filter(t => t.kind === 'term' && t.mode === 'literal').map(t => t.value);
  const regexes  = tokens.filter(t => t.kind === 'term' && t.mode === 'regex').map(t => t.value);
  const filters  = tokens.filter(t => t.kind === 'filter');
  const hasFilter = (k, v) => filters.some(f => f.key === k && (v == null || f.value.toLowerCase() === v.toLowerCase()));
  const hasNegFile = (glob) => {
    for (let i = 0; i < tokens.length - 1; i++) {
      if (tokens[i].kind === 'op' && tokens[i].value === 'not'
          && tokens[i+1].kind === 'filter' && tokens[i+1].key === 'file' && tokens[i+1].value === glob) return true;
    }
    return false;
  };
  if (literals.some(v => /^@(PreAuthorize|Secured|RolesAllowed)$/.test(v))
      && (hasFilter('visibility','public') || hasFilter('lang','java'))) return TG_HAPPY_QUERIES.authOpt1;
  if (hasFilter('implements','AuthenticationEntryPoint')) return TG_HAPPY_QUERIES.authOpt2;
  if (filters.length === 1 && hasFilter('visibility','public') && literals.length === 0 && regexes.length === 0) return TG_HAPPY_QUERIES.authOpt3;
  if (regexes.some(r => /log\\?\.\(\s*(error\s*\|\s*warn|warn\s*\|\s*error)\s*\)\\?\(/.test(r))) return TG_HAPPY_QUERIES.logOpt1;
  const isLoggerByType = literals.includes('Logger') && hasFilter('type','symbol');
  if (isLoggerByType && hasNegFile('**/test/**')) return TG_HAPPY_QUERIES.logOpt3;
  if (isLoggerByType) return TG_HAPPY_QUERIES.logOpt2;
  if (hasFilter('type','symbol') && literals.some(v => /^(RestTemplate|WebClient|RestClient)$/.test(v))) return TG_HAPPY_QUERIES.restOpt2;
  if (literals.includes('@RestController')) return TG_HAPPY_QUERIES.restOpt1;
  return null;
}

// Small fixed phrase bridge — not a parser. A handful of broad questions
// that mature search products bridge to a known query (Sourcegraph
// Smart Search–style). No stemming, no concept index, no fuzzy English.
const TG_PHRASE_ROUTES = [
  { rx: /\b(production code only|exclude tests?|no tests?|skip tests?)\b/i,                    key: 'logOpt3' },
  { rx: /\b(logger declarations?|what loggers do we use|logger types?|loggers?\b)\b/i,         key: 'logOpt2' },
  { rx: /\b(error logging|where do we log errors?|log errors?|warnings?|error\/warn)\b/i,      key: 'logOpt1' },
  { rx: /\b(public[- ]?facing|public only|just public|exposed services?)\b/i,                  key: 'authOpt3' },
  { rx: /\b(auth(entication)? entry points?|where authentication starts|entry points?)\b/i,    key: 'authOpt2' },
  { rx: /\b(@PreAuthorize|@Secured|@RolesAllowed|public authorization|authorization (rules?|annotations?))\b/i, key: 'authOpt1' },
  { rx: /\b(outbound|client calls?|http clients?|RestTemplate|WebClient|RestClient)\b/i,       key: 'restOpt2' },
  { rx: /\b(server[- ]?side controllers?|rest controllers?|@RestController|REST APIs?)\b/i,    key: 'restOpt1' },
];
function tgRoutePhrase(text) {
  for (const r of TG_PHRASE_ROUTES) if (r.rx.test(text)) return TG_HAPPY_QUERIES[r.key];
  return null;
}

const TG_THEME_WORDS = {
  auth:    /\b(authentication|auth|login|security|authorize|authorization|@PreAuthorize|@Secured|@RolesAllowed|entry points?|public[- ]?facing)\b/i,
  logging: /\b(logging|log|logger|loggers|slf4j|log4j|error logging|warnings?|audit log)\b/i,
  rest:    /\b(rest|api|apis|endpoints?|controllers?|@RestController|outbound|client|RestTemplate|WebClient|RestClient)\b/i,
};
function tgDetectTheme(text) {
  for (const [theme, rx] of Object.entries(TG_THEME_WORDS)) if (rx.test(text)) return theme;
  return null;
}
const TG_THEMES = {
  auth:    { title: 'Authentication', question: 'How is authentication handled?', options: [
    { label: 'Public authorization rules',  desc: '@PreAuthorize / @Secured / @RolesAllowed on public methods', key: 'authOpt1' },
    { label: 'Auth entry points',           desc: 'Classes that implement AuthenticationEntryPoint',           key: 'authOpt2' },
    { label: 'Just public-facing services', desc: 'Anything tagged visibility:public',                          key: 'authOpt3' },

  logging: { title: 'Logging', question: 'How is logging done across our services?', options: [
    { label: 'Error logging',                       desc: 'Regex over log.error / log.warn calls', key: 'logOpt1' },

  rest:    { title: 'REST APIs', question: 'How are our REST APIs structured?', options: [

    { label: 'Outbound REST calls (client)',   desc: 'RestTemplate / WebClient / RestClient',    key: 'restOpt2' },
  ]},
};
function tgShowScope(themeId) {

  if (!theme || !results) { showSearchFallback(); return; }

function tgRunCanned(query, flowId) {
  const flow = FLOWS[flowId];
  if (!flow) return;
  currentFlow = flowId;
  setSyntaxMode('sourcegraph');
  // Chips-in-input model: TGState holds all committed tokens; the visible
  // <input> only holds the unconfirmed trailing text. A canned query is
  // fully tokenized, so the input is cleared.
  TGState.tokens = tgParseRaw(query);
  const input = document.getElementById('trigrep-query-input');
  if (input) input.value = '';
  tgRenderPills();
  tgSyncSearchBarUI();
  renderTrigrepResults(flow);
  tgSyncFilterActive();
}

// Build the full query string from committed tokens + the unfinished tail
// in the input. Used by search submit, bookmark save, etc.
function tgGetFullQuery() {
  const input = document.getElementById('trigrep-query-input');
  const base = tgSerialize(TGState.tokens || []);
  const tail = input ? input.value.trim() : '';
  return base && tail ? base + ' ' + tail : (base || tail);
}

// Parse the input's trailing text and, if it produces tokens, promote them
// to chips in TGState. Skips bare incomplete filters like "lang:". Returns
// whether any tokens were committed.
function tgCommitInputTokens() {
  const input = document.getElementById('trigrep-query-input');
  if (!input) return false;
  const trimmed = input.value.trim();
  if (!trimmed) return false;
  if (/^[a-zA-Z][a-zA-Z0-9_]*:$/.test(trimmed)) return false;
  const tokens = tgParseRaw(trimmed);
  if (tokens.length === 0) return false;
  TGState.tokens.push(...tokens);
  input.value = '';
  tgRenderPills();
  tgSyncFilterActive();
  tgSyncSearchBarUI();
  return true;
}

// === Filter pills + free-text token chips =============================
// A `NOT` op followed by a `filter` token renders as ONE pill with an
// "is not" badge. Free-text terms / regex / structural units render as
// their own neutral chips alongside the pills.
function tgRenderPills() {
  const strip = document.getElementById('tg-chip-strip');
  if (!strip) return;
  const html = [];
  const tokens = TGState.tokens;
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.kind === 'op' && t.value === 'not' && tokens[i+1] && tokens[i+1].kind === 'filter') {
      const f = tokens[i+1];
      const cls = ['tg-pill','is-not', f.status === 'unverified' ? 'is-unverified' : ''].filter(Boolean).join(' ');
      html.push(`<span class="${cls}" data-idx="${i+1}" data-pair="${i}">
        <span class="tg-pill-key">${tgEscape(f.key)}</span>
        <span class="tg-pill-op">is not</span>
        <span class="tg-pill-val">${tgEscape(f.value)}</span>
        <button class="tg-pill-x" data-x-pair="${i},${i+1}" title="Remove" aria-label="Remove ${tgEscape(f.key)}: ${tgEscape(f.value)}">×</button>
      </span>`);
      i++;
      continue;
    }
    if (t.kind === 'filter') {
      const cls = ['tg-pill', t.status === 'unverified' ? 'is-unverified' : ''].filter(Boolean).join(' ');
      html.push(`<span class="${cls}" data-idx="${i}">
        <span class="tg-pill-key">${tgEscape(t.key)}:</span>
        <span class="tg-pill-val">${tgEscape(t.value)}</span>
        <button class="tg-pill-x" data-x="${i}" title="Remove" aria-label="Remove ${tgEscape(t.key)}: ${tgEscape(t.value)}">×</button>
      </span>`);
      continue;
    }
    if (t.kind === 'op') {
      html.push(`<span class="tg-op-chip" data-idx="${i}">${tgEscape(t.value)}</span>`);
      continue;
    }
    const modeCls = t.mode === 'regex' ? ' is-regex' : (t.mode === 'structural' ? ' is-structural' : '');
    html.push(`<span class="tg-tok${modeCls}" data-idx="${i}">${tgEscape(t.value)}<button class="tg-tok-x" data-x="${i}" title="Remove" aria-label="Remove ${tgEscape(t.value)}">×</button></span>`);
  }
  strip.innerHTML = html.join('');
  strip.querySelectorAll('[data-x]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.x, 10);
      TGState.tokens.splice(idx, 1);
      tgWriteBack();
    });
  });
  strip.querySelectorAll('[data-x-pair]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const [a, b] = btn.dataset.xPair.split(',').map(n => parseInt(n, 10));
      TGState.tokens.splice(Math.min(a,b), 2);
      tgWriteBack();
    });
  });
  // Click on a pill (not the ×) → re-edit its value via the autocomplete.
  strip.querySelectorAll('.tg-pill').forEach(p => {
    p.addEventListener('click', e => {
      if (e.target.closest('.tg-pill-x')) return;
      const idx = parseInt(p.dataset.idx, 10);
      const t = TGState.tokens[idx];
      if (!t || t.kind !== 'filter') return;
      const input = document.getElementById('trigrep-query-input');
      if (!input) return;
      // Strip the pill from tokens, then plant `key:` in the input (the
      // other chips stay rendered — input only holds the unconfirmed tail).
      const pairOp = p.dataset.pair != null ? parseInt(p.dataset.pair, 10) : null;
      if (pairOp != null) TGState.tokens.splice(Math.min(pairOp, idx), 2);
      else TGState.tokens.splice(idx, 1);
      input.value = `${t.key}:`;
      const newPos = input.value.length;
      input.focus();
      input.setSelectionRange(newPos, newPos);
      tgRenderPills();
      tgSyncFilterActive();
      setTimeout(tgRenderAutocomplete, 0);
    });
  });
}

function tgWriteBack() {
  // Chips-in-input model: chips render directly from TGState. The visible
  // input holds only the unconfirmed trailing text — do NOT overwrite it.
  tgRenderPills();
  tgSyncFilterActive();
  tgSyncSearchBarUI();
  tgApplyFilterScale();
}

// Combined scale derived from active sidebar filters. Each filter group's
// scale is the sum of its active items' counts divided by the group's
// total; the combined scale is the product across groups. With no active
// filters the scale is 1 (no narrowing).
function tgComputeFilterScale() {
  if (!tgCurrentFlow || !tgCurrentFlow.phase2) return 1;
  const activeByKey = new Map();
  document.querySelectorAll('.filter-item.active[data-fkey][data-count]').forEach(item => {
    const k = item.dataset.fkey;
    const c = parseInt(item.dataset.count, 10) || 0;
    if (!activeByKey.has(k)) activeByKey.set(k, []);
    activeByKey.get(k).push(c);
  });
  let scale = 1;
  for (const [key, counts] of activeByKey) {
    const group = tgCurrentFlow.phase2.filters.find(g => g.filterKey === key);
    if (!group) continue;
    const total = group.items.reduce((s, it) => s + (it.count || 0), 0);
    if (total === 0) continue;
    const activeSum = counts.reduce((s, c) => s + c, 0);
    scale *= (activeSum / total);
  }
  return Math.max(0, Math.min(1, scale));
}

// Apply the current filter scale to the visible result stats (toolbar
// title, tree footer summary, selected-count pill) so the page reflects
// "results updated" after a filter toggle.
function tgApplyFilterScale() {
  if (!tgFlowStats) return;
  const scale = tgComputeFilterScale();
  const baseMatches = parseInt((tgFlowStats.matches || '0').replace(/,/g, ''), 10) || 0;
  const baseFiles   = parseInt((tgFlowStats.files   || '0').replace(/,/g, ''), 10) || 0;
  const baseRepos   = tgFlowStats.repos || 0;
  const matches = Math.max(0, Math.round(baseMatches * scale));
  const files   = Math.max(0, Math.round(baseFiles * scale));
  const repos   = Math.max(0, Math.round(baseRepos * scale));
  const title = document.querySelector('.tg-detail-toolbar-title');
  if (title) {
    title.innerHTML = `<strong>${matches.toLocaleString()}</strong> matches in <strong>${files.toLocaleString()}</strong> files across <strong>${repos.toLocaleString()}</strong> repos<span class="tg-detail-toolbar-time">${tgFlowStats.time}</span>`;
  }
  const footer = trigrepPanel.querySelector('#tg-footer-summary');
  if (footer && tgTreeData) {
    const totalRepos = tgTreeData.length;
    const visibleRepos = Math.max(1, Math.round(repos));
    footer.textContent = `Showing ${visibleRepos.toLocaleString()} of ${totalRepos.toLocaleString()} repositor${totalRepos === 1 ? 'y' : 'ies'} · ${matches.toLocaleString()} result${matches === 1 ? '' : 's'}`;
  }
}

// Reconcile the clear-button visibility and bookmark-toggle state with the
// current composite contents (chips + unfinished tail).
function tgSyncSearchBarUI() {
  const input = document.getElementById('trigrep-query-input');
  const clearBtn = document.getElementById('trigrep-query-clear');
  if (input && clearBtn) {
    const hasContent = (input.value || '').length > 0
      || (TGState.tokens && TGState.tokens.length > 0);
    clearBtn.hidden = !hasContent;
  }
  if (typeof syncBookmarkToggleState === 'function') syncBookmarkToggleState();
}

// === Sidebar ↔ query bar sync ========================================
// Helpers used by the filter sidebar to mirror its active state into the
// query (and vice-versa). A filter item with data-fkey/data-fval/data-fnot
// represents one trigrep token (or a NOT + token pair).
function tgFilterIsActive(key, value, isNot) {
  if (!TGState || !TGState.tokens) return false;
  const tokens = TGState.tokens;
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.kind !== 'filter' || t.key !== key || t.value !== value) continue;
    const prev = tokens[i - 1];
    const tokenIsNot = !!(prev && prev.kind === 'op' && prev.value === 'not');
    if (!!isNot === tokenIsNot) return true;
  }
  return false;
}
function tgToggleFilter(key, value, isNot) {
  if (!TGState || !TGState.tokens) return;
  const tokens = TGState.tokens;
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.kind !== 'filter' || t.key !== key || t.value !== value) continue;
    const prev = tokens[i - 1];
    const tokenIsNot = !!(prev && prev.kind === 'op' && prev.value === 'not');
    if (!!isNot !== tokenIsNot) continue;
    tokens.splice(isNot ? i - 1 : i, isNot ? 2 : 1);
    tgWriteBack();
    return;
  }
  if (isNot) tokens.push({ kind: 'op', value: 'not' });
  tokens.push({ kind: 'filter', key, value });
  tgWriteBack();
}
function tgSyncFilterActive() {
  document.querySelectorAll('.filter-item[data-fkey]').forEach(item => {
    const k = item.dataset.fkey;
    const v = item.dataset.fval;
    const n = item.dataset.fnot === '1';
    item.classList.toggle('active', tgFilterIsActive(k, v, n));
  });
}

// === Recognition-over-recall autocomplete =============================
// On focus / empty caret token → list of filters with descriptions.
// After `key:` → values for that filter (curated, with scope hints).
function tgCaretContext(input) {
  const v = input.value;
  const pos = input.selectionStart || v.length;
  let start = pos;
  while (start > 0 && !/\s/.test(v[start - 1])) start--;
  const tokenSoFar = v.slice(start, pos);
  const colon = tokenSoFar.indexOf(':');
  if (colon < 0) {
    return { mode: 'filter', prefix: tokenSoFar.toLowerCase(), start, pos };
  }
  const key = tokenSoFar.slice(0, colon);
  const prefix = tokenSoFar.slice(colon + 1);
  const canon = TG_ALIAS_TO_CANON[key.toLowerCase()];
  if (!canon) return null;
  return { mode: 'value', canon, prefix, start, pos };
}

function tgValueLookup(filterKey, prefix='') {
  const list = (TG_VALUES[filterKey] || []).map(v => typeof v === 'string' ? { value: v } : v);
  const p = (prefix || '').toLowerCase();
  if (!p) return list.slice(0, 12);
  const starts = list.filter(v => v.value.toLowerCase().startsWith(p));
  const contains = list.filter(v => !v.value.toLowerCase().startsWith(p) && v.value.toLowerCase().includes(p));
  const fuzzy = list.filter(v => !v.value.toLowerCase().includes(p) && tgLev(v.value.toLowerCase(), p) <= 2);
  return [...starts, ...contains, ...fuzzy].slice(0, 12);
}

function tgFilterLookup(prefix='') {
  const p = (prefix || '').toLowerCase();
  const all = TG_FILTER_ORDER.map(k => ({ key: k, desc: TG_FILTERS[k].desc }));
  if (!p) return all;
  const starts = all.filter(f => f.key.startsWith(p));
  const contains = all.filter(f => !f.key.startsWith(p) && f.key.includes(p));
  const aliasHits = all.filter(f => !f.key.includes(p) && TG_FILTERS[f.key].aliases.some(a => a.startsWith(p)));
  return [...starts, ...contains, ...aliasHits];
}

function tgRenderAutocomplete() {
  const ac = document.getElementById('tg-autocomplete');
  const input = document.getElementById('trigrep-query-input');
  if (!ac || !input) return;
  if (document.activeElement !== input) { ac.hidden = true; TGState.ac.open = false; return; }
  const ctx = tgCaretContext(input);
  if (!ctx) { ac.hidden = true; TGState.ac.open = false; return; }
  let items, sectionTitle;
  if (ctx.mode === 'filter') {
    items = tgFilterLookup(ctx.prefix).map(f => ({ kind:'filter', name: `${f.key}:`, desc: f.desc, insert: `${f.key}:` }));
    sectionTitle = ctx.prefix ? `Filters matching "${ctx.prefix}"` : 'Available filters';
  } else {
    const raw = tgValueLookup(ctx.canon, ctx.prefix);
    items = raw.map(v => ({ kind:'value', name: v.value, desc: v.desc || '', insert: v.value }));
    sectionTitle = `Values for ${ctx.canon}:`;
  }
  if (!items.length) { ac.hidden = true; TGState.ac.open = false; return; }
  TGState.ac = { open: true, items, active: 0, mode: ctx.mode, ctx };
  const renderName = (name) => {
    if (ctx.mode === 'filter') {
      const m = ctx.prefix && name.toLowerCase().startsWith(ctx.prefix) ? ctx.prefix.length : 0;
      return m ? `<b>${tgEscape(name.slice(0, m))}</b>${tgEscape(name.slice(m))}` : tgEscape(name);
    }
    const m = ctx.prefix && name.toLowerCase().startsWith(ctx.prefix.toLowerCase()) ? ctx.prefix.length : 0;
    return m ? `<b>${tgEscape(name.slice(0, m))}</b>${tgEscape(name.slice(m))}` : tgEscape(name);
  };
  ac.innerHTML = `<div class="tg-ac-section">${tgEscape(sectionTitle)}</div>` +
    items.map((it, i) => `
      <div class="tg-ac-item${i === 0 ? ' is-active' : ''}" data-i="${i}">
        <span class="tg-ac-name">${renderName(it.name)}</span>
        <span class="tg-ac-desc">${tgEscape(it.desc || '')}</span>
      </div>`).join('');
  const box = document.getElementById('trigrep-search-box');
  if (box) {
