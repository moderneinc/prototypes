<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Moderne Genome gradient field</title>
  <desc id="desc">A magenta, blue, teal, and green gradient field for expressive Code Genome work.</desc>
  <defs>
    <radialGradient id="blue" gradientUnits="userSpaceOnUse" cx="880" cy="45" r="1152">
      <stop offset="0" stop-color="#3E7BF6"/>
      <stop offset="0.48" stop-color="#3E7BF6" stop-opacity="0"/>
      <stop offset="1" stop-color="#3E7BF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" gradientUnits="userSpaceOnUse" cx="1440" cy="702" r="1600">
      <stop offset="0" stop-color="#30F284"/>
      <stop offset="0.43" stop-color="#30F284" stop-opacity="0"/>
      <stop offset="1" stop-color="#30F284" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta" gradientUnits="userSpaceOnUse" cx="128" cy="180" r="1639">
      <stop offset="0" stop-color="#E6399B"/>
      <stop offset="0.42" stop-color="#E6399B" stop-opacity="0"/>
      <stop offset="1" stop-color="#E6399B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#25D0C0"/>
  <rect width="1600" height="900" fill="url(#blue)"/>
  <rect width="1600" height="900" fill="url(#green)"/>
  <rect width="1600" height="900" fill="url(#magenta)"/>
</svg>
