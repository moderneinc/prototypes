<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Moderne Mist gradient field</title>
  <desc id="desc">A quiet violet, blue, and stone gradient field for interface backgrounds.</desc>
  <defs>
    <radialGradient id="blue" gradientUnits="userSpaceOnUse" cx="80" cy="765" r="1702">
      <stop offset="0" stop-color="#3E7BF6" stop-opacity="0.35"/>
      <stop offset="0.48" stop-color="#3E7BF6" stop-opacity="0"/>
      <stop offset="1" stop-color="#3E7BF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" gradientUnits="userSpaceOnUse" cx="1216" cy="378" r="1273">
      <stop offset="0" stop-color="#9D5BE8" stop-opacity="0.68"/>
      <stop offset="0.48" stop-color="#9D5BE8" stop-opacity="0"/>
      <stop offset="1" stop-color="#9D5BE8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#F2F0EA"/>
  <rect width="1600" height="900" fill="url(#blue)"/>
  <rect width="1600" height="900" fill="url(#violet)"/>
