<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Moderne Cool gradient field</title>
  <desc id="desc">A teal, blue, and violet gradient field for technical and product framing.</desc>
  <defs>
    <radialGradient id="violet" gradientUnits="userSpaceOnUse" cx="1472" cy="135" r="1658">
      <stop offset="0" stop-color="#9D5BE8"/>
      <stop offset="0.55" stop-color="#9D5BE8" stop-opacity="0"/>
      <stop offset="1" stop-color="#9D5BE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" gradientUnits="userSpaceOnUse" cx="224" cy="738" r="1561">
      <stop offset="0" stop-color="#25D0C0"/>
      <stop offset="0.48" stop-color="#25D0C0" stop-opacity="0"/>
      <stop offset="1" stop-color="#25D0C0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#3E7BF6"/>
  <rect width="1600" height="900" fill="url(#violet)"/>
  <rect width="1600" height="900" fill="url(#teal)"/>
