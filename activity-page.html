<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity — Moderne</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@moderneinc/neo-design@1.6.1/dist/colors.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@moderneinc/neo-design@1.6.1/dist/semantic-colors.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@moderneinc/neo-design@1.6.1/dist/border-radius.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@moderneinc/neo-design@1.6.1/dist/shadows.css">
  <style>
    :root {
      --brand-white: var(--neo-surfaces-white);
      --brand-digital-blue-100: var(--neo-digital-blue-50);
      --brand-digital-blue-200: var(--neo-digital-blue-100);
      --brand-digital-blue-300: var(--neo-digital-blue-200);
      --brand-digital-blue-500: var(--neo-digital-blue-500);
      --brand-digital-blue-600: var(--neo-digital-blue-600);
      --brand-digital-blue-700: var(--neo-digital-blue-700);
      --brand-digital-blue-800: var(--neo-digital-blue-800);
      --brand-red-100: var(--neo-red-50);
      --brand-grey-100: var(--neo-grey-50);
      --brand-grey-200: var(--neo-grey-100);
      --brand-grey-300: var(--neo-grey-200);
      --brand-grey-400: var(--neo-grey-300);
      --brand-grey-500: var(--neo-grey-400);
      --brand-grey-600: var(--neo-grey-500);
      --brand-grey-700: var(--neo-grey-600);
      --brand-grey-800: var(--neo-grey-700);
      --brand-grey-900: var(--neo-grey-800);
      --brand-grey-1000: var(--neo-grey-900);
      --brand-violet-500: var(--neo-violet-400);

      --font-body: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      --font-code: 'JetBrains Mono','Fira Code','Consolas',monospace;

      --surface-primary: var(--neo-surfaces-white);
      --surface-page:    var(--neo-surfaces-page);
      --surface-tertiary: var(--brand-grey-200);
      --text-primary:   var(--brand-grey-1000);
      --text-secondary: var(--brand-grey-600);
      --text-tertiary:  var(--brand-grey-500);
      --border-primary: var(--brand-grey-300);
      --border-secondary: var(--brand-grey-400);

      --radius-sm: calc(var(--neo-border-radius-x-s) * 1px);
      --radius-md: 6px;
      --radius-lg: calc(var(--neo-border-radius-s) * 1px);
      --radius-full: calc(var(--neo-border-radius-full) * 1px);
      --shadow-sm: var(--neo-shadow-card);

      --transition-fast: 150ms ease;

      /* Foundations/Status — 8 intents × light / default / dark / transparent */
      --status-success-light:       #F3FFF5;
      --status-success-default:     #3B8948;
      --status-success-dark:        #2C6C36;
      --status-success-transparent: rgba(59, 137, 72, 0.6);

      --status-queued-light:        #F6EEFB;
      --status-queued-default:      #AD59C7;
      --status-queued-dark:         #992FB9;
      --status-queued-transparent:  rgba(173, 89, 199, 0.6);

      --status-active-light:        #F6EEFB;
      --status-active-default:      #992FB9;
      --status-active-dark:         #7A2694;
      --status-active-transparent:  rgba(153, 47, 185, 0.6);

      --status-info-light:          #F2F3FF;
      --status-info-default:        #2F42FF;
      --status-info-dark:           #1E2EC2;
      --status-info-transparent:    rgba(47, 66, 255, 0.6);

      --status-warning-light:       #FEF9E8;
      --status-warning-default:     #BD9319;
      --status-warning-dark:        #8E6E13;
      --status-warning-transparent: rgba(189, 147, 25, 0.6);

      --status-error-light:         #FFEDEF;
      --status-error-default:       #CB3446;
      --status-error-dark:          #A92232;
      --status-error-transparent:   rgba(203, 52, 70, 0.6);

      --status-neutral-light:       #F3F4F6;
      --status-neutral-default:     #6B7280;
      --status-neutral-dark:        #374151;
      --status-neutral-transparent: rgba(107, 114, 128, 0.6);

      --status-canceled-light:      #FAF8F3;
      --status-canceled-default:    #7B7263;
      --status-canceled-dark:       #564E41;
      --status-canceled-transparent:rgba(123, 114, 99, 0.6);

      /* Activity type accent colors (for lineage columns) */
      --c-recipe:  #992fb9;
      --c-commit:  #2f42ff;
      --c-viz:     #27aa88;
      --c-none:    var(--brand-grey-300);

      --row-h:   42px;
      --col-act: 34px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--surface-page);
      color: var(--text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
      line-height: 1.55;
      overflow: hidden;
    }
    button { font: inherit; cursor: pointer; }
    a { color: var(--brand-digital-blue-600); }
    .svg-stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* =========================================================
       Shell (from results-hierarchical-selection-v2)
       ========================================================= */
    .shell {
      height: 100vh;
      display: grid;
      grid-template-columns: 98px 1fr;
      grid-template-rows: 65px 1fr;
      grid-template-areas: "nav topbar" "nav main";
      background: var(--surface-page);
      overflow: hidden;
    }

    .left-nav {
      grid-area: nav;
      width: 98px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px 8px 24px;
      background: var(--surface-page);
      z-index: 10;
    }
    .left-nav-top { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .nav-home-stack { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 2px; padding: 4px 0; }
    .nav-item-home { padding: 0 4px; }
    .nav-item-home .nav-icon-container { padding: 4px; }
    .nav-version-badge {
      display: inline-flex; align-items: center; justify-content: center;
      height: 18px; padding: 0 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--brand-digital-blue-500), var(--brand-violet-500));
      color: #fff; font-size: 11px; font-weight: 600; line-height: 1;
    }
    .nav-item {
      width: 100%;
      padding: 8px 4px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      border-radius: var(--radius-lg);
      position: relative;
      background: transparent;
    }
    .nav-icon-container {
      display: flex; align-items: center; justify-content: center;
      padding: 8px;
      border-radius: var(--radius-lg);
      border: 1px solid transparent;
      background: transparent;
      transition: background-color 150ms, border-color 150ms;
    }
    .nav-item:hover .nav-icon-container,
    .nav-item.active .nav-icon-container {
      background: var(--brand-digital-blue-100);
      border-color: var(--brand-digital-blue-200);
    }
    .nav-item svg { width: 22px; height: 22px; min-width: 22px; color: var(--brand-grey-900); flex-shrink: 0; }
    .nav-label {
      font-size: 11px; font-weight: 400; line-height: 1;
      color: var(--brand-grey-900);
      text-align: center; width: 100%;
      transition: color 150ms;
    }
    .nav-item:hover .nav-label { color: var(--brand-digital-blue-600); }
    .nav-item.active .nav-label { font-weight: 600; color: var(--brand-digital-blue-800); }

    .nav-tenant { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 4px 0; }
    .tenant-logo {
      width: 46px; height: 46px;
      border-radius: var(--radius-lg);
      background: var(--brand-digital-blue-800);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      font-size: 11px; font-weight: 600; line-height: 1.15;
      letter-spacing: .01em;
    }

    .main-area {
      grid-area: main;
      display: flex; flex-direction: column;
      overflow: hidden;
      position: relative;
      min-height: 0;
      z-index: 11;
      background: var(--surface-primary);
      border-top-left-radius: 20px;
      box-shadow: -1px 0 0 var(--border-primary),
                  0 -1px 0 var(--border-primary),
                  0 -5px 24px -4px rgba(176,141,152,.10),
                  -12px 0 28px -6px rgba(176,141,152,.20);
    }

    .global-nav {
      grid-area: topbar;
      height: 65px;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px;
      flex-shrink: 0;
      position: relative;
      width: 100%;
      background: var(--surface-page);
    }
    .global-nav::before {
      content: '';
      position: absolute;
      left: 50%; top: 70%;
      transform: translate(-50%, -50%);
      width: 1000px; max-width: 90%;
      height: 65px;
      background: radial-gradient(ellipse at center, var(--brand-red-100) 0%, var(--brand-red-100) 40%, transparent 70%);
      filter: blur(20px);
      z-index: 0;
      pointer-events: none;
    }
    .global-nav > * { position: relative; z-index: 1; }

    .org-selector {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; color: var(--text-primary);
      padding: 10px 16px;
      border-radius: var(--radius-full);
      background: var(--surface-primary);
      border: 1px solid var(--border-secondary);
      white-space: nowrap;
      transition: all var(--transition-fast);
      min-width: 0;
    }
    .org-selector:hover { background: var(--brand-grey-200); }
    .org-selector .org-name {
      font-weight: 500;
      max-width: 340px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      display: inline-block;
    }
    .nav-spacer { flex: 1; }
    .search-input {
      height: 40px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-secondary);
      padding: 10px 16px;
      font-size: 14px;
      color: var(--text-tertiary);
      background: var(--surface-primary);
      display: flex; align-items: center; gap: 12px;
      width: 280px;
      user-select: none;
    }
    .search-input:hover { background: var(--brand-grey-200); }
    .search-input > span:first-of-type { flex: 1; }
    .search-input-keys { display: inline-flex; gap: 2px; }
    .search-input kbd {
      font-size: 10px;
      background: var(--surface-tertiary);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      color: var(--text-tertiary);
      border: 1px solid var(--border-primary);
      min-width: 18px; text-align: center;
    }
    .nav-actions { display: flex; align-items: center; gap: 4px; }
    .nav-action-btn {
      width: 40px; height: 40px;
      border-radius: 64px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: transparent;
      color: var(--brand-grey-900);
      transition: background var(--transition-fast);
    }
    .nav-action-btn:hover { background: var(--brand-grey-200); }
    .nav-action-btn svg { width: 20px; height: 20px; }
    .avatar {
      width: 32px; height: 32px;
      border-radius: var(--radius-full);
      background: #E45A4F;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }

    /* =========================================================
       Page top: title (left) + notification button (right); subhead below.
       ========================================================= */
    .page-top { padding: 28px 32px 20px; flex-shrink: 0; }
    .page-head-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }
    .page-head-text { min-width: 0; }
    .page-head-text h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 30px;
      line-height: 36px;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      margin: 0 0 6px;
    }
    .run-subhead {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 14px;
      line-height: 20px;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .run-subhead a {
      color: var(--brand-digital-blue-600);
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
    }
    .run-subhead a:hover { text-decoration: underline; }

    .notif-btn {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-secondary);
      background: var(--surface-primary);
      color: var(--brand-grey-900);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .notif-btn:hover { background: var(--brand-grey-200); border-color: var(--brand-grey-400); }
    .notif-btn svg { width: 18px; height: 18px; }

    .page-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 32px 40px;
      min-height: 0;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .search {
      flex: 1 1 320px;
      min-width: 240px;
      max-width: 460px;
      position: relative;
    }
    .search input {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      padding: 9px 12px 9px 34px;
      border-radius: var(--radius-md);
      background: var(--surface-primary);
      border: 1px solid var(--border-secondary);
      color: var(--text-primary);
      outline: none;
    }
    .search input::placeholder { color: var(--text-tertiary); }
    .search input:focus {
      border-color: var(--brand-digital-blue-500);
      box-shadow: 0 0 0 3px rgba(47,66,255,0.12);
    }
    .search .icn {
      position: absolute;
      left: 11px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      width: 14px; height: 14px;
    }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 10px 6px 8px;
      border-radius: 999px;
      background: var(--surface-primary);
      border: 1px solid var(--border-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: border-color 120ms, background 120ms;
      user-select: none;
    }
    .chip:hover { color: var(--text-primary); }
    .chip .sw {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--chip-color, var(--text-tertiary));
    }
    .chip.t-recipe { --chip-color: var(--c-recipe); }
    .chip.t-commit { --chip-color: var(--c-commit); }
    .chip.t-viz    { --chip-color: var(--c-viz); }
    .chip.active {
      background: var(--brand-grey-200);
      color: var(--text-primary);
    }
    .chip.active .sw { box-shadow: 0 0 0 3px color-mix(in srgb, var(--chip-color, var(--text-primary)) 24%, transparent); }
    .chip.muted { opacity: 0.5; }

    .toolbar-divider {
      width: 1px; align-self: stretch;
      background: var(--border-primary);
      margin: 0 4px;
    }

    .select {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 28px 6px 10px;
      border-radius: var(--radius-md);
      background: var(--surface-primary);
      border: 1px solid var(--border-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-tertiary) 50%),
                        linear-gradient(135deg, var(--text-tertiary) 50%, transparent 50%);
      background-position: calc(100% - 14px) 50%, calc(100% - 10px) 50%;
      background-size: 4px 4px;
      background-repeat: no-repeat;
    }
    .select:hover { color: var(--text-primary); }

    /* =========================================================
       Activity table (lineage columns + core fields)
       ========================================================= */
    .tableCard {
      background: var(--surface-primary);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    table.activity {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }
    .activity thead th {
      background: var(--surface-page);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      text-align: left;
      border-bottom: 1px solid var(--border-primary);
      padding: 0;
      height: var(--row-h);
      position: sticky; top: 0; z-index: 1;
    }
    .activity thead th.activity-col {
      width: var(--col-act);
      min-width: var(--col-act);
      max-width: var(--col-act);
      border-right: 1px solid var(--border-primary);
      padding: 0;
    }
    .activity thead th.activity-col .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      margin: 0 auto;
      display: block;
    }
    .activity thead th.name   { padding: 0 16px 0 20px; min-width: 320px; }
    .activity thead th.type   { padding: 0 16px; width: 140px; }
    .activity thead th.org    { padding: 0 16px; width: 180px; }
    .activity thead th.status { padding: 0 16px; width: 220px; }
    .activity thead th.runby  { width: 90px; text-align: center; padding: 0; }
    .activity thead th.time   { padding: 0 16px; width: 180px; text-align: right; }

    .activity tbody tr { transition: background 100ms; }
    .activity tbody tr:hover { background: var(--surface-page); }
    .activity tbody td {
      font-size: 13px;
      height: var(--row-h);
      vertical-align: middle;
      border-bottom: 1px solid var(--brand-grey-200);
    }
    .activity tbody tr:last-child td { border-bottom: none; }

    .activity tbody td.activity-cell {
      width: var(--col-act);
      min-width: var(--col-act);
      max-width: var(--col-act);
      border-right: 1px solid var(--border-primary);
      padding: 0;
      text-align: center;
      line-height: 0;
    }

    .activity tbody td.name { padding: 0 16px 0 20px; }
    .activity tbody td.name a {
      color: var(--brand-digital-blue-600);
      text-decoration: none;
      font-weight: 500;
    }
    .activity tbody td.name a:hover { text-decoration: underline; }
    .activity tbody td.name .name-meta {
      display: block;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 1px;
      font-weight: 400;
    }

    .activity tbody td.type {
      padding: 0 16px;
      font-size: 12px;
      font-weight: 500;
    }
    .activity tbody td.type.t-recipe-run    { color: var(--c-recipe); }
    .activity tbody td.type.t-commit-job    { color: var(--c-commit); }
    .activity tbody td.type.t-visualization { color: var(--c-viz); }

    .activity tbody td.org { padding: 0 16px; color: var(--text-primary); }
    .activity tbody td.status { padding: 0 16px; }
    .activity tbody td.status .status-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .activity tbody td.status .status-meta {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 400;
      white-space: nowrap;
    }
    .activity tbody td.status .status-info {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px; height: 14px;
      /* Neo --icon-information — the informational-blue affordance. */
      color: var(--brand-digital-blue-600);
      cursor: help;
      flex-shrink: 0;
    }
    .activity tbody td.status .neo-tooltip-trigger {
      border-radius: var(--radius-sm);
      outline: none;
    }
    .activity tbody td.status .neo-tooltip-trigger:hover .status-info { color: var(--brand-digital-blue-700); }
    .activity tbody td.status .neo-tooltip-trigger:focus-visible {
      outline: 2px solid var(--brand-digital-blue-500);
      outline-offset: 2px;
    }
    .activity tbody td.status .neo-tooltip-trigger:focus-visible .status-info { color: var(--brand-digital-blue-700); }
    .activity tbody td.status .status-info svg {
      width: 14px; height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Turtle icon: reuses the tooltip-trigger affordances, but the glyph is a
       filled illustration (not a stroked icon), so it inherits `fill` from
       `color` and needs no stroke overrides. */
    .activity tbody td.status .status-turtle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px; height: 14px;
      color: var(--text-secondary);
      cursor: help;
      flex-shrink: 0;
    }
    .activity tbody td.status .neo-tooltip-trigger:hover .status-turtle,
    .activity tbody td.status .neo-tooltip-trigger:focus-visible .status-turtle {
      color: var(--text-primary);
    }
    .activity tbody td.status .status-turtle svg {
      width: 14px; height: 14px;
      fill: currentColor;
    }
    .activity tbody td.status .status-turtle svg path { fill: currentColor; }

    /* =========================================================
       NeoTooltip (from @moderneinc/neo-design Tooltip.css)
       Uses position: fixed so it escapes any parent overflow-clip;
       coordinates set at hover/focus time by JS below.
       ========================================================= */
    .neo-tooltip-trigger { display: inline-flex; }
    .neo-tooltip {
      position: fixed;
      padding: 6px 10px;
      background-color: var(--brand-grey-900);
      color: #fff;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 20px rgba(15,23,42,0.18), 0 2px 6px rgba(15,23,42,0.10);
      opacity: 0;
      transform: translate(-50%, -100%) scale(0.95);
      transition: opacity var(--transition-fast), transform var(--transition-fast);
      pointer-events: none;
      max-width: 250px;
      width: max-content;
      white-space: normal;
      text-align: left;
      z-index: 1000;
      top: 0; left: 0;
    }
    .neo-tooltip--visible {
      opacity: 1;
      transform: translate(-50%, -100%) scale(1);
    }
    .neo-tooltip__arrow {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: var(--brand-grey-900);
      transform: rotate(45deg);
      bottom: -4px;
      left: 50%;
      margin-left: -4px;
    }

    .activity tbody td.runby { width: 90px; text-align: center; padding: 0; }
    .activity tbody td.runby .avatar-cell {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--avatar-bg, var(--brand-grey-300));
      color: #fff;
      font-size: 11px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
      border: 2px solid var(--surface-primary);
      box-shadow: 0 0 0 1px var(--avatar-bg, var(--brand-grey-300));
    }

    .activity tbody td.time {
      padding: 0 16px;
      color: var(--text-secondary);
      font-size: 12px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .activity tbody td.time .abs {
      display: block;
      color: var(--text-tertiary);
      font-size: 10.5px;
      margin-top: 1px;
    }

    svg.scene {
      width: 35px; height: 36px;
      overflow: visible;
      display: inline-block;
      vertical-align: middle;
    }

    /* =========================================================
       Neo Badge — from @moderneinc/neo-design Badge.css
       Medium: height 24px, padding 2px 10px, font-size 12px, gap 4px,
       border 1px solid --status-{intent}-transparent, currentColor icon.
       ========================================================= */
    .neo-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-body);
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0;
      border-radius: var(--radius-full);
      white-space: nowrap;
      border-width: 1px;
      border-style: solid;
      box-sizing: border-box;
      height: 24px;
      padding: 2px 10px;
      font-size: 12px;
    }
    .neo-badge__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 14px; height: 14px;
      color: currentColor;
    }
    .neo-badge__icon svg {
      width: 100%; height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .neo-badge--neutral  { background: var(--status-neutral-light);  border-color: var(--status-neutral-transparent);  color: var(--status-neutral-dark); }
    .neo-badge--success  { background: var(--status-success-light);  border-color: var(--status-success-transparent);  color: var(--status-success-dark); }
    .neo-badge--queued   { background: var(--status-queued-light);   border-color: var(--status-queued-transparent);   color: var(--status-queued-dark); }
    .neo-badge--active   { background: var(--status-active-light);   border-color: var(--status-active-transparent);   color: var(--status-active-dark); }
    .neo-badge--info     { background: var(--status-info-light);     border-color: var(--status-info-transparent);     color: var(--status-info-dark); }
    .neo-badge--warning  { background: var(--status-warning-light);  border-color: var(--status-warning-transparent);  color: var(--status-warning-dark); }
    .neo-badge--error    { background: var(--status-error-light);    border-color: var(--status-error-transparent);    color: var(--status-error-dark); }
    .neo-badge--canceled { background: var(--status-canceled-light); border-color: var(--status-canceled-transparent); color: var(--status-canceled-dark); }

    /* Active spinner: rotate loader-circle 2s linear */
    .neo-badge--active .neo-badge__icon svg {
      animation: neo-status-spin 2s linear infinite;
      transform-box: fill-box;
      transform-origin: 50% 50%;
    }
    @keyframes neo-status-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .neo-badge--active .neo-badge__icon svg { animation: none; }
    }

    /* Progress bar (commit-job in-flight scale — colored per Status intent) */
    .progress {
      display: flex; flex-direction: column; gap: 4px;
      width: 180px; max-width: 100%;
    }
    .progress-bar {
      width: 100%; height: 5px;
      border-radius: 999px;
      background: var(--brand-grey-200);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 999px;
      transition: width 200ms ease;
      background: var(--status-success-default);
    }
    .progress-fill.success { background: var(--status-success-default); }
    .progress-fill.warning { background: var(--status-warning-default); }
    .progress-fill.error   { background: var(--status-error-default); }
    .progress-fill.active { background: var(--status-active-default); }
    .progress-label {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .progress-label .state { font-weight: 500; }
    .progress-label .state.success { color: var(--status-success-dark); }
    .progress-label .state.warning { color: var(--status-warning-dark); }
    .progress-label .state.error   { color: var(--status-error-dark); }
    .progress-label .state.active  { color: var(--status-active-dark); }
    .progress-label .count { color: var(--text-tertiary); font-weight: 500; }

    /* Table footer — center-aligned results count + Load more link */
    .tableFoot {
      display: flex; align-items: center; justify-content: center;
      gap: 16px;
      padding: 14px 18px;
      border-top: 1px solid var(--border-primary);
      background: var(--surface-primary);
      color: var(--text-secondary);
      font-size: 13px;
    }
    .tableFoot .results-count { color: var(--text-secondary); }
    .tableFoot .load-more {
      color: var(--brand-digital-blue-600);
      text-decoration: none;
      font-weight: 500;
    }
    .tableFoot .load-more:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="shell">

            Runs are queued in lanes by size and available capacity, so wait times can vary - especially for larger runs. <a href="#">Learn more</a>

        <button class="notif-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

</div>

<script>
  /* ===== Left nav items ===== */
  const NAV_ITEMS = [
    { label: 'Moddy',        svg: '<path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M19 13l.75 2.25L22 16l-2.25.75L19 19l-.75-2.25L16 16l2.25-.75L19 13z"/>' },
    { label: 'DevCenter',    svg: '<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>' },
    { label: 'Marketplace',  svg: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>' },
    { label: 'Builder',      svg: '<rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/><rect x="2" y="14" width="8" height="8" rx="1"/><rect x="14" y="14" width="8" height="8" rx="1"/>' },
    { label: 'Activity', active: true, svg: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>' },
    { label: 'Changelog',    svg: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>' },
    { label: 'Repositories', svg: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="2"/><path d="M14 13h3"/><path d="M7 13h3"/>' },
    { label: 'Deploy',       svg: '<path d="M16.5 9.4l-9-5.19"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>' }
  ];
  const navList = document.getElementById('left-nav-items');
  NAV_ITEMS.forEach(i => {
    const el = document.createElement('div');
    el.className = 'nav-item' + (i.active ? ' active' : '');
    el.title = i.label;
    el.innerHTML = `<div class="nav-icon-container"><svg width="22" height="22" viewBox="0 0 24 24" class="svg-stroke">${i.svg}</svg></div><span class="nav-label">${i.label}</span>`;
    navList.appendChild(el);
  });

  /* ===== Foundations/Status Neo Badge ===== */
  const STATUS_ICONS = {
    success:  '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    queued:   '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    active:   '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
    info:     '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
    warning:  '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    error:    '<path d="M15.312 2a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586l-4.688-4.688A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
    neutral:  '<circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/>',
    canceled: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'
  };
  // Per Badge spec: leading icon is required for `queued` and `active`, omitted otherwise.
  const ICON_REQUIRED = new Set(['queued', 'active']);
  const badge = (intent, label) => {
    const icon = ICON_REQUIRED.has(intent)
      ? `<span class="neo-badge__icon" aria-hidden="true"><svg viewBox="0 0 24 24">${STATUS_ICONS[intent]}</svg></span>`
      : '';
    return `<span class="neo-badge neo-badge--${intent}">${icon}<span class="neo-badge__label">${label}</span></span>`;
  };
  // Status cell = badge + optional meta text sitting inline to its right
  // (error count, etc.). Kept outside the chip so the chip stays compact
  // and every row stays the same height. `info`, when passed, adds a
  // native-tooltip info icon after the meta.
  // Sequential id for aria-describedby wiring — Neo's Tooltip doc calls for
  // `aria-describedby` linking trigger → tooltip content (not `aria-label`).
  let tooltipUid = 0;
  const statusChip = (intent, label, meta, info) => {
    if (!meta) return badge(intent, label);
    let infoIcon = '';
    if (info) {
      const id = `lane-tt-${++tooltipUid}`;
      infoIcon = `<span class="neo-tooltip-trigger" tabindex="0" aria-describedby="${id}">
           <span class="status-info" aria-hidden="true"><svg viewBox="0 0 24 24">${STATUS_ICONS.info}</svg></span>
           <span class="neo-tooltip neo-tooltip--top" role="tooltip" id="${id}">${info}<span class="neo-tooltip__arrow"></span></span>
         </span>`;
    }
    return `<span class="status-cell">${badge(intent, label)}<span class="status-meta">${meta}</span>${infoIcon}</span>`;
  };
  // Slow-lane variant: badge + subtle turtle glyph carrying the tooltip.
  // No text label — the icon alone signals "this run is in the slow lane",
  // and the tooltip explains why. Fast lane has no visual indicator at all.
  const TURTLE_SVG = '<svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M11.6036 7.91165C11.3335 7.81226 11.0752 7.74876 10.8465 7.72323C10.0946 7.00917 9.07891 6.57041 7.96263 6.57041C7.08932 6.57041 6.27765 6.83906 5.60562 7.29784C4.61058 7.22396 3.77509 6.47651 3.60523 5.47907L3.60359 5.47896C3.47018 4.7488 2.90157 4.19577 2.21139 4.18527C1.4124 4.17313 0.170668 4.88812 0.0676643 5.78185C-0.0802381 7.0649 1.06415 7.08324 2.07245 7.08316C2.5312 7.93932 3.27643 8.61113 4.16879 8.98167C3.91414 9.52225 3.77146 10.1255 3.77146 10.7616C3.77146 11.3126 4.21804 11.7595 4.76934 11.7595C5.32064 11.7595 5.76725 11.3126 5.76725 10.7616C5.76725 10.1791 5.99571 9.64937 6.36715 9.25598C6.98468 9.16025 7.28975 8.92293 7.38165 8.64485C7.5709 8.59268 7.76632 8.56623 7.96263 8.56621C9.17294 8.56621 10.158 9.55102 10.158 10.7616C10.158 11.3126 10.6046 11.7595 11.1559 11.7595C11.7072 11.7595 12.1538 11.3126 12.1538 10.7616C12.1538 10.2844 12.0734 9.82558 11.9258 9.39784C12.8344 9.25223 13.9072 8.82119 13.9375 8.44584C13.9769 7.95833 13.1761 8.49033 11.6036 7.91165Z"/><path d="M2.15472 4.68491C2.36704 4.68491 2.53917 4.85703 2.53917 5.06936V5.54197C2.53917 5.75429 2.36704 5.92642 2.15472 5.92642C1.94239 5.92642 1.77026 5.75429 1.77026 5.54197V5.06936C1.77024 4.85703 1.94237 4.68491 2.15472 4.68491Z"/><path d="M11.0735 6.59504C11.0676 6.58282 11.0621 6.57093 11.0559 6.55854C10.3998 5.2322 9.37919 4.60302 9.16553 4.7675C8.99321 4.90017 9.332 4.93238 9.67636 6.24789C9.3358 6.19276 8.97822 6.15352 8.60802 6.13233C8.42446 5.37084 8.15518 4.74182 7.96273 4.74182C7.77029 4.74182 7.501 5.37084 7.31745 6.13233C6.94724 6.15352 6.58966 6.19276 6.2491 6.24789C6.59346 4.93238 6.93228 4.90017 6.75993 4.7675C6.54627 4.60302 5.52566 5.23223 4.86952 6.55854C4.8634 6.57093 4.85785 6.58285 4.85191 6.59504C3.67818 7.00796 2.92432 7.6492 2.92432 8.36927C2.92432 9.61483 5.18009 10.6246 7.9627 10.6246C10.7453 10.6246 13.0011 9.61483 13.0011 8.36927C13.0011 7.6492 12.2473 7.00796 11.0735 6.59504Z"/><path d="M7.99933 3.69211V3.68716C7.99741 3.68716 7.99563 3.68766 7.99372 3.68766C7.99181 3.68766 7.99006 3.68716 7.98814 3.68716V3.68815C7.97978 3.68815 7.97108 3.68968 7.96271 3.68976C7.95435 3.68971 7.94562 3.68815 7.93726 3.68815V3.68716C7.93534 3.68716 7.93359 3.68766 7.93168 3.68766C7.92976 3.68766 7.92607 3.69211 7.92607 3.69211C6.00449 3.73411 3.58276 5.48742 3.58276 7.81388C3.58276 8.12894 3.97671 9.78146 7.92613 9.8027V9.80467C7.9281 9.80467 7.92974 9.80454 7.93171 9.80454C7.93367 9.80454 7.93529 9.80467 7.93726 9.80467V9.80437C7.94625 9.80437 7.9538 9.80369 7.96274 9.80369C7.97168 9.80369 7.9792 9.80437 7.9882 9.80437V9.80467C7.99017 9.80467 7.99178 9.80454 7.99375 9.80454C7.99572 9.80454 7.99736 9.80467 7.99933 9.80467V9.8027C11.9487 9.78146 12.3427 8.12894 12.3427 7.81388C12.3426 5.48742 9.92091 3.73411 7.99933 3.69211ZM6.00736 7.43443C5.74984 9.06303 5.01823 8.23014 4.80456 8.06566C4.5909 7.90119 4.39769 7.51228 4.86953 6.5585C5.52567 5.23217 6.54628 4.60299 6.75994 4.76746C6.97361 4.93193 6.40155 4.94148 6.00736 7.43443ZM7.96271 8.74702C7.64353 8.74702 7.11279 8.86312 7.11279 7.66762C7.11279 6.47212 7.64353 4.74181 7.96271 4.74181C8.2819 4.74181 8.81264 6.47215 8.81264 7.66762C8.81264 8.86309 8.2819 8.74702 7.96271 8.74702ZM11.1209 8.06566C10.9072 8.23014 10.1756 9.06303 9.91806 7.43443C9.52388 4.94148 8.95185 4.93193 9.16551 4.76746C9.37917 4.60299 10.3998 5.2322 11.0559 6.5585C11.5277 7.51231 11.3345 7.90119 11.1209 8.06566Z"/></svg>';
  const slowLaneChip = (intent, label, tooltip) => {
    const id = `lane-tt-${++tooltipUid}`;
    const turtle = `<span class="neo-tooltip-trigger" tabindex="0" aria-describedby="${id}" aria-label="Slow lane">
         <span class="status-turtle">${TURTLE_SVG}</span>
         <span class="neo-tooltip neo-tooltip--top" role="tooltip" id="${id}">${tooltip}<span class="neo-tooltip__arrow"></span></span>
       </span>`;
    return `<span class="status-cell">${badge(intent, label)}${turtle}</span>`;
  };

  /* ===== Lineage SVG primitives (recipe → commit / viz) ===== */
  const COLORS = {
    'recipe-run':    '#992fb9',
    'commit-job':    '#2f42ff',
    'visualization': '#27aa88',
    'none':          '#e5e7eb'
  };
  const STROKE = 1.2;
  const VB = '-12 -12 35 36';
  const svg = (kids) => `<svg class="scene" viewBox="${VB}" xmlns="http://www.w3.org/2000/svg">${kids}</svg>`;
  const circle = (color, paths = {}) => {
    const parts = [];
    if (paths.right)  parts.push(`<path d="M 11,5 H 35"  stroke="${paths.right}"  stroke-width="${STROKE}" fill="none"/>`);
    if (paths.top)    parts.push(`<path d="M 5,-1 V -12" stroke="${paths.top}"    stroke-width="${STROKE}" fill="none"/>`);
    if (paths.bottom) parts.push(`<path d="M 5,11 V 35"  stroke="${paths.bottom}" stroke-width="${STROKE}" fill="none"/>`);
    parts.push(`<circle r="6" cx="5" cy="5" fill="${color}"/>`);
    return svg(parts.join(''));
  };
  const pathVertical   = (color) => svg(`<path d="M 5,-12 V 35" stroke="${color}" stroke-width="${STROKE}" fill="none"/>`);
  const corner         = (color) => svg(`<path d="M -12,5 H 0 Q 5 5.5, 5 12 V 35" stroke="${color}" stroke-width="${STROKE}" fill="none"/>`);
  const cornerWithH    = (cC, hC) => svg(`
    <path d="M -12,5 H 35" stroke="${hC}" stroke-width="${STROKE}" fill="none"/>
    <path d="M -12,5 H 0 Q 5 5.5, 5 12 V 35" stroke="${cC}" stroke-width="${STROKE}" fill="none"/>
  `);
  const pathHorizontal = (color) => svg(`<path d="M -12,5 H 35" stroke="${color}" stroke-width="${STROKE}" fill="none"/>`);

  const S = {
    BLANK: 'blank',
    CIRCLE: 'circle',
    CIRCLE_R: 'circle-right',
    CIRCLE_T: 'circle-top',
    CIRCLE_TB: 'circle-top-bottom',
    CORNER: 'corner',
    CORNER_H: 'corner-h',
    V: 'vertical',
    H: 'horizontal'
  };
  const renderScene = (scene, color, pathColor) => {
    const pc = pathColor || color;
    switch (scene) {
      case S.BLANK:     return '';
      case S.CIRCLE:    return circle(color);
      case S.CIRCLE_R:  return circle(color, { right: pc });
      case S.CIRCLE_T:  return circle(color, { top: pc });
      case S.CIRCLE_TB: return circle(color, { top: pc, bottom: pc });
      case S.CORNER:    return corner(pc);
      case S.CORNER_H:  return cornerWithH(color, pc);
      case S.V:         return pathVertical(color);
      case S.H:         return pathHorizontal(color);
      default:          return '';
    }
  };

  /* ===== Row helpers ===== */
  const recipeRunRow = (name, recipe, opts) => {
    const { hasCommit = false, hasVis = false,
            org = 'Moderne Inc', statusCell = badge('success', 'Completed'),
            runBy = 'A', time = '4 min ago', abs = 'Today 09:44', clusterStart = true } = opts || {};
    const col0 = (hasCommit || hasVis) ? S.CIRCLE_R : S.CIRCLE;
    let col1 = S.BLANK;
    if (hasCommit && hasVis) col1 = S.CORNER_H;
    else if (hasCommit)      col1 = S.CORNER;
    else if (hasVis)         col1 = S.H;
    const col2 = hasVis ? S.CORNER : S.BLANK;

    const col1BranchColor = hasCommit ? COLORS['commit-job'] : (hasVis ? COLORS['visualization'] : COLORS['recipe-run']);

    return {
      type: 'recipe-run',
      name, recipe, clusterStart,
      scenes: [col0, col1, col2],
      colors: [
        COLORS['recipe-run'],
        hasCommit ? COLORS['commit-job'] : (hasVis ? COLORS['visualization'] : COLORS.none),
        hasVis ? COLORS['visualization'] : COLORS.none
      ],
      secondaryColors: [
        col0 === S.CIRCLE_R ? col1BranchColor : COLORS['recipe-run'],
        hasCommit && hasVis ? COLORS['visualization'] : (hasCommit ? COLORS['commit-job'] : COLORS['visualization']),
        COLORS['visualization']
      ],
      org, statusCell, runBy, time, abs
    };
  };
  const commitJobRow = (name, opts) => {
    const { isLast = true, hasParallelVis = false,
            org = 'Moderne Inc', statusCell,
            progress,
            runBy = 'A', time = '3 min ago', abs = 'Today 09:45' } = opts || {};
    const col1 = isLast ? S.CIRCLE_T : S.CIRCLE_TB;
    const col2 = hasParallelVis ? S.V : S.BLANK;
    return {
      type: 'commit-job',
      name,
      scenes: [S.BLANK, col1, col2],
      colors: [COLORS.none, COLORS['commit-job'], COLORS['visualization']],
      secondaryColors: [COLORS.none, COLORS['commit-job'], COLORS['visualization']],
      org, statusCell, progress, runBy, time, abs
    };
  };
  const visualizationRow = (name, opts) => {
    const { isLast = true,
            org = 'Moderne Inc', statusCell = badge('success', 'Completed'),
            runBy = 'A', time = '2 min ago', abs = 'Today 09:46' } = opts || {};
    const col2 = isLast ? S.CIRCLE_T : S.CIRCLE_TB;
    return {
      type: 'visualization',
      name,
      scenes: [S.BLANK, S.BLANK, col2],
      colors: [COLORS.none, COLORS.none, COLORS['visualization']],
      secondaryColors: [COLORS.none, COLORS.none, COLORS['visualization']],
      org, statusCell, runBy, time, abs
    };
  };

  /* Avatar colors — one per user initial. */
  const AVATAR_COLORS = {
    P: '#4b9d5e',   // green
    T: '#c99933',   // gold
    J: '#5b8ac2',   // blue
    M: '#d17e3e',   // orange
    B: '#c47a44',   // sienna
    A: '#7a2694'    // violet
  };

  /* Row data — Foundations/Status intents.
     Lane (High / Normal / Low) sits as meta text next to the badge; only
     Queued and Running rows carry a lane. */
  const org = 'Default';
  const rows = [
    // Cluster 1 — plain queued (lane meta only appears once a run is running)
    recipeRunRow('Upgrade Spring Boot', 'org.openrewrite.spring.boot3.UpgradeSpringBoot_3_3',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('queued', 'Queued'),
        runBy: 'P', time: '5 min ago', abs: '' }),

    // Cluster 2 — running normally. Fast lane placement is no longer surfaced
    // in the UI; a run in the fast lane looks the same as any other running run.
    recipeRunRow('Migrate to JUnit 5', 'org.openrewrite.java.testing.junit5.JUnit5BestPractices',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('active', 'Running'),
        runBy: 'M', time: '15 min ago', abs: '' }),

    // Cluster 3 — running in the slow lane. Surfaced subtly via a turtle glyph
    // whose tooltip explains the placement; no "Slow lane" label text.
    recipeRunRow('Static analysis pass', 'org.openrewrite.staticanalysis.CommonStaticAnalysis',
      { hasCommit: false, hasVis: false, org,
        statusCell: slowLaneChip('active', 'Running', "This run spans 100+ repositories, so it's placed in the slow lane to keep smaller runs moving."),
        runBy: 'A', time: '32 min ago', abs: '' }),

    // Cluster 4 — recipe + visualization child (finished)
    recipeRunRow('Update Prethink context (no AI)', '',
      { hasCommit: false, hasVis: true, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'P', time: 'about 17 hours ago', abs: '' }),
    visualizationRow('Technical debt hotspot treemap',
      { isLast: true, org, statusCell: badge('success', 'Completed'),
        runBy: 'P', time: 'about 3 hours ago', abs: '' }),

    // Standalone recipe runs — matches the screenshot list
    recipeRunRow('Common static analysis issues', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'T', time: '12 days ago', abs: '' }),
    recipeRunRow('Common static analysis issues', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('canceled', 'Canceled'),
        runBy: 'J', time: '13 days ago', abs: '' }),
    recipeRunRow('Common static analysis issues', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'T', time: '15 days ago', abs: '' }),
    recipeRunRow('Remediate vulnerabilities from the OWASP Top Ten', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'P', time: '19 days ago', abs: '' }),
    recipeRunRow('Common static analysis issues', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'M', time: '19 days ago', abs: '' }),
    recipeRunRow('Common static analysis issues', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'P', time: '19 days ago', abs: '' }),
    recipeRunRow('Update Prethink context (no AI)', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'B', time: '20 days ago', abs: '' }),
    recipeRunRow('Find types', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'M', time: '20 days ago', abs: '' }),
    recipeRunRow('Update Prethink context (no AI)', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('error', 'Error'),
        runBy: 'B', time: '22 days ago', abs: '' }),
    recipeRunRow('Find types', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'J', time: '23 days ago', abs: '' }),
    recipeRunRow('Find Maven dependency', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'J', time: '25 days ago', abs: '' }),
    recipeRunRow('Find and fix vulnerable Maven/Gradle dependencies', '',
      { hasCommit: false, hasVis: false, org,
        statusCell: badge('success', 'Finished'),
        runBy: 'M', time: '27 days ago', abs: '' })
  ];

  /* ===== Render ===== */
  const tbody = document.getElementById('rows');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    if (r.clusterStart) tr.classList.add('cluster-start');

    for (let i = 0; i < 3; i++) {
      const td = document.createElement('td');
      td.className = 'activity-cell';
      td.innerHTML = renderScene(r.scenes[i], r.colors[i], r.secondaryColors[i]);
      tr.appendChild(td);
    }

    const tdName = document.createElement('td');
    tdName.className = 'name';
    tdName.innerHTML = `<a href="#">${r.name}</a>`;
    tr.appendChild(tdName);

    const tdType = document.createElement('td');
    tdType.className = 'type t-' + r.type;
    tdType.textContent = ({
      'recipe-run':    'Recipe run',
      'commit-job':    'Commit job',
      'visualization': 'Visualization'
    })[r.type];
    tr.appendChild(tdType);

    const tdOrg = document.createElement('td');
    tdOrg.className = 'org';
    tdOrg.textContent = r.org;
    tr.appendChild(tdOrg);

    const tdStatus = document.createElement('td');
    tdStatus.className = 'status';
    if (r.progress) {
      const { done, total, active, error } = r.progress;
      const pct = total > 0 ? Math.max(0, Math.min(100, (done / total) * 100)) : 0;
      const state = error ? 'error' : active ? 'active' : done < total ? 'warning' : 'success';
      // Once a run finishes cleanly (done === total, not active, not error) the
      // progress bar collapses to a Success chip — the bar only communicates
      // in-flight scale, and it's redundant at 100%.
      if (state === 'success') {
        tdStatus.innerHTML = badge('success', 'Finished');
      } else {
        const stateLabel = ({
          active:  'Running',
          error:   'Failed',
          warning: 'Partial'
        })[state];
        tdStatus.innerHTML = `
          <div class="progress">
            <div class="progress-bar"><div class="progress-fill ${state}" style="width:${pct.toFixed(1)}%"></div></div>
            <div class="progress-label">
              <span class="state ${state}">${stateLabel}</span>
              <span class="count">${done} / ${total} repos</span>
            </div>
          </div>
        `;
      }
    } else if (r.statusCell) {
      tdStatus.innerHTML = r.statusCell;
    }
    tr.appendChild(tdStatus);

    const tdRunBy = document.createElement('td');
    tdRunBy.className = 'runby';
    const avColor = AVATAR_COLORS[r.runBy] || '#9ca3af';
    tdRunBy.innerHTML = `<span class="avatar-cell" title="${r.runBy}" style="--avatar-bg:${avColor}">${r.runBy}</span>`;
    tr.appendChild(tdRunBy);

    const tdTime = document.createElement('td');
    tdTime.className = 'time';
    tdTime.innerHTML = r.time + (r.abs ? `<span class="abs">${r.abs}</span>` : '');
    tr.appendChild(tdTime);

    tbody.appendChild(tr);
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      chip.classList.toggle('active');
      chip.classList.toggle('muted');
    });
  });

  /* ===== NeoTooltip behavior =====
     Matches Neo Tooltip docs: shows on hover + keyboard focus, ~200ms delay
     to prevent flicker, Escape dismisses without moving focus, position:
     fixed so it escapes any parent overflow-clip. */
  const TOOLTIP_DELAY = 200;
  document.querySelectorAll('.neo-tooltip-trigger').forEach(trigger => {
    const tooltip = trigger.querySelector('.neo-tooltip');
    if (!tooltip) return;
    let showTimer = null;
    const place = () => {
      const r = trigger.getBoundingClientRect();
      tooltip.style.left = (r.left + r.width / 2) + 'px';
      tooltip.style.top  = (r.top - 8) + 'px';
    };
    const show = () => {
      clearTimeout(showTimer);
      showTimer = setTimeout(() => {
        place();
        tooltip.classList.add('neo-tooltip--visible');
      }, TOOLTIP_DELAY);
    };
    const hide = () => {
      clearTimeout(showTimer);
      tooltip.classList.remove('neo-tooltip--visible');
    };
    trigger.addEventListener('mouseenter', show);
    trigger.addEventListener('mouseleave', hide);
    trigger.addEventListener('focus', show);
    trigger.addEventListener('blur', hide);
    trigger.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hide();
        e.stopPropagation();
      }
    });
  });
</script>
