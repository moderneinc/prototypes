name: Refresh README dates

on:
  push:
    branches: [gh-pages]
    # The refresh commit only touches README.md, so ignoring it here
    # prevents the workflow from re-triggering itself.
    paths-ignore:
      - README.md

concurrency:
  group: readme-dates
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — Added dates need the first commit per file.
          fetch-depth: 0

      - name: Regenerate date columns
        run: python3 .github/scripts/update_readme_dates.py

      - name: Commit and push if changed
        run: |
          FILES="README.md moderne-marketing-kit.html"
          if git diff --quiet $FILES; then
            echo "Dates already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh git-derived dates (README + badges)" $FILES
          git push
