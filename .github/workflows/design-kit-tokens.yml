name: Design kit token drift

# Two ways the kit can drift from the design system, one job each:
# a raw colour literal pasted into the page, or a hand-edited vendored sheet.
on:
  pull_request:
    paths:
      - morpheus-design-kit.html
      - assets/design-system-tokens/**
      - scripts/**
  push:
    branches: [gh-pages]
    paths:
      - morpheus-design-kit.html
      - assets/design-system-tokens/**
      - scripts/**

permissions:
  contents: read

jobs:
  color-literals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-color-literals.sh

  vendored-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-vendor from the pinned version
        run: ./scripts/vendor-tokens.sh
      - name: Fail if the committed sheet differs
        run: |
          if ! git diff --exit-code -- assets/design-system-tokens/; then
            echo "::error::Vendored token sheet does not match the pinned package."
            echo "Run scripts/vendor-tokens.sh and commit, or correct scripts/tokens-version.txt."
            exit 1
          fi
