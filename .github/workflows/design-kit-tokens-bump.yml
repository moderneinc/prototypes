name: Bump design kit tokens

# Keeps the pinned token version fresh without letting npm change the page
# behind our backs: when a newer version publishes, this opens a PR with the
# regenerated sheet so the change is reviewed like any other.
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compare pinned version against npm latest
        id: check
        run: |
          pinned="$(tr -d '[:space:]' < scripts/tokens-version.txt)"
          latest="$(npm view @moderneinc/design-system-tokens version)"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$pinned" == "$latest" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-vendor at the new version
        if: steps.check.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          printf '%s\n' "$LATEST" > scripts/tokens-version.txt
          ./scripts/vendor-tokens.sh

      - name: Open PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.check.outputs.pinned }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          branch="chore/bump-design-system-tokens"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add scripts/tokens-version.txt assets/design-system-tokens/
          git commit -m "Bump design-system-tokens to $LATEST"
          git push -f origin "$branch"
          if [[ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base gh-pages --head "$branch" \
              --title "Bump design kit tokens to $LATEST" \
              --body "\`@moderneinc/design-system-tokens\` published a new version.

          \`$PINNED\` -> \`$LATEST\`

          Vendored sheet regenerated by \`scripts/vendor-tokens.sh\`. Review the CSS
          diff for value changes that alter how the kit renders."
          fi
