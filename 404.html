<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Not found</title>
<script>
  (function () {
    var pathSegmentsToKeep = 2; // prototypes/codegenome-recipe-marketplace
    var l = window.location;
    if (l.pathname.indexOf('/prototypes/codegenome-recipe-marketplace/') === 0) {
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash
      );
    }
  })();
</script></head>
<body style="font:14px/1.5 system-ui,sans-serif;color:#888;padding:2rem">Page not found.</body></html>
